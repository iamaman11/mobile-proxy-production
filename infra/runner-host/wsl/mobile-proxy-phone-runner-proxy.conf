[Service]
# GitHub Runner.Listener loads <runner-root>/.env at startup. A privileged
# pre-start helper owns only the mobile-proxy marker block in that existing
# file and recomputes the current WSL gateway before every listener start.
ExecStartPre=+/usr/bin/python3 -I -B /usr/local/lib/mobile-proxy-runner-proxy/prepare-runner-proxy-environment.py --apply
