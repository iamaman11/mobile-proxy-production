[Service]
# A preceding ExecStartPre prepares this optional file. Failure blocks ExecStart.
# systemd re-reads EnvironmentFile before each command, including the listener.
EnvironmentFile=-/run/mobile-proxy-runner-proxy/environment
ExecStartPre=+/usr/bin/python3 -I -B /usr/local/lib/mobile-proxy-runner-proxy/prepare-runner-proxy-environment.py
