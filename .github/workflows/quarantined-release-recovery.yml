name: Bounded quarantined Product Release recovery

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      quarantined_request_id:
        required: true
        type: string
    secrets:
      ANDROID_PRODUCTION_SERIAL:
        required: true
      ANDROID_TARGET_BINDING_KEY:
        required: true
      MOBILE_PROXY_ADMIN_TOKEN:
        required: true
      MOBILE_PROXY_DEVICE_TOKEN:
        required: true
      MOBILE_PROXY_UI_TOKEN:
        required: true
      MOBILE_PROXY_RELAY_USER:
        required: true
      MOBILE_PROXY_RELAY_PASSWORD:
        required: true
      MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64:
        required: true

permissions:
  contents: read
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  authorize:
    name: Bind authorized command to durable quarantine and immutable Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted_release_json: ${{ steps.gate.outputs.admitted_release_json }}
      release_source_sha: ${{ steps.gate.outputs.release_source_sha }}
      semantic_recovery_id: ${{ steps.gate.outputs.semantic_recovery_id }}
      original_intent_ref: ${{ steps.gate.outputs.original_intent_ref }}
      original_terminal_ref: ${{ steps.gate.outputs.original_terminal_ref }}
      recovery_parent_terminal_ref: ${{ steps.gate.outputs.recovery_parent_terminal_ref }}
    steps:
      - name: Check out exact controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Admit exact durable quarantine lineage and immutable Release
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_quarantine_recovery.py \
            --target '${{ inputs.target }}' \
            --release '${{ inputs.release_tag }}' \
            --quarantined-request-id '${{ inputs.quarantined_request_id }}' \
            --controller-revision "$GITHUB_SHA" \
            --execution-id "gh-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

  recover:
    name: Execute one activation-only recovery and independent postcondition
    needs: authorize
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 25
    concurrency:
      group: production-target-phone-production
      cancel-in-progress: false
    environment: phone-production
    steps:
      - name: Check out exact controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact immutable PRODUCT source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ needs.authorize.outputs.release_source_sha }}
          path: product-source
          persist-credentials: false

      - name: Require exact user-local Rust toolchain before Product digest/render
        shell: bash
        run: |
          set -euo pipefail
          CARGO_HOME="${HOME}/.cargo"
          RUSTUP_HOME="${HOME}/.rustup"
          PATH="${CARGO_HOME}/bin:${PATH}"
          export CARGO_HOME RUSTUP_HOME PATH
          test "$(command -v cargo)" = "$CARGO_HOME/bin/cargo"
          test "$(command -v rustc)" = "$CARGO_HOME/bin/rustc"
          "$CARGO_HOME/bin/cargo" --version | grep -Eq '^cargo 1\.95\.0([[:space:]]|$)'
          "$CARGO_HOME/bin/rustc" --version | grep -Eq '^rustc 1\.95\.0([[:space:]]|$)'
          (
            cd product-source
            "$CARGO_HOME/bin/cargo" metadata --format-version 1 --locked --no-deps >/dev/null
            git diff --check
            test -z "$(git status --porcelain --untracked-files=no)"
          )
          {
            printf 'CARGO_HOME=%s\n' "$CARGO_HOME"
            printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Execute exactly one bounded activation-only recovery transaction
        id: recovery
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
          ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
          MOBILE_PROXY_DEVICE_TOKEN: ${{ secrets.MOBILE_PROXY_DEVICE_TOKEN }}
          MOBILE_PROXY_UI_TOKEN: ${{ secrets.MOBILE_PROXY_UI_TOKEN }}
          MOBILE_PROXY_RELAY_USER: ${{ secrets.MOBILE_PROXY_RELAY_USER }}
          MOBILE_PROXY_RELAY_PASSWORD: ${{ secrets.MOBILE_PROXY_RELAY_PASSWORD }}
          MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64: ${{ secrets.MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run_quarantine_recovery.py \
            --target '${{ inputs.target }}' \
            --release '${{ inputs.release_tag }}' \
            --quarantined-request-id '${{ inputs.quarantined_request_id }}' \
            --quarantined-intent-ref '${{ needs.authorize.outputs.original_intent_ref }}' \
            --quarantined-terminal-ref '${{ needs.authorize.outputs.original_terminal_ref }}' \
            --recovery-parent-terminal-ref '${{ needs.authorize.outputs.recovery_parent_terminal_ref }}' \
            --admitted-release-json '${{ needs.authorize.outputs.admitted_release_json }}' \
            --execution-id "gh-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --controller-revision "$GITHUB_SHA" \
            --product-root "$GITHUB_WORKSPACE/product-source" \
            --runtime-manifest "$GITHUB_WORKSPACE/.github/production/runtime-reconstruction-manifest.json" \
            --output "$RUNNER_TEMP/quarantine-recovery-terminal.json"

      - name: Preserve bounded recovery terminal artifact
        if: always()
        id: terminal_upload_primary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarantine-recovery-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quarantine-recovery-terminal.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Retry only recovery terminal artifact transport
        if: always() && steps.terminal_upload_primary.outcome != 'success'
        id: terminal_upload_retry
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarantine-recovery-terminal-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quarantine-recovery-terminal.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Observe independent exact-release and operational postconditions once
        if: always()
        id: independent_postcondition
        continue-on-error: true
        env:
          ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
          ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
          MOBILE_PROXY_ADMIN_TOKEN: ${{ secrets.MOBILE_PROXY_ADMIN_TOKEN }}
          MOBILE_PROXY_DEVICE_TOKEN: ${{ secrets.MOBILE_PROXY_DEVICE_TOKEN }}
          MOBILE_PROXY_UI_TOKEN: ${{ secrets.MOBILE_PROXY_UI_TOKEN }}
          MOBILE_PROXY_RELAY_USER: ${{ secrets.MOBILE_PROXY_RELAY_USER }}
          MOBILE_PROXY_RELAY_PASSWORD: ${{ secrets.MOBILE_PROXY_RELAY_PASSWORD }}
          MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64: ${{ secrets.MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_quarantine_recovery_postconditions.py \
            --target '${{ inputs.target }}' \
            --release '${{ inputs.release_tag }}' \
            --admitted-release-json '${{ needs.authorize.outputs.admitted_release_json }}' \
            --controller-revision "$GITHUB_SHA" \
            --product-root "$GITHUB_WORKSPACE/product-source" \
            --runtime-manifest "$GITHUB_WORKSPACE/.github/production/runtime-reconstruction-manifest.json" \
            --output "$RUNNER_TEMP/quarantine-recovery-independent-postcondition.json"

      - name: Preserve independent postcondition artifact
        if: always()
        id: postcondition_upload_primary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarantine-recovery-postcondition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quarantine-recovery-independent-postcondition.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Retry only independent postcondition artifact transport
        if: always() && steps.postcondition_upload_primary.outcome != 'success'
        id: postcondition_upload_retry
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quarantine-recovery-postcondition-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quarantine-recovery-independent-postcondition.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Enforce recovery terminal and independent acceptance
        if: always()
        env:
          EXPECTED_TARGET: ${{ inputs.target }}
          EXPECTED_RELEASE: ${{ inputs.release_tag }}
          EXPECTED_REQUEST_ID: ${{ inputs.quarantined_request_id }}
          EXPECTED_SEMANTIC_ID: ${{ needs.authorize.outputs.semantic_recovery_id }}
          EXPECTED_TERMINAL_REF: ${{ needs.authorize.outputs.original_terminal_ref }}
          TERMINAL_UPLOAD_PRIMARY: ${{ steps.terminal_upload_primary.outcome }}
          TERMINAL_UPLOAD_RETRY: ${{ steps.terminal_upload_retry.outcome }}
          POST_UPLOAD_PRIMARY: ${{ steps.postcondition_upload_primary.outcome }}
          POST_UPLOAD_RETRY: ${{ steps.postcondition_upload_retry.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          terminal_path = Path(os.environ['RUNNER_TEMP']) / 'quarantine-recovery-terminal.json'
          if not terminal_path.is_file():
              raise SystemExit('quarantine recovery terminal is unavailable')
          terminal = json.loads(terminal_path.read_text(encoding='utf-8'))
          if terminal.get('schema') != 'production-quarantine-recovery-terminal.v1':
              raise SystemExit('quarantine recovery terminal schema differs')
          if terminal.get('semantic_recovery_id') != os.environ['EXPECTED_SEMANTIC_ID']:
              raise SystemExit('quarantine recovery semantic identity differs')
          if terminal.get('target') != os.environ['EXPECTED_TARGET'] or terminal.get('product_release') != os.environ['EXPECTED_RELEASE']:
              raise SystemExit('quarantine recovery target/Release differs')
          if terminal.get('quarantined_request_id') != os.environ['EXPECTED_REQUEST_ID']:
              raise SystemExit('quarantine recovery request lineage differs')
          if terminal.get('quarantined_terminal_ref') != os.environ['EXPECTED_TERMINAL_REF']:
              raise SystemExit('quarantine recovery terminal lineage differs')
          if terminal.get('state') != 'ACCEPTED' or terminal.get('mutation_performed') is not True or terminal.get('postcondition_verified') is not True:
              raise SystemExit('quarantine recovery transaction did not reach ACCEPTED')
          if terminal.get('blind_retry_allowed') is not False or not terminal.get('recovery_intent_ref'):
              raise SystemExit('quarantine recovery exactly-once boundary differs')
          facts = terminal.get('facts') or {}
          if facts.get('phone_runtime_bytes_rematerialized') is not False or facts.get('apk_mutation_performed') is not False:
              raise SystemExit('quarantine recovery crossed forbidden phone materialization/install boundary')
          if facts.get('provider_access_performed') is not False or facts.get('vm_access_performed') is not False:
              raise SystemExit('quarantine recovery crossed provider/VM boundary')
          if facts.get('activation_outcome') != 'confirmed':
              raise SystemExit('quarantine recovery activation was not confirmed')
          transaction_post = facts.get('postcondition') or {}
          if transaction_post.get('exact_release_desired') is not True:
              raise SystemExit('quarantine recovery terminal lacks exact activation postcondition')

          post_path = Path(os.environ['RUNNER_TEMP']) / 'quarantine-recovery-independent-postcondition.json'
          if not post_path.is_file():
              raise SystemExit('independent recovery postcondition is unavailable')
          independent = json.loads(post_path.read_text(encoding='utf-8'))
          if independent.get('schema') != 'production-quarantine-recovery-independent-postcondition.v1':
              raise SystemExit('independent recovery postcondition schema differs')
          if independent.get('target') != os.environ['EXPECTED_TARGET'] or independent.get('product_release') != os.environ['EXPECTED_RELEASE']:
              raise SystemExit('independent recovery postcondition target/Release differs')
          if independent.get('classification') != 'ACCEPTED':
              raise SystemExit('independent recovery postcondition did not reach ACCEPTED')
          exact = independent.get('exact_release') or {}
          operational = independent.get('operational') or {}
          if exact.get('desired') is not True or operational.get('desired') is not True:
              raise SystemExit('independent recovery postcondition lacks exact/operational proof')
          safety = independent.get('safety') or {}
          if safety.get('phone_mutation_performed') is not False or safety.get('provider_mutation_performed') is not False or safety.get('vm_mutation_performed') is not False:
              raise SystemExit('independent recovery postcondition crossed mutation boundary')

          terminal_transport_ok = os.environ.get('TERMINAL_UPLOAD_PRIMARY') == 'success' or os.environ.get('TERMINAL_UPLOAD_RETRY') == 'success'
          post_transport_ok = os.environ.get('POST_UPLOAD_PRIMARY') == 'success' or os.environ.get('POST_UPLOAD_RETRY') == 'success'
          if not terminal_transport_ok or not post_transport_ok:
              raise SystemExit('bounded recovery evidence artifact transport failed')
          print('QUARANTINE_RECOVERY_ACCEPTED_WITH_INDEPENDENT_POSTCONDITION')
          # Compatibility output consumed by the existing top-level Issue command policy.
          # It does not define recovery semantics and can be removed when that policy is converged.
          print('STAGE3_QUARANTINE_RECOVERY_ACCEPTED')
          PY
