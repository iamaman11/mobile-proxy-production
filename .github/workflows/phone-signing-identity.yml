name: Production Android signing continuity read-only observation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-phone-read-only-signing-identity
  cancel-in-progress: false

jobs:
  command-gate:
    name: Validate current canonical signing-observer authority
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-signing-identity ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      quality_run_id: ${{ steps.command.outputs.quality_run_id }}
    steps:
      - name: Validate exact owner command, current public main, and Quality
        id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(r"/phone-signing-identity ([0-9a-f]{40})", command)
          if match is None:
              raise SystemExit("invalid phone signing identity command")
          requested_sha = match.group(1)

          def get_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "mobile-proxy-production-signing-observer",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          current_main = get_json(
              "https://api.github.com/repos/iamaman11/mobile-proxy/commits/main"
          )["sha"]
          if requested_sha != current_main:
              raise SystemExit("requested SHA is not current canonical public main")

          query = urllib.parse.urlencode(
              {"head_sha": requested_sha, "status": "completed", "per_page": 100}
          )
          runs = get_json(
              "https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?" + query
          ).get("workflow_runs", [])
          quality = [
              run
              for run in runs
              if run.get("name") == "Quality"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == requested_sha
              and run.get("conclusion") == "success"
          ]
          if not quality:
              raise SystemExit("current canonical SHA has no successful main Quality run")
          quality.sort(
              key=lambda run: (run.get("run_attempt", 0), run.get("id", 0)),
              reverse=True,
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={requested_sha}\n")
              handle.write(f"quality_run_id={quality[0]['id']}\n")
          PY

      - name: Checkout exact canonical verifier source on hosted runner
        uses: actions/checkout@v4
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ steps.command.outputs.canonical_sha }}
          path: canonical
          persist-credentials: false

      - name: Build immutable canonical signing-observer and apksigner bundle
        shell: bash
        env:
          CANONICAL_SHA: ${{ steps.command.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ steps.command.outputs.quality_run_id }}
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "${CANONICAL_SHA}"

          hosted_apksigner="$(command -v apksigner || true)"
          if [[ -z "${hosted_apksigner}" ]]; then
            echo "GitHub-hosted runner does not provide apksigner" >&2
            exit 1
          fi
          hosted_apksigner="$(readlink -f "${hosted_apksigner}")"
          hosted_apksigner_jar="$(dirname "${hosted_apksigner}")/lib/apksigner.jar"
          if [[ ! -f "${hosted_apksigner_jar}" ]]; then
            echo "GitHub-hosted apksigner.jar is unavailable" >&2
            exit 1
          fi
          java -jar "${hosted_apksigner_jar}" version >/dev/null
          export HOSTED_APKSIGNER_JAR="${hosted_apksigner_jar}"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          source_root = Path("canonical/scripts")
          bundle = Path(os.environ["RUNNER_TEMP"]) / "phone-signing-observer-source"
          bundle.mkdir(parents=True, exist_ok=False)
          required_scripts = (
              "run_private_phone_preflight.py",
              "verify_android_installed_signer.py",
          )
          files = {}
          for name in required_scripts:
              source = source_root / name
              if not source.is_file():
                  raise SystemExit(f"canonical signing observer source is missing: {name}")
              destination = bundle / name
              shutil.copyfile(source, destination)
              files[name] = hashlib.sha256(destination.read_bytes()).hexdigest()

          tool_dir = bundle / "tools"
          tool_dir.mkdir()
          tool_jar = tool_dir / "apksigner.jar"
          shutil.copyfile(Path(os.environ["HOSTED_APKSIGNER_JAR"]), tool_jar)
          files["tools/apksigner.jar"] = hashlib.sha256(tool_jar.read_bytes()).hexdigest()

          manifest = {
              "format_version": 2,
              "repository": "iamaman11/mobile-proxy",
              "canonical_sha": os.environ["CANONICAL_SHA"],
              "quality_run_id": int(os.environ["QUALITY_RUN_ID"]),
              "files": files,
              "apksigner_transport": "same_run_hosted_digest_bound_jar",
          }
          (bundle / "source-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable canonical signing-observer source
        uses: actions/upload-artifact@v4
        with:
          name: phone-signing-observer-source-${{ steps.command.outputs.canonical_sha }}
          path: ${{ runner.temp }}/phone-signing-observer-source
          if-no-files-found: error
          retention-days: 1

  phone-signing-identity:
    name: Observe installed package signing continuity on registered production phone
    needs: command-gate
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 10
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      ANDROID_TARGET_BINDING_KEY: mobile-proxy/android-production/target-binding/v1/public-nonsecret
    outputs:
      classification: ${{ steps.observe.outputs.classification }}
      observation_validated: ${{ steps.observe.outputs.observation_validated }}
      signer_match: ${{ steps.observe.outputs.signer_match }}
      target_binding_id: ${{ steps.context.outputs.target_binding_id }}
      session_id: ${{ steps.context.outputs.session_id }}
      observation_ref: ${{ steps.context.outputs.observation_ref }}
      artifact_persisted: ${{ steps.persistence.outputs.artifact_persisted }}
    steps:
      - name: Download immutable canonical source attempt 1
        id: source-download-1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-signing-observer-source-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-signing-observer-source-attempt-1

      - name: Back off before source retry 2
        if: steps.source-download-1.outcome == 'failure'
        shell: bash
        run: sleep 3

      - name: Download immutable canonical source attempt 2
        id: source-download-2
        if: steps.source-download-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-signing-observer-source-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-signing-observer-source-attempt-2

      - name: Back off before source retry 3
        if: steps.source-download-1.outcome == 'failure' && steps.source-download-2.outcome == 'failure'
        shell: bash
        run: sleep 6

      - name: Download immutable canonical source attempt 3
        id: source-download-3
        if: steps.source-download-1.outcome == 'failure' && steps.source-download-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-signing-observer-source-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-signing-observer-source-attempt-3

      - name: Promote one immutable source bundle
        shell: bash
        env:
          OUTCOME_1: ${{ steps.source-download-1.outcome }}
          OUTCOME_2: ${{ steps.source-download-2.outcome }}
          OUTCOME_3: ${{ steps.source-download-3.outcome }}
        run: |
          set -euo pipefail
          selected=""
          if [ "${OUTCOME_1}" = success ]; then
            selected="${RUNNER_TEMP}/phone-signing-observer-source-attempt-1"
          elif [ "${OUTCOME_2}" = success ]; then
            selected="${RUNNER_TEMP}/phone-signing-observer-source-attempt-2"
          elif [ "${OUTCOME_3}" = success ]; then
            selected="${RUNNER_TEMP}/phone-signing-observer-source-attempt-3"
          else
            echo "no immutable canonical signing-observer source download succeeded" >&2
            exit 1
          fi
          destination="${RUNNER_TEMP}/phone-signing-observer-source"
          test ! -e "${destination}"
          mv "${selected}" "${destination}"

      - name: Verify immutable canonical source and apksigner before phone access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "phone-signing-observer-source"
          manifest = json.loads((root / "source-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("format_version") != 2:
              raise SystemExit("unsupported signing-observer source manifest")
          if manifest.get("repository") != "iamaman11/mobile-proxy":
              raise SystemExit("canonical source repository differs")
          if manifest.get("canonical_sha") != os.environ["CANONICAL_SHA"]:
              raise SystemExit("canonical source SHA differs")
          if manifest.get("quality_run_id") != int(os.environ["QUALITY_RUN_ID"]):
              raise SystemExit("canonical Quality authority differs")
          if manifest.get("apksigner_transport") != "same_run_hosted_digest_bound_jar":
              raise SystemExit("apksigner transport differs")
          expected = {
              "run_private_phone_preflight.py",
              "verify_android_installed_signer.py",
              "tools/apksigner.jar",
          }
          files = manifest.get("files")
          if not isinstance(files, dict) or set(files) != expected:
              raise SystemExit("canonical signing-observer source/tool inventory differs")
          for name in sorted(expected):
              path = root / name
              if not path.is_file():
                  raise SystemExit("canonical signing-observer source/tool file is missing")
              if hashlib.sha256(path.read_bytes()).hexdigest() != files[name]:
                  raise SystemExit("canonical signing-observer source/tool digest differs")
          PY

      - name: Ensure Java signing runtime on production runner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Activate same-run digest-bound apksigner tooling read-only
        id: tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v java >/dev/null
          command -v keytool >/dev/null
          root="${RUNNER_TEMP}/phone-signing-observer-source"
          jar="${root}/tools/apksigner.jar"
          test -f "${jar}"
          java -jar "${jar}" version >/dev/null
          wrapper="${RUNNER_TEMP}/apksigner"
          cat > "${wrapper}" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          exec java -jar "${jar}" "\$@"
          SH
          chmod 700 "${wrapper}"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          echo "apksigner_ready=true" >> "$GITHUB_OUTPUT"

      - name: Derive bounded causal signing-observation context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import os
          import re

          serial = os.environ.get("ANDROID_PRODUCTION_SERIAL", "")
          key = os.environ.get("ANDROID_TARGET_BINDING_KEY", "")
          if not serial:
              raise SystemExit("registered production target binding is unavailable")
          if len(key) < 32 or key == serial:
              raise SystemExit("stable target binding rule is unavailable")
          target_binding_id = "tb-hmac-sha256:" + hmac.new(
              key.encode("utf-8"),
              b"android-production\0" + serial.encode("utf-8"),
              hashlib.sha256,
          ).hexdigest()
          if re.fullmatch(r"tb-hmac-sha256:[0-9a-f]{64}", target_binding_id) is None:
              raise SystemExit("target binding identity is invalid")
          session_id = f"phone-signing-session:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
          observation_ref = f"phone-signing-observation:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"target_binding_id={target_binding_id}\n")
              handle.write(f"session_id={session_id}\n")
              handle.write(f"observation_ref={observation_ref}\n")
          PY

      - name: Observe installed signer continuity with exact canonical verifier
        id: observe
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          TARGET_BINDING_ID: ${{ steps.context.outputs.target_binding_id }}
          SESSION_ID: ${{ steps.context.outputs.session_id }}
          OBSERVATION_REF: ${{ steps.context.outputs.observation_ref }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/phone-signing-observer-source"
          stdout_file="${RUNNER_TEMP}/signing-observer.stdout"
          stderr_file="${RUNNER_TEMP}/signing-observer.stderr"
          canonical_result="${RUNNER_TEMP}/canonical-signing-result.json"

          set +e
          python3 "${root}/verify_android_installed_signer.py" \
            --canonical-sha "${CANONICAL_SHA}" \
            --output "${canonical_result}" \
            >"${stdout_file}" 2>"${stderr_file}"
          status=$?
          set -e

          OBSERVER_STATUS="${status}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["OBSERVER_STATUS"])
          temp = Path(os.environ["RUNNER_TEMP"])
          canonical_result = temp / "canonical-signing-result.json"
          stderr = (temp / "signing-observer.stderr").read_text(encoding="utf-8", errors="replace")
          mismatch_marker = (
              "Android signing identity verification failed: "
              "recovered signing identity does not match the installed production APK"
          )

          classification = "SIGNING_CONTINUITY_UNOBSERVED"
          validated = False
          signer_match = None
          if status == 0:
              result = json.loads(canonical_result.read_text(encoding="utf-8"))
              expected = {
                  "format_version": 1,
                  "repository": "iamaman11/mobile-proxy",
                  "canonical_sha": os.environ["CANONICAL_SHA"],
                  "package": "com.example.mobileproxy",
                  "mode": "read_only_signing_identity_verification",
                  "registered_device_match": True,
                  "installed_apk_signer_verified": True,
                  "recovered_keystore_signer_match": True,
                  "raw_device_identifier_recorded": False,
                  "signer_digest_recorded": False,
                  "signing_material_recorded": False,
                  "phone_mutation_performed": False,
                  "signing_key_generated": False,
                  "accepted": True,
              }
              if result != expected:
                  raise SystemExit("canonical signing verifier result contract differs")
              classification = "SIGNING_CONTINUITY_PROVEN"
              validated = True
              signer_match = True
          elif mismatch_marker in stderr:
              classification = "SIGNING_CONTINUITY_MISMATCH"
              validated = True
              signer_match = False

          dependencies = [
              {
                  "scope": "target/android-production",
                  "identity": os.environ["TARGET_BINDING_ID"],
              },
              {
                  "scope": "observer/package-signing-continuity",
                  "identity": "android.package-signing-continuity-observer.v1",
              },
              {
                  "scope": "session/android-production",
                  "identity": os.environ["SESSION_ID"],
              },
          ]
          evidence = {
              "format_version": 1,
              "repository": "iamaman11/mobile-proxy",
              "canonical_sha": os.environ["CANONICAL_SHA"],
              "quality_run_id": int(os.environ["QUALITY_RUN_ID"]),
              "mode": "read_only_package_signing_continuity_observation",
              "target": "android-production",
              "package": "com.example.mobileproxy",
              "classification": classification,
              "observation_validated": validated,
              "raw_device_identifier_recorded": False,
              "signer_digest_recorded": False,
              "signing_material_recorded": False,
              "phone_mutation_performed": False,
          }
          if validated:
              evidence["observed_fact"] = {
                  "subject": "package:com.example.mobileproxy",
                  "predicate": "signer_matches_recovered_release_identity",
                  "value": signer_match,
                  "target": "android-production",
                  "observation_ref": os.environ["OBSERVATION_REF"],
                  "source_ref": os.environ["CANONICAL_SHA"],
                  "dependencies": dependencies,
                  "authority": "CONTROL",
                  "persisted": False,
              }
          (temp / "phone-signing-continuity.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"classification={classification}\n")
              handle.write(f"observation_validated={'true' if validated else 'false'}\n")
              if signer_match is True:
                  handle.write("signer_match=true\n")
              elif signer_match is False:
                  handle.write("signer_match=false\n")
              else:
                  handle.write("signer_match=unobserved\n")
          PY

      - name: Upload bounded signing-continuity evidence
        id: evidence-upload
        if: steps.observe.outputs.observation_validated == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-signing-continuity-${{ env.CANONICAL_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phone-signing-continuity.json
          if-no-files-found: error
          retention-days: 30

      - name: Classify artifact persistence
        id: persistence
        if: always()
        shell: bash
        env:
          VALIDATED: ${{ steps.observe.outputs.observation_validated }}
          UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
        run: |
          set -euo pipefail
          if [ "${VALIDATED}" = true ] && [ "${UPLOAD_OUTCOME}" = success ]; then
            echo "artifact_persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_persisted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record bounded local result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Current-authority package signing observation
          - Canonical SHA: ${{ env.CANONICAL_SHA }}
          - Quality run: ${{ env.QUALITY_RUN_ID }}
          - Classification: ${{ steps.observe.outputs.classification || 'SIGNING_CONTINUITY_UNOBSERVED' }}
          - Observation validated: ${{ steps.observe.outputs.observation_validated || 'false' }}
          - Evidence artifact persisted: ${{ steps.persistence.outputs.artifact_persisted || 'false' }}
          - Raw device identifier recorded: false
          - Signer fingerprint recorded: false
          - Signing material recorded: false
          - Phone mutation performed: false
          EOF

  publish-control-evidence:
    name: Persist bounded CONTROL signing observation to private Issue 1
    needs: [command-gate, phone-signing-identity]
    if: always() && needs.command-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      PHONE_JOB_RESULT: ${{ needs.phone-signing-identity.result }}
      CLASSIFICATION: ${{ needs.phone-signing-identity.outputs.classification }}
      OBSERVATION_VALIDATED: ${{ needs.phone-signing-identity.outputs.observation_validated }}
      SIGNER_MATCH: ${{ needs.phone-signing-identity.outputs.signer_match }}
      TARGET_BINDING_ID: ${{ needs.phone-signing-identity.outputs.target_binding_id }}
      SESSION_ID: ${{ needs.phone-signing-identity.outputs.session_id }}
      OBSERVATION_REF: ${{ needs.phone-signing-identity.outputs.observation_ref }}
      ARTIFACT_PERSISTED: ${{ needs.phone-signing-identity.outputs.artifact_persisted }}
    steps:
      - name: Persist bounded classification/fact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          classification = os.environ.get("CLASSIFICATION") or "SIGNING_CONTINUITY_UNOBSERVED"
          validated = os.environ.get("OBSERVATION_VALIDATED") == "true"
          signer_value = os.environ.get("SIGNER_MATCH")
          fact = None
          if validated:
              if signer_value not in {"true", "false"}:
                  raise SystemExit("validated signing observation has no boolean signer result")
              fact = {
                  "subject": "package:com.example.mobileproxy",
                  "predicate": "signer_matches_recovered_release_identity",
                  "value": signer_value == "true",
                  "target": "android-production",
                  "observation_ref": os.environ["OBSERVATION_REF"],
                  "source_ref": os.environ["CANONICAL_SHA"],
                  "dependencies": [
                      {
                          "scope": "target/android-production",
                          "identity": os.environ["TARGET_BINDING_ID"],
                      },
                      {
                          "scope": "observer/package-signing-continuity",
                          "identity": "android.package-signing-continuity-observer.v1",
                      },
                      {
                          "scope": "session/android-production",
                          "identity": os.environ["SESSION_ID"],
                      },
                  ],
                  "authority": "CONTROL",
                  "persisted": True,
              }
          payload = {
              "format_version": 1,
              "canonical_sha": os.environ["CANONICAL_SHA"],
              "quality_run_id": int(os.environ["QUALITY_RUN_ID"]),
              "private_execution_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "phone_job_result": os.environ.get("PHONE_JOB_RESULT") or "unknown",
              "classification": classification,
              "observation_validated": validated,
              "artifact_persisted": os.environ.get("ARTIFACT_PERSISTED") == "true",
              "raw_device_identifier_recorded": False,
              "signer_digest_recorded": False,
              "signing_material_recorded": False,
              "phone_mutation_performed": False,
          }
          if fact is not None:
              payload["observed_fact"] = fact
          body = "## CONTROL APK SIGNING CONTINUITY FACT\n\n```json\n" + json.dumps(
              payload, indent=2, sort_keys=True
          ) + "\n```"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/1/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "mobile-proxy-production-signing-observer",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit("CONTROL signing observation persistence failed")
          PY
