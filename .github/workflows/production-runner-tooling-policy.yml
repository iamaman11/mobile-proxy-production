name: Production runner tooling policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runner-rust-bootstrap:
    name: Validate bounded production runner Rust bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce runner-tooling bootstrap invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bootstrap_path = Path('.github/workflows/production-runner-rust-bootstrap.yml')
          if not bootstrap_path.is_file():
              raise SystemExit('production runner Rust bootstrap workflow is missing')
          text = bootstrap_path.read_text(encoding='utf-8')

          required = (
              "inputs.source_issue_number == 1",
              "inputs.source_actor == github.repository_owner",
              "startsWith(inputs.command, '/runner-rust-bootstrap ')",
              "re.fullmatch(r'/runner-rust-bootstrap ([0-9a-f]{40})', command)",
              "runs-on: [self-hosted, Linux, X64, android-production]",
              "group: production-runner-rust-bootstrap",
              "cancel-in-progress: false",
              "RUSTUP_VERSION: '1.28.2'",
              "RUSTUP_INIT_SHA256: '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c'",
              "RUST_TOOLCHAIN: '1.95.0'",
              "CARGO_HOME=\"${HOME}/.cargo\"",
              "RUSTUP_HOME=\"${HOME}/.rustup\"",
              "printf '%s\\n' \"$CARGO_HOME/bin\" >> \"$GITHUB_PATH\"",
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init",
              "sha256sum -c -",
              "--default-toolchain \"$RUST_TOOLCHAIN\" --no-modify-path",
              "test \"$CARGO_HOME\" = \"${HOME}/.cargo\"",
              "test \"$RUSTUP_HOME\" = \"${HOME}/.rustup\"",
              "test \"$(command -v cargo)\" = \"$CARGO_HOME/bin/cargo\"",
              "test \"$(command -v rustc)\" = \"$CARGO_HOME/bin/rustc\"",
              "\"$CARGO_HOME/bin/cargo\" --version | grep -Eq '^cargo 1\\.95\\.0([[:space:]]|$)'",
              "\"$CARGO_HOME/bin/rustc\" --version | grep -Eq '^rustc 1\\.95\\.0([[:space:]]|$)'",
              "\"$CARGO_HOME/bin/cargo\" metadata --format-version 1 --locked --no-deps",
              "runner_tooling_mutation=true",
              "user_local_tooling=true",
              "system_path_mutation=false",
              "phone_access=false",
              "phone_mutation=false",
              "provider_access=false",
              "config_rendered=false",
              "secret_access=false",
          )
          missing = [snippet for snippet in required if snippet not in text]
          if missing:
              raise SystemExit('runner Rust bootstrap invariant missing: ' + ' | '.join(missing))

          forbidden = (
              'production-phone-global-mutation',
              'secrets.',
              'ANDROID_PRODUCTION_SERIAL',
              '/data/adb/',
              ' adb ',
              "['adb'",
              'package-device-release',
              'verify-release-integrity',
              'runtime-reconstruction-execute',
              'VULTR_API',
              'GOOGLE_APPLICATION_CREDENTIALS',
              'gcloud ',
              'pm install',
              'pm uninstall',
              'sudo ',
              '/usr/local/bin',
          )
          present = [snippet for snippet in forbidden if snippet in text]
          if present:
              raise SystemExit('runner Rust bootstrap crossed a forbidden boundary: ' + ' | '.join(present))

          if text.count("runs-on: [self-hosted, Linux, X64, android-production]") != 1:
              raise SystemExit('runner Rust bootstrap must have exactly one production self-hosted job')
          if text.count("/runner-rust-bootstrap ") != 2:
              raise SystemExit('runner Rust bootstrap command surface drifted')

          reconstruction_path = Path('.github/workflows/runtime-reconstruction-execution.yml')
          if not reconstruction_path.is_file():
              raise SystemExit('runtime reconstruction execution workflow is missing')
          reconstruction = reconstruction_path.read_text(encoding='utf-8')
          reconstruction_required = (
              '- name: Require exact user-local Rust toolchain before render or phone access',
              'CARGO_HOME="${HOME}/.cargo"',
              'RUSTUP_HOME="${HOME}/.rustup"',
              'PATH="${CARGO_HOME}/bin:${PATH}"',
              'export CARGO_HOME RUSTUP_HOME PATH',
              'test "$(command -v cargo)" = "$CARGO_HOME/bin/cargo"',
              'test "$(command -v rustc)" = "$CARGO_HOME/bin/rustc"',
              '"$CARGO_HOME/bin/cargo" --version | grep -Eq \'^cargo 1\\.95\\.0([[:space:]]|$)\'',
              '"$CARGO_HOME/bin/rustc" --version | grep -Eq \'^rustc 1\\.95\\.0([[:space:]]|$)\'',
              'reconstruction_rust_prerequisite=true',
              'config_rendered=false',
              'phone_access=false',
          )
          reconstruction_missing = [snippet for snippet in reconstruction_required if snippet not in reconstruction]
          if reconstruction_missing:
              raise SystemExit('reconstruction Rust prerequisite invariant missing: ' + ' | '.join(reconstruction_missing))

          prereq = reconstruction.index('- name: Require exact user-local Rust toolchain before render or phone access')
          render = reconstruction.index('- name: Render and verify complete source-bound release ephemerally')
          phone = reconstruction.index('- name: Mark conservative phone-access boundary')
          if not prereq < render < phone:
              raise SystemExit('reconstruction Rust prerequisite must fail closed before render and phone access')

          release_path = Path('.github/workflows/release-deployment.yml')
          if not release_path.is_file():
              raise SystemExit('release deployment workflow is missing')
          release = release_path.read_text(encoding='utf-8')
          release_required = (
              '- name: Require exact user-local Rust toolchain before Product digest/render',
              'CARGO_HOME="${HOME}/.cargo"',
              'RUSTUP_HOME="${HOME}/.rustup"',
              'PATH="${CARGO_HOME}/bin:${PATH}"',
              'export CARGO_HOME RUSTUP_HOME PATH',
              'test "$CARGO_HOME" = "${HOME}/.cargo"',
              'test "$RUSTUP_HOME" = "${HOME}/.rustup"',
              'test "$(command -v cargo)" = "$CARGO_HOME/bin/cargo"',
              'test "$(command -v rustc)" = "$CARGO_HOME/bin/rustc"',
              '"$CARGO_HOME/bin/cargo" --version | grep -Eq \'^cargo 1\\.95\\.0([[:space:]]|$)\'',
              '"$CARGO_HOME/bin/rustc" --version | grep -Eq \'^rustc 1\\.95\\.0([[:space:]]|$)\'',
              '"$CARGO_HOME/bin/cargo" metadata --format-version 1 --locked --no-deps',
              'git status --porcelain --untracked-files=no',
              "printf 'CARGO_HOME=%s\\n' \"$CARGO_HOME\"",
              "printf 'RUSTUP_HOME=%s\\n' \"$RUSTUP_HOME\"",
              "printf '%s\\n' \"$CARGO_HOME/bin\" >> \"$GITHUB_PATH\"",
              'deployment_rust_prerequisite=true',
              'rust_toolchain=1.95.0',
              'user_local_tooling=true',
              'system_path_mutation=false',
              'product_digest_render_started=false',
              'mutation_intent=false',
              'phone_access=false',
              'phone_mutation=false',
              'provider_access=false',
              'secret_access=false',
          )
          release_missing = [snippet for snippet in release_required if snippet not in release]
          if release_missing:
              raise SystemExit('release deployment Rust prerequisite invariant missing: ' + ' | '.join(release_missing))

          product_checkout = release.index('- name: Check out exact admitted PRODUCT source for normative digest/render code')
          release_prereq = release.index('- name: Require exact user-local Rust toolchain before Product digest/render')
          reconcile = release.index('- name: Reconcile recovery mode from durable private ledger')
          transaction = release.index('- name: Execute controller-owned composite transaction')
          if not product_checkout < release_prereq < reconcile < transaction:
              raise SystemExit('release deployment Rust prerequisite must fail closed before reconciliation and transaction')

          release_prereq_end = release.index('\n      - name: Reconcile recovery mode from durable private ledger', release_prereq)
          release_prereq_block = release[release_prereq:release_prereq_end]
          forbidden_release_prereq = (
              'secrets.',
              'ANDROID_PRODUCTION_SERIAL',
              'ANDROID_TARGET_BINDING_KEY',
              'PUBLIC_DEPLOYMENTS_TOKEN',
              '/data/adb/',
              ' adb ',
              'pm install',
              'pm uninstall',
              'package-device-release',
              'verify-release-integrity',
              'sudo ',
              'VULTR_API',
              'GOOGLE_APPLICATION_CREDENTIALS',
              'gcloud ',
          )
          release_present = [snippet for snippet in forbidden_release_prereq if snippet in release_prereq_block]
          if release_present:
              raise SystemExit('release deployment Rust prerequisite crossed a forbidden boundary: ' + ' | '.join(release_present))

          print('production runner tooling policy: accepted')
          print('rustup_version=1.28.2')
          print('rust_toolchain=1.95.0')
          print('user_local_tooling=true')
          print('system_path_mutation=false')
          print('reconstruction_rust_prerequisite=true')
          print('release_deployment_rust_prerequisite=true')
          print('phone_access=false')
          print('provider_access=false')
          print('secret_access=false')
          PY

  validate-runner-android-build-tools-bootstrap:
    name: Validate bounded production runner Android Build Tools bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce Android Build Tools bootstrap authority and filesystem invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflows = Path('.github/workflows')
          bootstrap_path = workflows / 'production-runner-android-build-tools-bootstrap.yml'
          router_path = workflows / 'production-control-router.yml'
          controller_path = Path('.github/controller/android_target.py')
          registry_path = Path('.github/production/command-control-registry.json')
          if not bootstrap_path.is_file() or not router_path.is_file() or not controller_path.is_file() or not registry_path.is_file():
              raise SystemExit('Android Build Tools bootstrap contract files are incomplete')

          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          router = router_path.read_text(encoding='utf-8')
          controller = controller_path.read_text(encoding='utf-8')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))

          required = (
              'workflow_call:',
              "inputs.source_issue_number == 1",
              "inputs.source_actor == github.repository_owner",
              "startsWith(inputs.command, '/runner-android-build-tools-bootstrap ')",
              "re.fullmatch(r'/runner-android-build-tools-bootstrap ([0-9a-f]{40})', command)",
              "'https://api.github.com/repos/iamaman11/mobile-proxy/commits/main'",
              "runs-on: [self-hosted, Linux, X64, android-production]",
              'group: production-runner-android-build-tools-bootstrap',
              'cancel-in-progress: false',
              "ANDROID_BUILD_TOOLS_VERSION: '36.0.0'",
              "ANDROID_BUILD_TOOLS_ARCHIVE_URL: 'https://dl.google.com/android/repository/build-tools_r36_linux.zip'",
              "ANDROID_BUILD_TOOLS_ARCHIVE_SHA256: '5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b'",
              'ANDROID_SDK_ROOT="${HOME}/.local/share/mobile-proxy/android-sdk"',
              'ANDROID_BUILD_TOOLS_DIR="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"',
              "zipfile.ZipFile(archive)",
              "stat.S_ISLNK(unix_mode)",
              "'.mobile-proxy-source.json'",
              'cp -a "$ANDROID_BUILD_TOOLS_STAGING" "$install_stage"',
              'diff -qr "$ANDROID_BUILD_TOOLS_STAGING" "$install_stage"',
              'mv "$install_stage" "$ANDROID_BUILD_TOOLS_DIR"',
              'android_build_tools_install=created_exact_atomic',
              '"$ANDROID_BUILD_TOOLS_DIR/aapt2" version',
              '"$ANDROID_BUILD_TOOLS_DIR/apksigner" version',
              'android_build_tools_identity=android-build-tools:36.0.0:user-local-v1',
              'runner_tooling_mutation=true',
              'user_local_tooling=true',
              'system_path_mutation=false',
              'phone_access=false',
              'phone_mutation=false',
              'provider_access=false',
              'config_rendered=false',
              'secret_access=false',
          )
          missing = [snippet for snippet in required if snippet not in bootstrap]
          if missing:
              raise SystemExit('Android Build Tools bootstrap invariant missing: ' + ' | '.join(missing))

          forbidden = (
              'workflow_dispatch:',
              'issue_comment:',
              'secrets.',
              'ANDROID_PRODUCTION_SERIAL',
              'ANDROID_TARGET_BINDING_KEY',
              'PUBLIC_DEPLOYMENTS_TOKEN',
              'production-phone-global-mutation',
              '/data/adb/',
              ' adb ',
              "['adb'",
              'pm install',
              'pm uninstall',
              'sudo ',
              '/usr/local/bin',
              'VULTR_API',
              'GOOGLE_APPLICATION_CREDENTIALS',
              'gcloud ',
              'runtime-reconstruction-execute',
              'package-device-release',
              'verify-release-integrity',
          )
          present = [snippet for snippet in forbidden if snippet in bootstrap]
          if present:
              raise SystemExit('Android Build Tools bootstrap crossed a forbidden boundary: ' + ' | '.join(present))

          if bootstrap.count('runs-on: [self-hosted, Linux, X64, android-production]') != 1:
              raise SystemExit('Android Build Tools bootstrap must have exactly one production self-hosted job')
          if bootstrap.count('/runner-android-build-tools-bootstrap ') != 2:
              raise SystemExit('Android Build Tools bootstrap command surface drifted')

          global_route_required = (
              "github.event.repository.full_name == 'iamaman11/mobile-proxy-production'",
              'github.event.issue.number == 1',
              'github.event.comment.user.login == github.repository_owner',
          )
          global_route_missing = [snippet for snippet in global_route_required if snippet not in router]
          if global_route_missing:
              raise SystemExit('sole Issue #1 owner ingress incomplete: ' + ' | '.join(global_route_missing))

          contracts = [
              item for item in registry.get('routes', [])
              if isinstance(item, dict)
              and item.get('id') == 'runner-android-build-tools-bootstrap'
              and item.get('enabled') is True
          ]
          if len(contracts) != 1:
              raise SystemExit('exactly one enabled Android Build Tools command contract is required')
          contract = contracts[0]
          expected_contract = {
              'handler': 'workflow_call',
              'workflow': '.github/workflows/production-runner-android-build-tools-bootstrap.yml',
              'ref': 'main',
              'operation': 'production-runner-android-build-tools-bootstrap',
              'operation_class': 'RUNNER_TOOLING',
              'read_only': False,
              'destructive': False,
              'semantic_identity_policy': 'command-arguments',
              'idempotency_policy': 'exact-package-noop-or-create',
              'concurrency_domain': 'production-runner-android-build-tools-bootstrap',
          }
          for field, expected in expected_contract.items():
              if contract.get(field) != expected:
                  raise SystemExit(f'Android Build Tools registry contract drifted: {field}')
          expected_pattern = r'^/runner-android-build-tools-bootstrap (?P<canonical_sha>[0-9a-f]{40})$'
          if contract.get('pattern') != expected_pattern:
              raise SystemExit('Android Build Tools registry syntax drifted')

          route_start = router.index('  android-build-tools-bootstrap:')
          route_end = router.index('\n  deploy:', route_start)
          route = router[route_start:route_end]
          route_required = (
              "needs.route.outputs.route_id == 'runner-android-build-tools-bootstrap'",
              "needs.route.outputs.destructive == 'false'",
              'uses: ./.github/workflows/production-runner-android-build-tools-bootstrap.yml',
              'command: ${{ github.event.comment.body }}',
          )
          route_missing = [snippet for snippet in route_required if snippet not in route]
          if route_missing:
              raise SystemExit('Android Build Tools registry-gated Issue #1 route incomplete: ' + ' | '.join(route_missing))
          if 'secrets:' in route or 'environment:' in route or 'runs-on:' in route:
              raise SystemExit('Android Build Tools router job crossed reusable-workflow boundary')
          if "startsWith(github.event.comment.body, '/runner-android-build-tools-bootstrap ')" in route:
              raise SystemExit('Android Build Tools route bypassed the declarative classifier')

          controller_required = (
              'ANDROID_BUILD_TOOLS_VERSION = "36.0.0"',
              '_ANDROID_SDK_USER_RELATIVE_ROOT = Path(".local/share/mobile-proxy/android-sdk")',
              'build_root = sdk_root / "build-tools" / ANDROID_BUILD_TOOLS_VERSION',
              'aapt2 = build_root / "aapt2"',
              'apksigner = build_root / "apksigner"',
              'return f"android-build-tools:{self.version}:user-local-v1"',
          )
          controller_missing = [snippet for snippet in controller_required if snippet not in controller]
          if controller_missing:
              raise SystemExit('deployment verifier path differs from bootstrap contract: ' + ' | '.join(controller_missing))

          print('PRODUCTION_ANDROID_BUILD_TOOLS_BOOTSTRAP_POLICY_OK')
          print('android_build_tools_version=36.0.0')
          print('archive_sha256=5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b')
          print('official_distribution=true')
          print('canonical_sha_gate=true')
          print('registry_gate=true')
          print('atomic_user_local_publish=true')
          print('phone_access=false')
          print('secret_access=false')
          print('provider_access=false')
          PY
