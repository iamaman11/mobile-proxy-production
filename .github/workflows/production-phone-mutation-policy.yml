name: Production phone mutation policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phone-workflow-classification:
    name: Validate sole controller-owned phone mutation path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce target lock, one dispatch and no legacy runtime routing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          workflow = Path('.github/workflows/release-deployment.yml').read_text(encoding='utf-8')
          router = Path('.github/workflows/production-control-router.yml').read_text(encoding='utf-8')
          runtime = Path('.github/scripts/run_phone_release_deployment.py')
          adapter_path = Path('.github/controller/android_target.py')
          adapter = adapter_path.read_text(encoding='utf-8')

          required = (
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production',
              'cancel-in-progress: false',
              'environment: phone-production',
              'ANDROID_PRODUCTION_SERIAL',
              'ANDROID_TARGET_BINDING_KEY',
          )
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit('phone target execution boundary incomplete: ' + ', '.join(missing))

          adapter_tree = ast.parse(adapter)
          install_calls = []
          for node in ast.walk(adapter_tree):
              if not isinstance(node, ast.Call):
                  continue
              if not isinstance(node.func, ast.Attribute) or node.func.attr != 'run':
                  continue
              if not node.args or not isinstance(node.args[0], ast.List):
                  continue
              values = []
              for item in node.args[0].elts:
                  if isinstance(item, ast.Constant) and isinstance(item.value, str):
                      values.append(item.value)
                  elif isinstance(item, ast.Name):
                      values.append(f'<{item.id}>')
                  else:
                      values.append('<expr>')
              if 'install' in values:
                  install_calls.append(values)
          if install_calls != [['<adb>', '-s', '<serial>', 'install', '-r', '<expr>']]:
              raise SystemExit(f'Android adapter must contain exactly one bounded install-replace primitive; got {install_calls!r}')

          tree = ast.parse(runtime.read_text(encoding='utf-8'))
          calls = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == 'dispatch_install_once'
          ]
          if len(calls) != 1:
              raise SystemExit(f'controller must have exactly one destructive dispatch callsite; got {len(calls)}')

          legacy_routes = (
              '/phone-clean-install',
              '/phone-filesystem-certification',
              '/phone-filesystem-quarantine-cleanup',
              '/phone-runtime-recovery',
              '/runtime-reconstruction',
              '/phone-apk-install',
              'filesystem-scratch-kernel-rehearsal.yml',
              'android-signing-migration.yml',
          )
          present = [item for item in legacy_routes if item in router]
          if present:
              raise SystemExit('legacy phone mutator remains reachable from production Issue #1: ' + ', '.join(present))
          if "startsWith(github.event.comment.body, '/deploy ')" not in router:
              raise SystemExit('Release deployment is not the sole v2 Issue #1 ingress')

          recovery = Path('.github/controller/deployment_state_machine.py').read_text(encoding='utf-8')
          if 'def recover_unknown' not in recovery or 'raise TransitionError("recovery is strictly read-only")' not in recovery:
              raise SystemExit('UNKNOWN recovery is not structurally read-only')

          print('CONTROLLER_OWNED_PHONE_MUTATION_POLICY_OK')
          PY
