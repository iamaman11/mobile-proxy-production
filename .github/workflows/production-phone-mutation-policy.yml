name: Production phone mutation policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phone-workflow-classification:
    name: Validate bounded controller-owned phone mutation paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enforce Product Release transaction ownership and fixed lifecycle mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          workflows = Path('.github/workflows')
          workflow = (workflows / 'release-deployment.yml').read_text(encoding='utf-8')
          lifecycle_workflow = (workflows / 'stage4-runtime-recovery-exercise.yml').read_text(encoding='utf-8')
          restart_workflow = (workflows / 'stage4-runtime-restart-exercise.yml').read_text(encoding='utf-8')
          router = (workflows / 'production-control-router.yml').read_text(encoding='utf-8')
          registry = json.loads(Path('.github/production/command-control-registry.json').read_text(encoding='utf-8'))
          runtime = Path('.github/scripts/run_phone_release_deployment.py')
          lifecycle_runtime = Path('.github/scripts/exercise_runtime_recovery.py')
          restart_runtime = Path('.github/scripts/exercise_runtime_restart.py')
          apk_adapter_path = Path('.github/controller/android_target.py')
          composite_adapter_path = Path('.github/controller/phone_target.py')
          apk_adapter = apk_adapter_path.read_text(encoding='utf-8')

          direct_ingress = sorted(
              path.name for path in workflows.glob('*.yml')
              if re.search(r'(?m)^  issue_comment:\s*$', path.read_text(encoding='utf-8'))
          )
          if direct_ingress != ['production-control-router.yml']:
              raise SystemExit('exactly one private Issue #1 ingress is required: ' + repr(direct_ingress))

          deploy_routes = [
              item for item in registry.get('routes', [])
              if isinstance(item, dict) and item.get('id') == 'deploy-product-release' and item.get('enabled') is True
          ]
          if len(deploy_routes) != 1:
              raise SystemExit('exactly one enabled deployment route is required')
          deploy_contract = deploy_routes[0]
          expected_contract = {
              'handler':'deployment', 'workflow':'.github/workflows/release-deployment.yml', 'ref':'main',
              'operation':'deploy-product-release', 'operation_class':'DEPLOY', 'read_only':False,
              'destructive':True, 'allowed_targets':['phone-production','vm-production'],
              'authority_policy':'private-issue1-owner+controller-main-exact+release-admission+explicit-refused-retry-lineage',
              'semantic_identity_policy':'existing-deployment-request-v2',
              'idempotency_policy':'durable-semantic-ledger', 'concurrency_domain':'target-global-mutation',
              'recovery_policy':'UNKNOWN-read-only-reconcile-no-blind-retry',
          }
          for field, expected in expected_contract.items():
              if deploy_contract.get(field) != expected:
                  raise SystemExit(f'deployment route contract drifted: {field}')
          expected_pattern = r'^/(?=(?:deploy [^ ]+ [^ ]+|retry-deploy phone-production [^ ]+ req-sha256:[0-9a-f]{64})$)(?:deploy|retry-deploy) (?P<target>phone-production|vm-production) (?P<release>v[0-9]+\.[0-9]+\.[0-9]+)(?: req-sha256:[0-9a-f]{64})?$'
          if deploy_contract.get('pattern') != expected_pattern:
              raise SystemExit('deployment route syntax drifted')
          route_re = re.compile(expected_pattern)
          prior = 'req-sha256:' + ('a' * 64)
          allowed_commands = (
              '/deploy phone-production v0.1.7',
              '/deploy vm-production v0.1.7',
              f'/retry-deploy phone-production v0.1.7 {prior}',
          )
          blocked_commands = (
              '/retry-deploy phone-production v0.1.7',
              f'/retry-deploy vm-production v0.1.7 {prior}',
              f'/deploy phone-production v0.1.7 {prior}',
              '/retry-deploy phone-production v0.1.7 comment-123',
          )
          if any(route_re.fullmatch(command) is None for command in allowed_commands):
              raise SystemExit('bounded deployment command syntax rejects an allowed command')
          if any(route_re.fullmatch(command) is not None for command in blocked_commands):
              raise SystemExit('bounded deployment command syntax admits a forbidden retry form')

          lifecycle_routes = [
              item for item in registry.get('routes', [])
              if isinstance(item, dict) and item.get('id') == 'exercise-runtime-recovery' and item.get('enabled') is True
          ]
          if len(lifecycle_routes) != 1:
              raise SystemExit('exactly one enabled Stage 4 runtime recovery exercise route is required')
          lifecycle = lifecycle_routes[0]
          lifecycle_expected = {
              'handler': 'workflow_call',
              'workflow': '.github/workflows/stage4-runtime-recovery-exercise.yml',
              'ref': 'main',
              'operation': 'exercise-runtime-recovery',
              'operation_class': 'RECOVER',
              'read_only': False,
              'destructive': True,
              'allowed_targets': ['phone-production'],
              'physical_domains': ['runtime'],
              'authority_policy': 'private-issue1-owner+controller-main-exact+stage4-v017-fixed-runtime-recovery-exercise',
              'semantic_identity_policy': 'source-comment-id+command-arguments',
              'idempotency_policy': 'single-run-attempt+single-semantic-command-attempt+no-automatic-retry',
              'concurrency_domain': 'production-target-phone-production',
              'recovery_policy': 'UNKNOWN-no-blind-retry-owner-checkpoint-required',
              'evidence_policy': 'LIFECYCLE_TERMINAL+EXACT_RELEASE_POSTCONDITION+OPERATIONAL_POSTCONDITION',
              'target_capability_policy': 'phone-production-fixed-runtime-recovery-exercise',
          }
          for field, expected in lifecycle_expected.items():
              if lifecycle.get(field) != expected:
                  raise SystemExit(f'Stage 4 runtime recovery route contract drifted: {field}')
          lifecycle_pattern = r'^/exercise-runtime-recovery (?P<target>phone-production) (?P<release>v0\.1\.7)$'
          if lifecycle.get('pattern') != lifecycle_pattern:
              raise SystemExit('Stage 4 runtime recovery command syntax drifted')
          lifecycle_re = re.compile(lifecycle_pattern)
          if lifecycle_re.fullmatch('/exercise-runtime-recovery phone-production v0.1.7') is None:
              raise SystemExit('Stage 4 runtime recovery exact command is not admitted')
          for command in (
              '/exercise-runtime-recovery phone-production v0.1.8',
              '/exercise-runtime-recovery vm-production v0.1.7',
              '/exercise-runtime-recovery phone-production v0.1.7 host-daemon',
              '/exercise-runtime-recovery phone-production v0.1.7;echo',
          ):
              if lifecycle_re.fullmatch(command) is not None:
                  raise SystemExit('Stage 4 runtime recovery syntax admitted a forbidden variant')

          restart_routes = [
              item for item in registry.get('routes', [])
              if isinstance(item, dict) and item.get('id') == 'exercise-runtime-restart' and item.get('enabled') is True
          ]
          if len(restart_routes) != 1:
              raise SystemExit('exactly one enabled Stage 4 runtime restart exercise route is required')
          restart = restart_routes[0]
          restart_expected = {
              'handler': 'workflow_call',
              'workflow': '.github/workflows/stage4-runtime-restart-exercise.yml',
              'ref': 'main',
              'operation': 'exercise-runtime-restart',
              'operation_class': 'RECOVER',
              'read_only': False,
              'destructive': True,
              'allowed_targets': ['phone-production'],
              'physical_domains': ['runtime'],
              'authority_policy': 'private-issue1-owner+controller-main-exact+stage4-v017-fixed-runtime-restart-exercise',
              'semantic_identity_policy': 'source-comment-id+command-arguments',
              'idempotency_policy': 'single-run-attempt+single-semantic-command-attempt+no-automatic-retry',
              'concurrency_domain': 'production-target-phone-production',
              'recovery_policy': 'UNKNOWN-no-blind-retry-owner-checkpoint-required',
              'evidence_policy': 'LIFECYCLE_TERMINAL+EXACT_RELEASE_POSTCONDITION+OPERATIONAL_POSTCONDITION',
              'target_capability_policy': 'phone-production-fixed-runtime-restart-exercise',
          }
          for field, expected in restart_expected.items():
              if restart.get(field) != expected:
                  raise SystemExit(f'Stage 4 runtime restart route contract drifted: {field}')
          restart_pattern = r'^/exercise-runtime-restart (?P<target>phone-production) (?P<release>v0\.1\.7)$'
          if restart.get('pattern') != restart_pattern:
              raise SystemExit('Stage 4 runtime restart command syntax drifted')
          restart_re = re.compile(restart_pattern)
          if restart_re.fullmatch('/exercise-runtime-restart phone-production v0.1.7') is None:
              raise SystemExit('Stage 4 runtime restart exact command is not admitted')
          for command in (
              '/exercise-runtime-restart phone-production v0.1.8',
              '/exercise-runtime-restart vm-production v0.1.7',
              '/exercise-runtime-restart phone-production v0.1.7 runtime-supervisor',
              '/exercise-runtime-restart phone-production v0.1.7;echo',
          ):
              if restart_re.fullmatch(command) is not None:
                  raise SystemExit('Stage 4 runtime restart syntax admitted a forbidden variant')

          required = (
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production', 'cancel-in-progress: false',
              'environment: phone-production', 'ANDROID_PRODUCTION_SERIAL', 'ANDROID_TARGET_BINDING_KEY',
              'MOBILE_PROXY_ADMIN_TOKEN', 'MOBILE_PROXY_DEVICE_TOKEN', 'MOBILE_PROXY_UI_TOKEN',
              'MOBILE_PROXY_RELAY_USER', 'MOBILE_PROXY_RELAY_PASSWORD', 'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64',
          )
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit('phone target execution boundary incomplete: ' + ', '.join(missing))

          lifecycle_required = (
              'workflow_call:',
              "command != '/exercise-runtime-recovery phone-production v0.1.7'",
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production',
              'cancel-in-progress: false',
              'environment: phone-production',
              '.github/scripts/exercise_runtime_recovery.py',
              'stage4-runtime-recovery-exercise.v1',
              'STAGE4_RUNTIME_RECOVERY_ACCEPTED classification=RECOVERED',
              'if-no-files-found: error',
          )
          lifecycle_missing = [item for item in lifecycle_required if item not in lifecycle_workflow]
          if lifecycle_missing:
              raise SystemExit('Stage 4 lifecycle workflow boundary incomplete: ' + ', '.join(lifecycle_missing))
          for forbidden in (
              'workflow_dispatch:',
              'issue_comment:',
              'run_phone_release_deployment.py',
              'dispatch_release_once',
              'dispatch_install_once',
              'systemctl restart',
              'observe-runner-transport',
              'phone-transport-preflight',
              '/deploy ',
              '/retry-deploy ',
          ):
              if forbidden in lifecycle_workflow:
                  raise SystemExit('Stage 4 lifecycle workflow gained forbidden capability: ' + forbidden)

          restart_required = (
              'workflow_call:',
              "command != '/exercise-runtime-restart phone-production v0.1.7'",
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production',
              'cancel-in-progress: false',
              'environment: phone-production',
              '.github/scripts/exercise_runtime_restart.py',
              'stage4-runtime-restart-exercise.v1',
              'STAGE4_RUNTIME_RESTART_ACCEPTED classification=RESTARTED',
              'if-no-files-found: error',
          )
          restart_missing = [item for item in restart_required if item not in restart_workflow]
          if restart_missing:
              raise SystemExit('Stage 4 runtime restart workflow boundary incomplete: ' + ', '.join(restart_missing))
          for forbidden in (
              'workflow_dispatch:',
              'issue_comment:',
              'run_phone_release_deployment.py',
              'dispatch_release_once',
              'dispatch_install_once',
              'systemctl restart',
              'observe-runner-transport',
              'phone-transport-preflight',
              'phone-runtime-recovery.yml',
              'service.sh',
              'adb install',
              'adb push',
              '/deploy ',
              '/retry-deploy ',
          ):
              if forbidden in restart_workflow:
                  raise SystemExit('Stage 4 runtime restart workflow gained forbidden capability: ' + forbidden)

          lifecycle_source = lifecycle_runtime.read_text(encoding='utf-8')
          lifecycle_tree = ast.parse(lifecycle_source)
          root_mutation_calls = [
              node for node in ast.walk(lifecycle_tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == '_run_root_script'
          ]
          if len(root_mutation_calls) != 1:
              raise SystemExit('Stage 4 lifecycle adapter must contain exactly one root mutation callsite')
          if lifecycle_source.count('kill -TERM "$host_pid"') != 1:
              raise SystemExit('Stage 4 lifecycle adapter must contain exactly one fixed host-daemon TERM')
          for forbidden in (
              '--process', '--signal', '--pid',
              'dispatch_release_once', 'dispatch_install_once',
              'subprocess.run', 'subprocess.Popen',
              'systemctl', 'runner_transport',
          ):
              if forbidden in lifecycle_source:
                  raise SystemExit('Stage 4 lifecycle adapter gained forbidden generic/mutation surface: ' + forbidden)

          restart_source = restart_runtime.read_text(encoding='utf-8')
          restart_tree = ast.parse(restart_source)
          restart_root_mutation_calls = [
              node for node in ast.walk(restart_tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == '_run_root_script'
          ]
          if len(restart_root_mutation_calls) != 1:
              raise SystemExit('Stage 4 runtime restart adapter must contain exactly one root mutation callsite')
          if restart_source.count('kill -TERM "$supervisor_pid"') != 1:
              raise SystemExit('Stage 4 runtime restart adapter must contain exactly one fixed runtime-supervisor TERM')
          if 'kill -TERM "$host_pid"' in restart_source or 'kill -TERM "$sing_box_pid"' in restart_source:
              raise SystemExit('Stage 4 runtime restart adapter must not terminate child processes directly')
          if 'printf \'%s\' "${{22}}"' not in restart_source or 'printf \'%s\' "$22"' in restart_source:
              raise SystemExit('Stage 4 runtime restart adapter does not encode the exact process starttime field safely')
          for forbidden in (
              '--process', '--signal', '--pid',
              'dispatch_release_once', 'dispatch_install_once',
              'subprocess.run', 'subprocess.Popen',
              'systemctl', 'runner_transport',
          ):
              if forbidden in restart_source:
                  raise SystemExit('Stage 4 runtime restart adapter gained forbidden generic/mutation surface: ' + forbidden)

          if workflow.count('group: production-target-phone-production') < 1:
              raise SystemExit('Product Release phone transaction lost target serialization')
          if lifecycle_workflow.count('group: production-target-phone-production') != 1:
              raise SystemExit('Stage 4 lifecycle exercise must share the exact production phone serialization domain')
          if restart_workflow.count('group: production-target-phone-production') != 1:
              raise SystemExit('Stage 4 runtime restart exercise must share the exact production phone serialization domain')

          adapter_tree = ast.parse(apk_adapter)
          install_calls = []
          for node in ast.walk(adapter_tree):
              if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Attribute) or node.func.attr != 'run':
                  continue
              if not node.args or not isinstance(node.args[0], ast.List):
                  continue
              values = []
              for item in node.args[0].elts:
                  if isinstance(item, ast.Constant) and isinstance(item.value, str):
                      values.append(item.value)
                  elif isinstance(item, ast.Name):
                      values.append(f'<{item.id}>')
                  else:
                      values.append('<expr>')
              if 'install' in values:
                  install_calls.append(values)
          if install_calls != [['<adb>', '-s', '<serial>', 'install', '-r', '<expr>']]:
              raise SystemExit(f'Android adapter must contain exactly one bounded install-replace primitive; got {install_calls!r}')

          runner_tree = ast.parse(runtime.read_text(encoding='utf-8'))
          composite_calls = [
              node for node in ast.walk(runner_tree)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'dispatch_release_once'
          ]
          direct_apk_calls = [
              node for node in ast.walk(runner_tree)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'dispatch_install_once'
          ]
          if len(composite_calls) != 1 or direct_apk_calls:
              raise SystemExit(f'controller must have exactly one composite dispatch callsite and no direct APK dispatch; composite={len(composite_calls)} direct_apk={len(direct_apk_calls)}')

          composite_tree = ast.parse(composite_adapter_path.read_text(encoding='utf-8'))
          primitive_calls = [
              node for node in ast.walk(composite_tree)
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'dispatch_install_once'
          ]
          if len(primitive_calls) != 1:
              raise SystemExit('composite adapter must contain exactly one APK destructive primitive callsite')

          legacy_routes = (
              '/phone-clean-install', '/phone-filesystem-certification', '/phone-filesystem-quarantine-cleanup',
              '/phone-runtime-recovery', '/runtime-reconstruction', '/phone-apk-install',
              'filesystem-scratch-kernel-rehearsal.yml', 'android-signing-migration.yml',
          )
          present = [item for item in legacy_routes if item in router]
          if present:
              raise SystemExit('legacy phone mutator remains reachable from production Issue #1: ' + ', '.join(present))

          router_required = (
              "github.event.repository.full_name == 'iamaman11/mobile-proxy-production'",
              'github.event.issue.number == 1', 'github.event.comment.user.login == github.repository_owner',
              "needs.route.outputs.route_id == 'deploy-product-release'", "needs.route.outputs.operation == 'deploy-product-release'",
              "needs.route.outputs.route_id == 'exercise-runtime-recovery'", "needs.route.outputs.operation == 'exercise-runtime-recovery'",
              "needs.route.outputs.route_id == 'exercise-runtime-restart'", "needs.route.outputs.operation == 'exercise-runtime-restart'",
              "needs.route.outputs.destructive == 'true'", 'uses: ./.github/workflows/release-deployment.yml',
              'uses: ./.github/workflows/stage4-runtime-recovery-exercise.yml',
              'uses: ./.github/workflows/stage4-runtime-restart-exercise.yml', 'secrets: inherit',
          )
          router_missing = [item for item in router_required if item not in router]
          if router_missing:
              raise SystemExit('registry-gated phone mutation routes incomplete: ' + ', '.join(router_missing))
          if "startsWith(github.event.comment.body, '/deploy ')" in router:
              raise SystemExit('deployment bypassed the declarative command classifier')
          if "startsWith(github.event.comment.body, '/exercise-runtime-recovery ')" in router:
              raise SystemExit('lifecycle mutation bypassed the declarative command classifier')
          if "startsWith(github.event.comment.body, '/exercise-runtime-restart ')" in router:
              raise SystemExit('runtime restart mutation bypassed the declarative command classifier')

          recovery = Path('.github/controller/deployment_state_machine.py').read_text(encoding='utf-8')
          if 'def recover_unknown' not in recovery or 'raise TransitionError("recovery is strictly read-only")' not in recovery:
              raise SystemExit('UNKNOWN deployment recovery is not structurally read-only')

          print('CONTROLLER_OWNED_PHONE_MUTATION_POLICY_OK')
          print('sole_issue_ingress=true')
          print('deployment_registry_gate=true')
          print('fixed_lifecycle_registry_gate=true')
          print('fixed_runtime_restart_registry_gate=true')
          print('shared_phone_serialization=true')
          PY
