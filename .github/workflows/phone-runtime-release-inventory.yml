name: Production phone runtime release inventory

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      source_event_name:
        required: true
        type: string
      source_issue_number:
        required: true
        type: number
      source_comment_id:
        required: true
        type: number
      source_actor:
        required: true
        type: string
      source_comment_url:
        required: true
        type: string
      control_request_id:
        required: true
        type: string
      control_request_json:
        required: true
        type: string

permissions:
  contents: read

jobs:
  command-gate:
    if: >-
      inputs.source_issue_number == 1 &&
      inputs.source_actor == github.repository_owner &&
      startsWith(inputs.command, '/phone-runtime-release-inventory ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
    steps:
      - id: command
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          match = re.fullmatch(r"/phone-runtime-release-inventory ([0-9a-f]{40})", os.environ.get("COMMAND", "").strip())
          if match is None:
              raise SystemExit("invalid command")
          requested = match.group(1)
          req = urllib.request.Request(
              "https://api.github.com/repos/iamaman11/mobile-proxy/commits/main",
              headers={"Accept":"application/vnd.github+json","User-Agent":"mobile-proxy-production-runtime-release-inventory"},
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              current = json.load(response)["sha"]
          if requested != current:
              raise SystemExit("requested SHA is not current canonical main")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={requested}\n")
          PY

  inventory:
    needs: command-gate
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 5
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
    steps:
      - name: Fetch exact canonical registered-device preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/iamaman11/mobile-proxy/${CANONICAL_SHA}/scripts/run_private_phone_preflight.py" \
            --output "${RUNNER_TEMP}/run_private_phone_preflight.py"

      - name: Record bounded immutable release inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, re, subprocess
          from pathlib import Path

          serial = os.environ["ANDROID_PRODUCTION_SERIAL"]
          canonical_sha = os.environ["CANONICAL_SHA"]
          spec = importlib.util.spec_from_file_location("preflight", Path(os.environ["RUNNER_TEMP"]) / "run_private_phone_preflight.py")
          preflight = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(preflight)
          preflight.require_canonical_sha(canonical_sha)
          preflight.require_expected_serial()
          preflight.prove_registered_device(serial)

          def root_capture(shell):
              result = subprocess.run(
                  ["adb","-s",serial,"shell","su","0","sh","-c",shell],
                  check=False, capture_output=True, text=True, timeout=30,
              )
              if result.returncode != 0:
                  raise RuntimeError("read-only runtime release inventory probe failed")
              return result.stdout.strip()

          # Only release IDs, public Git SHAs, and categorical layout booleans are emitted.
          # The resolved current target path is deliberately never printed or persisted.
          raw = root_capture(r'''
          ROOT=/data/adb/mobile-proxy-node
          current_link="$(readlink "$ROOT/current" 2>/dev/null || true)"
          current_resolved="$(readlink -f "$ROOT/current" 2>/dev/null || true)"
          current_id="${current_link##*/}"
          current_is_symlink=false; [ -L "$ROOT/current" ] && current_is_symlink=true
          current_target_exists=false; [ -n "$current_resolved" ] && [ -d "$current_resolved" ] && current_target_exists=true
          current_under_managed_root=false
          current_under_releases_root=false
          case "$current_resolved" in "$ROOT"/*) current_under_managed_root=true ;; esac
          case "$current_resolved" in "$ROOT"/releases/*) current_under_releases_root=true ;; esac
          canonical_release_entry_matches=false
          if [ -n "$current_id" ] && [ "$current_resolved" = "$ROOT/releases/$current_id" ] && [ -d "$ROOT/releases/$current_id" ]; then
            canonical_release_entry_matches=true
          fi
          current_service_x=false; [ -x "$ROOT/current/service.sh" ] && current_service_x=true
          current_supervisor_x=false; [ -x "$ROOT/current/bin/runtime-supervisor" ] && current_supervisor_x=true
          current_host_x=false; [ -x "$ROOT/current/bin/host-daemon" ] && current_host_x=true
          current_sing_x=false; [ -x "$ROOT/current/bin/sing-box" ] && current_sing_x=true
          printf 'CURRENT|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s\n' \
            "$current_id" "$current_is_symlink" "$current_target_exists" \
            "$current_under_managed_root" "$current_under_releases_root" \
            "$canonical_release_entry_matches" "$current_service_x" \
            "$current_supervisor_x" "$current_host_x" "$current_sing_x"
          count=0
          for dir in "$ROOT"/releases/*; do
            [ -d "$dir" ] || continue
            [ "$count" -lt 20 ] || break
            rid="${dir##*/}"
            sha=''
            if [ -f "$dir/release-metadata.json" ]; then
              sha="$(sed -n 's/.*"git_sha"[[:space:]]*:[[:space:]]*"\([0-9a-fA-F]*\)".*/\1/p' "$dir/release-metadata.json" | head -n1)"
            fi
            support=false
            grep -a -F -q 'first_party_android_egress' "$dir/bin/runtime-supervisor" 2>/dev/null && support=true
            service_x=false; [ -x "$dir/service.sh" ] && service_x=true
            supervisor_x=false; [ -x "$dir/bin/runtime-supervisor" ] && supervisor_x=true
            host_x=false; [ -x "$dir/bin/host-daemon" ] && host_x=true
            sing_x=false; [ -x "$dir/bin/sing-box" ] && sing_x=true
            integrity=false; [ -f "$dir/integrity.json" ] && integrity=true
            printf 'REL|%s|%s|%s|%s|%s|%s|%s|%s\n' "$rid" "$sha" "$support" "$service_x" "$supervisor_x" "$host_x" "$sing_x" "$integrity"
            count=$((count + 1))
          done
          ''')

          current = {
              "release_id": None,
              "is_symlink": False,
              "target_exists": False,
              "under_managed_root": False,
              "under_releases_root": False,
              "canonical_release_entry_matches": False,
              "service_executable": False,
              "runtime_supervisor_executable": False,
              "host_daemon_executable": False,
              "sing_box_executable": False,
          }
          releases = []
          id_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")
          sha_re = re.compile(r"^[0-9a-f]{40}$")
          for line in raw.splitlines():
              parts = line.split("|")
              if parts[0] == "CURRENT" and len(parts) == 11:
                  current = {
                      "release_id": parts[1] if id_re.fullmatch(parts[1]) else None,
                      "is_symlink": parts[2] == "true",
                      "target_exists": parts[3] == "true",
                      "under_managed_root": parts[4] == "true",
                      "under_releases_root": parts[5] == "true",
                      "canonical_release_entry_matches": parts[6] == "true",
                      "service_executable": parts[7] == "true",
                      "runtime_supervisor_executable": parts[8] == "true",
                      "host_daemon_executable": parts[9] == "true",
                      "sing_box_executable": parts[10] == "true",
                  }
              elif parts[0] == "REL" and len(parts) == 9 and id_re.fullmatch(parts[1]):
                  sha = parts[2].lower()
                  releases.append({
                      "release_id": parts[1],
                      "git_sha": sha if sha_re.fullmatch(sha) else None,
                      "supports_first_party_android_egress": parts[3] == "true",
                      "service_executable": parts[4] == "true",
                      "runtime_supervisor_executable": parts[5] == "true",
                      "host_daemon_executable": parts[6] == "true",
                      "sing_box_executable": parts[7] == "true",
                      "integrity_manifest_present": parts[8] == "true",
                  })

          report = {
              "format_version": 2,
              "canonical_sha": canonical_sha,
              "current": current,
              "release_count": len(releases),
              "releases": releases,
              "raw_current_target_path_recorded": False,
              "raw_config_recorded": False,
              "raw_device_identifier_recorded": False,
              "phone_mutation_performed": False,
          }
          Path(os.environ["RUNNER_TEMP"], "phone-runtime-release-inventory.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("bounded runtime release inventory: " + json.dumps(report, sort_keys=True))
          PY

      - name: Upload bounded inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: phone-runtime-release-inventory-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-runtime-release-inventory.json
          if-no-files-found: error
          retention-days: 30
