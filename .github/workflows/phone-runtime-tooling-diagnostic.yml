name: Production phone runtime tooling diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-phone-runtime-tooling-diagnostic
  cancel-in-progress: false

jobs:
  command-gate:
    name: Validate exact owner tooling diagnostic command
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-runtime-tooling-diagnostic ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
    steps:
      - name: Validate exact command and current canonical main SHA
        id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(r"/phone-runtime-tooling-diagnostic ([0-9a-f]{40})", command)
          if match is None:
              raise SystemExit("invalid runtime tooling diagnostic command")
          requested = match.group(1)
          req = urllib.request.Request(
              "https://api.github.com/repos/iamaman11/mobile-proxy/commits/main",
              headers={"Accept":"application/vnd.github+json","User-Agent":"mobile-proxy-production-runtime-tooling-diagnostic"},
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              current = json.load(response)["sha"]
          if requested != current:
              raise SystemExit("requested SHA is not current canonical main")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={requested}\n")
          PY

  diagnostic:
    name: Inspect bounded local runtime build tools read-only
    needs: command-gate
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 5
    env:
      ACTIONS_PROBE_ADMIN_TOKEN: ${{ secrets.MOBILE_PROXY_ADMIN_TOKEN }}
      ACTIONS_PROBE_DEVICE_TOKEN: ${{ secrets.MOBILE_PROXY_DEVICE_TOKEN }}
      ACTIONS_PROBE_UI_TOKEN: ${{ secrets.MOBILE_PROXY_UI_TOKEN }}
      ACTIONS_PROBE_RELAY_USER: ${{ secrets.MOBILE_PROXY_RELAY_USER }}
      ACTIONS_PROBE_RELAY_PASSWORD: ${{ secrets.MOBILE_PROXY_RELAY_PASSWORD }}
      ACTIONS_PROBE_REVERSE_TUNNEL_CERT: ${{ secrets.MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64 }}
    steps:
      - name: Record bounded tool availability
        shell: bash
        run: |
          set -euo pipefail
          for tool in adb cargo curl git tar python3; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s=true\n' "$tool"
            else
              printf '%s=false\n' "$tool"
            fi
          done
          echo 'phone_mutation=false'
          echo 'apk_mutation=false'
          echo 'runner_mutation=false'

      - name: Classify runtime input presence without values
        shell: bash
        run: |
          set -euo pipefail

          runner_present=true
          for name in \
            MOBILE_PROXY_ADMIN_TOKEN \
            MOBILE_PROXY_DEVICE_TOKEN \
            MOBILE_PROXY_UI_TOKEN \
            MOBILE_PROXY_RELAY_USER \
            MOBILE_PROXY_RELAY_PASSWORD \
            MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64; do
            if [ -z "${!name:-}" ]; then
              runner_present=false
            fi
          done

          actions_present=true
          for name in \
            ACTIONS_PROBE_ADMIN_TOKEN \
            ACTIONS_PROBE_DEVICE_TOKEN \
            ACTIONS_PROBE_UI_TOKEN \
            ACTIONS_PROBE_RELAY_USER \
            ACTIONS_PROBE_RELAY_PASSWORD \
            ACTIONS_PROBE_REVERSE_TUNNEL_CERT; do
            if [ -z "${!name:-}" ]; then
              actions_present=false
            fi
          done

          printf 'runner_runtime_inputs_present=%s\n' "$runner_present"
          printf 'actions_runtime_inputs_present=%s\n' "$actions_present"
          echo 'secret_values_recorded=false'
          echo 'config_rendered=false'
          echo 'phone_access=false'
          echo 'phone_mutation=false'

      - name: Classify runtime input shape without values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import unicodedata

          probes = (
              ('MOBILE_PROXY_ADMIN_TOKEN', 'ACTIONS_PROBE_ADMIN_TOKEN'),
              ('MOBILE_PROXY_DEVICE_TOKEN', 'ACTIONS_PROBE_DEVICE_TOKEN'),
              ('MOBILE_PROXY_UI_TOKEN', 'ACTIONS_PROBE_UI_TOKEN'),
              ('MOBILE_PROXY_RELAY_USER', 'ACTIONS_PROBE_RELAY_USER'),
              ('MOBILE_PROXY_RELAY_PASSWORD', 'ACTIONS_PROBE_RELAY_PASSWORD'),
              ('MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64', 'ACTIONS_PROBE_REVERSE_TUNNEL_CERT'),
          )

          def has_control(value):
              return any(unicodedata.category(ch) == 'Cc' for ch in value)

          def flag(value):
              return 'true' if value else 'false'

          all_validator_compatible = True
          for canonical_name, probe_name in probes:
              value = os.environ.get(probe_name, '')
              present = bool(value)
              bounded = present and len(value) <= 4096
              control_chars = present and has_control(value)
              validator_compatible = bounded and not control_chars
              all_validator_compatible = all_validator_compatible and validator_compatible
              print(
                  'runtime_input_shape|'
                  f'{canonical_name}|present={flag(present)}|bounded={flag(bounded)}|'
                  f'control_chars={flag(control_chars)}|validator_compatible={flag(validator_compatible)}'
              )

              if canonical_name == 'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64':
                  trimmed = value.strip()
                  internal_control_chars = bool(trimmed) and has_control(trimmed)
                  internal_whitespace = bool(trimmed) and any(ch.isspace() for ch in trimmed)
                  base64_valid = False
                  if trimmed:
                      try:
                          base64.b64decode(trimmed, validate=True)
                      except (binascii.Error, ValueError):
                          base64_valid = False
                      else:
                          base64_valid = True
                  print(
                      'runtime_cert_shape|'
                      f'control_chars_after_outer_trim={flag(internal_control_chars)}|'
                      f'whitespace_after_outer_trim={flag(internal_whitespace)}|'
                      f'standard_base64_after_outer_trim={flag(base64_valid)}'
                  )

          print(f'all_runtime_inputs_validator_compatible={flag(all_validator_compatible)}')
          print('secret_values_recorded=false')
          print('secret_lengths_recorded=false')
          print('secret_hashes_recorded=false')
          print('config_rendered=false')
          print('phone_access=false')
          print('phone_mutation=false')
          PY