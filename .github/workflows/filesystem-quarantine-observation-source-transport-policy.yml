name: Filesystem quarantine observation source transport policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-quarantine-observation-source-transport:
    name: Validate quarantine observation source retry and operation-once contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce bounded immutable-source transport retries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/phone-filesystem-quarantine-observation.yml')
          if not path.is_file():
              raise SystemExit('quarantine observation workflow is missing')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          required = (
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'id: source-download-1',
              'id: source-download-2',
              'id: source-download-3',
              'Back off before quarantine observation source retry 2',
              'Back off before quarantine observation source retry 3',
              "steps.source-download-1.outcome == 'failure'",
              "steps.source-download-2.outcome == 'failure'",
              'id: source-transport',
              'SOURCE_DOWNLOAD_1_OUTCOME:',
              'SOURCE_DOWNLOAD_2_OUTCOME:',
              'SOURCE_DOWNLOAD_3_OUTCOME:',
              'no immutable quarantine observation source download attempt succeeded',
              'immutable quarantine observation source destination already exists',
              'destination="${RUNNER_TEMP}/phone-filesystem-quarantine-observe-source"',
              'mv "${selected}" "${destination}"',
              'Verify source bundle before device access',
              'Run bounded read-only quarantine observation',
              'FILESYSTEM_QUARANTINE_UNOBSERVED',
              'FILESYSTEM_QUARANTINE_OBSERVED_UNPERSISTED',
              'FILESYSTEM_QUARANTINE_CLEANUP_ADMISSIBLE',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(
                  'quarantine observation source transport contract missing: ' + ', '.join(missing)
              )

          if 'production-phone-global-mutation' in text:
              raise SystemExit('read-only quarantine observation must stay outside global mutation lock')

          def named_step_blocks(step_prefix):
              blocks = []
              for index, line in enumerate(lines):
                  if line.strip().startswith(f'- name: {step_prefix}'):
                      end = index + 1
                      while end < len(lines) and not lines[end].startswith('      - name: '):
                          end += 1
                      blocks.append(lines[index:end])
              return blocks

          downloads = named_step_blocks('Download immutable canonical quarantine observation logic (attempt ')
          if len(downloads) != 3:
              raise SystemExit('quarantine observation must have exactly three source download attempts')

          names = []
          paths = []
          for attempt, block in enumerate(downloads, start=1):
              block_text = '\n'.join(block)
              if block_text.count('uses: actions/download-artifact@v4') != 1:
                  raise SystemExit(f'source download attempt {attempt} must use download-artifact once')
              if block_text.count('continue-on-error: true') != 1:
                  raise SystemExit(f'source download attempt {attempt} must expose failure for bounded retry')
              name_lines = [
                  line.strip()
                  for line in block
                  if line.strip().startswith('name: phone-filesystem-quarantine-observe-source-')
              ]
              path_lines = [
                  line.strip()
                  for line in block
                  if line.strip().startswith('path: ')
                  and 'phone-filesystem-quarantine-observe-source-attempt-' in line
              ]
              if len(name_lines) != 1 or len(path_lines) != 1:
                  raise SystemExit(f'source download attempt {attempt} has ambiguous identity or path')
              names.append(name_lines[0])
              paths.append(path_lines[0])
              if 'env.CANONICAL_SHA' not in name_lines[0] or 'github.run_id' not in name_lines[0]:
                  raise SystemExit('source artifact identity must bind canonical SHA and exact same run')
              if not path_lines[0].endswith(f'phone-filesystem-quarantine-observe-source-attempt-{attempt}'):
                  raise SystemExit(f'source download attempt {attempt} must use isolated temporary state')

          if len(set(names)) != 1:
              raise SystemExit('all source retries must request one exact immutable artifact identity')
          if len(set(paths)) != 3:
              raise SystemExit('all source retries must use isolated temporary paths')

          second = '\n'.join(downloads[1])
          third = '\n'.join(downloads[2])
          if "steps.source-download-1.outcome == 'failure'" not in second:
              raise SystemExit('source retry 2 must require attempt 1 failure')
          if (
              "steps.source-download-1.outcome == 'failure'" not in third
              or "steps.source-download-2.outcome == 'failure'" not in third
          ):
              raise SystemExit('source retry 3 must require both prior failures')
          if text.count('run: sleep 2') != 1 or text.count('run: sleep 5') != 1:
              raise SystemExit('source transport backoff must stay bounded to two retries')

          promote = named_step_blocks(
              'Promote one successfully downloaded immutable quarantine observation source bundle'
          )
          if len(promote) != 1:
              raise SystemExit('source transport must have one fail-closed promotion gate')
          promote_text = '\n'.join(promote[0])
          if 'continue-on-error: true' in promote_text or 'if: always()' in promote_text:
              raise SystemExit('source promotion must fail closed before device access')
          for token in (
              'SOURCE_DOWNLOAD_1_OUTCOME',
              'SOURCE_DOWNLOAD_2_OUTCOME',
              'SOURCE_DOWNLOAD_3_OUTCOME',
              '= success',
              'exit 1',
              '[ -e "${destination}" ]',
              'mv "${selected}" "${destination}"',
          ):
              if token not in promote_text:
                  raise SystemExit(f'source promotion contract missing: {token}')
          for destructive in ('rm -rf', 'mv -f', 'cp -p', 'mkdir -p'):
              if destructive in promote_text:
                  raise SystemExit(f'source promotion contains forbidden destructive pattern: {destructive}')

          verify = named_step_blocks('Verify source bundle before device access')
          operation = named_step_blocks('Run bounded read-only quarantine observation')
          if len(verify) != 1 or len(operation) != 1:
              raise SystemExit('quarantine observation must keep one verification gate and one device step')
          if 'continue-on-error: true' in '\n'.join(verify[0]) or 'if: always()' in '\n'.join(verify[0]):
              raise SystemExit('source verification must fail closed before device access')
          operation_text = '\n'.join(operation[0])
          if operation_text.count("'--mode', 'observe'") != 1:
              raise SystemExit('quarantine observation mode must be invoked exactly once')
          if operation_text.count('subprocess.run(command, check=True)') != 1:
              raise SystemExit('quarantine observation subprocess must be invoked exactly once')
          if text.count("'--mode', 'observe'") != 1:
              raise SystemExit('transport retries must not duplicate observation mode invocation')
          if text.count('subprocess.run(command, check=True)') != 1:
              raise SystemExit('transport retries must not duplicate device subprocess invocation')

          promote_index = text.index(
              'Promote one successfully downloaded immutable quarantine observation source bundle'
          )
          verify_index = text.index('Verify source bundle before device access')
          operation_index = text.index('Run bounded read-only quarantine observation')
          if not promote_index < verify_index < operation_index:
              raise SystemExit('source transport and verification must complete before device observation')

          def select_attempt(outcomes):
              for index, outcome in enumerate(outcomes, start=1):
                  if outcome == 'success':
                      return index
              return None

          truth_table = (
              (('success', 'skipped', 'skipped'), 1),
              (('failure', 'success', 'skipped'), 2),
              (('failure', 'failure', 'success'), 3),
              (('failure', 'failure', 'failure'), None),
          )
          for outcomes, expected in truth_table:
              actual = select_attempt(outcomes)
              if actual != expected:
                  raise SystemExit(
                      f'quarantine source transport truth table differs: '
                      f'outcomes={outcomes} expected={expected} actual={actual}'
                  )

          print('filesystem quarantine observation source transport policy: accepted')
          print('source_download_attempts=3')
          print('isolated_download_state=accepted')
          print('immutable_same_run_artifact_identity=accepted')
          print('device_observation_invocations=1')
          print('transport_failure_state=FILESYSTEM_QUARANTINE_UNOBSERVED')
          PY
