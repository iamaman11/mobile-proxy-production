name: Physical transaction wiring policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-physical-wiring:
    name: Validate exact canonical plans, kernel and bounded scratch execution wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private wiring candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out accepted public canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: 374073b4e666d71981d5ccf9169c30e0979845e6
          path: canonical-public

      - name: Compile private wiring verifier and scratch seam
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/validate_physical_transaction_wiring.py \
            .github/scripts/filesystem_scratch_edges.py \
            .github/scripts/filesystem_scratch_transaction_ports.py \
            .github/scripts/run_filesystem_scratch_transaction.py \
            .github/scripts/test_filesystem_scratch_transaction.py

      - name: Prove default fail-closed wiring plus one atomic scratch override
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_physical_transaction_wiring.py \
            --private-root . \
            --canonical-root canonical-public
          python3 .github/scripts/test_filesystem_scratch_transaction.py

      - name: Prove canonical physical transaction identity crosses preflight unchanged
        shell: bash
        env:
          CANONICAL_SHA: 374073b4e666d71981d5ccf9169c30e0979845e6
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib
          import os
          import sys
          from pathlib import Path

          scripts = Path('canonical-public/scripts').resolve()
          sys.path.insert(0, str(scripts))
          transaction = importlib.import_module('transaction_runner')
          preflight = importlib.import_module('run_private_phone_preflight')

          semantic = transaction.routed_semantic_request_identity(
              request_id='req-sha256:' + 'a' * 64,
              operation='phone-filesystem-certification',
              arguments=(os.environ['CANONICAL_SHA'],),
              authority_cursor='issue179-comment-5531491187',
              desired_generation='gen-sha256:' + 'b' * 64,
          )
          tx = transaction.derive_physical_transaction_id(
              semantic,
              'android.filesystem-scratch-roundtrip.v1',
          )
          if preflight.require_transaction_id(tx) != tx:
              raise SystemExit('canonical physical transaction identity changed at preflight')
          fact = preflight.build_phone_access_fact_envelope(
              os.environ['CANONICAL_SHA'],
              target_binding_id='tb-hmac-sha256:' + 'c' * 64,
              session_id=f'scratch-tx-session:33800000000:1:{tx}',
              observation_ref=f'scratch-boundary:33800000000:1:{tx}',
              transaction_id=tx,
          )
          expected = {'scope': f'transaction/{tx}', 'identity': tx}
          if fact['dependencies'][-1] != expected:
              raise SystemExit('canonical SAME_TRANSACTION dependency differs')
          print('PHYSICAL_TX_PREFLIGHT_IDENTITY_OK')
          PY

      - name: Prove persisted may-have-dispatched evidence forbids a second dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          scripts = Path('canonical-public/scripts').resolve()
          sys.path.insert(0, str(scripts))
          operation = importlib.import_module('operation_state_machine')
          transaction = importlib.import_module('transaction_runner')
          filesystem = importlib.import_module('operations.filesystem')

          semantic = transaction.routed_semantic_request_identity(
              request_id='req-sha256:' + 'd' * 64,
              operation='phone-filesystem-certification',
              arguments=('374073b4e666d71981d5ccf9169c30e0979845e6',),
              authority_cursor='issue179-comment-5531491187',
              desired_generation='gen-sha256:' + 'e' * 64,
          )
          request = filesystem.FilesystemScratchRoundtripRequest(
              semantic_request=semantic,
              scratch_ref='/data/local/tmp/mobile-proxy-kernel-' + 'f' * 32,
              payload_ref='payload/gen-sha256:' + 'e' * 64,
          )
          tx = transaction.derive_physical_transaction_id(
              semantic,
              'android.filesystem-scratch-roundtrip.v1',
          )
          persisted_ref = 'issue-comment:1001'
          prior = (
              operation.PhaseEvidence('resolve_authority', operation.PASSED, tx, persisted_ref),
              operation.PhaseEvidence('mutation_scope', operation.PASSED, tx, persisted_ref),
              operation.PhaseEvidence('phone_access_boundary', operation.PASSED, tx, persisted_ref),
              operation.PhaseEvidence('mutation_intent', operation.PASSED, tx, persisted_ref),
              operation.PhaseEvidence('scratch_roundtrip', operation.DISPATCHED, tx, persisted_ref),
          )

          class Executor:
              dispatch_calls = 0
              observer_calls = 0

              def dispatch_once(self, _request):
                  self.dispatch_calls += 1
                  raise AssertionError('blind retry reached physical dispatch')

              def verify_postcondition(self, _request):
                  self.observer_calls += 1
                  raise AssertionError('blind retry reached postcondition observation')

          executor = Executor()
          binding = filesystem.FilesystemScratchRoundtripBinding(executor)
          try:
              transaction.TransactionRunner().run(
                  request,
                  ports=object(),
                  binding=binding,
                  existing_evidence=prior,
              )
          except transaction.BlindRetryForbidden:
              pass
          else:
              raise SystemExit('Universal Kernel did not forbid retry after persisted DISPATCHED evidence')
          if executor.dispatch_calls != 0 or executor.observer_calls != 0:
              raise SystemExit('blind retry crossed an execution or observer edge')
          print('SCRATCH_BLIND_RETRY_FORBIDDEN_OK')
          PY
