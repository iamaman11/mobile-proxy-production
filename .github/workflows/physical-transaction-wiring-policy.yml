name: Physical transaction wiring policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-physical-wiring:
    name: Validate exact canonical plans, kernel and executor bindings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private wiring candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out accepted public canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: 8e994aafcf1b56a86cffef1d99f380393fa71f17
          path: canonical-public

      - name: Compile private wiring verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/validate_physical_transaction_wiring.py

      - name: Prove canonical handoff remains hosted and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_physical_transaction_wiring.py \
            --private-root . \
            --canonical-root canonical-public
