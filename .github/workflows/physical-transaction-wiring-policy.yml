name: Physical transaction wiring policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-physical-wiring:
    name: Validate private controller transaction wiring
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact private controller candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove controller-owned transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/controller/tests/test_controller.py
          python3 .github/controller/tests/test_phone_runtime.py
          python3 .github/controller/tests/test_product_runtime_renderer.py
          python3 .github/controller/tests/test_phone_target.py
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('.github/controller')
          required = {
              'deployment_state_machine.py', 'deployment_request.py', 'release_resolver.py',
              'evidence_store.py', 'android_target.py', 'phone_runtime.py',
              'product_runtime_renderer.py', 'phone_target.py', 'terminal_result.py', 'github_projection.py',
          }
          found = {path.name for path in controller.glob('*.py')}
          missing = sorted(required - found)
          if missing:
              raise SystemExit('private controller ownership incomplete: ' + ', '.join(missing))

          active = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in [
                  Path('.github/workflows/production-control-router.yml'),
                  Path('.github/workflows/release-deployment.yml'),
                  Path('.github/scripts/deployment_command_router.py'),
                  Path('.github/scripts/prepare_release_deployment.py'),
                  Path('.github/scripts/run_phone_release_deployment.py'),
              ]
          )
          forbidden = (
              'canonical-public', 'authority_cursor', 'issue179-comment-',
              'transaction_runner.py', 'control_state_machine.py', 'operation_state_machine.py',
          )
          present = [item for item in forbidden if item in active]
          if present:
              raise SystemExit('active v2 runtime still depends on legacy public kernel/cursor: ' + ', '.join(present))
          if active.count('run_phone_release_deployment.py') != 1:
              raise SystemExit('composite transaction must retain one existing transaction owner')
          if 'android-release-composite-v1' not in active:
              raise SystemExit('active transaction owner does not persist composite dispatch identity')
          print('PRIVATE_CONTROLLER_COMPOSITE_TRANSACTION_WIRING_OK')
          PY
