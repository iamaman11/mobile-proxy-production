name: Production Android 0.1.4 signed migration candidate

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      source_event_name:
        required: true
        type: string
      source_issue_number:
        required: true
        type: number
      source_comment_id:
        required: true
        type: number
      source_actor:
        required: true
        type: string
      source_comment_url:
        required: true
        type: string
      control_request_id:
        required: true
        type: string
      control_request_json:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-android-v014-signed-candidate
  cancel-in-progress: false

jobs:
  command-gate:
    name: Validate bound signed-candidate command and canonical Quality
    if: >-
      inputs.source_issue_number == 1 &&
      inputs.source_actor == github.repository_owner &&
      startsWith(inputs.command, '/android-release-build ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      version_name: ${{ steps.binding.outputs.version_name }}
      version_code: ${{ steps.binding.outputs.version_code }}
      application_id: ${{ steps.binding.outputs.application_id }}
    steps:
      - name: Check out exact private execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution

      - name: Load and validate single Android migration execution binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path('private-execution/.github/production/android-v0.1.4-migration-binding.json')
          binding = json.loads(path.read_text(encoding='utf-8'))
          expected = {
              'format_version': 1,
              'binding_role': 'private_execution_only',
              'canonical_repository': 'iamaman11/mobile-proxy',
              'quality_required': True,
              'migration_tracker_issue': 162,
              'hardening_tracker_issue': 179,
              'application_id': 'com.example.mobileproxy',
              'version_name': '0.1.4',
              'version_code': 1004,
              'old_version_name': '1.1.0',
              'old_version_code': 2,
              'candidate_retention_days_minimum': 30,
              'final_release_authority': False,
          }
          for key, value in expected.items():
              if binding.get(key) != value:
                  raise SystemExit(f'Android migration binding mismatch: {key}')
          canonical_sha = binding.get('canonical_sha')
          if not isinstance(canonical_sha, str) or re.fullmatch(r'[0-9a-f]{40}', canonical_sha) is None:
              raise SystemExit('Android migration binding canonical_sha is malformed')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={canonical_sha}\n')
              handle.write(f"version_name={binding['version_name']}\n")
              handle.write(f"version_code={binding['version_code']}\n")
              handle.write(f"application_id={binding['application_id']}\n")
          PY

      - name: Validate exact owner command, current canonical main, Quality, and pre-release order
        id: command
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          BOUND_CANONICAL_SHA: ${{ steps.binding.outputs.canonical_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          command = os.environ.get('COMMAND', '').strip()
          match = re.fullmatch(r'/android-release-build ([0-9a-f]{40})', command)
          if match is None:
              raise SystemExit('invalid Android release build command')
          requested_sha = match.group(1)
          bound_sha = os.environ['BOUND_CANONICAL_SHA']
          if requested_sha != bound_sha:
              raise SystemExit('requested SHA is not the single Android migration execution binding')

          headers = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'mobile-proxy-production-android-candidate-gate',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          current_main = get_json('https://api.github.com/repos/iamaman11/mobile-proxy/commits/main').get('sha')
          if current_main != bound_sha:
              raise SystemExit('private Android migration binding is stale relative to current canonical main')

          public_runs = get_json(
              f'https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?head_sha={bound_sha}&event=push&per_page=100'
          ).get('workflow_runs', [])
          accepted_quality = [
              run for run in public_runs
              if run.get('name') == 'Quality'
              and run.get('head_branch') == 'main'
              and run.get('head_sha') == bound_sha
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
          ]
          if not accepted_quality:
              raise SystemExit('bound canonical SHA has no exact successful main Quality run')

          tag_url = 'https://api.github.com/repos/iamaman11/mobile-proxy/git/ref/tags/v0.1.4'
          try:
              get_json(tag_url)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('final v0.1.4 tag exists before pre-Item20 signing-generation migration')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={bound_sha}\n')
          PY

  build-sign:
    name: Build and prove exact signed Android migration candidate off-phone
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      APPLICATION_ID: ${{ needs.command-gate.outputs.application_id }}
      VERSION_NAME: ${{ needs.command-gate.outputs.version_name }}
      VERSION_CODE: ${{ needs.command-gate.outputs.version_code }}
      ANDROID_BASELINE_REF: v0.1.3
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch exact canonical source and migration baseline
        id: source
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/canonical"
          rm -rf "${root}"
          git init "${root}"
          git -C "${root}" remote add origin https://github.com/iamaman11/mobile-proxy.git
          git -C "${root}" fetch --no-tags --depth=1 origin "${CANONICAL_SHA}"
          git -C "${root}" fetch --depth=1 origin "refs/tags/${ANDROID_BASELINE_REF}:refs/tags/${ANDROID_BASELINE_REF}"
          git -C "${root}" checkout --detach "${CANONICAL_SHA}"
          test "$(git -C "${root}" rev-parse HEAD)" = "${CANONICAL_SHA}"
          test "$(git -C "${root}" cat-file -t "refs/tags/${ANDROID_BASELINE_REF}")" = tag
          test -z "$(git -C "${root}" status --porcelain --untracked-files=no)"
          echo "root=${root}" >> "$GITHUB_OUTPUT"

      - name: Re-prove private signing identity without phone access
        id: signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          proof="${RUNNER_TEMP}/android-signing-proof.json"
          python3 "${{ steps.source.outputs.root }}/scripts/verify_android_release_keystore.py" \
            --canonical-sha "${CANONICAL_SHA}" \
            --output "${proof}"

      - name: Build and verify exact signed Android candidate
        id: build
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/android-release-output"
          rm -rf "${output}"
          mkdir -p "${output}"
          python3 "${{ steps.source.outputs.root }}/scripts/build_signed_android_release.py" \
            --repository-root "${{ steps.source.outputs.root }}" \
            --canonical-sha "${CANONICAL_SHA}" \
            --output-dir "${output}" \
            --android-baseline-ref "${ANDROID_BASELINE_REF}"
          python3 - "${output}/android-release-evidence.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], 'r', encoding='utf-8') as handle:
              evidence = json.load(handle)
          expected = {
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'android_baseline_ref': os.environ['ANDROID_BASELINE_REF'],
              'android_functional_source_preserved': True,
              'application_id': os.environ['APPLICATION_ID'],
              'version_name': os.environ['VERSION_NAME'],
              'version_code': int(os.environ['VERSION_CODE']),
              'release_contract_verified': True,
              'keystore_verified': True,
              'apk_signature_verified': True,
              'apk_signer_matches_private_key': True,
              'production_apk_signed': True,
              'phone_access_performed': False,
              'phone_mutation_performed': False,
              'accepted': True,
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f'bounded release evidence mismatch: {key}')
          if evidence.get('artifact_name') != 'mobile-proxy-android-v0.1.4.apk':
              raise SystemExit('unexpected signed APK artifact name')
          PY
          test -s "${output}/mobile-proxy-android-v0.1.4.apk"
          echo "output=${output}" >> "$GITHUB_OUTPUT"

      - name: Retain bounded signing proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-signing-proof-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/android-signing-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain exact signed candidate and canonical evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-candidate-v0.1.4-${{ env.CANONICAL_SHA }}
          path: |
            ${{ steps.build.outputs.output }}/mobile-proxy-android-v0.1.4.apk
            ${{ steps.build.outputs.output }}/android-release-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Record safe result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Production Android 0.1.4 signed migration candidate
          - Canonical source SHA: ${{ env.CANONICAL_SHA }}
          - Private execution SHA: ${{ github.sha }}
          - Canonical SHA source: single private execution binding
          - Exact canonical main equality required: true
          - Exact canonical main Quality required: true
          - Final public v0.1.4 tag required: false
          - Premature final public v0.1.4 tag accepted: false
          - Android functional baseline: v0.1.3
          - Signing identity proof outcome: ${{ steps.signing.outcome }}
          - Exact signed build outcome: ${{ steps.build.outcome }}
          - Phone runner used: false
          - Phone access performed: false
          - Phone mutation performed: false
          - Signing key generated: false
          - Signing material recorded: false
          - Signer fingerprint recorded: false
          - Device identifier recorded: false
          - Provider credentials requested: false
          EOF

  report:
    name: Record bounded signed-candidate run checkpoint
    needs:
      - command-gate
      - build-sign
    if: always() && needs.command-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      BUILD_RESULT: ${{ needs.build-sign.result }}
    steps:
      - name: Post safe private execution checkpoint
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body "ANDROID 0.1.4 SIGNED-MIGRATION-CANDIDATE CHECKPOINT — run \`${GITHUB_RUN_ID}\`

          - private execution SHA: \`${GITHUB_SHA}\`
          - canonical public SHA: \`${CANONICAL_SHA}\`
          - canonical SHA source: single private execution binding
          - signed-candidate build result: \`${BUILD_RESULT}\`
          - exact canonical main equality required: true
          - exact canonical main Quality required: true
          - final public v0.1.4 tag required: false
          - expected package/version: \`com.example.mobileproxy\` / \`0.1.4\` / \`1004\`
          - phone runner used: false
          - phone mutation performed: false
          - signing material recorded: false
          - signer fingerprint recorded: false
          - device identifier recorded: false"
