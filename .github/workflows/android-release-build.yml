name: Production Android 0.1.4 signed migration candidate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: production-android-v014-signed-candidate
  cancel-in-progress: false

jobs:
  command-gate:
    name: Validate pinned signed-candidate command and canonical Quality
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/android-release-build ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PINNED_CANONICAL_SHA: 6d8591b680e4b029cd04c0108b4f8e284bba2477
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
    steps:
      - name: Validate exact owner command, pinned SHA, main Quality, and pre-release order
        id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(r"/android-release-build ([0-9a-f]{40})", command)
          if match is None:
              raise SystemExit("invalid Android release build command")
          requested_sha = match.group(1)
          pinned_sha = os.environ["PINNED_CANONICAL_SHA"]
          if requested_sha != pinned_sha:
              raise SystemExit("requested SHA is not the pinned Android 0.1.4 migration baseline")

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "mobile-proxy-production-android-candidate-gate",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          public_runs = get_json(
              f"https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?head_sha={pinned_sha}&event=push&per_page=100"
          ).get("workflow_runs", [])
          accepted_quality = [
              run for run in public_runs
              if run.get("name") == "Quality"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == pinned_sha
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not accepted_quality:
              raise SystemExit("pinned canonical SHA has no exact successful main Quality run")

          tag_url = "https://api.github.com/repos/iamaman11/mobile-proxy/git/ref/tags/v0.1.4"
          try:
              get_json(tag_url)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit("final v0.1.4 tag exists before pre-Item20 signing-generation migration")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={pinned_sha}\n")
          PY

  build-sign:
    name: Build and prove exact signed Android migration candidate off-phone
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      ANDROID_BASELINE_REF: v0.1.3
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch exact canonical source and migration baseline
        id: source
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/canonical"
          rm -rf "${root}"
          git init "${root}"
          git -C "${root}" remote add origin https://github.com/iamaman11/mobile-proxy.git
          git -C "${root}" fetch --no-tags --depth=1 origin "${CANONICAL_SHA}"
          git -C "${root}" fetch --depth=1 origin "refs/tags/${ANDROID_BASELINE_REF}:refs/tags/${ANDROID_BASELINE_REF}"
          git -C "${root}" checkout --detach "${CANONICAL_SHA}"
          test "$(git -C "${root}" rev-parse HEAD)" = "${CANONICAL_SHA}"
          test "$(git -C "${root}" cat-file -t "refs/tags/${ANDROID_BASELINE_REF}")" = tag
          test -z "$(git -C "${root}" status --porcelain --untracked-files=no)"
          echo "root=${root}" >> "$GITHUB_OUTPUT"

      - name: Re-prove private signing identity without phone access
        id: signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          proof="${RUNNER_TEMP}/android-signing-proof.json"
          python3 "${{ steps.source.outputs.root }}/scripts/verify_android_release_keystore.py" \
            --canonical-sha "${CANONICAL_SHA}" \
            --output "${proof}"

      - name: Build and verify exact signed Android 0.1.4 APK
        id: build
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/android-release-output"
          rm -rf "${output}"
          mkdir -p "${output}"
          python3 "${{ steps.source.outputs.root }}/scripts/build_signed_android_release.py" \
            --repository-root "${{ steps.source.outputs.root }}" \
            --canonical-sha "${CANONICAL_SHA}" \
            --output-dir "${output}" \
            --android-baseline-ref "${ANDROID_BASELINE_REF}"
          python3 - "${output}/android-release-evidence.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as handle:
              evidence = json.load(handle)
          expected = {
              "canonical_sha": "6d8591b680e4b029cd04c0108b4f8e284bba2477",
              "android_baseline_ref": "v0.1.3",
              "android_functional_source_preserved": True,
              "application_id": "com.example.mobileproxy",
              "version_name": "0.1.4",
              "version_code": 1004,
              "release_contract_verified": True,
              "keystore_verified": True,
              "apk_signature_verified": True,
              "apk_signer_matches_private_key": True,
              "production_apk_signed": True,
              "phone_access_performed": False,
              "phone_mutation_performed": False,
              "accepted": True,
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"bounded release evidence mismatch: {key}")
          if evidence.get("artifact_name") != "mobile-proxy-android-v0.1.4.apk":
              raise SystemExit("unexpected signed APK artifact name")
          PY
          test -s "${output}/mobile-proxy-android-v0.1.4.apk"
          echo "output=${output}" >> "$GITHUB_OUTPUT"

      - name: Retain bounded signing proof
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-signing-proof-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/android-signing-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Retain exact signed candidate and canonical evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-candidate-v0.1.4-${{ env.CANONICAL_SHA }}
          path: |
            ${{ steps.build.outputs.output }}/mobile-proxy-android-v0.1.4.apk
            ${{ steps.build.outputs.output }}/android-release-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Record safe result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Production Android 0.1.4 signed migration candidate
          - Canonical source SHA: ${{ env.CANONICAL_SHA }}
          - Exact canonical main Quality required: true
          - Final public v0.1.4 tag required: false
          - Premature final public v0.1.4 tag accepted: false
          - Android functional baseline: v0.1.3
          - Signing identity proof outcome: ${{ steps.signing.outcome }}
          - Exact signed build outcome: ${{ steps.build.outcome }}
          - Expected package: com.example.mobileproxy
          - Expected versionName: 0.1.4
          - Expected versionCode: 1004
          - Phone runner used: false
          - Phone access performed: false
          - Phone mutation performed: false
          - Signing key generated: false
          - Signing material recorded: false
          - Signer fingerprint recorded: false
          - Device identifier recorded: false
          - Provider credentials requested: false
          EOF

  report:
    name: Record bounded signed-candidate run checkpoint
    needs:
      - command-gate
      - build-sign
    if: always() && needs.command-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      BUILD_RESULT: ${{ needs.build-sign.result }}
    steps:
      - name: Post safe private execution checkpoint
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body "ANDROID 0.1.4 SIGNED-MIGRATION-CANDIDATE CHECKPOINT — run \`${GITHUB_RUN_ID}\`

          - private execution SHA: \`${GITHUB_SHA}\`
          - canonical public SHA: \`${CANONICAL_SHA}\`
          - signed-candidate build result: \`${BUILD_RESULT}\`
          - exact canonical main Quality required: true
          - final public v0.1.4 tag required: false
          - expected package/version: \`com.example.mobileproxy\` / \`0.1.4\` / \`1004\`
          - phone runner used: false
          - phone mutation performed: false
          - signing material recorded: false
          - signer fingerprint recorded: false
          - device identifier recorded: false"
