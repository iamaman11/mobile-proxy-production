name: Runtime reconstruction execution gate policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-reconstruction-execution-gate:
    name: Validate hard-blocked one-time local reconstruction execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce hard-blocked reconstruction execution contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          authority_path = Path('.github/production/runtime-reconstruction-execution-authority.json')
          execution_path = Path('.github/workflows/runtime-reconstruction-execution.yml')
          binding_path = Path('.github/production/runtime-reconstruction-binding.json')
          manifest_path = Path('.github/production/runtime-reconstruction-manifest.json')
          readiness_path = Path('.github/workflows/runtime-reconstruction-readiness.yml')
          for path, label in (
              (authority_path, 'reconstruction execution authority'),
              (execution_path, 'reconstruction execution workflow'),
              (binding_path, 'reconstruction binding'),
              (manifest_path, 'reconstruction manifest source'),
              (readiness_path, 'reconstruction readiness workflow'),
          ):
              if not path.is_file():
                  raise SystemExit(f'{label} is missing')

          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          expected_keys = {
              'accepted_readiness', 'authority_role', 'canonical_repository',
              'canonical_sha', 'command_issue', 'command_prefix',
              'config_render_authority', 'duplicate_rule', 'empty_layout_policy',
              'evidence_policy', 'execution_id', 'final_release_authority',
              'format_version', 'full_serving_authority', 'future_phone_job',
              'global_mutation_group', 'item20_transport_authority', 'mode',
              'phone_execution_authority', 'provider_access_authority',
              'quality_run_id', 'readiness_workflow_path',
              'reconstruction_binding_path', 'reconstruction_manifest_path',
              'recovery_health_scope', 'runtime_secret_access_authority',
              'source_private_sha', 'status',
          }
          if set(authority) != expected_keys:
              raise SystemExit('reconstruction execution authority key drift')
          expected_scalars = {
              'format_version': 1,
              'authority_role': 'private_execution_only',
              'mode': 'local_runtime_reconstruction_gate',
              'status': 'hard_blocked',
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': 'be619ebab9325e712cc6ef662689f78cc7131d5f',
              'quality_run_id': 33525893784,
              'source_private_sha': 'b58366e8f7695bd444540a211b30b6723a64bbfa',
              'reconstruction_binding_path': '.github/production/runtime-reconstruction-binding.json',
              'reconstruction_manifest_path': '.github/production/runtime-reconstruction-manifest.json',
              'readiness_workflow_path': '.github/workflows/runtime-reconstruction-readiness.yml',
              'phone_execution_authority': False,
              'runtime_secret_access_authority': False,
              'config_render_authority': False,
              'provider_access_authority': False,
              'full_serving_authority': False,
              'final_release_authority': False,
              'recovery_health_scope': 'local_runtime_only',
              'item20_transport_authority': 'deferred_to_sealed_handoff',
              'command_issue': 1,
              'command_prefix': '/runtime-reconstruction-execute',
              'duplicate_rule': 'first_exact_issue_comment_only',
              'future_phone_job': 'reconstruct-phone',
              'global_mutation_group': 'production-phone-global-mutation',
          }
          for key, value in expected_scalars.items():
              if authority.get(key) != value:
                  raise SystemExit(f'reconstruction execution authority mismatch: {key}')
          execution_id = authority.get('execution_id')
          if not isinstance(execution_id, str) or re.fullmatch(
              r'[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}',
              execution_id,
          ) is None:
              raise SystemExit('reconstruction execution ID must be one UUIDv4 value')

          if authority.get('accepted_readiness') != {
              'owner_comment_id': 5502167058,
              'transport_run_id': 33572652019,
              'readiness_run_id': 33572661956,
              'private_sha': 'b58366e8f7695bd444540a211b30b6723a64bbfa',
          }:
              raise SystemExit('accepted readiness authority drift')
          if authority.get('empty_layout_policy') != {
              'current_must_be_absent': True,
              'release_count_must_be_zero': True,
              'unexpected_managed_state_fails_closed': True,
              'preexisting_boot_hook_must_be_absent_or_backed_up': True,
              'rollback_restores_admitted_prestate': True,
          }:
              raise SystemExit('empty-layout reconstruction policy drift')
          if authority.get('evidence_policy') != {
              'raw_device_identifier_recorded': False,
              'raw_manifest_recorded': False,
              'rendered_config_recorded': False,
              'runtime_secret_values_recorded': False,
              'config_digest_recorded': False,
              'credential_derived_identifiers_recorded': False,
              'raw_process_identifier_recorded': False,
          }:
              raise SystemExit('reconstruction execution evidence policy drift')

          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          for key, value in {
              'binding_role': 'private_execution_only',
              'canonical_repository': authority['canonical_repository'],
              'canonical_sha': authority['canonical_sha'],
              'quality_required': True,
              'final_release_authority': False,
              'phone_execution_authority': False,
              'provider_credentials_allowed': False,
              'recovery_health_scope': 'local_runtime_only',
              'full_serving_authority': False,
              'item20_transport_authority': 'deferred_to_sealed_handoff',
          }.items():
              if binding.get(key) != value:
                  raise SystemExit(f'reconstruction binding no longer satisfies execution skeleton: {key}')
          if binding.get('enrollment_status') != 'enrolled':
              raise SystemExit('reconstruction execution skeleton requires enrolled source identity')

          execution = execution_path.read_text(encoding='utf-8')
          required_fragments = (
              'name: Production phone local runtime reconstruction gate',
              '  issue_comment:',
              'types: [created]',
              '  contents: read',
              '  issues: read',
              '  actions: read',
              'github.event.issue.number == 1',
              'github.event.comment.user.login == github.repository_owner',
              "startsWith(github.event.comment.body, '/runtime-reconstruction-execute ')",
              'runtime-reconstruction-execution-authority.json',
              'expected_command = (',
              "authority['command_prefix']",
              "authority['execution_id']",
              "authority['canonical_sha']",
              'first_exact_issue_comment_only',
              'comment_id != min(matching_comment_ids)',
              'duplicate reconstruction execution command refused before phone access',
              'accepted readiness transport run differs from exact authority',
              'accepted readiness child run differs from exact authority',
              'inherited readiness source identity changed after accepted readiness',
              'phone_execution_authority=false',
              'runtime_secret_access=false',
              'config_rendered=false',
              'provider_access=false',
              'phone_access=false',
              'Refuse phone execution until a later tracker checkpoint',
              'reconstruction execution control plane validated; phone execution remains hard-blocked',
              '  reconstruct-phone:',
              '    if: $' + '{{ false }}',
              '    concurrency:',
              '      group: production-phone-global-mutation',
              '      cancel-in-progress: false',
              '      queue: max',
              '    runs-on: [self-hosted, Linux, X64, android-production]',
              'Refuse production-phone reconstruction until explicit authority',
          )
          for fragment in required_fragments:
              if fragment not in execution:
                  raise SystemExit(f'reconstruction execution workflow missing required fragment: {fragment}')
          if execution.count('group: production-phone-global-mutation') != 1:
              raise SystemExit('reconstruction execution global mutation lock must appear exactly once')
          if execution.count('runs-on: [self-hosted, Linux, X64, android-production]') != 1:
              raise SystemExit('reconstruction execution must contain exactly one future phone job')
          for fragment in (
              'secrets.',
              'ANDROID_PRODUCTION_SERIAL',
              'package-device-release',
              'host-daemon.json',
              'sing-box.json',
              'upload-artifact',
              'download-artifact',
              'VULTR_',
              'MOBILE_PROXY_ADMIN_TOKEN',
              'MOBILE_PROXY_DEVICE_TOKEN',
              'MOBILE_PROXY_UI_TOKEN',
              'MOBILE_PROXY_RELAY_USER',
              'MOBILE_PROXY_RELAY_PASSWORD',
              'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64',
              'adb ',
              "'adb'",
              '"adb"',
          ):
              if fragment in execution:
                  raise SystemExit(
                      f'hard-blocked reconstruction execution workflow contains forbidden protected behavior: {fragment}'
                  )

          print('runtime reconstruction execution gate policy: accepted')
          print('status=hard_blocked')
          print('accepted_readiness=first_authorized_pair')
          print('duplicate_rule=first_exact_issue_comment_only')
          print('phone_execution_authority=false')
          print('runtime_secret_access=false')
          print('config_rendered=false')
          print('provider_access=false')
          print('phone_access=false')
          PY
