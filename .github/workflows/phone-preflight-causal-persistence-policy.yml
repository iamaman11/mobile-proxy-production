name: Phone preflight causal persistence policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phone-preflight-causal-persistence:
    name: Validate phone-access causal persistence and promotion contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate phone-access causal persistence contract
        run: python3 .github/scripts/control_plane_policy.py --policy phone-preflight
