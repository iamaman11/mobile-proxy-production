name: Phone preflight causal persistence policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phone-preflight-causal-persistence:
    name: Validate phone-access causal persistence and promotion contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce canonical phone-access causal persistence contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflows = Path('.github/workflows')
          path = workflows / 'phone-preflight.yml'
          if not path.is_file():
              raise SystemExit('phone-preflight.yml is missing')
          text = path.read_text(encoding='utf-8')

          required = (
              'group: production-phone-read-only-preflight',
              'cancel-in-progress: false',
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'ANDROID_PRODUCTION_SERIAL:',
              'secrets.ANDROID_PRODUCTION_SERIAL',
              'ANDROID_TARGET_BINDING_KEY:',
              'secrets.ANDROID_TARGET_BINDING_KEY',
              '- name: Derive bounded causal phone-access context',
              'id: causal-context',
              "message = b'android-production\\0' + serial.encode('utf-8')",
              "'tb-hmac-sha256:'",
              "hmac.new(binding_key.encode('utf-8'), message, hashlib.sha256).hexdigest()",
              "session_id = f\"phone-preflight-session:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}\"",
              "observation_ref = f\"phone-preflight-observation:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}\"",
              '--target-binding-id',
              'steps.causal-context.outputs.target_binding_id',
              '--session-id',
              'steps.causal-context.outputs.session_id',
              '--observation-ref',
              'steps.causal-context.outputs.observation_ref',
              '- name: Validate canonical causal phone-access fact before persistence',
              'id: causal-fact-validation',
              "{'scope': 'target/android-production', 'identity': os.environ['TARGET_BINDING_ID']}",
              "{'scope': 'observer/phone-access', 'identity': 'android.phone-access-observer.v2'}",
              "{'scope': 'session/android-production', 'identity': os.environ['SESSION_ID']}",
              "'predicate': 'registered_phone_access_proven'",
              "'authority': 'CONTROL'",
              "'persisted': False",
              "evidence.get('observed_facts') != [expected_fact]",
              'causal_fact_validated=true',
              '- name: Upload bounded private evidence',
              'id: evidence-upload',
              '- name: Export raw evidence persistence state',
              'id: raw-evidence-state',
              'raw_evidence_persisted=${persisted}',
              '- name: Promote canonical phone-access fact after raw evidence persistence',
              "if: steps.raw-evidence-state.outputs.raw_evidence_persisted == 'true'",
              "promoted_fact['persisted'] = True",
              "comparison['persisted'] = False",
              "if comparison != raw_fact:",
              'promotion changed physical value or causal dependency identity',
              "'evidence_type': 'PROMOTED_OBSERVED_FACT'",
              "'raw_evidence_persisted': True",
              "'promotion_changes_only_persistence': True",
              "'observed_fact': promoted_fact",
              '- name: Persist promoted reusable phone-access fact independently',
              'id: promoted-fact-upload',
              'name: phone-access-observed-fact-',
              'env.CANONICAL_SHA',
              'phone-access-promoted-fact.json',
              '- name: Export evidence persistence state',
              'id: evidence-state',
              'promoted_fact_persisted=${promoted}',
              'artifact_persisted=${promoted}',
              'CAUSAL_FACT_VALIDATED:',
              'needs.phone-preflight.outputs.causal_fact_validated',
              'RAW_EVIDENCE_PERSISTED:',
              'needs.phone-preflight.outputs.raw_evidence_persisted',
              'PROMOTED_FACT_PERSISTED:',
              'needs.phone-preflight.outputs.promoted_fact_persisted',
              'ARTIFACT_PERSISTED:',
              'needs.phone-preflight.outputs.artifact_persisted',
              'const artifactPersisted = process.env.ARTIFACT_PERSISTED === \'true\';',
              'const proven = probeAccepted && artifactPersisted;',
              "? 'PHONE_ACCESS_PROVEN'",
              "? 'PHONE_ACCESS_OBSERVED_UNPERSISTED'",
              ": 'PHONE_ACCESS_UNOBSERVED';",
          )
          missing = [snippet for snippet in required if snippet not in text]
          if missing:
              raise SystemExit('phone preflight causal persistence contract missing: ' + ', '.join(missing))

          if 'production-phone-global-mutation' in text:
              raise SystemExit('phone-preflight must remain outside the global mutation lock')
          if '--transaction-id' in text:
              raise SystemExit('reusable phone preflight must not acquire destructive transaction dependency')
          if 'source/canonical' in text or "'scope': 'source/" in text:
              raise SystemExit('Git/source identity must not be a physical phone-access dependency')

          operation_invocation = 'python3 "${RUNNER_TEMP}/phone-preflight-source/run_private_phone_preflight.py"'
          if text.count(operation_invocation) != 1:
              raise SystemExit('canonical phone preflight producer must be invoked exactly once')
          for argument in ('--target-binding-id', '--session-id', '--observation-ref'):
              if text.count(argument) != 1:
                  raise SystemExit(f'canonical producer argument must appear exactly once: {argument}')

          anchors = {
              'context': '- name: Derive bounded causal phone-access context',
              'operation': '- name: Run exact registered-device CONTROL preflight',
              'validate': '- name: Validate canonical causal phone-access fact before persistence',
              'raw_upload': '- name: Upload bounded private evidence',
              'raw_state': '- name: Export raw evidence persistence state',
              'promote': '- name: Promote canonical phone-access fact after raw evidence persistence',
              'promoted_upload': '- name: Persist promoted reusable phone-access fact independently',
              'final_state': '- name: Export evidence persistence state',
          }
          positions = {name: text.find(anchor) for name, anchor in anchors.items()}
          if any(position < 0 for position in positions.values()):
              raise SystemExit('phone preflight causal persistence ordering anchor missing')
          expected_order = (
              positions['context'] < positions['operation'] < positions['validate']
              < positions['raw_upload'] < positions['raw_state'] < positions['promote']
              < positions['promoted_upload'] < positions['final_state']
          )
          if not expected_order:
              raise SystemExit(
                  'required order is context -> producer -> validate -> raw persist -> promote -> promoted persist'
              )

          raw_upload_section = text[positions['raw_upload']:positions['raw_state']]
          promoted_upload_section = text[positions['promoted_upload']:positions['final_state']]
          if raw_upload_section.count('uses: actions/upload-artifact@v4') != 1:
              raise SystemExit('raw evidence must have exactly one persistence adapter')
          if promoted_upload_section.count('uses: actions/upload-artifact@v4') != 1:
              raise SystemExit('promoted fact must have exactly one independent persistence adapter')
          if 'continue-on-error: true' not in raw_upload_section:
              raise SystemExit('raw evidence persistence failure must remain classifiable without replaying probe')
          if 'continue-on-error: true' not in promoted_upload_section:
              raise SystemExit('promoted fact persistence failure must remain classifiable without replaying probe')
          if 'phone-preflight.json' not in raw_upload_section:
              raise SystemExit('raw persistence must persist canonical producer report')
          if 'phone-access-promoted-fact.json' not in promoted_upload_section:
              raise SystemExit('promoted persistence must use independent fact envelope')

          promote_section = text[positions['promote']:positions['promoted_upload']]
          for forbidden in (
              "promoted_fact['dependencies'] =",
              "promoted_fact['value'] =",
              "promoted_fact['target'] =",
              "promoted_fact['predicate'] =",
              "promoted_fact['observation_ref'] =",
          ):
              if forbidden in promote_section:
                  raise SystemExit('promotion must not rewrite physical or causal fact identity')

          mutators = (
              'android-signing-migration.yml',
              'phone-filesystem-certification.yml',
              'phone-filesystem-quarantine-cleanup.yml',
              'phone-runtime-recovery.yml',
              'phone-runtime-binary-repair.yml',
              'runtime-reconstruction-execution.yml',
          )
          forbidden_reuse_tokens = (
              'phone-access-observed-fact-',
              'registered_phone_access_proven',
              'PROMOTED_OBSERVED_FACT',
          )
          for name in mutators:
              mutator = workflows / name
              if not mutator.is_file():
                  raise SystemExit(f'classified mutator missing: {name}')
              mutator_text = mutator.read_text(encoding='utf-8')
              for token in forbidden_reuse_tokens:
                  if token in mutator_text:
                      raise SystemExit(
                          f'{name}: reusable preflight fact may not replace SAME_TRANSACTION boundary proof'
                      )

          def classify(probe_accepted: bool, raw_persisted: bool, promoted_persisted: bool) -> str:
              admitted = raw_persisted and promoted_persisted
              if probe_accepted and admitted:
                  return 'PHONE_ACCESS_PROVEN'
              if probe_accepted:
                  return 'PHONE_ACCESS_OBSERVED_UNPERSISTED'
              return 'PHONE_ACCESS_UNOBSERVED'

          truth_table = (
              ((True, True, True), 'PHONE_ACCESS_PROVEN'),
              ((True, True, False), 'PHONE_ACCESS_OBSERVED_UNPERSISTED'),
              ((True, False, False), 'PHONE_ACCESS_OBSERVED_UNPERSISTED'),
              ((False, True, True), 'PHONE_ACCESS_UNOBSERVED'),
              ((False, False, False), 'PHONE_ACCESS_UNOBSERVED'),
          )
          for inputs, expected in truth_table:
              actual = classify(*inputs)
              if actual != expected:
                  raise SystemExit(
                      f'phone access causal persistence truth table differs: {inputs} expected={expected} actual={actual}'
                  )

          print('phone_access_target_binding=HMAC-SHA256')
          print('phone_access_dependencies=target+observer+session')
          print('git_sha_physical_dependency=false')
          print('raw_fact_persisted=false')
          print('promotion_after_raw_persistence=accepted')
          print('promotion_identity_mutation=forbidden')
          print('promoted_fact_independent_persistence=accepted')
          print('mutator_reuse_as_boundary_proof=forbidden')
          print('device_operation_invocations=1')
          PY
