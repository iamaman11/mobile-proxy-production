name: Production phone transport preflight

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      source_issue_number:
        required: true
        type: number
      source_comment_id:
        required: true
        type: number
      source_actor:
        required: true
        type: string
      source_comment_url:
        required: true
        type: string
      source_comment_created_at:
        required: true
        type: string
    secrets:
      ANDROID_PRODUCTION_SERIAL:
        required: true

permissions:
  contents: read

jobs:
  preflight:
    name: Prove bounded registered-phone transport readiness
    if: >-
      inputs.command == '/phone-transport-preflight' &&
      inputs.source_issue_number == 1 &&
      inputs.source_actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 2
    concurrency:
      group: production-phone-read-only-preflight
      cancel-in-progress: false
    environment: phone-production
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
    steps:
      - name: Check out exact Controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify immutable Issue 1 command provenance
        shell: bash
        env:
          SOURCE_COMMENT_URL: ${{ inputs.source_comment_url }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SOURCE_COMMENT_URL" = "https://github.com/iamaman11/mobile-proxy-production/issues/1#issuecomment-$SOURCE_COMMENT_ID"

      - name: Run bounded read-only transport preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phone_transport_preflight.py \
            --controller-revision "$GITHUB_SHA" \
            --source-comment-created-at "${{ inputs.source_comment_created_at }}" \
            --output "$RUNNER_TEMP/phone-transport-preflight.json"

      - name: Validate bounded transport evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'phone-transport-preflight.json').read_text())
          expected_top = {
              'schema', 'controller_revision', 'classification', 'phone_failure_phase',
              'timing_ms', 'transport', 'host_usb_bridge', 'safety',
          }
          if set(value) != expected_top:
              raise SystemExit('phone transport preflight top-level evidence fields differ')
          if value.get('schema') != 'phone-transport-preflight.v4':
              raise SystemExit('phone transport preflight schema differs')

          classification = value.get('classification')
          allowed_classifications = {'READY', 'NOT_READY', 'TRANSPORT_DEGRADED'}
          if classification not in allowed_classifications:
              raise SystemExit('phone transport preflight classification differs')

          phone_failure_phase = value.get('phone_failure_phase')
          allowed_phone_failures = {
              'NONE', 'ADB_TOOLING_UNAVAILABLE', 'ADB_TRANSPORT_TIMEOUT',
              'REGISTERED_DEVICE_NOT_DEVICE', 'ROOT_SHELL_SPAWN_FAILED',
              'ROOT_SCRIPT_TIMEOUT', 'ROOT_SCRIPT_OUTPUT_TRUNCATED',
              'ROOT_SCRIPT_PROTOCOL_MISMATCH', 'ROOT_SCRIPT_NONZERO', 'UNKNOWN',
          }
          if phone_failure_phase not in allowed_phone_failures:
              raise SystemExit('phone transport preflight phone failure phase differs')
          if classification == 'NOT_READY' and phone_failure_phase == 'NONE':
              raise SystemExit('NOT_READY lacks typed phone failure')
          if classification != 'NOT_READY' and phone_failure_phase != 'NONE':
              raise SystemExit('phone-ready classification contains phone failure')

          timings = value.get('timing_ms')
          expected_timings = {
              'adb_tooling', 'registered_device_state', 'root_stdout_contract',
              'root_stderr_exit_contract', 'total',
          }
          if not isinstance(timings, dict) or set(timings) != expected_timings:
              raise SystemExit('phone transport preflight timing schema differs')
          for field, item in timings.items():
              if item is not None and (not isinstance(item, int) or isinstance(item, bool) or item < 0):
                  raise SystemExit('phone transport preflight timing differs: ' + field)
          if not isinstance(timings.get('total'), int) or isinstance(timings.get('total'), bool):
              raise SystemExit('phone transport preflight total timing is unavailable')
          if phone_failure_phase == 'NONE' and any(timings.get(field) is None for field in expected_timings):
              raise SystemExit('phone-ready diagnostic lacks phase timing')

          transport = value.get('transport')
          expected_transport = {
              'artifact_upload_required', 'runner_assignment_latency_ms',
              'diagnostic_window', 'diagnostic_evidence_available', 'diagnostics_truncated',
              'runner_version', 'listener_session_started_at_utc',
              'last_successful_session_establishment_at_utc', 'listener_files_scanned',
              'worker_files_scanned', 'error_counters', 'failure_classes',
              'assignment_normal_slo_ms', 'assignment_bounded_slo_ms',
              'assignment_slo_exceeded', 'repeated_transport_error', 'transport_degraded',
          }
          if not isinstance(transport, dict) or set(transport) != expected_transport:
              raise SystemExit('phone transport preflight transport evidence fields differ')
          if transport.get('artifact_upload_required') is not True:
              raise SystemExit('phone transport preflight evidence/upload contract differs')
          latency = transport.get('runner_assignment_latency_ms')
          if not isinstance(latency, int) or isinstance(latency, bool) or latency < 0:
              raise SystemExit('phone transport preflight assignment latency is unavailable')
          if transport.get('assignment_normal_slo_ms') != 20000 or transport.get('assignment_bounded_slo_ms') != 60000:
              raise SystemExit('phone transport preflight assignment SLO differs')
          for field in (
              'diagnostic_evidence_available', 'diagnostics_truncated', 'assignment_slo_exceeded',
              'repeated_transport_error', 'transport_degraded',
          ):
              if not isinstance(transport.get(field), bool):
                  raise SystemExit('phone transport preflight boolean telemetry differs: ' + field)
          for field in ('listener_files_scanned', 'worker_files_scanned'):
              item = transport.get(field)
              if not isinstance(item, int) or isinstance(item, bool) or item < 0:
                  raise SystemExit('phone transport preflight diagnostic source count differs: ' + field)

          counters = transport.get('error_counters')
          required_counters = {
              'broker_reconnect', 'runserver_reconnect', 'tls_error', 'eof_error',
              'connection_reset', 'action_download_error', 'artifact_transport_error',
              'transport_error_lines',
          }
          if not isinstance(counters, dict) or set(counters) != required_counters:
              raise SystemExit('phone transport preflight error counter contract differs')
          if any(not isinstance(item, int) or isinstance(item, bool) or item < 0 for item in counters.values()):
              raise SystemExit('phone transport preflight error counter value differs')

          allowed_classes = {
              'BROKER_RECONNECT', 'RUNSERVER_RECONNECT', 'TLS_ERROR', 'EOF_ERROR',
              'CONNECTION_RESET', 'ACTION_DOWNLOAD_TRANSPORT', 'ARTIFACT_TRANSPORT',
              'DIAGNOSTIC_EVIDENCE_UNAVAILABLE', 'DIAGNOSTIC_WINDOW_TRUNCATED',
              'RUNNER_VERSION_UNAVAILABLE', 'SESSION_ESTABLISHMENT_UNOBSERVED',
              'SESSION_WINDOW_UNRESOLVED',
          }
          failure_classes = transport.get('failure_classes')
          if not isinstance(failure_classes, list) or any(item not in allowed_classes for item in failure_classes):
              raise SystemExit('phone transport preflight failure classes differ')
          if classification == 'READY' and transport.get('transport_degraded') is not False:
              raise SystemExit('READY transport is marked degraded')
          if classification == 'TRANSPORT_DEGRADED' and transport.get('transport_degraded') is not True:
              raise SystemExit('TRANSPORT_DEGRADED lacks degraded evidence')
          if classification == 'NOT_READY' and not isinstance(transport.get('transport_degraded'), bool):
              raise SystemExit('NOT_READY lost transport telemetry')
          if transport.get('diagnostic_evidence_available') is True:
              version = transport.get('runner_version')
              if version is not None and (not isinstance(version, str) or len(version) > 32):
                  raise SystemExit('runner version evidence differs')
              for field in ('listener_session_started_at_utc', 'last_successful_session_establishment_at_utc'):
                  item = transport.get(field)
                  if item is not None and (not isinstance(item, str) or len(item) > 64):
                      raise SystemExit('runner session timestamp evidence differs: ' + field)
              session_started = transport.get('listener_session_started_at_utc')
              unresolved = 'SESSION_WINDOW_UNRESOLVED' in failure_classes
              if (session_started is None) != unresolved:
                  raise SystemExit('runner transport session-window resolution evidence differs')

          bridge = value.get('host_usb_bridge')
          expected_bridge = {'classification', 'failure_category', 'freshness', 'age_seconds'}
          if not isinstance(bridge, dict) or set(bridge) != expected_bridge:
              raise SystemExit('phone transport USB bridge evidence fields differ')
          allowed_bridge_classifications = {
              'NOT_EVALUATED', 'EVIDENCE_UNAVAILABLE', 'EVIDENCE_INVALID', 'EVIDENCE_STALE',
              'USB_DEVICE_NOT_PRESENT', 'ATTACH_SUCCEEDED', 'BRIDGE_STARTED', 'BRIDGE_FAILURE',
          }
          bridge_classification = bridge.get('classification')
          if bridge_classification not in allowed_bridge_classifications:
              raise SystemExit('phone transport USB bridge classification differs')
          allowed_bridge_failures = {
              'attach_distro_missing', 'attach_distro_not_running', 'attach_distro_not_wsl2',
              'attach_failed', 'attach_firewall_blocked', 'attach_host_address_unavailable',
              'attach_kernel_not_usbip_capable', 'attach_networking_mode_unsupported',
              'attach_unknown', 'attach_usbip_client_attach_failed', 'attach_usbip_client_unavailable',
              'attach_usbipd_not_local_drive', 'attach_usbipd_service_unavailable',
              'attach_vhci_unavailable', 'attach_windows_device_busy', 'attach_wsl2_unavailable',
              'attach_wsl_support_missing', 'attach_wsl_support_mount_failed', 'bind_failed',
              'inventory_unavailable', 'state_unavailable', 'unexpected_local_error', 'wsl_unavailable',
          }
          bridge_failure = bridge.get('failure_category')
          if bridge_classification == 'BRIDGE_FAILURE':
              if bridge_failure not in allowed_bridge_failures:
                  raise SystemExit('phone transport USB bridge failure category differs')
          elif bridge_failure is not None:
              raise SystemExit('non-failure USB bridge evidence contains failure category')

          freshness = bridge.get('freshness')
          age = bridge.get('age_seconds')
          fresh_classes = {'USB_DEVICE_NOT_PRESENT', 'ATTACH_SUCCEEDED', 'BRIDGE_STARTED', 'BRIDGE_FAILURE'}
          if bridge_classification in fresh_classes:
              if freshness != 'FRESH' or not isinstance(age, int) or isinstance(age, bool) or not 0 <= age <= 60:
                  raise SystemExit('fresh USB bridge evidence contract differs')
          elif bridge_classification == 'EVIDENCE_STALE':
              if freshness != 'STALE' or not isinstance(age, int) or isinstance(age, bool) or age <= 60:
                  raise SystemExit('stale USB bridge evidence contract differs')
          elif bridge_classification in {'EVIDENCE_UNAVAILABLE', 'EVIDENCE_INVALID'}:
              if freshness != 'UNKNOWN' or age is not None:
                  raise SystemExit('unknown USB bridge evidence contract differs')
          elif bridge_classification == 'NOT_EVALUATED':
              if freshness != 'NOT_EVALUATED' or age is not None:
                  raise SystemExit('not-evaluated USB bridge evidence contract differs')

          if phone_failure_phase == 'REGISTERED_DEVICE_NOT_DEVICE':
              if bridge_classification == 'NOT_EVALUATED':
                  raise SystemExit('registered-device failure lacks bounded USB bridge evidence')
          elif bridge_classification != 'NOT_EVALUATED':
              raise SystemExit('USB bridge evidence escaped its registered-device failure domain')

          safety = value.get('safety')
          expected_safety = {
              'phone_access_performed', 'phone_mutation_performed', 'provider_access_performed',
              'provider_mutation_performed', 'deployment_created', 'deployment_intent_created',
              'raw_device_identifier_recorded', 'secret_values_recorded', 'raw_runner_log_recorded',
              'raw_transport_url_recorded', 'automatic_recovery_performed',
          }
          if not isinstance(safety, dict) or set(safety) != expected_safety:
              raise SystemExit('phone transport preflight safety evidence fields differ')
          if not isinstance(safety.get('phone_access_performed'), bool):
              raise SystemExit('phone transport preflight phone access evidence differs')
          for field in expected_safety - {'phone_access_performed'}:
              if safety.get(field) is not False:
                  raise SystemExit('phone transport preflight safety differs: ' + field)

          print(
              'PHONE_TRANSPORT_PREFLIGHT_CLASSIFIED '
              f'classification={classification} phone_failure_phase={phone_failure_phase} '
              f'host_usb_bridge={bridge_classification}'
          )
          PY

      - name: Preserve mandatory bounded transport evidence
        id: transport-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phone-transport-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phone-transport-preflight.json
          if-no-files-found: error
          retention-days: 90

      - name: Record bounded transport artifact outcome
        if: always()
        shell: bash
        env:
          ARTIFACT_OUTCOME: ${{ steps.transport-artifact.outcome }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_OUTCOME" in
            success|failure|cancelled|skipped) ;;
            *) exit 1 ;;
          esac
          echo "PHONE_TRANSPORT_ARTIFACT outcome=$ARTIFACT_OUTCOME"

      - name: Record workflow and phone readiness semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'phone-transport-preflight.json').read_text())
          classification = value['classification']
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('workflow_execution=success\n')
              handle.write(f'phone_readiness={classification}\n')
              handle.write('automatic_recovery_performed=false\n')
          print('workflow_execution=success')
          print(f'phone_readiness={classification}')
          print('automatic_recovery_performed=false')
          PY
