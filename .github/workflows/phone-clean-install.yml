name: Production Android destructive clean install

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  command-gate:
    name: Validate current clean-install authority and stable transaction
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-clean-install ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      quality_run_id: ${{ steps.command.outputs.quality_run_id }}
      transaction_id: ${{ steps.command.outputs.transaction_id }}
    steps:
      - name: Validate owner command, exact mains, Quality, and no prior destructive intent
        id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          command = os.environ.get('COMMAND', '').strip()
          match = re.fullmatch(r'/phone-clean-install ([0-9a-f]{40})', command)
          if match is None:
              raise SystemExit('invalid destructive clean-install command')
          requested_sha = match.group(1)
          transaction_id = f"clean-install-comment-{os.environ['GITHUB_EVENT_COMMENT_ID']}"

          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'mobile-proxy-production-clean-install-gate',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          public_main = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/commits/main'
          ).get('sha')
          if requested_sha != public_main:
              raise SystemExit('requested SHA is not current canonical public main')

          private_main = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy-production/commits/main'
          ).get('sha')
          if private_main != os.environ['GITHUB_SHA']:
              raise SystemExit('workflow execution SHA is not current private main')

          query = urllib.parse.urlencode(
              {'head_sha': requested_sha, 'event': 'push', 'status': 'completed', 'per_page': 100}
          )
          runs = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?' + query
          ).get('workflow_runs', [])
          quality = [
              run for run in runs
              if run.get('name') == 'Quality'
              and run.get('head_branch') == 'main'
              and run.get('head_sha') == requested_sha
              and run.get('conclusion') == 'success'
          ]
          if not quality:
              raise SystemExit('current canonical SHA has no exact successful main Quality run')
          quality.sort(
              key=lambda run: (run.get('run_attempt', 0), run.get('id', 0)),
              reverse=True,
          )

          headings = {
              '## CONTROL APK CLEAN INSTALL INTENT',
              '## CONTROL APK CLEAN INSTALL TERMINAL',
          }
          page = 1
          while True:
              comments = get_json(
                  f"https://api.github.com/repos/iamaman11/mobile-proxy-production/issues/1/comments?per_page=100&page={page}"
              )
              for comment in comments:
                  user = comment.get('user') or {}
                  if user.get('login') != 'github-actions[bot]':
                      continue
                  body = comment.get('body') or ''
                  heading = next((value for value in headings if body.startswith(value + '\n\n```json\n')), None)
                  if heading is None or not body.endswith('\n```'):
                      continue
                  raw = body[len(heading + '\n\n```json\n'):-4]
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if payload.get('transaction_id') == transaction_id:
                      raise SystemExit('transaction already has durable CONTROL evidence; blind retry forbidden')
              if len(comments) < 100:
                  break
              page += 1
              if page > 50:
                  raise SystemExit('CONTROL evidence pagination exceeded bound')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={requested_sha}\n')
              handle.write(f"quality_run_id={quality[0]['id']}\n")
              handle.write(f'transaction_id={transaction_id}\n')
          PY
        env:
          GITHUB_EVENT_COMMENT_ID: ${{ github.event.comment.id }}

  build-candidate:
    name: Build exact current-source signed replacement candidate off-phone
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      TRANSACTION_ID: ${{ needs.command-gate.outputs.transaction_id }}
      EXPECTED_VERSION_NAME: '0.1.4'
      EXPECTED_VERSION_CODE: '1004'
      ANDROID_BASELINE_REF: v0.1.3
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact canonical source with release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ env.CANONICAL_SHA }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact private execution wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution
          persist-credentials: false

      - name: Build and verify exact signed replacement APK
        id: build
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "${CANONICAL_SHA}"
          test "$(git -C private-execution rev-parse HEAD)" = "${GITHUB_SHA}"
          output="${RUNNER_TEMP}/android-release-output"
          mkdir -p "${output}"
          python3 canonical/scripts/build_signed_android_release.py \
            --repository-root canonical \
            --canonical-sha "${CANONICAL_SHA}" \
            --output-dir "${output}" \
            --android-baseline-ref "${ANDROID_BASELINE_REF}"
          python3 - "${output}/android-release-evidence.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], 'r', encoding='utf-8') as handle:
              evidence = json.load(handle)
          expected = {
              'format_version': 1,
              'repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'application_id': 'com.example.mobileproxy',
              'version_name': os.environ['EXPECTED_VERSION_NAME'],
              'version_code': int(os.environ['EXPECTED_VERSION_CODE']),
              'release_contract_verified': True,
              'keystore_verified': True,
              'apk_signature_verified': True,
              'apk_signer_matches_private_key': True,
              'production_apk_signed': True,
              'phone_access_performed': False,
              'phone_mutation_performed': False,
              'artifact_digest_algorithm': 'blake3-256',
              'artifact_digest_domain': 'mobile-proxy/android-apk/v1',
              'accepted': True,
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f'current-source release evidence mismatch: {key}')
          if evidence.get('artifact_name') != 'mobile-proxy-android-v0.1.4.apk':
              raise SystemExit('unexpected signed replacement APK name')
          PY
          test -s "${output}/mobile-proxy-android-v0.1.4.apk"
          echo "output=${output}" >> "$GITHUB_OUTPUT"

      - name: Build exact host-side typed APK digest verifier
        id: digest-tool
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path canonical/Cargo.toml --locked --release \
            -p operator-cli --bin android-artifact-digest
          tool="canonical/target/release/android-artifact-digest"
          test -x "${tool}"
          echo "path=${tool}" >> "$GITHUB_OUTPUT"

      - name: Assemble immutable same-run clean-install bundle
        shell: bash
        env:
          RELEASE_OUTPUT: ${{ steps.build.outputs.output }}
          DIGEST_TOOL: ${{ steps.digest-tool.outputs.path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-clean-install-bundle'
          root.mkdir(parents=True, exist_ok=False)
          files = {
              'mobile-proxy-android-v0.1.4.apk': Path(os.environ['RELEASE_OUTPUT']) / 'mobile-proxy-android-v0.1.4.apk',
              'android-release-evidence.json': Path(os.environ['RELEASE_OUTPUT']) / 'android-release-evidence.json',
              'android-artifact-digest': Path(os.environ['DIGEST_TOOL']),
              'clean_install_android_production.py': Path('canonical/scripts/clean_install_android_production.py'),
              'run_private_phone_preflight.py': Path('canonical/scripts/run_private_phone_preflight.py'),
              'verify_android_installed_signer.py': Path('canonical/scripts/verify_android_installed_signer.py'),
              'run_destructive_clean_install.py': Path('private-execution/.github/scripts/run_destructive_clean_install.py'),
          }
          digests = {}
          for name, source in files.items():
              if not source.is_file():
                  raise SystemExit(f'clean-install bundle input missing: {name}')
              destination = root / name
              shutil.copyfile(source, destination)
              if name in {'android-artifact-digest', 'run_destructive_clean_install.py'}:
                  destination.chmod(0o755)
              digests[name] = hashlib.sha256(destination.read_bytes()).hexdigest()
          manifest = {
              'format_version': 1,
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'private_repository': 'iamaman11/mobile-proxy-production',
              'private_execution_sha': os.environ['GITHUB_SHA'],
              'transaction_id': os.environ['TRANSACTION_ID'],
              'expected_version_name': os.environ['EXPECTED_VERSION_NAME'],
              'expected_version_code': int(os.environ['EXPECTED_VERSION_CODE']),
              'files_sha256': digests,
          }
          (root / 'bundle-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload immutable destructive clean-install bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-clean-install-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-bundle
          if-no-files-found: error
          retention-days: 1

  clean-install-phone:
    name: Globally serialized destructive Android clean install
    needs: [command-gate, build-candidate]
    if: ${{ needs.command-gate.result == 'success' && needs.build-candidate.result == 'success' }}
    concurrency:
      group: production-phone-global-mutation
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 20
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      TRANSACTION_ID: ${{ needs.command-gate.outputs.transaction_id }}
      PRIVATE_SHA: ${{ github.sha }}
      REQUEST_REF: issue-comment:${{ github.event.comment.id }}
      EXPECTED_VERSION_NAME: '0.1.4'
      EXPECTED_VERSION_CODE: '1004'
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      state: ${{ steps.result.outputs.state }}
      accepted: ${{ steps.result.outputs.accepted }}
      terminal_comment_id: ${{ steps.result.outputs.terminal_comment_id }}
    steps:
      - name: Download immutable clean-install bundle attempt 1
        id: bundle-download-1
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phone-clean-install-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-attempt-1

      - name: Back off before bundle retry 2
        if: steps.bundle-download-1.outcome == 'failure'
        shell: bash
        run: sleep 3

      - name: Download immutable clean-install bundle attempt 2
        id: bundle-download-2
        if: steps.bundle-download-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phone-clean-install-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-attempt-2

      - name: Back off before bundle retry 3
        if: steps.bundle-download-1.outcome == 'failure' && steps.bundle-download-2.outcome == 'failure'
        shell: bash
        run: sleep 6

      - name: Download immutable clean-install bundle attempt 3
        id: bundle-download-3
        if: steps.bundle-download-1.outcome == 'failure' && steps.bundle-download-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phone-clean-install-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-attempt-3

      - name: Promote and verify exact immutable bundle before phone access
        shell: bash
        env:
          OUTCOME_1: ${{ steps.bundle-download-1.outcome }}
          OUTCOME_2: ${{ steps.bundle-download-2.outcome }}
          OUTCOME_3: ${{ steps.bundle-download-3.outcome }}
        run: |
          set -euo pipefail
          selected=""
          if [ "${OUTCOME_1}" = success ]; then
            selected="${RUNNER_TEMP}/phone-clean-install-attempt-1"
          elif [ "${OUTCOME_2}" = success ]; then
            selected="${RUNNER_TEMP}/phone-clean-install-attempt-2"
          elif [ "${OUTCOME_3}" = success ]; then
            selected="${RUNNER_TEMP}/phone-clean-install-attempt-3"
          else
            echo "no immutable clean-install bundle download succeeded" >&2
            exit 1
          fi
          destination="${RUNNER_TEMP}/phone-clean-install-bundle"
          test ! -e "${destination}"
          mv "${selected}" "${destination}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-clean-install-bundle'
          manifest = json.loads((root / 'bundle-manifest.json').read_text(encoding='utf-8'))
          expected_meta = {
              'format_version': 1,
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'private_repository': 'iamaman11/mobile-proxy-production',
              'private_execution_sha': os.environ['PRIVATE_SHA'],
              'transaction_id': os.environ['TRANSACTION_ID'],
              'expected_version_name': os.environ['EXPECTED_VERSION_NAME'],
              'expected_version_code': int(os.environ['EXPECTED_VERSION_CODE']),
          }
          for key, value in expected_meta.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'clean-install bundle authority differs: {key}')
          expected_files = {
              'mobile-proxy-android-v0.1.4.apk',
              'android-release-evidence.json',
              'android-artifact-digest',
              'clean_install_android_production.py',
              'run_private_phone_preflight.py',
              'verify_android_installed_signer.py',
              'run_destructive_clean_install.py',
          }
          digests = manifest.get('files_sha256')
          if not isinstance(digests, dict) or set(digests) != expected_files:
              raise SystemExit('clean-install bundle file inventory differs')
          for name in sorted(expected_files):
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'clean-install bundle file missing: {name}')
              if hashlib.sha256(path.read_bytes()).hexdigest() != digests[name]:
                  raise SystemExit(f'clean-install bundle digest differs: {name}')
          PY
          chmod 700 "${destination}/run_destructive_clean_install.py"
          chmod 700 "${destination}/android-artifact-digest"

      - name: Execute one durable destructive clean-install transaction
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/phone-clean-install-bundle"
          canonical="${RUNNER_TEMP}/phone-clean-install-canonical"
          mkdir -p "${canonical}/scripts"
          cp "${root}/clean_install_android_production.py" "${canonical}/scripts/"
          cp "${root}/run_private_phone_preflight.py" "${canonical}/scripts/"
          cp "${root}/verify_android_installed_signer.py" "${canonical}/scripts/"
          touch "${canonical}/scripts/__init__.py"
          python3 "${root}/run_destructive_clean_install.py" \
            --canonical-root "${canonical}" \
            --canonical-sha "${CANONICAL_SHA}" \
            --quality-run-id "${QUALITY_RUN_ID}" \
            --private-sha "${PRIVATE_SHA}" \
            --transaction-id "${TRANSACTION_ID}" \
            --request-ref "${REQUEST_REF}" \
            --apk "${root}/mobile-proxy-android-v0.1.4.apk" \
            --release-evidence "${root}/android-release-evidence.json" \
            --digest-tool "${root}/android-artifact-digest" \
            --expected-version-name "${EXPECTED_VERSION_NAME}" \
            --expected-version-code "${EXPECTED_VERSION_CODE}" \
            --output "${RUNNER_TEMP}/phone-clean-install-result.json"

      - name: Export bounded terminal result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'phone-clean-install-result.json'
          if not path.is_file():
              values = {
                  'state': 'NO_DURABLE_TERMINAL_OUTPUT',
                  'accepted': False,
                  'terminal_comment_id': '',
              }
          else:
              result = json.loads(path.read_text(encoding='utf-8'))
              allowed = {
                  'INSTALLED_EXACT_CANDIDATE',
                  'INSTALLED_EXACT_CANDIDATE_RECOVERED_POSTCONDITION',
                  'PACKAGE_ABSENT_AFTER_FAILED_CLEAN_INSTALL',
                  'QUARANTINED_PACKAGE_STATE',
                  'UNKNOWN_EXECUTION_OUTCOME',
              }
              state = result.get('state')
              if state not in allowed:
                  raise SystemExit('clean-install terminal state is invalid')
              values = {
                  'state': state,
                  'accepted': result.get('accepted') is True,
                  'terminal_comment_id': result.get('terminal_comment_id', ''),
              }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"state={values['state']}\n")
              handle.write(f"accepted={'true' if values['accepted'] else 'false'}\n")
              handle.write(f"terminal_comment_id={values['terminal_comment_id']}\n")
          PY

      - name: Upload bounded terminal result without changing mutation truth
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-clean-install-result-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Record bounded destructive result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Destructive Android clean install
          - Canonical SHA: ${{ env.CANONICAL_SHA }}
          - Quality run: ${{ env.QUALITY_RUN_ID }}
          - Transaction: ${{ env.TRANSACTION_ID }}
          - State: ${{ steps.result.outputs.state || 'NO_DURABLE_TERMINAL_OUTPUT' }}
          - Accepted: ${{ steps.result.outputs.accepted || 'false' }}
          - Legacy generation preservation required: false
          - Provider/reboot/runtime mutation performed by this operation: false
          - Blind retry allowed: false
          EOF

      - name: Fail workflow unless exact replacement package terminal is proven
        if: always() && steps.result.outputs.accepted != 'true'
        shell: bash
        run: |
          echo "destructive clean install did not prove an accepted exact-candidate terminal" >&2
          exit 1
