name: Production Android destructive clean install

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  command-gate:
    name: Validate cursor-bound clean-install authority
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-clean-install ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMMAND: ${{ github.event.comment.body }}
      COMMENT_ID: ${{ github.event.comment.id }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      cursor_id: ${{ steps.command.outputs.cursor_id }}
      quality_run_id: ${{ steps.command.outputs.quality_run_id }}
      transaction_id: ${{ steps.command.outputs.transaction_id }}
      semantic_request_key: ${{ steps.command.outputs.semantic_request_key }}
    steps:
      - name: Checkout exact private control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution
          persist-credentials: false

      - name: Admit exactly one tracker-cursor transaction
        id: command
        shell: bash
        run: |
          set -euo pipefail
          python3 private-execution/.github/scripts/clean_install_control.py admit \
            --command-body "${COMMAND}" \
            --command-comment-id "${COMMENT_ID}" \
            --workflow-sha "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  build-candidate:
    name: Build exact current-source signed replacement candidate off-phone
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      CONTROL_CURSOR_ID: ${{ needs.command-gate.outputs.cursor_id }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      TRANSACTION_ID: ${{ needs.command-gate.outputs.transaction_id }}
      SEMANTIC_REQUEST_KEY: ${{ needs.command-gate.outputs.semantic_request_key }}
      EXPECTED_VERSION_NAME: '0.1.4'
      EXPECTED_VERSION_CODE: '1004'
      ANDROID_BASELINE_REF: v0.1.3
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact canonical source with release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ env.CANONICAL_SHA }}
          path: canonical
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact private execution wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution
          persist-credentials: false

      - name: Build and verify exact signed replacement APK
        id: build
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "${CANONICAL_SHA}"
          test "$(git -C private-execution rev-parse HEAD)" = "${GITHUB_SHA}"
          output="${RUNNER_TEMP}/android-release-output"
          mkdir -p "${output}"
          python3 canonical/scripts/build_signed_android_release.py \
            --repository-root canonical \
            --canonical-sha "${CANONICAL_SHA}" \
            --output-dir "${output}" \
            --android-baseline-ref "${ANDROID_BASELINE_REF}"
          python3 - "${output}/android-release-evidence.json" <<'PY'
          import json
          import os
          import sys

          evidence = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = {
              'format_version': 1,
              'repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'application_id': 'com.example.mobileproxy',
              'version_name': os.environ['EXPECTED_VERSION_NAME'],
              'version_code': int(os.environ['EXPECTED_VERSION_CODE']),
              'release_contract_verified': True,
              'keystore_verified': True,
              'apk_signature_verified': True,
              'apk_signer_matches_private_key': True,
              'production_apk_signed': True,
              'phone_access_performed': False,
              'phone_mutation_performed': False,
              'artifact_digest_algorithm': 'blake3-256',
              'artifact_digest_domain': 'mobile-proxy/android-apk/v1',
              'accepted': True,
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f'current-source release evidence mismatch: {key}')
          if evidence.get('artifact_name') != 'mobile-proxy-android-v0.1.4.apk':
              raise SystemExit('unexpected signed replacement APK name')
          PY
          test -s "${output}/mobile-proxy-android-v0.1.4.apk"
          echo "output=${output}" >> "$GITHUB_OUTPUT"

      - name: Build exact host-side typed APK digest verifier
        id: digest-tool
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path canonical/Cargo.toml --locked --release \
            -p operator-cli --bin android-artifact-digest
          test -x canonical/target/release/android-artifact-digest
          echo "path=canonical/target/release/android-artifact-digest" >> "$GITHUB_OUTPUT"

      - name: Assemble immutable cursor-bound clean-install bundle
        shell: bash
        env:
          RELEASE_OUTPUT: ${{ steps.build.outputs.output }}
          DIGEST_TOOL: ${{ steps.digest-tool.outputs.path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-clean-install-bundle'
          root.mkdir(parents=True, exist_ok=False)
          files = {
              'mobile-proxy-android-v0.1.4.apk': Path(os.environ['RELEASE_OUTPUT']) / 'mobile-proxy-android-v0.1.4.apk',
              'android-release-evidence.json': Path(os.environ['RELEASE_OUTPUT']) / 'android-release-evidence.json',
              'android-artifact-digest': Path(os.environ['DIGEST_TOOL']),
              'clean_install_android_production.py': Path('canonical/scripts/clean_install_android_production.py'),
              'run_private_phone_preflight.py': Path('canonical/scripts/run_private_phone_preflight.py'),
              'verify_android_installed_signer.py': Path('canonical/scripts/verify_android_installed_signer.py'),
              'clean_install_control.py': Path('private-execution/.github/scripts/clean_install_control.py'),
              'run_destructive_clean_install.py': Path('private-execution/.github/scripts/run_destructive_clean_install.py'),
              'run_destructive_clean_install_v2.py': Path('private-execution/.github/scripts/run_destructive_clean_install_v2.py'),
          }
          digests = {}
          for name, source in files.items():
              if not source.is_file():
                  raise SystemExit(f'clean-install bundle input missing: {name}')
              destination = root / name
              shutil.copyfile(source, destination)
              if name in {'android-artifact-digest', 'run_destructive_clean_install_v2.py'}:
                  destination.chmod(0o755)
              digests[name] = hashlib.sha256(destination.read_bytes()).hexdigest()
          manifest = {
              'format_version': 2,
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'control_cursor_id': int(os.environ['CONTROL_CURSOR_ID']),
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'private_repository': 'iamaman11/mobile-proxy-production',
              'private_execution_sha': os.environ['GITHUB_SHA'],
              'transaction_id': os.environ['TRANSACTION_ID'],
              'semantic_request_key': os.environ['SEMANTIC_REQUEST_KEY'],
              'expected_version_name': os.environ['EXPECTED_VERSION_NAME'],
              'expected_version_code': int(os.environ['EXPECTED_VERSION_CODE']),
              'files_sha256': digests,
          }
          (root / 'bundle-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload immutable destructive clean-install bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-clean-install-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-bundle
          if-no-files-found: error
          retention-days: 1

  clean-install-phone:
    name: Globally serialized destructive Android clean install
    needs: [command-gate, build-candidate]
    if: ${{ needs.command-gate.result == 'success' && needs.build-candidate.result == 'success' }}
    concurrency:
      group: production-phone-global-mutation
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 20
    env:
      COMMAND: ${{ github.event.comment.body }}
      COMMENT_ID: ${{ github.event.comment.id }}
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      CONTROL_CURSOR_ID: ${{ needs.command-gate.outputs.cursor_id }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      TRANSACTION_ID: ${{ needs.command-gate.outputs.transaction_id }}
      SEMANTIC_REQUEST_KEY: ${{ needs.command-gate.outputs.semantic_request_key }}
      PRIVATE_SHA: ${{ github.sha }}
      REQUEST_REF: issue-comment:${{ github.event.comment.id }}
      EXPECTED_VERSION_NAME: '0.1.4'
      EXPECTED_VERSION_CODE: '1004'
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      state: ${{ steps.result.outputs.state }}
      accepted: ${{ steps.result.outputs.accepted }}
      terminal_comment_id: ${{ steps.result.outputs.terminal_comment_id }}
    steps:
      - name: Download immutable same-run clean-install bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: phone-clean-install-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-bundle

      - name: Verify exact immutable bundle before phone access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-clean-install-bundle'
          manifest = json.loads((root / 'bundle-manifest.json').read_text(encoding='utf-8'))
          expected = {
              'format_version': 2,
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'control_cursor_id': int(os.environ['CONTROL_CURSOR_ID']),
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'private_repository': 'iamaman11/mobile-proxy-production',
              'private_execution_sha': os.environ['PRIVATE_SHA'],
              'transaction_id': os.environ['TRANSACTION_ID'],
              'semantic_request_key': os.environ['SEMANTIC_REQUEST_KEY'],
              'expected_version_name': os.environ['EXPECTED_VERSION_NAME'],
              'expected_version_code': int(os.environ['EXPECTED_VERSION_CODE']),
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'clean-install bundle authority differs: {key}')
          expected_files = {
              'mobile-proxy-android-v0.1.4.apk',
              'android-release-evidence.json',
              'android-artifact-digest',
              'clean_install_android_production.py',
              'run_private_phone_preflight.py',
              'verify_android_installed_signer.py',
              'clean_install_control.py',
              'run_destructive_clean_install.py',
              'run_destructive_clean_install_v2.py',
          }
          digests = manifest.get('files_sha256')
          if not isinstance(digests, dict) or set(digests) != expected_files:
              raise SystemExit('clean-install bundle file inventory differs')
          for name in sorted(expected_files):
              path = root / name
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digests[name]:
                  raise SystemExit(f'clean-install bundle digest differs: {name}')
          PY
          chmod 700 "${RUNNER_TEMP}/phone-clean-install-bundle/run_destructive_clean_install_v2.py"
          chmod 700 "${RUNNER_TEMP}/phone-clean-install-bundle/android-artifact-digest"

      - name: Revalidate semantic admission inside global mutation lock
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/phone-clean-install-bundle"
          python3 "${root}/clean_install_control.py" admit \
            --command-body "${COMMAND}" \
            --command-comment-id "${COMMENT_ID}" \
            --workflow-sha "${PRIVATE_SHA}" \
            --expected-quality-run-id "${QUALITY_RUN_ID}" \
            --expected-transaction-id "${TRANSACTION_ID}" \
            --expected-semantic-request-key "${SEMANTIC_REQUEST_KEY}"

      - name: Execute one durable destructive clean-install transaction
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/phone-clean-install-bundle"
          canonical="${RUNNER_TEMP}/phone-clean-install-canonical"
          mkdir -p "${canonical}/scripts"
          cp "${root}/clean_install_android_production.py" "${canonical}/scripts/"
          cp "${root}/run_private_phone_preflight.py" "${canonical}/scripts/"
          cp "${root}/verify_android_installed_signer.py" "${canonical}/scripts/"
          touch "${canonical}/scripts/__init__.py"
          python3 "${root}/run_destructive_clean_install_v2.py" \
            --canonical-root "${canonical}" \
            --canonical-sha "${CANONICAL_SHA}" \
            --quality-run-id "${QUALITY_RUN_ID}" \
            --private-sha "${PRIVATE_SHA}" \
            --transaction-id "${TRANSACTION_ID}" \
            --semantic-request-key "${SEMANTIC_REQUEST_KEY}" \
            --control-cursor-id "${CONTROL_CURSOR_ID}" \
            --request-ref "${REQUEST_REF}" \
            --apk "${root}/mobile-proxy-android-v0.1.4.apk" \
            --release-evidence "${root}/android-release-evidence.json" \
            --digest-tool "${root}/android-artifact-digest" \
            --expected-version-name "${EXPECTED_VERSION_NAME}" \
            --expected-version-code "${EXPECTED_VERSION_CODE}" \
            --output "${RUNNER_TEMP}/phone-clean-install-result.json"

      - name: Export bounded terminal result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'phone-clean-install-result.json'
          if path.is_file():
              result = json.loads(path.read_text(encoding='utf-8'))
              state = result.get('state')
              accepted = result.get('accepted') is True
              terminal = result.get('terminal_comment_id', '')
          else:
              state = 'NO_DURABLE_TERMINAL_OUTPUT'
              accepted = False
              terminal = ''
          allowed = {
              'INSTALLED_EXACT_CANDIDATE',
              'INSTALLED_EXACT_CANDIDATE_RECOVERED_POSTCONDITION',
              'PACKAGE_ABSENT_AFTER_FAILED_CLEAN_INSTALL',
              'QUARANTINED_PACKAGE_STATE',
              'UNKNOWN_EXECUTION_OUTCOME',
              'NO_DURABLE_TERMINAL_OUTPUT',
          }
          if state not in allowed:
              raise SystemExit('clean-install terminal state is invalid')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'state={state}\n')
              handle.write(f"accepted={'true' if accepted else 'false'}\n")
              handle.write(f'terminal_comment_id={terminal}\n')
          PY

      - name: Retain bounded terminal result without changing mutation truth
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-clean-install-result-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-clean-install-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Record bounded destructive result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Destructive Android clean install
          - Canonical SHA: ${{ env.CANONICAL_SHA }}
          - Control cursor: ${{ env.CONTROL_CURSOR_ID }}
          - Quality run: ${{ env.QUALITY_RUN_ID }}
          - Transaction: ${{ env.TRANSACTION_ID }}
          - State: ${{ steps.result.outputs.state || 'NO_DURABLE_TERMINAL_OUTPUT' }}
          - Accepted: ${{ steps.result.outputs.accepted || 'false' }}
          - Legacy generation preservation required: false
          - Provider/reboot/runtime mutation performed by this operation: false
          - Blind retry allowed: false
          EOF

      - name: Fail workflow unless exact replacement package terminal is proven
        if: always() && steps.result.outputs.accepted != 'true'
        shell: bash
        run: |
          echo "destructive clean install did not prove an accepted exact-candidate terminal" >&2
          exit 1
