name: Issue command control policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-issue-command-control:
    name: Validate sole Issue #1 ingress and declarative command contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile command adapters, controller and registries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/controller/*.py \
            .github/controller/tests/*.py \
            .github/scripts/deployment_command_router.py \
            .github/scripts/issue_command_router.py \
            .github/scripts/dispatch_allowlisted_workflow.py \
            .github/scripts/deployment_execution.py \
            .github/scripts/prepare_release_deployment.py \
            .github/scripts/finalize_deployment_projection.py \
            .github/scripts/run_phone_release_deployment.py \
            .github/scripts/prepare_quarantine_recovery.py \
            .github/scripts/run_quarantine_recovery.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('.github/production/command-control-registry.json'),
              Path('.github/production/targets.json'),
          ):
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path} is not a JSON object')
          print('COMMAND_CONTROL_REGISTRIES_JSON_OK')
          PY

      - name: Run fail-closed command-control and controller acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/controller/tests/test_controller.py
          python3 .github/controller/tests/test_evidence_store.py
          python3 .github/controller/tests/test_issue_command_router.py
          python3 .github/controller/tests/test_product_release_admission_workflow.py
          python3 .github/controller/tests/test_projection_reconciler.py
          python3 .github/controller/tests/test_release_resolver.py
          python3 .github/controller/tests/test_quarantine_recovery.py
          echo 'DEPLOYMENT_CONTROLLER_HOSTED_TESTS_OK'

      - name: Prove legacy Product Release refusal off-device
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/controller').resolve()))
          from release_resolver import ReleaseAdmissionError, resolve_release

          try:
              resolve_release(tag='v0.1.4', target='phone-production')
          except ReleaseAdmissionError as exc:
              message = str(exc).strip()
              if not message:
                  raise SystemExit('legacy v0.1.4 refusal lacked a fail-closed reason')
              print('LEGACY_PRODUCT_RELEASE_REFUSAL_OK tag=v0.1.4 target=phone-production reason=' + message)
          else:
              raise SystemExit('legacy five-asset v0.1.4 unexpectedly admitted')
          PY

      - name: Prove sole ingress and Deployment Controller safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import importlib.util
          import json
          import re
          import sys
          from pathlib import Path

          workflows = Path('.github/workflows')
          router = (workflows / 'production-control-router.yml').read_text(encoding='utf-8')
          deployment = (workflows / 'release-deployment.yml').read_text(encoding='utf-8')
          quarantine_recovery = (workflows / 'quarantined-release-recovery.yml').read_text(encoding='utf-8')
          admission = (workflows / 'product-release-admission-proof.yml').read_text(encoding='utf-8')
          registry_path = Path('.github/production/command-control-registry.json')
          targets_path = Path('.github/production/targets.json')

          direct_ingress = sorted(
              path.name for path in workflows.glob('*.yml')
              if re.search(r'(?m)^  issue_comment:\s*$', path.read_text(encoding='utf-8'))
          )
          if direct_ingress != ['production-control-router.yml']:
              raise SystemExit('exactly one private Issue #1 ingress required: ' + repr(direct_ingress))

          required_router = (
              "github.event.repository.full_name == 'iamaman11/mobile-proxy-production'",
              'github.event.issue.number == 1',
              'github.event.comment.user.login == github.repository_owner',
              '.github/scripts/issue_command_router.py',
              '.github/scripts/dispatch_allowlisted_workflow.py',
              "needs.route.outputs.handler == 'dispatch_workflow'",
              "needs.route.outputs.read_only == 'true'",
              "needs.route.outputs.destructive == 'false'",
              "needs.route.outputs.route_id == 'deploy-product-release'",
              "needs.route.outputs.route_id == 'recover-quarantined-product-release'",
              "needs.route.outputs.operation_class == 'RECOVER'",
              'name: Revalidate deployment request outputs against admitted route',
              'uses: ./.github/workflows/release-deployment.yml',
              'uses: ./.github/workflows/quarantined-release-recovery.yml',
          )
          missing = [item for item in required_router if item not in router]
          if missing:
              raise SystemExit('sole router contract incomplete: ' + ', '.join(missing))
          expression_open = '$' + '{{'
          forbidden_router = (
              'actions/workflows/' + expression_open,
              '-f ref=' + expression_open,
              'secrets.',
              'runs-on: [self-hosted',
              ' adb ',
              'authority_cursor',
              'issue179-comment-',
          )
          present = [item for item in forbidden_router if item in router]
          if present:
              raise SystemExit('router gained forbidden capability: ' + ', '.join(present))

          build_marker = '      - name: Build existing cursor-free semantic deployment request'
          validate_marker = '      - name: Revalidate deployment request outputs against admitted route'
          execution_marker = '      - name: Build exact controller execution ACK'
          if not all(marker in router for marker in (build_marker, validate_marker, execution_marker)):
              raise SystemExit('deployment ACK output-validation step ordering markers missing')
          build_block = router.split(build_marker, 1)[1].split(validate_marker, 1)[0]
          if 'steps.command.outputs.' in build_block:
              raise SystemExit('deployment request step must not consume its own outputs')
          validate_block = router.split(validate_marker, 1)[1].split(execution_marker, 1)[0]
          for required in (
              'steps.command.outputs.target',
              'steps.command.outputs.release_tag',
              'needs.route.outputs.target',
              'needs.route.outputs.release_tag',
          ):
              if required not in validate_block:
                  raise SystemExit('deployment output-validation contract incomplete: ' + required)

          spec = importlib.util.spec_from_file_location('issue_command_router_acceptance', '.github/scripts/issue_command_router.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load command classifier')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          targets = module.validate_target_registry(json.loads(targets_path.read_text(encoding='utf-8')))
          routes = module.validate_registry(json.loads(registry_path.read_text(encoding='utf-8')), targets)
          active = [item for item in routes if item.get('enabled') is True]
          if {item['id'] for item in active} != {
              'observe-public-deployment-projection',
              'verify-product-release',
              'deploy-product-release',
              'runner-android-build-tools-bootstrap',
              'recover-quarantined-product-release',
          }:
              raise SystemExit('active route set differs')
          destructive = {item.get('id'): item for item in active if item.get('destructive') is True}
          if set(destructive) != {'deploy-product-release', 'recover-quarantined-product-release'}:
              raise SystemExit('unexpected destructive route set')
          deploy = destructive['deploy-product-release']
          if deploy.get('semantic_identity_policy') != 'existing-deployment-request-v2':
              raise SystemExit('deployment semantic identity drifted')
          if deploy.get('idempotency_policy') != 'durable-semantic-ledger':
              raise SystemExit('deployment idempotency drifted')
          if deploy.get('recovery_policy') != 'UNKNOWN-read-only-reconcile-no-blind-retry':
              raise SystemExit('deployment UNKNOWN recovery drifted')

          recover = destructive['recover-quarantined-product-release']
          if (
              recover.get('handler') != 'workflow_call'
              or recover.get('operation_class') != 'RECOVER'
              or recover.get('read_only') is not False
              or recover.get('requires_phone') is not True
              or recover.get('requires_vm') is not False
              or recover.get('requires_release') is not True
              or recover.get('allowed_targets') != ['phone-production']
              or recover.get('physical_domains') != ['runtime']
              or recover.get('idempotency_policy') != 'single-run-attempt+durable-semantic-quarantine-recovery-ledger'
              or recover.get('semantic_identity_policy') != 'quarantined-deployment-terminal+command-arguments'
              or recover.get('recovery_policy') != 'UNKNOWN-no-blind-retry-owner-checkpoint-required'
              or recover.get('workflow') != '.github/workflows/quarantined-release-recovery.yml'
              or 'v0\\.1\\.7' not in recover.get('pattern', '')
              or '74489a27b4c845b9060056af498090beded81db009e05f0290091af846c4e5d7' not in recover.get('pattern', '')
          ):
              raise SystemExit('Stage 3 quarantine recovery route safety contract differs')

          verify = next((item for item in active if item.get('id') == 'verify-product-release'), None)
          if verify is None:
              raise SystemExit('Product Release admission route is missing')
          if (
              verify.get('handler') != 'dispatch_workflow'
              or verify.get('operation_class') != 'RELEASE_VERIFY'
              or verify.get('read_only') is not True
              or verify.get('destructive') is not False
              or verify.get('requires_phone') is not False
              or verify.get('requires_vm') is not False
              or verify.get('requires_release') is not True
              or verify.get('physical_domains') != []
              or verify.get('allowed_targets') != ['phone-production']
          ):
              raise SystemExit('Product Release admission route safety contract differs')

          if targets['phone-production'].get('active') is not True:
              raise SystemExit('phone target is not active')
          if targets['phone-production'].get('serialization_domain') != 'production-target-phone-production':
              raise SystemExit('phone target serialization drifted')
          if targets['phone-production'].get('allowed_operations') != [
              'deploy-product-release',
              'verify-product-release',
              'recover-quarantined-product-release',
          ]:
              raise SystemExit('phone target operation allowlist differs')
          if targets['vm-production'].get('active') is not False or targets['vm-production'].get('adapter') != 'deferred':
              raise SystemExit('VM target is not fail-closed/deferred')
          if targets['vm-production'].get('allowed_operations') != ['deploy-product-release']:
              raise SystemExit('VM target operation allowlist drifted')

          required_admission = (
              'workflow_dispatch:',
              'runs-on: ubuntu-latest',
              'from release_resolver import resolve_release',
              'resolve_release(tag=release_tag, target=target)',
              'PRODUCT_RELEASE_ADMISSION_ACCEPTED',
              '"phone_access": False',
              '"deployment_created": False',
              '"deployment_intent_created": False',
          )
          missing = [item for item in required_admission if item not in admission]
          if missing:
              raise SystemExit('Product Release admission proof contract incomplete: ' + ', '.join(missing))
          forbidden_admission = (
              'environment:',
              'secrets.',
              'self-hosted',
              'android-production',
              ' adb ',
              'prepare_release_deployment',
              'finalize_deployment_projection',
              'release-deployment.yml',
              'deployments_url',
              '/deploy ',
              'com.mobileproxy.app',
              'com.example.mobileproxy',
          )
          present = [item for item in forbidden_admission if item in admission]
          if present:
              raise SystemExit('Product Release admission proof gained forbidden capability or duplicate package authority: ' + ', '.join(present))

          for required in (
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production',
              'cancel-in-progress: false',
              'environment: phone-production',
              'Reconcile recovery mode from durable private ledger',
              'finalize-phone-projection:',
          ):
              if required not in deployment:
                  raise SystemExit('deployment workflow invariant missing: ' + required)

          for required in (
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production',
              'cancel-in-progress: false',
              'environment: phone-production',
              'prepare_quarantine_recovery.py',
              'run_quarantine_recovery.py',
              'STAGE3_QUARANTINE_RECOVERY_ACCEPTED',
          ):
              if required not in quarantine_recovery:
                  raise SystemExit('quarantine recovery workflow invariant missing: ' + required)
          for forbidden in (
              'workflow_dispatch:',
              'dispatch_release_once',
              'dispatch_install_once',
              '_stage_runtime',
              '_materialize_inactive',
          ):
              if forbidden in quarantine_recovery:
                  raise SystemExit('quarantine recovery workflow gained forbidden deploy/restage surface: ' + forbidden)

          evidence = Path('.github/controller/evidence_store.py').read_text(encoding='utf-8')
          for required in (
              '## DEPLOYMENT ADMISSION V2',
              '## DEPLOYMENT MUTATION INTENT V2',
              '## DEPLOYMENT TERMINAL V2',
              '## DEPLOYMENT DUPLICATE V2',
          ):
              if required not in evidence:
                  raise SystemExit('durable evidence invariant missing: ' + required)

          state_machine = Path('.github/controller/deployment_state_machine.py').read_text(encoding='utf-8')
          for required in ('ACCEPTED', 'REFUSED', 'UNKNOWN', 'RECOVERED', 'QUARANTINED'):
              if required not in state_machine:
                  raise SystemExit('state machine terminal missing: ' + required)
          if 'state in {UNKNOWN, RECOVERED}' not in state_machine:
              raise SystemExit('UNKNOWN/RECOVERED projection fail-closed invariant missing')

          run_path = Path('.github/scripts/run_phone_release_deployment.py')
          run_tree = ast.parse(run_path.read_text(encoding='utf-8'))
          composite_calls = [
              node for node in ast.walk(run_tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == 'dispatch_release_once'
          ]
          direct_apk_calls = [
              node for node in ast.walk(run_tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == 'dispatch_install_once'
          ]
          if len(composite_calls) != 1 or direct_apk_calls:
              raise SystemExit(
                  f'exactly one composite dispatch and zero direct APK dispatch callsites required; '
                  f'composite={len(composite_calls)} direct_apk={len(direct_apk_calls)}'
              )
          target_path = Path('.github/controller/phone_target.py')
          target_tree = ast.parse(target_path.read_text(encoding='utf-8'))
          primitive_calls = [
              node for node in ast.walk(target_tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == 'dispatch_install_once'
          ]
          if len(primitive_calls) != 1:
              raise SystemExit(f'composite adapter must contain exactly one APK destructive primitive; got {len(primitive_calls)}')

          print('SOLE_COMMAND_CONTROL_INGRESS_OK')
          print('PRODUCT_RELEASE_ADMISSION_READ_ONLY_OK')
          print('DEPLOYMENT_CONTROLLER_BOUNDARY_OK')
          print('STAGE3_QUARANTINE_RECOVERY_BOUNDARY_OK')
          print('VM_TARGET_DEFERRED_OK')
          PY