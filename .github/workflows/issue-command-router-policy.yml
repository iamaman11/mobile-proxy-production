name: Issue command control policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-issue-command-control:
    name: Validate sole Issue #1 ingress and declarative command contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile command adapters and parse registries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/issue_command_router.py \
            .github/scripts/dispatch_allowlisted_workflow.py \
            .github/controller/tests/test_issue_command_router.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('.github/production/command-control-registry.json'),
              Path('.github/production/targets.json'),
          ):
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path} is not a JSON object')
          print('COMMAND_CONTROL_REGISTRIES_JSON_OK')
          PY

      - name: Run fail-closed command-control policy tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/controller/tests/test_issue_command_router.py
