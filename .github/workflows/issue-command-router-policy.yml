name: Issue command control policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-issue-command-control:
    name: Validate sole Issue #1 ingress and declarative command contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile command adapters, controller and registries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/controller/*.py \
            .github/controller/tests/*.py \
            .github/scripts/deployment_command_router.py \
            .github/scripts/issue_command_router.py \
            .github/scripts/dispatch_allowlisted_workflow.py \
            .github/scripts/deployment_execution.py \
            .github/scripts/prepare_release_deployment.py \
            .github/scripts/finalize_deployment_projection.py \
            .github/scripts/run_phone_release_deployment.py \
            .github/scripts/observe_phone_release.py \
            .github/scripts/observe_phone_operational.py \
            .github/scripts/exercise_runtime_recovery.py \
            .github/scripts/reconcile_phone_release.py \
            .github/scripts/phone_transport_preflight.py \
            .github/scripts/observe_runner_transport.py \
            .github/scripts/finalize_runner_transport_observation.py \
            .github/scripts/prepare_quarantine_recovery.py \
            .github/scripts/run_quarantine_recovery.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('.github/production/command-control-registry.json'),
              Path('.github/production/targets.json'),
          ):
              value = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'{path} is not a JSON object')
          print('COMMAND_CONTROL_REGISTRIES_JSON_OK')
          PY

      - name: Run fail-closed command-control and controller acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/controller/tests/test_controller.py
          python3 .github/controller/tests/test_evidence_store.py
          python3 .github/controller/tests/test_issue_command_router.py
          python3 .github/controller/tests/test_phone_operational_observer.py
          python3 .github/controller/tests/test_phone_release_observer.py
          python3 .github/controller/tests/test_phone_release_state.py
          python3 .github/controller/tests/test_phone_release_reconcile.py
          python3 .github/controller/tests/test_product_release_admission_workflow.py
          python3 .github/controller/tests/test_projection_reconciler.py
          python3 .github/controller/tests/test_release_resolver.py
          python3 .github/controller/tests/test_quarantine_recovery.py
          python3 .github/controller/tests/test_runtime_recovery_exercise.py
          echo 'DEPLOYMENT_CONTROLLER_HOSTED_TESTS_OK'

      - name: Prove legacy Product Release refusal off-device
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/controller').resolve()))
          from release_resolver import ReleaseAdmissionError, resolve_release

          try:
              resolve_release(tag='v0.1.4', target='phone-production')
          except ReleaseAdmissionError as exc:
              message = str(exc).strip()
              if not message:
                  raise SystemExit('legacy v0.1.4 refusal lacked a fail-closed reason')
              print('LEGACY_PRODUCT_RELEASE_REFUSAL_OK tag=v0.1.4 target=phone-production reason=' + message)
          else:
              raise SystemExit('legacy five-asset v0.1.4 unexpectedly admitted')
          PY

      - name: Prove sole ingress and Deployment Controller safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import importlib.util
          import json
          import re
          import sys
          from pathlib import Path

          workflows = Path('.github/workflows')
          router = (workflows / 'production-control-router.yml').read_text(encoding='utf-8')
          deployment = (workflows / 'release-deployment.yml').read_text(encoding='utf-8')
          quarantine_recovery = (workflows / 'quarantined-release-recovery.yml').read_text(encoding='utf-8')
          admission = (workflows / 'product-release-admission-proof.yml').read_text(encoding='utf-8')
          phone_observation = (workflows / 'phone-release-observation.yml').read_text(encoding='utf-8')
          phone_operational = (workflows / 'phone-operational-observation.yml').read_text(encoding='utf-8')
          runtime_recovery = (workflows / 'phone-runtime-recovery.yml').read_text(encoding='utf-8')
          phone_reconcile = (workflows / 'phone-release-reconcile.yml').read_text(encoding='utf-8')
          phone_transport_preflight = (workflows / 'phone-transport-preflight.yml').read_text(encoding='utf-8')
          registry_path = Path('.github/production/command-control-registry.json')
          targets_path = Path('.github/production/targets.json')

          direct_ingress = sorted(
              path.name for path in workflows.glob('*.yml')
              if re.search(r'(?m)^  issue_comment:\s*$', path.read_text(encoding='utf-8'))
          )
          if direct_ingress != ['production-control-router.yml']:
              raise SystemExit('exactly one private Issue #1 ingress required: ' + repr(direct_ingress))

          required_router = (
              "github.event.repository.full_name == 'iamaman11/mobile-proxy-production'",
              'github.event.issue.number == 1',
              'github.event.comment.user.login == github.repository_owner',
              '.github/scripts/issue_command_router.py',
              '.github/scripts/dispatch_allowlisted_workflow.py',
              "needs.route.outputs.handler == 'dispatch_workflow'",
              "needs.route.outputs.read_only == 'true'",
              "needs.route.outputs.destructive == 'false'",
              "needs.route.outputs.handler == 'workflow_call'",
              "needs.route.outputs.route_id == 'observe-phone-release'",
              "needs.route.outputs.route_id == 'observe-phone-operational'",
              "needs.route.outputs.route_id == 'exercise-runtime-recovery'",
              "needs.route.outputs.route_id == 'reconcile-phone-release'",
              "needs.route.outputs.operation_class == 'RECONCILE'",
              "needs.route.outputs.route_id == 'phone-transport-preflight'",
              "needs.route.outputs.route_id == 'observe-runner-transport'",
              'source_comment_created_at: $' + '{{ github.event.comment.created_at }}',
              "needs.route.outputs.route_id == 'deploy-product-release'",
              "needs.route.outputs.route_id == 'recover-quarantined-product-release'",
              "needs.route.outputs.operation_class == 'RECOVER'",
              'name: Revalidate deployment request outputs against admitted route',
              'uses: ./.github/workflows/phone-release-observation.yml',
              'uses: ./.github/workflows/phone-operational-observation.yml',
              'uses: ./.github/workflows/phone-runtime-recovery.yml',
              'uses: ./.github/workflows/phone-release-reconcile.yml',
              'uses: ./.github/workflows/phone-transport-preflight.yml',
              'uses: ./.github/workflows/runner-transport-observation.yml',
              'uses: ./.github/workflows/release-deployment.yml',
              'uses: ./.github/workflows/quarantined-release-recovery.yml',
          )
          missing = [item for item in required_router if item not in router]
          if missing:
              raise SystemExit('sole router contract incomplete: ' + ', '.join(missing))
          expression_open = '$' + '{{'
          forbidden_router = (
              'actions/workflows/' + expression_open,
              '-f ref=' + expression_open,
              'secrets.',
              'runs-on: [self-hosted',
              ' adb ',
              'authority_cursor',
              'issue179-comment-',
          )
          present = [item for item in forbidden_router if item in router]
          if present:
              raise SystemExit('router gained forbidden capability: ' + ', '.join(present))

          build_marker = '      - name: Build existing cursor-free semantic deployment request'
          validate_marker = '      - name: Revalidate deployment request outputs against admitted route'
          execution_marker = '      - name: Build exact controller execution ACK'
          if not all(marker in router for marker in (build_marker, validate_marker, execution_marker)):
              raise SystemExit('deployment ACK output-validation step ordering markers missing')
          build_block = router.split(build_marker, 1)[1].split(validate_marker, 1)[0]
          if 'steps.command.outputs.' in build_block:
              raise SystemExit('deployment request step must not consume its own outputs')
          validate_block = router.split(validate_marker, 1)[1].split(execution_marker, 1)[0]
          for required in (
              'steps.command.outputs.target',
              'steps.command.outputs.release_tag',
              'needs.route.outputs.target',
              'needs.route.outputs.release_tag',
          ):
              if required not in validate_block:
                  raise SystemExit('deployment output-validation contract incomplete: ' + required)

          spec = importlib.util.spec_from_file_location('issue_command_router_acceptance', '.github/scripts/issue_command_router.py')
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load command classifier')
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          targets = module.validate_target_registry(json.loads(targets_path.read_text(encoding='utf-8')))
          routes = module.validate_registry(json.loads(registry_path.read_text(encoding='utf-8')), targets)
          active = [item for item in routes if item.get('enabled') is True]
          if {item['id'] for item in active} != {
              'observe-public-deployment-projection',
              'verify-product-release',
              'observe-phone-release',
              'observe-phone-operational',
              'exercise-runtime-recovery',
              'reconcile-phone-release',
              'phone-transport-preflight',
              'observe-runner-transport',
              'deploy-product-release',
              'runner-android-build-tools-bootstrap',
              'recover-quarantined-product-release',
          }:
              raise SystemExit('active route set differs')
          destructive = {item.get('id'): item for item in active if item.get('destructive') is True}
          if set(destructive) != {
              'deploy-product-release',
              'recover-quarantined-product-release',
              'exercise-runtime-recovery',
          }:
              raise SystemExit('unexpected destructive route set')
          deploy = destructive['deploy-product-release']
          if deploy.get('semantic_identity_policy') != 'existing-deployment-request-v2':
              raise SystemExit('deployment semantic identity drifted')
          if deploy.get('idempotency_policy') != 'durable-semantic-ledger':
              raise SystemExit('deployment idempotency drifted')
          if deploy.get('recovery_policy') != 'UNKNOWN-read-only-reconcile-no-blind-retry':
              raise SystemExit('deployment UNKNOWN recovery drifted')

          recover = destructive['recover-quarantined-product-release']
          if (
              recover.get('handler') != 'workflow_call'
              or recover.get('operation_class') != 'RECOVER'
              or recover.get('read_only') is not False
              or recover.get('requires_phone') is not True
              or recover.get('requires_vm') is not False
              or recover.get('requires_release') is not True
              or recover.get('allowed_targets') != ['phone-production']
              or recover.get('physical_domains') != ['runtime']
              or recover.get('authority_policy') != 'private-issue1-owner+controller-main-exact+exact-quarantined-v017+exact-prior-recovery-terminal'
              or recover.get('idempotency_policy') != 'single-run-attempt+bounded-lineage-generation+durable-semantic-quarantine-recovery-ledger'
              or recover.get('semantic_identity_policy') != 'quarantined-deployment-terminal+prior-recovery-terminal+command-arguments'
              or recover.get('recovery_policy') != 'UNKNOWN-no-blind-retry-owner-checkpoint-required'
              or recover.get('workflow') != '.github/workflows/quarantined-release-recovery.yml'
              or 'v0\\.1\\.7' not in recover.get('pattern', '')
              or '74489a27b4c845b9060056af498090beded81db009e05f0290091af846c4e5d7' not in recover.get('pattern', '')
          ):
              raise SystemExit('Stage 3 quarantine recovery route safety contract differs')

          verify = next((item for item in active if item.get('id') == 'verify-product-release'), None)
          if verify is None:
              raise SystemExit('Product Release admission route is missing')
          if (
              verify.get('handler') != 'dispatch_workflow'
              or verify.get('operation_class') != 'RELEASE_VERIFY'
              or verify.get('read_only') is not True
              or verify.get('destructive') is not False
              or verify.get('requires_phone') is not False
              or verify.get('requires_vm') is not False
              or verify.get('requires_release') is not True
              or verify.get('physical_domains') != []
              or verify.get('allowed_targets') != ['phone-production']
          ):
              raise SystemExit('Product Release admission route safety contract differs')

          observe = next((item for item in active if item.get('id') == 'observe-phone-release'), None)
          if observe is None:
              raise SystemExit('Stage 4 phone observation route is missing')
          if (
              observe.get('handler') != 'workflow_call'
              or observe.get('operation') != 'observe-phone-release'
              or observe.get('operation_class') != 'OBSERVE'
              or observe.get('read_only') is not True
              or observe.get('destructive') is not False
              or observe.get('requires_phone') is not True
              or observe.get('requires_vm') is not False
              or observe.get('requires_release') is not True
              or observe.get('allowed_targets') != ['phone-production']
              or observe.get('physical_domains') != []
              or observe.get('concurrency_domain') != 'production-target-phone-production'
              or observe.get('authority_policy') != 'private-issue1-owner+controller-main-exact+stage4-v017-phone-observation'
              or observe.get('workflow') != '.github/workflows/phone-release-observation.yml'
              or observe.get('ref_policy') != 'controller-event-sha-exact'
              or observe.get('pattern') != r'^/observe-phone-release (?P<target>phone-production) (?P<release>v0\.1\.7)$'
          ):
              raise SystemExit('Stage 4 phone observation route safety contract differs')

          operational = next((item for item in active if item.get('id') == 'observe-phone-operational'), None)
          if operational is None:
              raise SystemExit('Stage 4 phone operational observation route is missing')
          if (
              operational.get('handler') != 'workflow_call'
              or operational.get('operation') != 'observe-phone-operational'
              or operational.get('operation_class') != 'OBSERVE'
              or operational.get('read_only') is not True
              or operational.get('destructive') is not False
              or operational.get('requires_phone') is not True
              or operational.get('requires_vm') is not False
              or operational.get('requires_release') is not True
              or operational.get('allowed_targets') != ['phone-production']
              or operational.get('physical_domains') != []
              or operational.get('concurrency_domain') != 'production-target-phone-production'
              or operational.get('authority_policy') != 'private-issue1-owner+controller-main-exact+stage4-v017-phone-operational-observation'
              or operational.get('target_capability_policy') != 'phone-production-operational-observation'
              or operational.get('evidence_policy') != 'mandatory-bounded-phone-operational-observation'
              or operational.get('workflow') != '.github/workflows/phone-operational-observation.yml'
              or operational.get('ref_policy') != 'controller-event-sha-exact'
              or operational.get('pattern') != r'^/observe-phone-operational (?P<target>phone-production) (?P<release>v0\.1\.7)$'
          ):
              raise SystemExit('Stage 4 phone operational observation route safety contract differs')

          lifecycle = destructive['exercise-runtime-recovery']
          if (
              lifecycle.get('handler') != 'workflow_call'
              or lifecycle.get('operation') != 'exercise-runtime-recovery'
              or lifecycle.get('operation_class') != 'RECOVER'
              or lifecycle.get('read_only') is not False
              or lifecycle.get('destructive') is not True
              or lifecycle.get('requires_phone') is not True
              or lifecycle.get('requires_vm') is not False
              or lifecycle.get('requires_release') is not True
              or lifecycle.get('allowed_targets') != ['phone-production']
              or lifecycle.get('physical_domains') != ['runtime']
              or lifecycle.get('concurrency_domain') != 'production-target-phone-production'
              or lifecycle.get('authority_policy') != 'private-issue1-owner+controller-main-exact+stage4-v017-fixed-runtime-recovery-exercise'
              or lifecycle.get('target_capability_policy') != 'phone-production-fixed-runtime-recovery-exercise'
              or lifecycle.get('evidence_policy') != 'LIFECYCLE_TERMINAL+EXACT_RELEASE_POSTCONDITION+OPERATIONAL_POSTCONDITION'
              or lifecycle.get('idempotency_policy') != 'single-semantic-command-attempt+no-automatic-retry'
              or lifecycle.get('semantic_identity_policy') != 'source-comment-id+command-arguments'
              or lifecycle.get('recovery_policy') != 'UNKNOWN-no-blind-retry-owner-checkpoint-required'
              or lifecycle.get('workflow') != '.github/workflows/phone-runtime-recovery.yml'
              or lifecycle.get('ref_policy') != 'controller-event-sha-exact'
              or lifecycle.get('pattern') != r'^/exercise-runtime-recovery (?P<target>phone-production) (?P<release>v0\.1\.7)$'
          ):
              raise SystemExit('Stage 4 runtime recovery route safety contract differs')

          reconcile = next((item for item in active if item.get('id') == 'reconcile-phone-release'), None)
          if reconcile is None:
              raise SystemExit('Stage 4 phone reconcile route is missing')
          if (
              reconcile.get('handler') != 'workflow_call'
              or reconcile.get('operation') != 'reconcile-phone-release'
              or reconcile.get('operation_class') != 'RECONCILE'
              or reconcile.get('read_only') is not False
              or reconcile.get('destructive') is not False
              or reconcile.get('requires_phone') is not True
              or reconcile.get('requires_vm') is not False
              or reconcile.get('requires_release') is not True
              or reconcile.get('allowed_targets') != ['phone-production']
              or reconcile.get('physical_domains') != []
              or reconcile.get('concurrency_domain') != 'production-target-phone-production'
              or reconcile.get('authority_policy') != 'private-issue1-owner+controller-main-exact+stage4-v017-target-read-only-reconcile'
              or reconcile.get('semantic_identity_policy') != 'command-arguments+existing-admitted-projection'
              or reconcile.get('idempotency_policy') != 'projection-readback-noop'
              or reconcile.get('workflow') != '.github/workflows/phone-release-reconcile.yml'
              or reconcile.get('ref_policy') != 'controller-event-sha-exact'
              or reconcile.get('pattern') != r'^/reconcile-phone-release (?P<target>phone-production) (?P<release>v0\.1\.7)$'
          ):
              raise SystemExit('Stage 4 phone reconcile route safety contract differs')

          transport_preflight = next((item for item in active if item.get('id') == 'phone-transport-preflight'), None)
          if transport_preflight is None:
              raise SystemExit('Stage 4 phone transport preflight route is missing')
          if (
              transport_preflight.get('handler') != 'workflow_call'
              or transport_preflight.get('operation') != 'phone-transport-preflight'
              or transport_preflight.get('operation_class') != 'DIAGNOSTIC'
              or transport_preflight.get('read_only') is not True
              or transport_preflight.get('destructive') is not False
              or transport_preflight.get('requires_phone') is not True
              or transport_preflight.get('requires_vm') is not False
              or transport_preflight.get('requires_release') is not False
              or transport_preflight.get('allowed_targets') != []
              or transport_preflight.get('physical_domains') != []
              or transport_preflight.get('concurrency_domain') != 'production-phone-read-only-preflight'
              or transport_preflight.get('authority_policy') != 'private-issue1-owner+controller-main-exact+registered-phone-read-only'
              or transport_preflight.get('workflow') != '.github/workflows/phone-transport-preflight.yml'
              or transport_preflight.get('ref_policy') != 'controller-event-sha-exact'
              or transport_preflight.get('pattern') != r'^/phone-transport-preflight$'
          ):
              raise SystemExit('Stage 4 phone transport preflight route safety contract differs')

          runner_transport = next((item for item in active if item.get('id') == 'observe-runner-transport'), None)
          if runner_transport is None:
              raise SystemExit('Stage 4 runner transport observation route is missing')
          if (
              runner_transport.get('handler') != 'workflow_call'
              or runner_transport.get('operation') != 'observe-runner-transport'
              or runner_transport.get('operation_class') != 'DIAGNOSTIC'
              or runner_transport.get('read_only') is not True
              or runner_transport.get('destructive') is not False
              or runner_transport.get('requires_phone') is not False
              or runner_transport.get('requires_vm') is not False
              or runner_transport.get('requires_release') is not False
              or runner_transport.get('allowed_targets') != []
              or runner_transport.get('physical_domains') != []
              or runner_transport.get('concurrency_domain') != 'production-runner-transport-observation'
              or runner_transport.get('authority_policy') != 'private-issue1-owner+controller-main-exact+stage4-runner-transport-read-only'
              or runner_transport.get('target_capability_policy') != 'runner-transport-read-only'
              or runner_transport.get('evidence_policy') != 'mandatory-bounded-runner-transport-observation-artifact-round-trip'
              or runner_transport.get('workflow') != '.github/workflows/runner-transport-observation.yml'
              or runner_transport.get('ref_policy') != 'controller-event-sha-exact'
              or runner_transport.get('pattern') != r'^/observe-runner-transport$'
          ):
              raise SystemExit('Stage 4 runner transport observation route safety contract differs')

          if targets['phone-production'].get('active') is not True:
              raise SystemExit('phone target is not active')
          if targets['phone-production'].get('serialization_domain') != 'production-target-phone-production':
              raise SystemExit('phone target serialization drifted')
          if targets['phone-production'].get('allowed_operations') != [
              'deploy-product-release',
              'verify-product-release',
              'observe-phone-release',
              'observe-phone-operational',
              'exercise-runtime-recovery',
              'reconcile-phone-release',
              'phone-transport-preflight',
              'recover-quarantined-product-release',
          ]:
              raise SystemExit('phone target operation allowlist differs')
          if targets['vm-production'].get('active') is not False or targets['vm-production'].get('adapter') != 'deferred':
              raise SystemExit('VM target is not fail-closed/deferred')
          if targets['vm-production'].get('allowed_operations') != ['deploy-product-release']:
              raise SystemExit('VM target operation allowlist drifted')

          required_admission = (
              'workflow_dispatch:',
              'runs-on: ubuntu-latest',
              'from release_resolver import resolve_release',
              'resolve_release(tag=release_tag, target=target)',
              'PRODUCT_RELEASE_ADMISSION_ACCEPTED',
              '"phone_access": False',
              '"deployment_created": False',
              '"deployment_intent_created": False',
          )
          missing = [item for item in required_admission if item not in admission]
          if missing:
              raise SystemExit('Product Release admission proof contract incomplete: ' + ', '.join(missing))
          forbidden_admission = (
              'environment:',
              'secrets.',
              'self-hosted',
              'android-production',
              ' adb ',
              'prepare_release_deployment',
              'finalize_deployment_projection',
              'release-deployment.yml',
              'deployments_url',
              '/deploy ',
              'com.mobileproxy.app',
              'com.example.mobileproxy',
          )
          present = [item for item in forbidden_admission if item in admission]
          if present:
              raise SystemExit('Product Release admission proof gained forbidden capability or duplicate package authority: ' + ', '.join(present))

          for required in (
              'workflow_call:',
              "command != '/observe-phone-release phone-production v0.1.7'",
              "SOURCE_ISSUE_NUMBER'] != '1'",
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production',
              'cancel-in-progress: false',
              'environment: phone-production',
              '.github/scripts/observe_phone_release.py',
              'STAGE4_PHONE_RELEASE_OBSERVATION_CLASSIFIED',
              'export MOBILE_PROXY_RUNTIME_CACHE_DIR="$RUNNER_TOOL_CACHE/mobile-proxy-runtime-cache"',
          ):
              if required not in phone_observation:
                  raise SystemExit('Stage 4 phone observation workflow invariant missing: ' + required)
          for forbidden in (
              'workflow_dispatch:',
              'issue_comment:',
              'dispatch_release_once',
              'dispatch_install_once',
              'enrich_phone_runtime_operational.py',
              'observe_phone_operational.py',
          ):
              if forbidden in phone_observation:
                  raise SystemExit('Stage 4 phone observation workflow gained forbidden ingress/mutation/operational coupling: ' + forbidden)

          for required in (
              'workflow_call:',
              "os.environ['COMMAND'] != '/observe-phone-operational phone-production v0.1.7'",
              "SOURCE_ISSUE_NUMBER'] != '1'",
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-target-phone-production',
              'cancel-in-progress: false',
              'environment: phone-production',
              '.github/scripts/observe_phone_operational.py',
              'stage4-phone-operational-observation.v1',
              "'READY', 'DEGRADED', 'UNKNOWN'",
              'exact_phone_release_state_observed',
              'phone_mutation_performed',
              'provider_mutation_performed',
              'if-no-files-found: error',
          ):
              if required not in phone_operational:
                  raise SystemExit('Stage 4 phone operational workflow invariant missing: ' + required)
          for forbidden in (
              'workflow_dispatch:',
              'issue_comment:',
              '.github/scripts/observe_phone_release.py',
