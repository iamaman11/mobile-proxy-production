name: Production Android filesystem mutation certification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  command-gate:
    name: Validate filesystem certification command and prepare canonical source
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-filesystem-cert ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      quality_run_id: ${{ steps.command.outputs.quality_run_id }}
      operation_transaction_id: ${{ steps.command.outputs.operation_transaction_id }}
    steps:
      - name: Validate exact command, canonical main SHA, and Quality
        id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          command = os.environ.get('COMMAND', '').strip()
          match = re.fullmatch(r'/phone-filesystem-cert ([0-9a-f]{40})', command)
          if match is None:
              raise SystemExit('invalid filesystem certification command')
          requested_sha = match.group(1)

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'mobile-proxy-production-filesystem-certification',
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          canonical_main = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/commits/main'
          )['sha']
          if requested_sha != canonical_main:
              raise SystemExit('requested SHA is not current canonical main')

          query = urllib.parse.urlencode(
              {'head_sha': requested_sha, 'status': 'completed', 'per_page': 100}
          )
          runs = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?' + query
          ).get('workflow_runs', [])
          quality = [
              run for run in runs
              if run.get('name') == 'Quality'
              and run.get('head_sha') == requested_sha
              and run.get('conclusion') == 'success'
          ]
          if not quality:
              raise SystemExit('exact canonical SHA has no successful Quality run')
          quality.sort(key=lambda run: (run.get('run_attempt', 0), run.get('id', 0)), reverse=True)
          operation_transaction_id = (
              f"fs-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={requested_sha}\n')
              handle.write(f"quality_run_id={quality[0]['id']}\n")
              handle.write(f'operation_transaction_id={operation_transaction_id}\n')
          PY

      - name: Checkout exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ steps.command.outputs.canonical_sha }}
          path: canonical
          persist-credentials: false

      - name: Build immutable filesystem certification source bundle
        shell: bash
        env:
          CANONICAL_SHA: ${{ steps.command.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ steps.command.outputs.quality_run_id }}
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "${CANONICAL_SHA}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-source'
          root.mkdir(parents=True, exist_ok=False)
          scripts = (
              'run_private_phone_preflight.py',
              'run_android_capability_inventory.py',
              'android_filesystem_comparator.py',
              'run_android_filesystem_certification.py',
          )
          digests = {}
          for name in scripts:
              source = Path('canonical/scripts') / name
              if not source.is_file():
                  raise SystemExit(f'canonical source missing: {name}')
              target = root / name
              shutil.copyfile(source, target)
              digests[name] = hashlib.sha256(target.read_bytes()).hexdigest()

          manifest = {
              'format_version': 1,
              'repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'scripts_sha256': digests,
          }
          (root / 'source-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload immutable filesystem certification source
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-source-${{ steps.command.outputs.canonical_sha }}
          path: ${{ runner.temp }}/phone-filesystem-source
          if-no-files-found: error
          retention-days: 1

  certify-filesystem:
    name: Globally serialized Android filesystem mutation certification
    needs: command-gate
    if: ${{ needs.command-gate.result == 'success' }}
    concurrency:
      group: production-phone-global-mutation
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 10
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
      TRANSACTION_ID: ${{ needs.command-gate.outputs.operation_transaction_id }}
    outputs:
      state: ${{ steps.result.outputs.state }}
      accepted: ${{ steps.result.outputs.accepted }}
      cleanup_verified: ${{ steps.result.outputs.cleanup_verified }}
      selection_before_mutation: ${{ steps.result.outputs.selection_before_mutation }}
      scratch_selected: ${{ steps.result.outputs.scratch_selected }}
      scratch_state: ${{ steps.result.outputs.scratch_state }}
      managed_selected: ${{ steps.result.outputs.managed_selected }}
      managed_state: ${{ steps.result.outputs.managed_state }}
    steps:
      - name: Download immutable canonical filesystem logic
        uses: actions/download-artifact@v4
        with:
          name: phone-filesystem-source-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-filesystem-source

      - name: Verify source bundle before device mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-source'
          manifest = json.loads((root / 'source-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('format_version') != 1:
              raise SystemExit('unsupported source manifest')
          if manifest.get('repository') != 'iamaman11/mobile-proxy':
              raise SystemExit('source repository differs')
          if manifest.get('canonical_sha') != os.environ['CANONICAL_SHA']:
              raise SystemExit('source canonical SHA differs')
          if manifest.get('quality_run_id') != int(os.environ['QUALITY_RUN_ID']):
              raise SystemExit('source Quality authority differs')
          expected = manifest.get('scripts_sha256')
          required = {
              'run_private_phone_preflight.py',
              'run_android_capability_inventory.py',
              'android_filesystem_comparator.py',
              'run_android_filesystem_certification.py',
          }
          if not isinstance(expected, dict) or set(expected) != required:
              raise SystemExit('source script set differs')
          for name, digest in expected.items():
              path = root / name
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'source digest differs: {name}')
          PY

      - name: Build bounded CONTROL mutation dispatch intent
        id: dispatch-intent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import re
          from pathlib import Path

          operation_transaction_id = os.environ['TRANSACTION_ID']
          if re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,95}', operation_transaction_id) is None:
              raise SystemExit('operation transaction identity is invalid')
          serial = os.environ.get('ANDROID_PRODUCTION_SERIAL', '')
          binding_key = os.environ.get('ANDROID_TARGET_BINDING_KEY', '')
          if not serial:
              raise SystemExit('registered production target binding is unavailable')
          if len(binding_key) < 32:
              raise SystemExit('target binding HMAC key is unavailable or too short')
          if binding_key == serial:
              raise SystemExit('target binding HMAC key must be independent from raw device binding')
          message = b'android-production\0' + serial.encode('utf-8')
          target_binding_id = (
              'tb-hmac-sha256:'
              + hmac.new(binding_key.encode('utf-8'), message, hashlib.sha256).hexdigest()
          )
          marker = {
              'format_version': 1,
              'evidence_type': 'MUTATION_DISPATCH_INTENT',
              'authority': 'CONTROL',
              'lifecycle': 'CURRENT',
              'private_repository': os.environ['GITHUB_REPOSITORY'],
              'private_sha': os.environ['GITHUB_SHA'],
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'canonical_quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'operation_id': 'android.filesystem-certification.v1',
              'operation_transaction_id': operation_transaction_id,
              'destructive_step_id': 'scratch_roundtrip',
              'target': 'android-production',
              'target_binding_id': target_binding_id,
              'target_binding_algorithm': 'HMAC-SHA256(ANDROID_TARGET_BINDING_KEY, target+serial)',
              'affected_domain_generations': {'domain/filesystem': operation_transaction_id},
              'dispatch_may_reach_target': True,
              'adapter_invocation_allowed_only_after_persistence': True,
              'blind_retry_allowed': False,
              'raw_device_identifier_recorded': False,
              'phone_mutation_performed': False,
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'filesystem-mutation-dispatch-intent.json'
          path.write_text(json.dumps(marker, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Persist CONTROL mutation dispatch intent before adapter invocation
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-dispatch-intent-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/filesystem-mutation-dispatch-intent.json
          if-no-files-found: error
          retention-days: 90

      - name: Run bounded filesystem mutation transaction
        id: certify
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/phone-filesystem-source/run_android_filesystem_certification.py" \
            --canonical-sha "${CANONICAL_SHA}" \
            --transaction-id "${TRANSACTION_ID}" \
            --output "${RUNNER_TEMP}/phone-filesystem-certification.json"

      - name: Export bounded filesystem result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-certification.json'
          values = {
              'state': 'UNOBSERVED',
              'accepted': False,
              'cleanup_verified': False,
              'selection_before_mutation': False,
              'scratch_selected': 'unobserved',
              'scratch_state': 'unobserved',
              'managed_selected': 'unobserved',
              'managed_state': 'unobserved',
          }
          if path.is_file():
              evidence = json.loads(path.read_text(encoding='utf-8'))
              admission = evidence.get('comparator_admission')
              if isinstance(admission, dict):
                  scratch = admission.get('scratch')
                  managed = admission.get('managed_root')
                  values['selection_before_mutation'] = (
                      admission.get('selection_before_mutation') is True
                  )
                  if isinstance(scratch, dict):
                      values['scratch_selected'] = str(
                          scratch.get('selected_comparator', 'unobserved')
                      )
                      values['scratch_state'] = str(
                          scratch.get('canonical_comparator_path_state', 'unobserved')
                      )
                  if isinstance(managed, dict):
                      values['managed_selected'] = str(
                          managed.get('selected_comparator', 'unobserved')
                      )
                      values['managed_state'] = str(
                          managed.get('canonical_comparator_path_state', 'unobserved')
                      )
              values['state'] = str(evidence.get('state', 'UNOBSERVED'))
              values['accepted'] = evidence.get('accepted') is True
              values['cleanup_verified'] = evidence.get('cleanup_verified') is True

          selected_values = {'cmp', 'toybox_cmp', 'busybox_cmp', 'NONE', 'UNKNOWN', 'unobserved'}
          state_values = {'SUPPORTED', 'UNSUPPORTED', 'UNKNOWN', 'unobserved'}
          if values['scratch_selected'] not in selected_values:
              raise SystemExit('filesystem certification scratch comparator enum is invalid')
          if values['managed_selected'] not in selected_values:
              raise SystemExit('filesystem certification managed comparator enum is invalid')
          if values['scratch_state'] not in state_values:
              raise SystemExit('filesystem certification scratch comparator state is invalid')
          if values['managed_state'] not in state_values:
              raise SystemExit('filesystem certification managed comparator state is invalid')
          if values['accepted']:
              if values['state'] != 'ACCEPTED':
                  raise SystemExit('accepted filesystem certification has non-ACCEPTED state')
              if not values['selection_before_mutation']:
                  raise SystemExit('accepted filesystem certification lacks pre-mutation comparator admission')
              if values['scratch_state'] != 'SUPPORTED' or values['managed_state'] != 'SUPPORTED':
                  raise SystemExit('accepted filesystem certification lacks supported comparator paths')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"state={values['state']}\n")
              handle.write(f"accepted={str(values['accepted']).lower()}\n")
              handle.write(f"cleanup_verified={str(values['cleanup_verified']).lower()}\n")
              handle.write(
                  f"selection_before_mutation={str(values['selection_before_mutation']).lower()}\n"
              )
              handle.write(f"scratch_selected={values['scratch_selected']}\n")
              handle.write(f"scratch_state={values['scratch_state']}\n")
              handle.write(f"managed_selected={values['managed_selected']}\n")
              handle.write(f"managed_state={values['managed_state']}\n")
          if values['state'] == 'QUARANTINED':
              raise SystemExit('filesystem certification cleanup is not proven')
          PY

      - name: Upload bounded filesystem certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-certification-${{ env.CANONICAL_SHA }}-${{ env.TRANSACTION_ID }}
          path: ${{ runner.temp }}/phone-filesystem-certification.json
          if-no-files-found: warn
          retention-days: 30

      - name: Require accepted certification
        if: always()
        shell: bash
        env:
          ACCEPTED: ${{ steps.result.outputs.accepted }}
          STATE: ${{ steps.result.outputs.state }}
        run: |
          set -euo pipefail
          test "${ACCEPTED}" = true || {
            echo "filesystem mutation certification not accepted: state=${STATE}" >&2
            exit 1
          }

  report:
    name: Publish bounded filesystem mutation classification
    if: always() && needs.command-gate.result != 'skipped'
    needs: [command-gate, certify-filesystem]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment bounded result on control issue
        uses: actions/github-script@v7
        env:
          CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
          OPERATION_TRANSACTION_ID: ${{ needs.command-gate.outputs.operation_transaction_id }}
          JOB_RESULT: ${{ needs.certify-filesystem.result }}
          STATE: ${{ needs.certify-filesystem.outputs.state }}
          ACCEPTED: ${{ needs.certify-filesystem.outputs.accepted }}
          CLEANUP_VERIFIED: ${{ needs.certify-filesystem.outputs.cleanup_verified }}
          SELECTION_BEFORE_MUTATION: ${{ needs.certify-filesystem.outputs.selection_before_mutation }}
          SCRATCH_SELECTED: ${{ needs.certify-filesystem.outputs.scratch_selected }}
          SCRATCH_STATE: ${{ needs.certify-filesystem.outputs.scratch_state }}
          MANAGED_SELECTED: ${{ needs.certify-filesystem.outputs.managed_selected }}
          MANAGED_STATE: ${{ needs.certify-filesystem.outputs.managed_state }}
        with:
          script: |
            const state = process.env.STATE || 'UNOBSERVED';
            const markerName = `phone-filesystem-dispatch-intent-${process.env.CANONICAL_SHA}-${process.env.OPERATION_TRANSACTION_ID}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const markers = artifacts.filter((artifact) => artifact.name === markerName && artifact.expired === false);
            if (markers.length > 1) {
              throw new Error('filesystem dispatch intent artifact is ambiguous');
            }
            const markerPersisted = markers.length === 1;
            let classification = 'FILESYSTEM_MUTATION_UNOBSERVED';
            if (process.env.ACCEPTED === 'true' && state === 'ACCEPTED') {
              classification = 'FILESYSTEM_MUTATION_PROVEN';
            } else if (state === 'RECOVERED' && process.env.CLEANUP_VERIFIED === 'true') {
              classification = 'FILESYSTEM_MUTATION_RECOVERED';
            } else if (state === 'QUARANTINED') {
              classification = 'FILESYSTEM_MUTATION_QUARANTINED';
            } else if (state === 'REFUSED') {
              classification = 'FILESYSTEM_MUTATION_REFUSED';
            } else if (markerPersisted && state === 'UNOBSERVED') {
              classification = 'UNKNOWN_EXECUTION_OUTCOME';
            }
            const body = [
              '## CONTROL ANDROID FILESYSTEM MUTATION RESULT',
              '',
              `- classification: **${classification}**`,
              `- canonical_sha: \`${process.env.CANONICAL_SHA || 'unavailable'}\``,
              `- quality_run_id: \`${process.env.QUALITY_RUN_ID || 'unavailable'}\``,
              `- operation_transaction_id: \`${process.env.OPERATION_TRANSACTION_ID || 'unavailable'}\``,
              `- workflow_run_id: \`${context.runId}\``,
              `- certification_job_result: \`${process.env.JOB_RESULT}\``,
              `- dispatch_intent_persisted: \`${markerPersisted}\``,
              `- domain/filesystem_generation: \`${markerPersisted ? process.env.OPERATION_TRANSACTION_ID : 'unadvanced'}\``,
              `- blind_retry_allowed: \`false\``,
              `- transaction_state: \`${state}\``,
              `- accepted: \`${process.env.ACCEPTED || 'false'}\``,
              `- cleanup_verified: \`${process.env.CLEANUP_VERIFIED || 'false'}\``,
              `- comparator_selection_before_mutation: \`${process.env.SELECTION_BEFORE_MUTATION || 'false'}\``,
              `- scratch_selected_comparator: \`${process.env.SCRATCH_SELECTED || 'unobserved'}\``,
              `- scratch_comparator_path_state: \`${process.env.SCRATCH_STATE || 'unobserved'}\``,
              `- managed_selected_comparator: \`${process.env.MANAGED_SELECTED || 'unobserved'}\``,
              `- managed_comparator_path_state: \`${process.env.MANAGED_STATE || 'unobserved'}\``,
              '- mutation_scope: `transaction-scoped adapter test namespaces only`',
              '- package_mutation_performed: `false`',
              '- runtime_lifecycle_mutation_performed: `false`',
              '- raw_device_identifier_recorded: `false`',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });