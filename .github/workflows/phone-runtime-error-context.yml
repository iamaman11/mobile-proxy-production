name: Production phone sanitized runtime error context

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  command-gate:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-runtime-error-context ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
    steps:
      - id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          match = re.fullmatch(r"/phone-runtime-error-context ([0-9a-f]{40})", os.environ.get("COMMAND", "").strip())
          if match is None:
              raise SystemExit("invalid command")
          requested = match.group(1)
          req = urllib.request.Request(
              "https://api.github.com/repos/iamaman11/mobile-proxy/commits/main",
              headers={"Accept":"application/vnd.github+json","User-Agent":"mobile-proxy-production-runtime-error-context"},
          )
          with urllib.request.urlopen(req, timeout=10) as response:
              current = json.load(response)["sha"]
          if requested != current:
              raise SystemExit("requested SHA is not current canonical main")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={requested}\n")
          PY

  diagnostic:
    needs: command-gate
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 5
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
    steps:
      - name: Fetch exact canonical registered-device preflight
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/iamaman11/mobile-proxy/${CANONICAL_SHA}/scripts/run_private_phone_preflight.py" \
            --output "${RUNNER_TEMP}/run_private_phone_preflight.py"

      - name: Emit sanitized error context only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os, re, subprocess
          from pathlib import Path

          serial = os.environ["ANDROID_PRODUCTION_SERIAL"]
          spec = importlib.util.spec_from_file_location("preflight", Path(os.environ["RUNNER_TEMP"]) / "run_private_phone_preflight.py")
          preflight = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(preflight)
          preflight.require_canonical_sha(os.environ["CANONICAL_SHA"])
          preflight.require_expected_serial()
          preflight.prove_registered_device(serial)

          result = subprocess.run(
              ["adb","-s",serial,"shell","su","0","sh","-c",'tail -n 240 /data/adb/mobile-proxy-node/logs/runtime-supervisor.log 2>/dev/null || true'],
              check=False, capture_output=True, text=True, timeout=20,
          )
          if result.returncode != 0:
              raise SystemExit("read-only runtime log probe failed")

          lines = []
          for raw in result.stdout.splitlines():
              if not re.search(r"permission denied|operation not permitted|error:|failed|denied", raw, re.I):
                  continue
              line = raw[:800]
              line = re.sub(r"https?://\S+", "<url>", line)
              line = re.sub(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", "<ip>", line)
              line = re.sub(r"(?i)(password|token|secret|authorization|username)([=: ]+)[^ ,;]+", r"\1\2<redacted>", line)
              line = re.sub(r"\b[A-Za-z0-9_\-+/=]{32,}\b", "<redacted-long-value>", line)
              lines.append(line)
          bounded = lines[-12:]
          Path(os.environ["RUNNER_TEMP"], "sanitized-runtime-error-context.json").write_text(
              json.dumps({
                  "sanitized_runtime_error_line_count": len(lines),
                  "sanitized_runtime_error_lines": bounded,
                  "raw_runtime_log_recorded": False,
                  "raw_device_identifier_recorded": False,
                  "phone_mutation_performed": False,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"sanitized_runtime_error_line_count={len(lines)}")
          for line in bounded:
              print("sanitized_runtime_error: " + line)
          print("raw_runtime_log_recorded=false raw_device_identifier_recorded=false phone_mutation_performed=false")
          PY

      - name: Upload sanitized error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-runtime-error-context-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sanitized-runtime-error-context.json
          if-no-files-found: warn
          retention-days: 30

      - name: Post sanitized audit context
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CANONICAL_SHA_SAFE: ${{ env.CANONICAL_SHA }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "sanitized-runtime-error-context.json"
          body_lines = [
              f"SANITIZED RUNTIME ERROR CONTEXT — run `{os.environ['RUN_ID']}`",
              "",
              f"- canonical SHA: `{os.environ['CANONICAL_SHA_SAFE']}`",
          ]
          if path.is_file():
              state = json.loads(path.read_text(encoding="utf-8"))
              body_lines.append(f"- sanitized matching line count: `{state['sanitized_runtime_error_line_count']}`")
              body_lines.append("- sanitized recent matching lines:")
              for line in state["sanitized_runtime_error_lines"]:
                  body_lines.append("  - `" + str(line).replace("`", "'") + "`")
              body_lines.extend([
                  "- raw runtime log recorded: `False`",
                  "- raw device identifier recorded: `False`",
                  "- phone mutation performed: `False`",
              ])
          else:
              body_lines.append("- sanitized snapshot: `unavailable`")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=json.dumps({"body":"\n".join(body_lines)}).encode("utf-8"),
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type":"application/json",
                  "User-Agent":"mobile-proxy-production-runtime-error-context",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 201):
                  raise SystemExit("failed to post sanitized runtime error context")
          PY
