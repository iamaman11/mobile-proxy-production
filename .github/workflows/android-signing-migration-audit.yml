name: Production Android signing-generation migration audit checkpoint

on:
  workflow_run:
    workflows:
      - Production Android 0.1.4 signing-generation migration
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Record bounded migration run checkpoint
    if: >-
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Derive canonical pin from exact migration source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          source_sha = os.environ["SOURCE_RUN_SHA"]
          path = ".github/workflows/android-signing-migration.yml"
          url = (
              f"https://api.github.com/repos/{repository}/contents/"
              f"{urllib.parse.quote(path, safe='/')}?ref={source_sha}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "mobile-proxy-production-migration-audit",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.load(response)
          raw = base64.b64decode(payload["content"]).decode("utf-8")
          matches = re.findall(
              r"^\s*PINNED_CANONICAL_SHA:\s*([0-9a-f]{40})\s*$",
              raw,
              re.MULTILINE,
          )
          if len(matches) != 1:
              raise SystemExit("exact migration canonical pin is unavailable or ambiguous")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={matches[0]}\n")
          PY

      - name: Post safe private execution checkpoint
        shell: bash
        env:
          CANONICAL_SHA: ${{ steps.source.outputs.canonical_sha }}
        run: |
          set -euo pipefail
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body "ANDROID 0.1.4 SIGNING-GENERATION MIGRATION CHECKPOINT — run \`${SOURCE_RUN_ID}\`

          - private execution SHA: \`${SOURCE_RUN_SHA}\`
          - canonical public SHA: \`${CANONICAL_SHA}\`
          - canonical pin source: exact private migration workflow revision
          - migration workflow conclusion: \`${SOURCE_CONCLUSION}\`
          - command source: owner-only private Issue #1 gate
          - migration authority: exact protected SHA + retained signed candidate
          - final public v0.1.4 tag required: false
          - signing secrets exposed to phone job: false
          - device identifier recorded: false
          - signer fingerprint recorded: false
          - provider credentials requested: false"
