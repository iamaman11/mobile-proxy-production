name: Stage 4 exact phone Product Release reconcile

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      target:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_issue_number:
        required: true
        type: number
      source_comment_id:
        required: true
        type: number
      source_actor:
        required: true
        type: string
      source_comment_url:
        required: true
        type: string
    secrets:
      ANDROID_PRODUCTION_SERIAL:
        required: true
      ANDROID_TARGET_BINDING_KEY:
        required: true
      MOBILE_PROXY_ADMIN_TOKEN:
        required: true
      MOBILE_PROXY_DEVICE_TOKEN:
        required: true
      MOBILE_PROXY_UI_TOKEN:
        required: true
      MOBILE_PROXY_RELAY_USER:
        required: true
      MOBILE_PROXY_RELAY_PASSWORD:
        required: true
      MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64:
        required: true
      PUBLIC_DEPLOYMENTS_TOKEN:
        required: true

permissions:
  contents: read
  issues: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  admit:
    name: Admit exact Issue 1 Stage 4 reconcile without phone access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out exact Controller comment-event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate sole-ingress provenance and immutable Stage 4 Release
        id: release
        env:
          COMMAND: ${{ inputs.command }}
          TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ISSUE_NUMBER: ${{ inputs.source_issue_number }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
          SOURCE_ACTOR: ${{ inputs.source_actor }}
          SOURCE_COMMENT_URL: ${{ inputs.source_comment_url }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          command = os.environ['COMMAND']
          target = os.environ['TARGET']
          release_tag = os.environ['RELEASE_TAG']
          if command != '/reconcile-phone-release phone-production v0.1.7':
              raise SystemExit('Stage 4 reconcile command differs from exact Issue #1 contract')
          if target != 'phone-production' or release_tag != 'v0.1.7':
              raise SystemExit('Stage 4 reconcile admission differs from phone-production@v0.1.7')
          if os.environ['SOURCE_ISSUE_NUMBER'] != '1':
              raise SystemExit('Stage 4 reconcile source Issue differs')
          if os.environ['SOURCE_ACTOR'] != os.environ['EXPECTED_OWNER']:
              raise SystemExit('Stage 4 reconcile source actor is not repository owner')
          try:
              comment_id = int(os.environ['SOURCE_COMMENT_ID'])
          except ValueError as exc:
              raise SystemExit('Stage 4 reconcile source comment id is invalid') from exc
          if comment_id <= 0:
              raise SystemExit('Stage 4 reconcile source comment id is invalid')
          expected_url = (
              'https://github.com/iamaman11/mobile-proxy-production/issues/1#issuecomment-'
              + str(comment_id)
          )
          if os.environ['SOURCE_COMMENT_URL'] != expected_url:
              raise SystemExit('Stage 4 reconcile source comment URL differs')

          sys.path.insert(0, str(Path('.github/controller').resolve()))
          from release_resolver import resolve_release

          admitted = resolve_release(tag=release_tag, target=target)
          if admitted.identity.tag != release_tag or admitted.identity.immutable is not True:
              raise SystemExit('Stage 4 reconcile Product Release admission differs')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"source_sha={admitted.identity.source_sha}\n")
          print(
              'STAGE4_PHONE_RELEASE_RECONCILE_ADMISSION_ACCEPTED '
              f"release={release_tag} source_sha={admitted.identity.source_sha} "
              f"source_comment_id={comment_id} phone_access=false projection_write=false"
          )
          PY

  reconcile-phone:
    name: Observe exact phone then reconcile existing projection only
    needs: admit
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 20
    concurrency:
      group: production-target-phone-production
      cancel-in-progress: false
    environment: phone-production
    env:
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
      MOBILE_PROXY_ADMIN_TOKEN: ${{ secrets.MOBILE_PROXY_ADMIN_TOKEN }}
      MOBILE_PROXY_DEVICE_TOKEN: ${{ secrets.MOBILE_PROXY_DEVICE_TOKEN }}
      MOBILE_PROXY_UI_TOKEN: ${{ secrets.MOBILE_PROXY_UI_TOKEN }}
      MOBILE_PROXY_RELAY_USER: ${{ secrets.MOBILE_PROXY_RELAY_USER }}
      MOBILE_PROXY_RELAY_PASSWORD: ${{ secrets.MOBILE_PROXY_RELAY_PASSWORD }}
      MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64: ${{ secrets.MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64 }}
      PUBLIC_DEPLOYMENTS_TOKEN: ${{ secrets.PUBLIC_DEPLOYMENTS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact Controller comment-event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact admitted PRODUCT source for digest and render verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ needs.admit.outputs.source_sha }}
          path: product-source
          persist-credentials: false

      - name: Require exact user-local Rust toolchain before Product digest/render
        shell: bash
        run: |
          set -euo pipefail
          CARGO_HOME="${HOME}/.cargo"
          RUSTUP_HOME="${HOME}/.rustup"
          PATH="${CARGO_HOME}/bin:${PATH}"
          export CARGO_HOME RUSTUP_HOME PATH
          test "$CARGO_HOME" = "${HOME}/.cargo"
          test "$RUSTUP_HOME" = "${HOME}/.rustup"
          test "$(command -v cargo)" = "$CARGO_HOME/bin/cargo"
          test "$(command -v rustc)" = "$CARGO_HOME/bin/rustc"
          "$CARGO_HOME/bin/cargo" --version | grep -Eq '^cargo 1\.95\.0([[:space:]]|$)'
          "$CARGO_HOME/bin/rustc" --version | grep -Eq '^rustc 1\.95\.0([[:space:]]|$)'
          (
            cd product-source
            "$CARGO_HOME/bin/cargo" metadata --format-version 1 --locked --no-deps >/dev/null
            git diff --check
            test -z "$(git status --porcelain --untracked-files=no)"
          )
          {
            printf 'CARGO_HOME=%s\n' "$CARGO_HOME"
            printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo 'stage4_reconcile_rust_prerequisite=true'
          echo 'rust_toolchain=1.95.0'
          echo 'user_local_tooling=true'
          echo 'system_path_mutation=false'
          echo 'phone_access=false'
          echo 'phone_mutation=false'
          echo 'provider_access=false'

      - name: Observe exact phone and reconcile existing public projection
        id: reconcile
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "${RUNNER_TOOL_CACHE:-}"
          export MOBILE_PROXY_RUNTIME_CACHE_DIR="$RUNNER_TOOL_CACHE/mobile-proxy-runtime-cache"
          python3 .github/scripts/reconcile_phone_release.py \
            --target "$TARGET" \
            --release-tag "$RELEASE_TAG" \
            --controller-revision "$GITHUB_SHA" \
            --product-root "$GITHUB_WORKSPACE/product-source" \
            --runtime-manifest "$GITHUB_WORKSPACE/.github/production/runtime-reconstruction-manifest.json" \
            --output "$RUNNER_TEMP/stage4-phone-release-reconcile.json"

      - name: Preserve mandatory bounded Stage 4 reconcile evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage4-phone-release-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage4-phone-release-reconcile.json
          if-no-files-found: error
          retention-days: 90

      - name: Record bounded Stage 4 reconcile artifact transport outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo 'STAGE4_PHONE_RELEASE_RECONCILE_ARTIFACT_TRANSPORT outcome=${{ steps.evidence_upload.outcome }}'

      - name: Require HEALTHY_EXACT target and verified projection read-back
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'stage4-phone-release-reconcile.json'
          if not path.is_file():
              raise SystemExit('Stage 4 reconcile evidence is unavailable')
          value = json.loads(path.read_text(encoding='utf-8'))
          if value.get('schema') != 'stage4-phone-release-reconcile.v1':
              raise SystemExit('Stage 4 reconcile schema differs')
          if value.get('operation_class') != 'RECONCILE' or value.get('target_access_mode') != 'read_only':
              raise SystemExit('Stage 4 reconcile operation identity differs')
          if value.get('classification') != 'HEALTHY_EXACT':
              raise SystemExit('Stage 4 reconcile lacks HEALTHY_EXACT target observation')
          if value.get('phone_snapshot_classification') != 'HEALTHY_EXACT':
              raise SystemExit('Stage 4 reconcile phone snapshot differs')
          if value.get('outcome') not in {'REPAIRED', 'NOOP'}:
              raise SystemExit('Stage 4 reconcile outcome differs')
          projection = value.get('projection')
          if not isinstance(projection, dict):
              raise SystemExit('Stage 4 reconcile projection evidence is absent')
          if (
              projection.get('evaluated') is not True
              or not isinstance(projection.get('deployment_id'), int)
              or projection.get('deployment_id', 0) <= 0
              or not isinstance(projection.get('durable_admission_count'), int)
              or projection.get('durable_admission_count', 0) <= 0
              or projection.get('final_state') != 'success'
              or projection.get('readback_verified') is not True
              or projection.get('new_deployment_created') is not False
              or projection.get('historical_terminal_rewritten') is not False
          ):
              raise SystemExit('Stage 4 reconcile projection contract differs')
          if value.get('outcome') == 'NOOP' and projection.get('write_performed') is not False:
              raise SystemExit('Stage 4 reconcile NOOP unexpectedly wrote projection')
          safety = value.get('safety')
          if not isinstance(safety, dict):
              raise SystemExit('Stage 4 reconcile safety evidence is absent')
          if safety.get('phone_access_performed') is not True:
              raise SystemExit('Stage 4 reconcile lacks direct phone observation')
          if safety.get('projection_control_plane_side_effect') is not True:
              raise SystemExit('Stage 4 reconcile hides projection side-effect class')
          if safety.get('projection_write_outcome') not in {'none', 'confirmed'}:
              raise SystemExit('Stage 4 reconcile projection write is ambiguous')
          for field in (
              'phone_mutation_performed',
              'deployment_created',
              'deployment_intent_created',
              'private_terminal_written',
              'private_evidence_written',
              'provider_access_performed',
              'provider_mutation_performed',
              'raw_device_identifier_recorded',
              'raw_current_target_path_recorded',
              'raw_config_recorded',
              'secret_values_recorded',
          ):
              if safety.get(field) is not False:
                  raise SystemExit(f'Stage 4 reconcile safety invariant differs: {field}')
          print(
              'STAGE4_PHONE_RELEASE_RECONCILE_ACCEPTED '
              f"outcome={value['outcome']} projection_write={projection.get('write_performed')} "
              'phone_mutation=false deployment_created=false durable_intent=false '
              'historical_terminal_rewritten=false readback_verified=true'
          )
          PY
