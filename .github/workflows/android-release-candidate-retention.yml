name: Production Android signed migration-candidate retention

on:
  workflow_run:
    workflows:
      - Production Android 0.1.4 signed migration candidate
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: production-android-v014-candidate-retention
  cancel-in-progress: false

jobs:
  retain:
    name: Retain exact signed candidate as bounded private prerelease
    if: >-
      github.event.workflow_run.event == 'issue_comment' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact source-run private execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_RUN_SHA }}
          path: private-execution

      - name: Load and validate source-run Android migration execution binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path

          path = Path('private-execution/.github/production/android-v0.1.4-migration-binding.json')
          binding = json.loads(path.read_text(encoding='utf-8'))
          expected = {
              'format_version': 1,
              'binding_role': 'private_execution_only',
              'canonical_repository': 'iamaman11/mobile-proxy',
              'quality_required': True,
              'migration_tracker_issue': 162,
              'hardening_tracker_issue': 179,
              'application_id': 'com.example.mobileproxy',
              'version_name': '0.1.4',
              'version_code': 1004,
              'old_version_name': '1.1.0',
              'old_version_code': 2,
              'candidate_retention_days_minimum': 30,
              'final_release_authority': False,
          }
          for key, value in expected.items():
              if binding.get(key) != value:
                  raise SystemExit(f'Android migration binding mismatch: {key}')
          canonical_sha = binding.get('canonical_sha')
          if not isinstance(canonical_sha, str) or re.fullmatch(r'[0-9a-f]{40}', canonical_sha) is None:
              raise SystemExit('Android migration binding canonical_sha is malformed')

          req = urllib.request.Request(
              'https://api.github.com/repos/iamaman11/mobile-proxy/commits/main',
              headers={'Accept':'application/vnd.github+json','User-Agent':'mobile-proxy-production-candidate-retention'},
          )
          with urllib.request.urlopen(req, timeout=15) as response:
              current_main = json.load(response).get('sha')
          if current_main != canonical_sha:
              raise SystemExit('source-run Android migration binding is stale relative to current canonical main')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={canonical_sha}\n')
              handle.write(f"application_id={binding['application_id']}\n")
              handle.write(f"version_name={binding['version_name']}\n")
              handle.write(f"version_code={binding['version_code']}\n")
          PY

      - name: Download exact signed-candidate artifact from source run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-candidate-v0.1.4-${{ steps.binding.outputs.canonical_sha }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Revalidate bounded canonical evidence before retention
        shell: bash
        env:
          CANONICAL_SHA: ${{ steps.binding.outputs.canonical_sha }}
          APPLICATION_ID: ${{ steps.binding.outputs.application_id }}
          VERSION_NAME: ${{ steps.binding.outputs.version_name }}
          VERSION_CODE: ${{ steps.binding.outputs.version_code }}
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/candidate"
          test -s "${candidate}/mobile-proxy-android-v0.1.4.apk"
          test -s "${candidate}/android-release-evidence.json"
          python3 - "${candidate}/android-release-evidence.json" <<'PY'
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], 'r', encoding='utf-8') as handle:
              evidence = json.load(handle)
          expected = {
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'android_baseline_ref': 'v0.1.3',
              'android_functional_source_preserved': True,
              'application_id': os.environ['APPLICATION_ID'],
              'version_name': os.environ['VERSION_NAME'],
              'version_code': int(os.environ['VERSION_CODE']),
              'release_contract_verified': True,
              'keystore_verified': True,
              'apk_signature_verified': True,
              'apk_signer_matches_private_key': True,
              'production_apk_signed': True,
              'phone_access_performed': False,
              'phone_mutation_performed': False,
              'accepted': True,
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f'candidate retention evidence mismatch: {key}')
          digest = evidence.get('artifact_digest')
          if not isinstance(digest, str) or re.fullmatch(r'b3:[0-9a-f]{64}', digest) is None:
              raise SystemExit('typed APK digest is absent or malformed')
          if evidence.get('artifact_digest_algorithm') != 'blake3-256':
              raise SystemExit('unexpected APK digest algorithm')
          if evidence.get('artifact_name') != 'mobile-proxy-android-v0.1.4.apk':
              raise SystemExit('unexpected APK artifact name')
          PY

      - name: Publish immutable-by-contract private execution candidate prerelease
        env:
          CANONICAL_SHA: ${{ steps.binding.outputs.canonical_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="execution-candidate-android-v0.1.4-${CANONICAL_SHA:0:12}-run-${SOURCE_RUN_ID}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "candidate retention release already exists" >&2
            exit 1
          fi
          cat > "${RUNNER_TEMP}/candidate-notes.md" <<EOF
          Private execution retention for the exact signed Android 0.1.4 signing-generation migration candidate.

          Canonical public version metadata: 0.1.4
          Canonical public source SHA: ${CANONICAL_SHA}
          Final public release authority: absent; not created by this private prerelease
          Private signed-candidate run: ${SOURCE_RUN_ID}
          Private execution SHA: ${SOURCE_RUN_SHA}
          Canonical SHA source: binding loaded from the exact source-run private execution SHA

          Assets are the signed APK and canonical typed-digest/provenance evidence. This private prerelease is execution evidence only; public iamaman11/mobile-proxy remains the sole authority for source, architecture, policy and final release identity.
          EOF
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_RUN_SHA}" \
            --title "Private execution candidate — Android 0.1.4 migration — run ${SOURCE_RUN_ID}" \
            --notes-file "${RUNNER_TEMP}/candidate-notes.md" \
            --prerelease \
            "${RUNNER_TEMP}/candidate/mobile-proxy-android-v0.1.4.apk" \
            "${RUNNER_TEMP}/candidate/android-release-evidence.json"

      - name: Record safe retention checkpoint
        env:
          CANONICAL_SHA: ${{ steps.binding.outputs.canonical_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body "ANDROID 0.1.4 MIGRATION-CANDIDATE RETENTION CHECKPOINT — source run \`${SOURCE_RUN_ID}\`

          - private execution SHA: \`${SOURCE_RUN_SHA}\`
          - canonical public SHA: \`${CANONICAL_SHA}\`
          - canonical SHA source: exact source-run execution binding
          - exact signed APK retained as private execution prerelease: true
          - canonical typed digest/provenance evidence retained: true
          - final public release authority created: false
          - final public v0.1.4 tag required: false
          - phone access performed: false
          - phone mutation performed: false
          - signing material recorded: false
          - signer fingerprint recorded: false
          - device identifier recorded: false"
