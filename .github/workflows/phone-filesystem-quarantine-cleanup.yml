name: Production Android filesystem quarantine cleanup

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  command-gate:
    name: Validate quarantine cleanup authority and prepare exact admission bundle
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-filesystem-quarantine-clean ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      quality_run_id: ${{ steps.command.outputs.quality_run_id }}
      observation_run_id: ${{ steps.command.outputs.observation_run_id }}
      observation_source_sha: ${{ steps.command.outputs.observation_source_sha }}
      transaction_ids_json: ${{ steps.command.outputs.transaction_ids_json }}
      observation_artifact_name: ${{ steps.command.outputs.observation_artifact_name }}
      promoted_artifact_name: ${{ steps.command.outputs.promoted_artifact_name }}
      operation_transaction_id: ${{ steps.command.outputs.operation_transaction_id }}
    steps:
      - name: Validate exact command, current authority, and causally promoted observation run
        id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          PRIVATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          tokens = os.environ.get('COMMAND', '').strip().split()
          if len(tokens) < 4 or tokens[0] != '/phone-filesystem-quarantine-clean':
              raise SystemExit('invalid filesystem quarantine cleanup command')
          requested_sha = tokens[1]
          if re.fullmatch(r'[0-9a-f]{40}', requested_sha) is None:
              raise SystemExit('invalid canonical SHA')
          if re.fullmatch(r'[1-9][0-9]*', tokens[2]) is None:
              raise SystemExit('invalid quarantine observation run ID')
          observation_run_id = int(tokens[2])
          transaction_ids = tokens[3:]
          transaction_pattern = re.compile(r'[A-Za-z0-9][A-Za-z0-9._-]{0,95}')
          if len(transaction_ids) > 8:
              raise SystemExit('too many quarantine transaction IDs')
          if len(set(transaction_ids)) != len(transaction_ids):
              raise SystemExit('duplicate quarantine transaction ID')
          if any(transaction_pattern.fullmatch(value) is None for value in transaction_ids):
              raise SystemExit('invalid quarantine transaction ID')

          token = os.environ['GH_TOKEN']
          private_repository = os.environ['PRIVATE_REPOSITORY']

          def get_json(url, *, authenticated=False):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'mobile-proxy-production-quarantine-cleanup',
              }
              if authenticated:
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          canonical_main = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/commits/main'
          )['sha']
          if requested_sha != canonical_main:
              raise SystemExit('requested SHA is not current canonical main')

          query = urllib.parse.urlencode(
              {'head_sha': requested_sha, 'status': 'completed', 'per_page': 100}
          )
          runs = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?' + query
          ).get('workflow_runs', [])
          quality = [
              run for run in runs
              if run.get('name') == 'Quality'
              and run.get('head_sha') == requested_sha
              and run.get('conclusion') == 'success'
          ]
          if not quality:
              raise SystemExit('exact canonical SHA has no successful Quality run')
          quality.sort(
              key=lambda run: (run.get('run_attempt', 0), run.get('id', 0)),
              reverse=True,
          )

          observation = get_json(
              f'https://api.github.com/repos/{private_repository}/actions/runs/{observation_run_id}',
              authenticated=True,
          )
          if observation.get('name') != 'Production Android filesystem quarantine observation':
              raise SystemExit('observation run workflow differs')
          if observation.get('event') != 'issue_comment':
              raise SystemExit('observation run event differs')
          if observation.get('status') != 'completed' or observation.get('conclusion') != 'success':
              raise SystemExit('observation run is not completed/success')

          artifacts = get_json(
              f'https://api.github.com/repos/{private_repository}/actions/runs/{observation_run_id}/artifacts?per_page=100',
              authenticated=True,
          ).get('artifacts', [])
          raw_pattern = re.compile(
              rf'phone-filesystem-quarantine-observation-(?P<sha>[0-9a-f]{{40}})-{observation_run_id}'
          )
          promoted_pattern = re.compile(
              rf'phone-filesystem-quarantine-observed-facts-(?P<sha>[0-9a-f]{{40}})-{observation_run_id}'
          )
          raw_matches = []
          promoted_matches = []
          for artifact in artifacts:
              if artifact.get('expired') is not False:
                  continue
              name = str(artifact.get('name', ''))
              raw_match = raw_pattern.fullmatch(name)
              if raw_match:
                  raw_matches.append((artifact, raw_match.group('sha')))
              promoted_match = promoted_pattern.fullmatch(name)
              if promoted_match:
                  promoted_matches.append((artifact, promoted_match.group('sha')))
          if len(raw_matches) != 1 or len(promoted_matches) != 1:
              raise SystemExit('exact durable raw/promoted quarantine observation artifacts are unavailable')
          observation_source_sha = raw_matches[0][1]
          if promoted_matches[0][1] != observation_source_sha:
              raise SystemExit('raw/promoted observation source provenance differs')

          transaction_ids_json = json.dumps(transaction_ids, separators=(',', ':'))
          operation_transaction_id = (
              f"fs-quarantine-clean-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={requested_sha}\n')
              handle.write(f"quality_run_id={quality[0]['id']}\n")
              handle.write(f'observation_run_id={observation_run_id}\n')
              handle.write(f'observation_source_sha={observation_source_sha}\n')
              handle.write(f'transaction_ids_json={transaction_ids_json}\n')
              handle.write(f"observation_artifact_name={raw_matches[0][0]['name']}\n")
              handle.write(f"promoted_artifact_name={promoted_matches[0][0]['name']}\n")
              handle.write(f'operation_transaction_id={operation_transaction_id}\n')
          PY

      - name: Download exact durable raw quarantine observation evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.command.outputs.observation_artifact_name }}
          path: ${{ runner.temp }}/prior-quarantine-observation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.command.outputs.observation_run_id }}

      - name: Download exact promoted reusable quarantine facts
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.command.outputs.promoted_artifact_name }}
          path: ${{ runner.temp }}/prior-quarantine-promoted-facts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.command.outputs.observation_run_id }}

      - name: Verify prior raw/promoted evidence binds the exact cleanup transaction set
        id: admission
        shell: bash
        env:
          OBSERVATION_SOURCE_SHA: ${{ steps.command.outputs.observation_source_sha }}
          TRANSACTION_IDS_JSON: ${{ steps.command.outputs.transaction_ids_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          raw_root = Path(os.environ['RUNNER_TEMP']) / 'prior-quarantine-observation'
          raw_files = list(raw_root.glob('*.json'))
          if len(raw_files) != 1:
              raise SystemExit('prior quarantine observation artifact shape differs')
          raw_path = raw_files[0]
          raw = json.loads(raw_path.read_text(encoding='utf-8'))
          expected_ids = json.loads(os.environ['TRANSACTION_IDS_JSON'])
          if raw.get('format_version') != 1:
              raise SystemExit('prior observation format differs')
          if raw.get('repository') != 'iamaman11/mobile-proxy':
              raise SystemExit('prior observation repository differs')
          if raw.get('canonical_sha') != os.environ['OBSERVATION_SOURCE_SHA']:
              raise SystemExit('prior observation source provenance differs')
          if raw.get('operation_id') != 'android.filesystem-quarantine-observation.v1':
              raise SystemExit('prior observation operation differs')
          if raw.get('observation_complete') is not True:
              raise SystemExit('prior observation is incomplete')
          if raw.get('cleanup_admissible') is not True:
              raise SystemExit('prior observation does not admit cleanup')
          transactions = raw.get('transactions')
          if not isinstance(transactions, list):
              raise SystemExit('prior observation transaction list differs')
          if [item.get('transaction_id') for item in transactions] != expected_ids:
              raise SystemExit('prior observation transaction set differs')
          for flag in (
              'raw_directory_contents_recorded',
              'raw_command_output_recorded',
              'raw_device_identifier_recorded',
              'phone_mutation_performed',
          ):
              if raw.get(flag) is not False:
                  raise SystemExit(f'prior observation unsafe flag differs: {flag}')

          promoted_root = Path(os.environ['RUNNER_TEMP']) / 'prior-quarantine-promoted-facts'
          promoted_files = list(promoted_root.glob('*.json'))
          if len(promoted_files) != 1:
              raise SystemExit('prior promoted quarantine artifact shape differs')
          promoted_path = promoted_files[0]
          promoted = json.loads(promoted_path.read_text(encoding='utf-8'))
          if promoted.get('format_version') != 1:
              raise SystemExit('promoted quarantine fact format differs')
          if promoted.get('evidence_type') != 'PROMOTED_OBSERVED_FACT_SET':
              raise SystemExit('promoted quarantine fact evidence type differs')
          if promoted.get('authority') != 'CONTROL' or promoted.get('lifecycle') != 'CURRENT':
              raise SystemExit('promoted quarantine authority/lifecycle differs')
          if promoted.get('raw_evidence_persisted') is not True:
              raise SystemExit('promoted quarantine fact lacks raw persistence proof')
          if promoted.get('generation_stable') is not True:
              raise SystemExit('promoted quarantine fact lacks stable double-resolution')
          if promoted.get('promotion_changes_only_persistence') is not True:
              raise SystemExit('promoted quarantine fact promotion contract differs')
          facts = promoted.get('observed_facts')
          if not isinstance(facts, list) or len(facts) != 2:
              raise SystemExit('promoted quarantine fact set cardinality differs')
          raw_facts = raw.get('observed_facts')
          if not isinstance(raw_facts, list) or len(raw_facts) != 2:
              raise SystemExit('raw quarantine causal fact set cardinality differs')
          normalized_promoted = []
          for fact in facts:
              if not isinstance(fact, dict) or fact.get('persisted') is not True:
                  raise SystemExit('promoted quarantine fact is not durable')
              candidate = dict(fact)
              candidate['persisted'] = False
              normalized_promoted.append(candidate)
          if normalized_promoted != raw_facts:
              raise SystemExit('promoted facts do not exactly correspond to raw canonical facts')
          predicates = {fact.get('predicate'): fact.get('value') for fact in facts}
          if predicates.get('cleanup_admissible') is not True:
              raise SystemExit('promoted quarantine fact does not admit cleanup')
          if set(predicates) != {'transactions_absent', 'cleanup_admissible'}:
              raise SystemExit('promoted quarantine fact predicate set differs')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'observation_sha256={hashlib.sha256(raw_path.read_bytes()).hexdigest()}\n')
              handle.write(f'observation_filename={raw_path.name}\n')
              handle.write(f'promoted_sha256={hashlib.sha256(promoted_path.read_bytes()).hexdigest()}\n')
              handle.write(f'promoted_filename={promoted_path.name}\n')
          PY

      - name: Checkout exact current canonical cleanup source
        uses: actions/checkout@v4
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ steps.command.outputs.canonical_sha }}
          path: canonical
          persist-credentials: false

      - name: Checkout exact private generation evidence adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-control
          persist-credentials: false

      - name: Build immutable same-run quarantine cleanup bundle
        shell: bash
        env:
          CANONICAL_SHA: ${{ steps.command.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ steps.command.outputs.quality_run_id }}
          OBSERVATION_RUN_ID: ${{ steps.command.outputs.observation_run_id }}
          OBSERVATION_SOURCE_SHA: ${{ steps.command.outputs.observation_source_sha }}
          OBSERVATION_SHA256: ${{ steps.admission.outputs.observation_sha256 }}
          OBSERVATION_FILENAME: ${{ steps.admission.outputs.observation_filename }}
          PROMOTED_SHA256: ${{ steps.admission.outputs.promoted_sha256 }}
          PROMOTED_FILENAME: ${{ steps.admission.outputs.promoted_filename }}
          TRANSACTION_IDS_JSON: ${{ steps.command.outputs.transaction_ids_json }}
          PRIVATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "${CANONICAL_SHA}"
          test "$(git -C private-control rev-parse HEAD)" = "${PRIVATE_SHA}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-cleanup-source'
          root.mkdir(parents=True, exist_ok=False)
          scripts = (
              'run_private_phone_preflight.py',
              'run_android_capability_inventory.py',
              'android_filesystem_comparator.py',
              'run_android_filesystem_certification.py',
              'run_android_filesystem_quarantine_recovery.py',
              'physical_domain_generation.py',
              'control_state_machine.py',
          )
          digests = {}
          for name in scripts:
              source = Path('canonical/scripts') / name
              if not source.is_file():
                  raise SystemExit(f'canonical source missing: {name}')
              target = root / name
              shutil.copyfile(source, target)
              digests[name] = hashlib.sha256(target.read_bytes()).hexdigest()

          helper_source = Path('private-control/.github/scripts/filesystem_generation_inventory.py')
          if not helper_source.is_file():
              raise SystemExit('private filesystem generation evidence adapter is missing')
          helper = root / 'filesystem_generation_inventory.py'
          shutil.copyfile(helper_source, helper)
          helper_digest = hashlib.sha256(helper.read_bytes()).hexdigest()

          prior = Path(os.environ['RUNNER_TEMP']) / 'prior-quarantine-observation' / os.environ['OBSERVATION_FILENAME']
          if hashlib.sha256(prior.read_bytes()).hexdigest() != os.environ['OBSERVATION_SHA256']:
              raise SystemExit('prior observation digest changed during bundle construction')
          shutil.copyfile(prior, root / 'admission-observation.json')

          promoted = Path(os.environ['RUNNER_TEMP']) / 'prior-quarantine-promoted-facts' / os.environ['PROMOTED_FILENAME']
          if hashlib.sha256(promoted.read_bytes()).hexdigest() != os.environ['PROMOTED_SHA256']:
              raise SystemExit('promoted fact digest changed during bundle construction')
          shutil.copyfile(promoted, root / 'admission-promoted-facts.json')

          manifest = {
              'format_version': 2,
              'repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'observation_run_id': int(os.environ['OBSERVATION_RUN_ID']),
              'observation_source_ref': os.environ['OBSERVATION_SOURCE_SHA'],
              'observation_sha256': os.environ['OBSERVATION_SHA256'],
              'promoted_facts_sha256': os.environ['PROMOTED_SHA256'],
              'transaction_ids': json.loads(os.environ['TRANSACTION_IDS_JSON']),
              'scripts_sha256': digests,
              'private_repository': 'iamaman11/mobile-proxy-production',
              'private_sha': os.environ['PRIVATE_SHA'],
              'private_evidence_adapter_sha256': helper_digest,
          }
          (root / 'source-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload immutable quarantine cleanup source and causal admission bundle
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-cleanup-source-${{ steps.command.outputs.canonical_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-cleanup-source
          if-no-files-found: error
          retention-days: 1

  cleanup-quarantine:
    name: Globally serialized exact filesystem quarantine cleanup
    needs: command-gate
    if: ${{ needs.command-gate.result == 'success' }}
    concurrency:
      group: production-phone-global-mutation
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 10
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      OBSERVATION_RUN_ID: ${{ needs.command-gate.outputs.observation_run_id }}
      OBSERVATION_SOURCE_SHA: ${{ needs.command-gate.outputs.observation_source_sha }}
      TRANSACTION_IDS_JSON: ${{ needs.command-gate.outputs.transaction_ids_json }}
      OPERATION_TRANSACTION_ID: ${{ needs.command-gate.outputs.operation_transaction_id }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
    outputs:
      result_validated: ${{ steps.result.outputs.result_validated }}
      state: ${{ steps.result.outputs.state }}
      accepted: ${{ steps.result.outputs.accepted }}
      cleanup_attempted: ${{ steps.result.outputs.cleanup_attempted }}
      cleanup_verified: ${{ steps.result.outputs.cleanup_verified }}
      phone_mutation_performed: ${{ steps.result.outputs.phone_mutation_performed }}
      failure_substep: ${{ steps.result.outputs.failure_substep }}
      artifact_persisted: ${{ steps.evidence-state.outputs.artifact_persisted }}
    steps:
      - name: Download immutable quarantine cleanup source and causal admission bundle
        uses: actions/download-artifact@v4
        with:
          name: phone-filesystem-quarantine-cleanup-source-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-cleanup-source

      - name: Verify exact source and bundled causal evidence before generation admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-cleanup-source'
          manifest = json.loads((root / 'source-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('format_version') != 2:
              raise SystemExit('unsupported cleanup source manifest')
          if manifest.get('repository') != 'iamaman11/mobile-proxy':
              raise SystemExit('cleanup source repository differs')
          if manifest.get('canonical_sha') != os.environ['CANONICAL_SHA']:
              raise SystemExit('cleanup source canonical SHA differs')
          if manifest.get('quality_run_id') != int(os.environ['QUALITY_RUN_ID']):
              raise SystemExit('cleanup source Quality authority differs')
          if manifest.get('observation_run_id') != int(os.environ['OBSERVATION_RUN_ID']):
              raise SystemExit('cleanup observation run authority differs')
          if manifest.get('observation_source_ref') != os.environ['OBSERVATION_SOURCE_SHA']:
              raise SystemExit('cleanup observation source provenance differs')
          if manifest.get('transaction_ids') != json.loads(os.environ['TRANSACTION_IDS_JSON']):
              raise SystemExit('cleanup transaction set differs')
          expected = manifest.get('scripts_sha256')
          required = {
              'run_private_phone_preflight.py',
              'run_android_capability_inventory.py',
              'android_filesystem_comparator.py',
              'run_android_filesystem_certification.py',
              'run_android_filesystem_quarantine_recovery.py',
              'physical_domain_generation.py',
              'control_state_machine.py',
          }
          if not isinstance(expected, dict) or set(expected) != required:
              raise SystemExit('cleanup source script set differs')
          for name, digest in expected.items():
              path = root / name
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'cleanup source digest differs: {name}')
          helper = root / 'filesystem_generation_inventory.py'
          if hashlib.sha256(helper.read_bytes()).hexdigest() != manifest.get('private_evidence_adapter_sha256'):
              raise SystemExit('cleanup private evidence adapter digest differs')
          admission = root / 'admission-observation.json'
          if hashlib.sha256(admission.read_bytes()).hexdigest() != manifest.get('observation_sha256'):
              raise SystemExit('cleanup admission observation digest differs')
          promoted = root / 'admission-promoted-facts.json'
          if hashlib.sha256(promoted.read_bytes()).hexdigest() != manifest.get('promoted_facts_sha256'):
              raise SystemExit('cleanup promoted fact digest differs')
          PY

      - name: Fetch current trusted filesystem CONTROL history under global mutation lock
        id: current-history
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const headings = [
              '## CONTROL FILESYSTEM MUTATION INTENT',
              '## CONTROL ANDROID FILESYSTEM MUTATION RESULT',
              '## CONTROL ANDROID FILESYSTEM QUARANTINE CLEANUP RESULT',
            ];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              per_page: 100,
            });
            const bounded = comments
              .filter((comment) => headings.some((heading) => String(comment.body || '').startsWith(heading)))
              .map((comment) => ({
                id: comment.id,
                body: String(comment.body || ''),
                user: {login: String(comment.user?.login || '')},
              }));
            if (bounded.length > 512) {
              throw new Error('bounded filesystem CONTROL history exceeds supported inventory size');
            }
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, 'filesystem-control-comments-cleanup.json'),
              JSON.stringify(bounded),
              'utf8',
            );

      - name: Resolve current filesystem generation under global mutation lock
        id: current-generation
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/phone-filesystem-quarantine-cleanup-source"
          python3 "${root}/filesystem_generation_inventory.py" \
            --comments "${RUNNER_TEMP}/filesystem-control-comments-cleanup.json" \
            --output "${RUNNER_TEMP}/filesystem-generation-inventory-cleanup.json"
          python3 "${root}/physical_domain_generation.py" \
            --inventory "${RUNNER_TEMP}/filesystem-generation-inventory-cleanup.json" \
            --output "${RUNNER_TEMP}/filesystem-generation-cleanup.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          resolution = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'filesystem-generation-cleanup.json').read_text(encoding='utf-8')
          )
          if resolution.get('state') != 'RESOLVED':
              raise SystemExit('current filesystem generation is not resolved')
          if resolution.get('domain_scope') != 'domain/filesystem':
              raise SystemExit('current filesystem generation scope differs')
          if resolution.get('git_source_dependency') is not False:
              raise SystemExit('filesystem generation must not depend on Git source identity')
          generation = str(resolution.get('generation', ''))
          if not generation:
              raise SystemExit('current filesystem generation is empty')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'generation={generation}\n')
          PY

      - name: Admit promoted quarantine facts through canonical control state classifier
        id: causal-admission
        shell: bash
        env:
          CURRENT_FILESYSTEM_GENERATION: ${{ steps.current-generation.outputs.generation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import importlib.util
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-cleanup-source'
          spec = importlib.util.spec_from_file_location('control_state_machine', root / 'control_state_machine.py')
          if spec is None or spec.loader is None:
              raise SystemExit('unable to load canonical control state classifier')
          control = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = control
          spec.loader.exec_module(control)

          serial = os.environ.get('ANDROID_PRODUCTION_SERIAL', '')
          binding_key = os.environ.get('ANDROID_TARGET_BINDING_KEY', '')
          if not serial:
              raise SystemExit('registered production target binding is unavailable')
          if len(binding_key) < 32:
              raise SystemExit('target binding HMAC key is unavailable or too short')
          if binding_key == serial:
              raise SystemExit('target binding HMAC key must be independent from raw device binding')
          message = b'android-production\0' + serial.encode('utf-8')
          target_binding_id = (
              'tb-hmac-sha256:'
              + hmac.new(binding_key.encode('utf-8'), message, hashlib.sha256).hexdigest()
          )
          if re.fullmatch(r'tb-hmac-sha256:[0-9a-f]{64}', target_binding_id) is None:
              raise SystemExit('opaque target binding identity is invalid')

          promoted = json.loads((root / 'admission-promoted-facts.json').read_text(encoding='utf-8'))
          if promoted.get('generation_stable') is not True:
              raise SystemExit('promoted fact set is not generation-stable')
          facts = promoted.get('observed_facts')
          if not isinstance(facts, list) or len(facts) != 2:
              raise SystemExit('promoted fact set cardinality differs')

          transaction_ids = json.loads(os.environ['TRANSACTION_IDS_JSON'])
          current_context = {
              'target/android-production': target_binding_id,
              'observer/filesystem-quarantine': 'android.filesystem-quarantine-observer.v2',
              'domain/filesystem': os.environ['CURRENT_FILESYSTEM_GENERATION'],
          }
          for transaction_id in transaction_ids:
              current_context[f'transaction/{transaction_id}'] = transaction_id
          required_scopes = tuple(current_context)

          predicates = {}
          for payload in facts:
              dependencies = tuple(
                  control.FactDependency(str(item.get('scope', '')), str(item.get('identity', '')))
                  for item in payload.get('dependencies', [])
                  if isinstance(item, dict)
              )
              fact = control.ObservedFact(
                  subject=str(payload.get('subject', '')),
                  predicate=str(payload.get('predicate', '')),
                  value=payload.get('value'),
                  target=str(payload.get('target', '')),
                  observation_ref=str(payload.get('observation_ref', '')),
                  source_ref=str(payload.get('source_ref', '')),
                  dependencies=dependencies,
                  authority=str(payload.get('authority', '')),
                  persisted=payload.get('persisted') is True,
              )
              validity = control.classify_observed_fact(
                  fact,
                  current_context,
                  required_scopes=required_scopes,
              )
              if validity.state != control.FACT_VALID:
                  raise SystemExit(
                      'promoted quarantine fact is not reusable in current context: '
                      + validity.state + ':' + ','.join(validity.reasons)
                  )
              predicates[fact.predicate] = fact.value
          if set(predicates) != {'transactions_absent', 'cleanup_admissible'}:
              raise SystemExit('promoted quarantine predicate set differs')
          if predicates['cleanup_admissible'] is not True:
              raise SystemExit('promoted quarantine facts do not admit cleanup')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('causal_admission=true\n')
              handle.write(f'target_binding_id={target_binding_id}\n')
          PY

      - name: Build bounded CONTROL mutation dispatch intent
        id: dispatch-intent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import re
          from pathlib import Path

          operation_transaction_id = os.environ['OPERATION_TRANSACTION_ID']
          if re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,95}', operation_transaction_id) is None:
              raise SystemExit('operation transaction identity is invalid')
          target_transaction_ids = json.loads(os.environ['TRANSACTION_IDS_JSON'])
          serial = os.environ.get('ANDROID_PRODUCTION_SERIAL', '')
          binding_key = os.environ.get('ANDROID_TARGET_BINDING_KEY', '')
          if not serial:
              raise SystemExit('registered production target binding is unavailable')
          if len(binding_key) < 32:
              raise SystemExit('target binding HMAC key is unavailable or too short')
          if binding_key == serial:
              raise SystemExit('target binding HMAC key must be independent from raw device binding')
          message = b'android-production\0' + serial.encode('utf-8')
          target_binding_id = (
              'tb-hmac-sha256:'
              + hmac.new(binding_key.encode('utf-8'), message, hashlib.sha256).hexdigest()
          )
          if target_binding_id != os.environ['ADMISSION_TARGET_BINDING_ID']:
              raise SystemExit('target binding changed between causal admission and dispatch intent')
          marker = {
              'format_version': 1,
              'evidence_type': 'MUTATION_DISPATCH_INTENT',
              'authority': 'CONTROL',
              'lifecycle': 'CURRENT',
              'private_repository': os.environ['GITHUB_REPOSITORY'],
              'private_sha': os.environ['GITHUB_SHA'],
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'canonical_quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'operation_id': 'android.filesystem-quarantine-cleanup.v1',
              'operation_transaction_id': operation_transaction_id,
              'target_transaction_ids': target_transaction_ids,
              'destructive_step_id': 'cleanup_exact_paths',
              'target': 'android-production',
              'target_binding_id': target_binding_id,
              'target_binding_algorithm': 'HMAC-SHA256(ANDROID_TARGET_BINDING_KEY, target+serial)',
              'affected_domain_generations': {'domain/filesystem': operation_transaction_id},
              'dispatch_may_reach_target': True,
              'adapter_invocation_allowed_only_after_persistence': True,
              'blind_retry_allowed': False,
              'raw_device_identifier_recorded': False,
              'phone_mutation_performed': False,
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'filesystem-mutation-dispatch-intent.json'
          path.write_text(json.dumps(marker, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
        env:
          ADMISSION_TARGET_BINDING_ID: ${{ steps.causal-admission.outputs.target_binding_id }}

      - name: Persist CONTROL mutation dispatch intent before adapter invocation
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-dispatch-intent-${{ env.CANONICAL_SHA }}-${{ env.OPERATION_TRANSACTION_ID }}
          path: ${{ runner.temp }}/filesystem-mutation-dispatch-intent.json
          if-no-files-found: error
          retention-days: 90

      - name: Journal durable CONTROL mutation intent before adapter invocation
        id: intent-journal
        uses: actions/github-script@v7
        env:
          INTENT_PATH: ${{ runner.temp }}/filesystem-mutation-dispatch-intent.json
        with:
          script: |
            const fs = require('fs');
            const marker = JSON.parse(fs.readFileSync(process.env.INTENT_PATH, 'utf8'));
            const expectedGeneration = marker.operation_transaction_id;
            if (
              marker.format_version !== 1 ||
              marker.evidence_type !== 'MUTATION_DISPATCH_INTENT' ||
              marker.authority !== 'CONTROL' ||
              marker.lifecycle !== 'CURRENT' ||
              marker.private_repository !== process.env.GITHUB_REPOSITORY ||
              marker.private_sha !== process.env.GITHUB_SHA ||
              marker.workflow_run_id !== context.runId ||
              marker.workflow_run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT) ||
              marker.operation_id !== 'android.filesystem-quarantine-cleanup.v1' ||
              marker.operation_transaction_id !== process.env.OPERATION_TRANSACTION_ID ||
              !Array.isArray(marker.target_transaction_ids) ||
              marker.target_transaction_ids.length < 1 ||
              marker.target !== 'android-production' ||
              typeof marker.target_binding_id !== 'string' ||
              !marker.target_binding_id.startsWith('tb-hmac-sha256:') ||
              marker.affected_domain_generations?.['domain/filesystem'] !== expectedGeneration ||
              marker.dispatch_may_reach_target !== true ||
              marker.adapter_invocation_allowed_only_after_persistence !== true ||
              marker.blind_retry_allowed !== false ||
              marker.raw_device_identifier_recorded !== false ||
              marker.phone_mutation_performed !== false
            ) {
              throw new Error('filesystem quarantine cleanup dispatch intent is not journal-admissible');
            }
            const journal = {
              format_version: 1,
              journal_type: 'FILESYSTEM_MUTATION_INTENT',
              evidence_type: marker.evidence_type,
              authority: marker.authority,
              lifecycle: marker.lifecycle,
              private_repository: marker.private_repository,
              private_sha: marker.private_sha,
              canonical_repository: marker.canonical_repository,
              canonical_sha: marker.canonical_sha,
              canonical_quality_run_id: marker.canonical_quality_run_id,
              workflow_run_id: marker.workflow_run_id,
              workflow_run_attempt: marker.workflow_run_attempt,
              operation_id: marker.operation_id,
              operation_transaction_id: marker.operation_transaction_id,
              target_transaction_ids: marker.target_transaction_ids,
              target: marker.target,
              target_binding_id: marker.target_binding_id,
              affected_domain_generations: marker.affected_domain_generations,
              dispatch_intent_artifact_persisted: true,
              journaled_before_adapter_invocation: true,
              dispatch_may_reach_target: true,
              blind_retry_allowed: false,
              raw_device_identifier_recorded: false,
            };
            const body = [
              '## CONTROL FILESYSTEM MUTATION INTENT',
              '',
              '```json',
              JSON.stringify(journal),
              '```',
            ].join('\n');
            const response = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });
            if (!response?.data?.id) {
              throw new Error('durable filesystem mutation intent journal comment was not created');
            }
            core.setOutput('journal_comment_id', String(response.data.id));

      - name: Run exact bounded quarantine cleanup
        id: cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-cleanup-source'
          output = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-cleanup.json'
          command = [
              'python3',
              str(root / 'run_android_filesystem_quarantine_recovery.py'),
              '--mode', 'cleanup',
              '--canonical-sha', os.environ['CANONICAL_SHA'],
          ]
          for transaction_id in json.loads(os.environ['TRANSACTION_IDS_JSON']):
              command += ['--transaction-id', transaction_id]
          command += ['--output', str(output)]
          subprocess.run(command, check=True)
          PY

      - name: Validate and export bounded quarantine cleanup result
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-cleanup.json'
          values = {
              'result_validated': False,
              'state': 'UNOBSERVED',
              'accepted': False,
              'cleanup_attempted': False,
              'cleanup_verified': False,
              'phone_mutation_performed': False,
              'failure_substep': 'unobserved',
          }
          if path.is_file():
              evidence = json.loads(path.read_text(encoding='utf-8'))
              if evidence.get('format_version') != 1:
                  raise SystemExit('unsupported quarantine cleanup evidence')
              if evidence.get('repository') != 'iamaman11/mobile-proxy':
                  raise SystemExit('quarantine cleanup repository differs')
              if evidence.get('canonical_sha') != os.environ['CANONICAL_SHA']:
                  raise SystemExit('quarantine cleanup canonical SHA differs')
              if evidence.get('operation_id') != 'android.filesystem-quarantine-cleanup.v1':
                  raise SystemExit('quarantine cleanup operation differs')
              if evidence.get('mode') != 'bounded_quarantine_cleanup':
                  raise SystemExit('quarantine cleanup mode differs')
              if evidence.get('transaction_ids') != json.loads(os.environ['TRANSACTION_IDS_JSON']):
                  raise SystemExit('quarantine cleanup transaction IDs differ')
              for flag in (
                  'package_mutation_performed',
                  'runtime_lifecycle_mutation_performed',
                  'provider_access_performed',
                  'phone_reboot_performed',
                  'raw_directory_contents_recorded',
                  'raw_command_output_recorded',
                  'raw_device_identifier_recorded',
              ):
                  if evidence.get(flag) is not False:
                      raise SystemExit(f'quarantine cleanup unsafe flag differs: {flag}')
              state = str(evidence.get('state', 'UNOBSERVED'))
              if state not in {'CLEANED', 'ALREADY_CLEAN', 'REFUSED', 'QUARANTINED'}:
                  raise SystemExit('quarantine cleanup state enum differs')
              accepted = evidence.get('accepted') is True
              cleanup_verified = evidence.get('cleanup_verified') is True
              mutation = evidence.get('phone_mutation_performed') is True
              if accepted and (state not in {'CLEANED', 'ALREADY_CLEAN'} or not cleanup_verified):
                  raise SystemExit('accepted quarantine cleanup has invalid state/postcondition')
              if state == 'REFUSED' and mutation:
                  raise SystemExit('refused quarantine cleanup crossed mutation boundary')
              values = {
                  'result_validated': True,
                  'state': state,
                  'accepted': accepted,
                  'cleanup_attempted': evidence.get('cleanup_attempted') is True,
                  'cleanup_verified': cleanup_verified,
                  'phone_mutation_performed': mutation,
                  'failure_substep': str(evidence.get('failure_substep') or 'none'),
              }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              for key, value in values.items():
                  if isinstance(value, bool):
                      value = str(value).lower()
                  handle.write(f'{key}={value}\n')
          PY

      - name: Upload bounded quarantine cleanup evidence (attempt 1)
        id: evidence-upload-1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-cleanup-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-cleanup.json
          if-no-files-found: warn
          retention-days: 30

      - name: Back off before quarantine cleanup evidence retry 2
        if: always() && steps.result.outputs.result_validated == 'true' && steps.evidence-upload-1.outcome == 'failure'
        shell: bash
        run: sleep 3

      - name: Upload bounded quarantine cleanup evidence (attempt 2)
        id: evidence-upload-2
        if: always() && steps.result.outputs.result_validated == 'true' && steps.evidence-upload-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-cleanup-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-cleanup.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Back off before quarantine cleanup evidence retry 3
        if: always() && steps.result.outputs.result_validated == 'true' && steps.evidence-upload-1.outcome == 'failure' && steps.evidence-upload-2.outcome == 'failure'
        shell: bash
        run: sleep 6

      - name: Upload bounded quarantine cleanup evidence (attempt 3)
        id: evidence-upload-3
        if: always() && steps.result.outputs.result_validated == 'true' && steps.evidence-upload-1.outcome == 'failure' && steps.evidence-upload-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-cleanup-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-cleanup.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Export quarantine cleanup evidence persistence state
        id: evidence-state
        if: always()
        shell: bash
        env:
          RESULT_OUTCOME: ${{ steps.result.outcome }}
          RESULT_VALIDATED: ${{ steps.result.outputs.result_validated }}
          EVIDENCE_UPLOAD_1_OUTCOME: ${{ steps.evidence-upload-1.outcome }}
          EVIDENCE_UPLOAD_2_OUTCOME: ${{ steps.evidence-upload-2.outcome }}
          EVIDENCE_UPLOAD_3_OUTCOME: ${{ steps.evidence-upload-3.outcome }}
        run: |
          set -euo pipefail
          persisted=false
          if [ "${RESULT_OUTCOME}" = success ] && [ "${RESULT_VALIDATED}" = true ]; then
            for outcome in "${EVIDENCE_UPLOAD_1_OUTCOME}" "${EVIDENCE_UPLOAD_2_OUTCOME}" "${EVIDENCE_UPLOAD_3_OUTCOME}"; do
              if [ "${outcome}" = success ]; then
                persisted=true
                break
              fi
            done
          fi
          echo "artifact_persisted=${persisted}" >> "$GITHUB_OUTPUT"

      - name: Require durable accepted cleanup
        if: always()
        shell: bash
        env:
          RESULT_VALIDATED: ${{ steps.result.outputs.result_validated }}
          ACCEPTED: ${{ steps.result.outputs.accepted }}
          CLEANUP_VERIFIED: ${{ steps.result.outputs.cleanup_verified }}
          ARTIFACT_PERSISTED: ${{ steps.evidence-state.outputs.artifact_persisted }}
        run: |
          set -euo pipefail
          test "${RESULT_VALIDATED}" = true
          test "${ACCEPTED}" = true
          test "${CLEANUP_VERIFIED}" = true
          test "${ARTIFACT_PERSISTED}" = true

  report:
    name: Publish bounded quarantine cleanup classification
    if: always() && needs.command-gate.result != 'skipped'
    needs: [command-gate, cleanup-quarantine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment bounded quarantine cleanup result on control issue
        uses: actions/github-script@v7
        env:
          CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
          OBSERVATION_RUN_ID: ${{ needs.command-gate.outputs.observation_run_id }}
          OBSERVATION_SOURCE_SHA: ${{ needs.command-gate.outputs.observation_source_sha }}
          OPERATION_TRANSACTION_ID: ${{ needs.command-gate.outputs.operation_transaction_id }}
          CLEANUP_JOB_RESULT: ${{ needs.cleanup-quarantine.result }}
          RESULT_VALIDATED: ${{ needs.cleanup-quarantine.outputs.result_validated }}
          STATE: ${{ needs.cleanup-quarantine.outputs.state }}
          ACCEPTED: ${{ needs.cleanup-quarantine.outputs.accepted }}
          CLEANUP_ATTEMPTED: ${{ needs.cleanup-quarantine.outputs.cleanup_attempted }}
          CLEANUP_VERIFIED: ${{ needs.cleanup-quarantine.outputs.cleanup_verified }}
          PHONE_MUTATION_PERFORMED: ${{ needs.cleanup-quarantine.outputs.phone_mutation_performed }}
          FAILURE_SUBSTEP: ${{ needs.cleanup-quarantine.outputs.failure_substep }}
          ARTIFACT_PERSISTED: ${{ needs.cleanup-quarantine.outputs.artifact_persisted }}
        with:
          script: |
            const validated = process.env.RESULT_VALIDATED === 'true';
            const persisted = process.env.ARTIFACT_PERSISTED === 'true';
            const accepted = process.env.ACCEPTED === 'true';
            const verified = process.env.CLEANUP_VERIFIED === 'true';
            const state = process.env.STATE || 'UNOBSERVED';
            const markerName = `phone-filesystem-dispatch-intent-${process.env.CANONICAL_SHA}-${process.env.OPERATION_TRANSACTION_ID}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const markers = artifacts.filter((artifact) => artifact.name === markerName && artifact.expired === false);
            if (markers.length > 1) {
              throw new Error('filesystem dispatch intent artifact is ambiguous');
            }
            const markerPersisted = markers.length === 1;
            let classification;
            if (markerPersisted && !validated) {
              classification = 'UNKNOWN_EXECUTION_OUTCOME';
            } else if (!validated) {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_UNOBSERVED';
            } else if (!persisted) {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_OBSERVED_UNPERSISTED';
            } else if (state === 'CLEANED' && accepted && verified) {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_PROVEN';
            } else if (state === 'ALREADY_CLEAN' && accepted && verified) {
              classification = 'FILESYSTEM_QUARANTINE_ALREADY_CLEAN';
            } else if (state === 'REFUSED') {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_REFUSED';
            } else if (state === 'QUARANTINED') {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_QUARANTINED';
            } else {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_INVALID';
            }
            const body = [
              '## CONTROL ANDROID FILESYSTEM QUARANTINE CLEANUP RESULT',
              '',
              `- classification: **${classification}**`,
              `- canonical_sha: \`${process.env.CANONICAL_SHA || 'unavailable'}\``,
              `- quality_run_id: \`${process.env.QUALITY_RUN_ID || 'unavailable'}\``,
              `- observation_run_id: \`${process.env.OBSERVATION_RUN_ID || 'unavailable'}\``,
              `- observation_source_ref: \`${process.env.OBSERVATION_SOURCE_SHA || 'unavailable'}\``,
              `- operation_transaction_id: \`${process.env.OPERATION_TRANSACTION_ID || 'unavailable'}\``,
              `- workflow_run_id: \`${context.runId}\``,
              `- cleanup_job_result: \`${process.env.CLEANUP_JOB_RESULT}\``,
              `- dispatch_intent_persisted: \`${markerPersisted}\``,
              `- domain/filesystem_generation: \`${markerPersisted ? process.env.OPERATION_TRANSACTION_ID : 'unadvanced'}\``,
              `- blind_retry_allowed: \`false\``,
              `- result_validated: \`${validated}\``,
              `- cleanup_state: \`${state}\``,
              `- accepted: \`${process.env.ACCEPTED || 'false'}\``,
              `- cleanup_attempted: \`${process.env.CLEANUP_ATTEMPTED || 'false'}\``,
              `- cleanup_verified: \`${process.env.CLEANUP_VERIFIED || 'false'}\``,
              `- artifact_persisted: \`${process.env.ARTIFACT_PERSISTED || 'false'}\``,
              `- phone_mutation_performed: \`${process.env.PHONE_MUTATION_PERFORMED || 'false'}\``,
              `- failure_substep: \`${process.env.FAILURE_SUBSTEP || 'unobserved'}\``,
              '- cleanup_scope: `explicit transaction IDs under fixed adapter-test bases only`',
              '- package_mutation_performed: `false`',
              '- runtime_lifecycle_mutation_performed: `false`',
              '- provider_access_performed: `false`',
              '- phone_reboot_performed: `false`',
              '- raw_directory_contents_recorded: `false`',
              '- raw_command_output_recorded: `false`',
              '- raw_device_identifier_recorded: `false`',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });