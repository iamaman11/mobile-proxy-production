name: Agent quarantine evidence retry patch

on:
  push:
    branches:
      - agent/quarantine-evidence-upload-retry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded persistence-only retry patch
        run: python3 tools/agent_quarantine_evidence_retry_patch.py

      - name: Commit bounded persistence retry hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phone-filesystem-quarantine-observation.yml
          git add .github/workflows/phone-filesystem-quarantine-cleanup.yml
          git add .github/workflows/filesystem-quarantine-recovery-policy.yml
          git rm .github/workflows/agent-quarantine-evidence-retry-patch.yml
          git rm tools/agent_quarantine_evidence_retry_patch.py
          git commit -m 'fix(control): retry quarantine evidence persistence'
          git push origin HEAD:${GITHUB_REF_NAME}
