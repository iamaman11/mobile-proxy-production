      - name: Revalidate exact authority at mutation boundary
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          deadline = int(os.environ['RECONSTRUCTION_MUTATION_DEADLINE_EPOCH'])
          if int(time.time()) > deadline:
              raise SystemExit('reconstruction mutation refused: rollback reserve would be violated')
          private = Path('private-execution')
          authority = json.loads((private / '.github/production/runtime-reconstruction-execution-authority.json').read_text(encoding='utf-8'))
          token = os.environ.get('GH_TOKEN', '')
          headers = {
              'Accept':'application/vnd.github+json',
              'Authorization':f'Bearer {token}',
              'User-Agent':'mobile-proxy-production-reconstruction-boundary',
              'X-GitHub-Api-Version':'2022-11-28',
          }
          public_headers = {k:v for k,v in headers.items() if k != 'Authorization'}

          def get_json(url, *, private_request=True):
              last = None
              for attempt in range(3):
                  if int(time.time()) > deadline:
                      raise SystemExit('reconstruction authority retry exceeded mutation admission deadline')
                  request = urllib.request.Request(url, headers=headers if private_request else public_headers)
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504):
                          raise
                      last = error
                  except (urllib.error.URLError, TimeoutError) as error:
                      last = error
                  if attempt < 2:
                      if int(time.time()) + attempt + 1 > deadline:
                          raise SystemExit('reconstruction authority backoff would exceed mutation admission deadline')
                      time.sleep(attempt + 1)
              raise SystemExit('reconstruction authority read failed after bounded retries') from last

          repository = os.environ['GITHUB_REPOSITORY']
          private_sha = os.environ['GITHUB_SHA']
          if get_json(f'https://api.github.com/repos/{repository}/commits/main').get('sha') != private_sha:
              raise SystemExit('private main drifted before reconstruction mutation')
          if get_json('https://api.github.com/repos/iamaman11/mobile-proxy/commits/main', private_request=False).get('sha') != os.environ['CANONICAL_SHA']:
              raise SystemExit('public main drifted before reconstruction mutation')
          quality = get_json(
              f"https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs/{os.environ['QUALITY_RUN_ID']}",
              private_request=False,
          )
          if not (
              quality.get('name') == 'Quality'
              and quality.get('event') == 'push'
              and quality.get('head_branch') == 'main'
              and quality.get('head_sha') == os.environ['CANONICAL_SHA']
              and quality.get('status') == 'completed'
              and quality.get('conclusion') == 'success'
          ):
              raise SystemExit('Quality authority drifted before reconstruction mutation')

          if authority.get('status') != 'armed':
              raise SystemExit('reconstruction authority disarmed before mutation')
          for key in ('phone_execution_authority','runtime_secret_access_authority','config_render_authority'):
              if authority.get(key) is not True:
                  raise SystemExit(f'execution authority disabled before mutation: {key}')
          for key in ('provider_access_authority','full_serving_authority','final_release_authority'):
              if authority.get(key) is not False:
                  raise SystemExit(f'forbidden authority enabled before mutation: {key}')
          readiness = authority['accepted_readiness']
          for run_id, expected_name, expected_event in (
              (readiness['transport_run_id'], 'Runtime reconstruction readiness transport', 'issue_comment'),
              (readiness['readiness_run_id'], 'Runtime reconstruction readiness', 'workflow_dispatch'),
          ):
              run = get_json(f'https://api.github.com/repos/{repository}/actions/runs/{run_id}')
              if not (
                  run.get('name') == expected_name
                  and run.get('event') == expected_event
                  and run.get('head_sha') == readiness['private_sha']
                  and run.get('status') == 'completed'
                  and run.get('conclusion') == 'success'
              ):
                  raise SystemExit('accepted inherited readiness drifted before mutation')

          evidence_path = Path(os.environ['RUNNER_TEMP']) / 'runtime-reconstruction-evidence.json'
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence.get('empty_prestate_accepted') is not True or evidence.get('release_staged') is not True:
              raise SystemExit('mutation boundary refused without admitted empty prestate and complete staged release')
          evidence['authority_revalidated_at_mutation_boundary'] = True
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('exact public/private/readiness authority revalidated immediately before mutation')
          PY

