          count=0
          for proc in /proc/[0-9]*; do
            [ -r "$proc/cmdline" ] || continue
            [ -r "$proc/exe" ] || continue
            cmd="$(tr '\000' ' ' < "$proc/cmdline")"
            exe="$(readlink -f "$proc/exe" 2>/dev/null || true)"
            if [ "$exe" = "{target}/bin/runtime-supervisor" ]; then
              case "$cmd" in *"--runtime-root /data/adb/mobile-proxy-node/current"*) count=$((count + 1)) ;; esac
            fi
          done
          [ "$count" -eq 1 ]
          '''
          port_shell = '''
          BB=""
          for candidate in /data/adb/magisk/busybox /debug_ramdisk/.magisk/busybox/busybox; do
            [ -x "$candidate" ] && BB="$candidate" && break
          done
          [ -n "$BB" ] || exit 1
          "$BB" nc -z -w 2 127.0.0.1 __PORT__ >/dev/null 2>&1
          '''
          deadline = time.monotonic() + 90
          accepted = False
          while time.monotonic() < deadline:
              supervisor = root_ok(supervisor_shell)
              egress = subprocess.run(
                  ['adb','-s',serial,'shell','dumpsys','activity','services','com.example.mobileproxy'],
                  capture_output=True, text=True, timeout=30,
              )
              egress_ok = egress.returncode == 0 and 'com.example.mobileproxy/.CellularEgressService' in egress.stdout
              port_18080 = root_ok(port_shell.replace('__PORT__', '18080'))
              port_1080 = root_ok(port_shell.replace('__PORT__', '1080'))
              if supervisor and egress_ok and port_18080 and port_1080:
                  accepted = True
                  break
              time.sleep(2)
          if not accepted:
              raise SystemExit('local-runtime-only reconstruction health did not converge')

          package = subprocess.run(
              ['adb','-s',serial,'shell','dumpsys','package','com.example.mobileproxy'],
              check=False, capture_output=True, text=True, timeout=60,
          )
          codes = re.findall(r'^\s*versionCode=([0-9]+)\b', package.stdout, re.MULTILINE)
          names = re.findall(r'^\s*versionName=([^\s]+)\s*$', package.stdout, re.MULTILINE)
          if package.returncode != 0 or codes != ['2'] or names != ['1.1.0']:
              raise SystemExit('installed APK baseline changed during reconstruction')

          evidence_path = Path(os.environ['RUNNER_TEMP']) / 'runtime-reconstruction-evidence.json'
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          evidence['local_runtime_health_accepted'] = True
          evidence['apk_unchanged'] = True
          evidence['rollback_required'] = False
          evidence['accepted'] = True
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('local-runtime-only reconstruction accepted: exact supervisor, app egress, 18080 and 1080 ready; no full-serving probe')
          PY

      - name: Roll back transaction-created canonical state on any failed acceptance
        if: failure()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          evidence_path = Path(os.environ['RUNNER_TEMP']) / 'runtime-reconstruction-evidence.json'
          if not evidence_path.is_file():
              raise SystemExit('reconstruction evidence missing; rollback state cannot be classified')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence.get('mutation_boundary_crossed') is not True:
              print('rollback not required: mutation boundary was not crossed')
              raise SystemExit(0)
          for key in (
              'root_dir_preexisting',
              'releases_dir_preexisting',
              'logs_dir_preexisting',
              'state_dir_preexisting',
          ):
              if evidence.get(key) not in (True, False):
                  raise SystemExit('rollback baseline directory classification is incomplete')

          serial = os.environ['ANDROID_PRODUCTION_SERIAL']
          release_id = os.environ['RECONSTRUCTION_RELEASE_ID']
          exec_id = os.environ['EXECUTION_ID']
          boot_baseline = evidence.get('boot_hook_baseline')
          args = [
              release_id,
              exec_id,
              str(boot_baseline),
              'true' if evidence['root_dir_preexisting'] else 'false',
              'true' if evidence['releases_dir_preexisting'] else 'false',
              'true' if evidence['logs_dir_preexisting'] else 'false',
              'true' if evidence['state_dir_preexisting'] else 'false',
          ]
          script = r'''
          set -eu
          ROOT=/data/adb/mobile-proxy-node
          REL="$1"
          EXEC="$2"
          BOOT_BASE="$3"
          ROOT_BASE="$4"
          RELEASES_BASE="$5"
          LOGS_BASE="$6"
          STATE_BASE="$7"
          TARGET="$ROOT/releases/$REL"
          BOOT=/data/adb/service.d/99-mobile-proxy-runtime.sh
          ROUTEFIX=/data/adb/service.d/99-mobile-proxy-routefix.sh
          BACKUP="/data/local/tmp/mobile-proxy-reconstruct-backup-${EXEC}"

          if [ -f "$ROOT/logs/runtime-watchdog.pid" ]; then
            pid="$(cat "$ROOT/logs/runtime-watchdog.pid" 2>/dev/null || true)"
            if [ -n "$pid" ] && [ -r "/proc/$pid/cmdline" ]; then
              cmd="$(tr '\000' ' ' < "/proc/$pid/cmdline")"
              case "$cmd" in *"$ROOT/logs/runtime-watchdog.sh"*"$ROOT/current"*) kill -TERM "$pid" 2>/dev/null || true ;; esac
            fi
          fi
          for proc in /proc/[0-9]*; do
            [ -r "$proc/exe" ] || continue
            exe="$(readlink -f "$proc/exe" 2>/dev/null || true)"
            case "$exe" in "$TARGET"/*) kill -TERM "${proc#/proc/}" 2>/dev/null || true ;; esac
          done
          sleep 1

          if [ -L "$ROOT/current" ] && [ "$(readlink "$ROOT/current")" = "$TARGET" ]; then
            rm -f "$ROOT/current"
          elif [ -e "$ROOT/current" ] || [ -L "$ROOT/current" ]; then
            exit 51
          fi
          rm -rf "$TARGET"

          if [ "$BOOT_BASE" = present ]; then
            [ -f "$BACKUP/boot-hook" ] || exit 52
            cp -p "$BACKUP/boot-hook" "$BOOT"
          elif [ "$BOOT_BASE" = absent ]; then
            rm -f "$BOOT"
          else
            exit 53
          fi

          rm -rf "$ROOT/logs" "$ROOT/state"
          if [ "$LOGS_BASE" = true ]; then
            [ -d "$BACKUP/logs" ] || exit 54
            cp -pR "$BACKUP/logs" "$ROOT/logs"
          fi
          if [ "$STATE_BASE" = true ]; then
            [ -d "$BACKUP/state" ] || exit 55
            cp -pR "$BACKUP/state" "$ROOT/state"
          fi

          count=0
          if [ -d "$ROOT/releases" ]; then
            for item in "$ROOT"/releases/*; do
              [ -e "$item" ] || [ -L "$item" ] || continue
              count=$((count + 1))
            done
          fi
          [ "$count" -eq 0 ] || exit 56
          if [ "$RELEASES_BASE" = false ] && [ -d "$ROOT/releases" ]; then
            rmdir "$ROOT/releases"
          fi
          if [ "$ROOT_BASE" = false ] && [ -d "$ROOT" ]; then
            rmdir "$ROOT"
          fi

          [ ! -e "$ROOT/current" ] && [ ! -L "$ROOT/current" ]
          [ ! -e "$ROUTEFIX" ] && [ ! -L "$ROUTEFIX" ]
          if [ "$ROOT_BASE" = true ]; then [ -d "$ROOT" ]; else [ ! -e "$ROOT" ]; fi
          if [ "$RELEASES_BASE" = true ]; then [ -d "$ROOT/releases" ]; else [ ! -e "$ROOT/releases" ]; fi
          if [ "$LOGS_BASE" = true ]; then [ -d "$ROOT/logs" ]; else [ ! -e "$ROOT/logs" ]; fi
          if [ "$STATE_BASE" = true ]; then [ -d "$ROOT/state" ]; else [ ! -e "$ROOT/state" ]; fi
          if [ "$BOOT_BASE" = present ]; then [ -f "$BOOT" ] && [ ! -L "$BOOT" ]; else [ ! -e "$BOOT" ] && [ ! -L "$BOOT" ]; fi

          for proc in /proc/[0-9]*; do
            [ -r "$proc/cmdline" ] || continue
            cmd="$(tr '\000' ' ' < "$proc/cmdline")"
            exe="$(readlink -f "$proc/exe" 2>/dev/null || true)"
            case "$exe" in "$ROOT"/*) exit 57 ;; esac
            case "$cmd" in *"$ROOT"*|*"/data/local/tmp/mobile-proxy-logs/runtime-watchdog.sh"*) exit 58 ;; esac
          done

          rm -rf "$BACKUP" "/data/local/tmp/mobile-proxy-reconstruct-${EXEC}"
          '''
          evidence['rollback_attempted'] = True
          result = subprocess.run(
              ['adb','-s',serial,'shell','su','0','sh','-s','--',*args],
              input=script, text=True, capture_output=True, timeout=420,
          )
          if result.returncode != 0:
              evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              raise SystemExit('reconstruction rollback could not prove exact restoration of admitted empty prestate')
          evidence['rollback_restored_empty_prestate'] = True
          evidence['rollback_required'] = False
          evidence['accepted'] = False
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('reconstruction rollback restored admitted empty canonical prestate and bounded mutable directories')
          PY

      - name: Clean ephemeral rendered release and bounded phone staging
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path

          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'device-releases', ignore_errors=True)
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'reconstruction-bundle', ignore_errors=True)
          evidence_path = Path(os.environ['RUNNER_TEMP']) / 'runtime-reconstruction-evidence.json'
          if not evidence_path.is_file():
              raise SystemExit(0)
          try:
              evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(0)
          if evidence.get('phone_access_started') is not True:
              raise SystemExit(0)
          serial = os.environ.get('ANDROID_PRODUCTION_SERIAL', '')
          exec_id = os.environ.get('EXECUTION_ID', '')
          if not serial or not exec_id:
              raise SystemExit(0)
          subprocess.run(
              ['adb','-s',serial,'shell','rm','-rf',f'/data/local/tmp/mobile-proxy-reconstruct-{exec_id}'],
              check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30,
          )
          if evidence.get('accepted') is True or evidence.get('rollback_restored_empty_prestate') is True:
              subprocess.run(
                  ['adb','-s',serial,'shell','rm','-rf',f'/data/local/tmp/mobile-proxy-reconstruct-backup-{exec_id}'],
                  check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30,
              )
          PY
          unset MOBILE_PROXY_ADMIN_TOKEN MOBILE_PROXY_DEVICE_TOKEN MOBILE_PROXY_UI_TOKEN
          unset MOBILE_PROXY_RELAY_USER MOBILE_PROXY_RELAY_PASSWORD MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64
          exit 0

      - name: Upload bounded reconstruction and rollback evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-reconstruction-evidence-${{ env.EXECUTION_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-reconstruction-evidence.json
          if-no-files-found: error
          retention-days: 30
