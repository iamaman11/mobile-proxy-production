name: Production phone local runtime reconstruction gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  command-gate:
    name: Validate one-time local reconstruction execution authority
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/runtime-reconstruction-execute ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_sha: ${{ steps.authority.outputs.canonical_sha }}
      quality_run_id: ${{ steps.authority.outputs.quality_run_id }}
      execution_id: ${{ steps.authority.outputs.execution_id }}
    steps:
      - name: Check out exact private execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution
          persist-credentials: false

      - name: Validate exact one-time command, inherited readiness, and current authority
        id: authority
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PRIVATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          authority_path = Path(
              'private-execution/.github/production/runtime-reconstruction-execution-authority.json'
          )
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          expected_command = (
              f"{authority['command_prefix']} {authority['execution_id']} {authority['canonical_sha']}"
          )
          command = os.environ.get('COMMAND', '').strip()
          if command != expected_command:
              raise SystemExit('reconstruction execution command differs from exact one-time authority')
          if authority.get('status') != 'armed':
              raise SystemExit('reconstruction execution authority is not armed')
          for key in (
              'phone_execution_authority',
              'runtime_secret_access_authority',
              'config_render_authority',
          ):
              if authority.get(key) is not True:
                  raise SystemExit(f'reconstruction execution authority not enabled: {key}')
          for key in (
              'provider_access_authority',
              'full_serving_authority',
              'final_release_authority',
          ):
              if authority.get(key) is not False:
                  raise SystemExit(f'forbidden reconstruction execution authority enabled: {key}')
          if authority.get('recovery_health_scope') != 'local_runtime_only':
              raise SystemExit('reconstruction execution health scope drift')
          if authority.get('item20_transport_authority') != 'deferred_to_sealed_handoff':
              raise SystemExit('Item20 authority must remain deferred')
          if authority.get('duplicate_rule') != 'first_exact_issue_comment_only':
              raise SystemExit('reconstruction duplicate-command rule drift')

          token = os.environ.get('GH_TOKEN', '')
          if not token:
              raise SystemExit('GitHub token unavailable for private authority validation')
          repository = os.environ['REPOSITORY']
          owner = os.environ['REPOSITORY_OWNER']
          private_sha = os.environ['PRIVATE_SHA']
          comment_id = int(os.environ['COMMENT_ID'])
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'mobile-proxy-production-runtime-reconstruction-execution-gate',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          public_headers = {
              key: value for key, value in headers.items() if key != 'Authorization'
          }

          def get_json(url, *, private=True):
              request = urllib.request.Request(url, headers=headers if private else public_headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          matching_comment_ids = []
          for page in range(1, 11):
              comments = get_json(
                  f'https://api.github.com/repos/{repository}/issues/1/comments?per_page=100&page={page}'
              )
              if not comments:
                  break
              for item in comments:
                  if (
                      item.get('user', {}).get('login') == owner
                      and str(item.get('body', '')).strip() == expected_command
                      and isinstance(item.get('id'), int)
                  ):
                      matching_comment_ids.append(item['id'])
              if len(comments) < 100:
                  break
          if not matching_comment_ids:
              raise SystemExit('exact reconstruction execution command comment not found')
          if comment_id != min(matching_comment_ids):
              raise SystemExit('duplicate reconstruction execution command refused before phone access')

          if get_json(f'https://api.github.com/repos/{repository}/commits/main').get('sha') != private_sha:
              raise SystemExit('reconstruction execution gate must run from exact current private main')
          canonical_sha = authority['canonical_sha']
          if get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/commits/main',
              private=False,
          ).get('sha') != canonical_sha:
              raise SystemExit('reconstruction execution canonical SHA is not current public main')

          quality = get_json(
              f"https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs/{authority['quality_run_id']}",
              private=False,
          )
          if not (
              quality.get('name') == 'Quality'
              and quality.get('event') == 'push'
              and quality.get('head_branch') == 'main'
              and quality.get('head_sha') == canonical_sha
              and quality.get('status') == 'completed'
              and quality.get('conclusion') == 'success'
          ):
              raise SystemExit('exact reconstruction execution Quality authority is not successful')

          readiness = authority['accepted_readiness']
          source_private_sha = authority['source_private_sha']
          if readiness.get('private_sha') != source_private_sha:
              raise SystemExit('accepted readiness private SHA differs from source authority')
          accepted_comment = get_json(
              f"https://api.github.com/repos/{repository}/issues/comments/{readiness['owner_comment_id']}"
          )
          if not (
              accepted_comment.get('user', {}).get('login') == owner
              and str(accepted_comment.get('body', '')).strip()
              == '/runtime-reconstruction-readiness RUN_ENROLLED_LOCAL_RECOVERY_READINESS'
          ):
              raise SystemExit('accepted readiness owner comment differs from exact authority')

          transport = get_json(
              f"https://api.github.com/repos/{repository}/actions/runs/{readiness['transport_run_id']}"
          )
          child = get_json(
              f"https://api.github.com/repos/{repository}/actions/runs/{readiness['readiness_run_id']}"
          )
          if not (
              transport.get('name') == 'Runtime reconstruction readiness transport'
              and transport.get('event') == 'issue_comment'
              and transport.get('head_sha') == source_private_sha
              and transport.get('status') == 'completed'
              and transport.get('conclusion') == 'success'
          ):
              raise SystemExit('accepted readiness transport run differs from exact authority')
          if not (
              child.get('name') == 'Runtime reconstruction readiness'
              and child.get('event') == 'workflow_dispatch'
              and child.get('head_sha') == source_private_sha
              and child.get('status') == 'completed'
              and child.get('conclusion') == 'success'
          ):
              raise SystemExit('accepted readiness child run differs from exact authority')

          binding = json.loads(
              Path('private-execution', authority['reconstruction_binding_path']).read_text(encoding='utf-8')
          )
          for key, value in {
              'binding_role': 'private_execution_only',
              'canonical_repository': authority['canonical_repository'],
              'canonical_sha': authority['canonical_sha'],
              'quality_required': True,
              'final_release_authority': False,
              'phone_execution_authority': True,
              'provider_credentials_allowed': False,
              'recovery_health_scope': 'local_runtime_only',
              'full_serving_authority': False,
              'item20_transport_authority': 'deferred_to_sealed_handoff',
          }.items():
              if binding.get(key) != value:
                  raise SystemExit(f'current reconstruction binding differs from armed execution authority: {key}')
          if binding.get('enrollment_status') != 'enrolled':
              raise SystemExit('current reconstruction binding is not enrolled')

          for path in (
              authority['reconstruction_manifest_path'],
              authority['readiness_workflow_path'],
          ):
              encoded = urllib.parse.quote(path, safe='/')
              source = get_json(
                  f'https://api.github.com/repos/{repository}/contents/{encoded}?ref={source_private_sha}'
              )
              current = get_json(
                  f'https://api.github.com/repos/{repository}/contents/{encoded}?ref={private_sha}'
              )
              if source.get('sha') != current.get('sha'):
                  raise SystemExit('inherited readiness source identity changed after accepted readiness')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"canonical_sha={authority['canonical_sha']}\n")
              handle.write(f"quality_run_id={authority['quality_run_id']}\n")
              handle.write(f"execution_id={authority['execution_id']}\n")

          print('reconstruction execution hosted authority gate: accepted')
          print('first_exact_comment=true')
          print('accepted_readiness_inherited=true')
          print('source_identity_unchanged=true')
          print('phone_execution_authority=true')
          print('runtime_secret_access=true')
          print('config_render_authority=true')
          print('provider_access=false')
          print('phone_access=false')
          PY

  build:
    name: Build exact non-secret Android ARM reconstruction runtime
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      EXECUTION_ID: ${{ needs.command-gate.outputs.execution_id }}
    steps:
      - name: Check out exact canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ env.CANONICAL_SHA }}
          path: canonical
          persist-credentials: false

      - name: Resolve installed Android NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          candidates = []
          for key in ('ANDROID_NDK_HOME', 'ANDROID_NDK_ROOT'):
              value = os.environ.get(key)
              if value:
                  candidates.append(Path(value))
          sdk = os.environ.get('ANDROID_SDK_ROOT') or os.environ.get('ANDROID_HOME')
          if sdk:
              root = Path(sdk) / 'ndk'
              if root.is_dir():
                  candidates.extend(sorted((p for p in root.iterdir() if p.is_dir()), reverse=True))
          for candidate in candidates:
              clang = candidate / 'toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi23-clang'
              ar = candidate / 'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
              if clang.is_file() and ar.is_file():
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
                      handle.write(f'path={candidate}\n')
                  raise SystemExit(0)
          raise SystemExit('no compatible Android NDK found on hosted runner')
          PY

      - name: Build exact canonical runtime binaries
        shell: bash
        working-directory: canonical
        run: |
          set -euo pipefail
          cargo run --locked -p operator-cli --bin operator-cli -- prepare-runtime-binaries --android-ndk '${{ steps.ndk.outputs.path }}'
          file deploy/device-runtime/bin/runtime-supervisor deploy/device-runtime/bin/host-daemon deploy/device-runtime/bin/sing-box

      - name: Stage bounded non-secret reconstruction bundle
        shell: bash
        working-directory: canonical
        run: |
          set -euo pipefail
          mkdir -p ../reconstruction-bundle/bin
          cp deploy/device-runtime/bin/runtime-supervisor ../reconstruction-bundle/bin/runtime-supervisor
          cp deploy/device-runtime/bin/host-daemon ../reconstruction-bundle/bin/host-daemon
          cp deploy/device-runtime/bin/sing-box ../reconstruction-bundle/bin/sing-box
          chmod 0755 ../reconstruction-bundle/bin/*
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('../reconstruction-bundle')
          files = {}
          for path in sorted((root / 'bin').iterdir()):
              files[path.name] = {
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'size': path.stat().st_size,
              }
          (root / 'build-evidence.json').write_text(json.dumps({
              'format_version': 1,
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'private_execution_sha': os.environ['GITHUB_SHA'],
              'execution_id': os.environ['EXECUTION_ID'],
              'contains_production_secrets': False,
              'phone_access_performed': False,
              'provider_access_performed': False,
              'files': files,
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Upload exact non-secret reconstruction bundle
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-reconstruction-${{ env.EXECUTION_ID }}-${{ github.run_id }}
          path: reconstruction-bundle
          if-no-files-found: error
          retention-days: 7

  reconstruct-phone:
    name: Globally serialized local-runtime reconstruction
    needs: [command-gate, build]
    if: ${{ needs.command-gate.result == 'success' && needs.build.result == 'success' }}
    concurrency:
      group: production-phone-global-mutation
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 45
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      EXECUTION_ID: ${{ needs.command-gate.outputs.execution_id }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      MOBILE_PROXY_ADMIN_TOKEN: ${{ secrets.MOBILE_PROXY_ADMIN_TOKEN }}
      MOBILE_PROXY_DEVICE_TOKEN: ${{ secrets.MOBILE_PROXY_DEVICE_TOKEN }}
      MOBILE_PROXY_UI_TOKEN: ${{ secrets.MOBILE_PROXY_UI_TOKEN }}
      MOBILE_PROXY_RELAY_USER: ${{ secrets.MOBILE_PROXY_RELAY_USER }}
      MOBILE_PROXY_RELAY_PASSWORD: ${{ secrets.MOBILE_PROXY_RELAY_PASSWORD }}
      MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64: ${{ secrets.MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64 }}
    steps:
      - name: Initialize bounded reconstruction transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          started = int(time.time())
          mutation_deadline = started + 900
          evidence = {
              'format_version': 1,
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'private_execution_sha': os.environ['GITHUB_SHA'],
              'execution_id': os.environ['EXECUTION_ID'],
              'phone_access_started': False,
              'authority_revalidated_at_mutation_boundary': False,
              'empty_prestate_accepted': False,
              'boot_hook_baseline': 'unobserved',
              'root_dir_preexisting': None,
              'releases_dir_preexisting': None,
              'logs_dir_preexisting': None,
              'state_dir_preexisting': None,
              'bounded_prestate_backup_complete': False,
              'release_rendered_ephemerally': False,
              'release_integrity_verified': False,
              'release_staged': False,
              'mutation_boundary_crossed': False,
              'release_materialized': False,
              'current_published': False,
              'runtime_started': False,
              'local_runtime_health_accepted': False,
              'apk_unchanged': False,
              'rollback_required': False,
              'rollback_attempted': False,
              'rollback_restored_empty_prestate': False,
              'config_reconstruction_performed': False,
              'config_mutation_performed': False,
              'apk_mutation_performed': False,
              'provider_access_performed': False,
              'phone_reboot_performed': False,
              'full_serving_probe_performed': False,
              'raw_device_identifier_recorded': False,
              'raw_manifest_recorded': False,
              'rendered_config_recorded': False,
              'runtime_secret_values_recorded': False,
              'config_digest_recorded': False,
              'credential_derived_identifiers_recorded': False,
              'raw_process_identifier_recorded': False,
              'accepted': False,
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'runtime-reconstruction-evidence.json'
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'RECONSTRUCTION_MUTATION_DEADLINE_EPOCH={mutation_deadline}\n')
              handle.write(f'RECONSTRUCTION_RELEASE_ID=recovery-{os.environ["CANONICAL_SHA"][:12]}-{os.environ["EXECUTION_ID"][:8]}\n')
          print('bounded reconstruction initialized: first mutation must begin within 15 minutes')
          PY

      - name: Check out exact private execution state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution
          persist-credentials: false

      - name: Check out exact canonical public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ env.CANONICAL_SHA }}
          path: canonical
          persist-credentials: false

      - name: Download exact reconstruction bundle attempt 1
        id: reconstruction-download-1
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-reconstruction-${{ env.EXECUTION_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/reconstruction-bundle

      - name: Reset reconstruction bundle before retry 2
        if: steps.reconstruction-download-1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/reconstruction-bundle"
          sleep 1

      - name: Download exact reconstruction bundle attempt 2
        id: reconstruction-download-2
        timeout-minutes: 2
        if: steps.reconstruction-download-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-reconstruction-${{ env.EXECUTION_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/reconstruction-bundle

      - name: Reset reconstruction bundle before retry 3
        if: steps.reconstruction-download-1.outcome == 'failure' && steps.reconstruction-download-2.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/reconstruction-bundle"
          sleep 2

      - name: Download exact reconstruction bundle attempt 3
        id: reconstruction-download-3
        timeout-minutes: 2
        if: steps.reconstruction-download-1.outcome == 'failure' && steps.reconstruction-download-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-reconstruction-${{ env.EXECUTION_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/reconstruction-bundle

      - name: Require exact same-run bundle and armed execution authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          private = Path('private-execution')
          authority = json.loads((private / '.github/production/runtime-reconstruction-execution-authority.json').read_text(encoding='utf-8'))
          binding = json.loads((private / '.github/production/runtime-reconstruction-binding.json').read_text(encoding='utf-8'))
          manifest_path = private / '.github/production/runtime-reconstruction-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          normalized = json.dumps(manifest, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          enrolled = binding.get('manifest_fingerprint', {}).get('sha256')
          if not isinstance(enrolled, str) or hashlib.sha256(normalized).hexdigest() != enrolled:
              raise SystemExit('enrolled synthetic manifest identity differs')
          if authority.get('execution_id') != os.environ['EXECUTION_ID']:
              raise SystemExit('execution authority ID differs')
          if authority.get('canonical_sha') != os.environ['CANONICAL_SHA']:
              raise SystemExit('execution canonical SHA differs')
          for key in ('phone_execution_authority', 'runtime_secret_access_authority', 'config_render_authority'):
              if authority.get(key) is not True:
                  raise SystemExit(f'armed reconstruction authority is not enabled: {key}')
          if authority.get('status') != 'armed':
              raise SystemExit('reconstruction execution status is not armed')
          for key in ('provider_access_authority', 'full_serving_authority', 'final_release_authority'):
              if authority.get(key) is not False:
                  raise SystemExit(f'forbidden reconstruction authority enabled: {key}')
          if authority.get('recovery_health_scope') != 'local_runtime_only':
              raise SystemExit('reconstruction health scope differs')
          if authority.get('item20_transport_authority') != 'deferred_to_sealed_handoff':
              raise SystemExit('Item20 transport must remain deferred')
          if binding.get('enrollment_status') != 'enrolled':
              raise SystemExit('reconstruction manifest is not enrolled')
          if binding.get('phone_execution_authority') is not True:
              raise SystemExit('binding phone execution authority is not enabled')
          if binding.get('full_serving_authority') is not False or binding.get('provider_credentials_allowed') is not False:
              raise SystemExit('binding widened into serving/provider authority')
          if binding.get('recovery_health_scope') != 'local_runtime_only':
              raise SystemExit('binding local runtime scope differs')

          root = Path(os.environ['RUNNER_TEMP']) / 'reconstruction-bundle'
          evidence_path = root / 'build-evidence.json'
          if not evidence_path.is_file():
              raise SystemExit('same-run reconstruction build evidence is absent')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if not (
              evidence.get('format_version') == 1
              and evidence.get('canonical_sha') == os.environ['CANONICAL_SHA']
              and evidence.get('quality_run_id') == int(os.environ['QUALITY_RUN_ID'])
              and evidence.get('private_execution_sha') == os.environ['GITHUB_SHA']
              and evidence.get('execution_id') == os.environ['EXECUTION_ID']
              and evidence.get('contains_production_secrets') is False
          ):
              raise SystemExit('same-run reconstruction bundle authority differs')
          expected = {'runtime-supervisor', 'host-daemon', 'sing-box'}
          if set(evidence.get('files', {})) != expected:
              raise SystemExit('same-run reconstruction binary set differs')
          for name in sorted(expected):
              path = root / 'bin' / name
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit('same-run reconstruction runtime binary missing')
              if hashlib.sha256(path.read_bytes()).hexdigest() != evidence['files'][name]['sha256']:
                  raise SystemExit('same-run reconstruction runtime binary digest differs')

          for name in (
              'MOBILE_PROXY_ADMIN_TOKEN',
              'MOBILE_PROXY_DEVICE_TOKEN',
              'MOBILE_PROXY_UI_TOKEN',
              'MOBILE_PROXY_RELAY_USER',
              'MOBILE_PROXY_RELAY_PASSWORD',
              'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64',
          ):
              value = os.environ.get(name, '')
              if not value or len(value) > 4096:
                  raise SystemExit('required bounded runtime secret is unavailable')
          if not os.environ.get('ANDROID_PRODUCTION_SERIAL', ''):
              raise SystemExit('registered production device selector is unavailable')
          print('same-run source bundle, enrolled manifest, and armed reconstruction authority accepted')
          PY

      - name: Require exact user-local Rust toolchain before render or phone access
        shell: bash
        run: |
          set -euo pipefail
          CARGO_HOME="${HOME}/.cargo"
          RUSTUP_HOME="${HOME}/.rustup"
          PATH="${CARGO_HOME}/bin:${PATH}"
          export CARGO_HOME RUSTUP_HOME PATH
          test "$CARGO_HOME" = "${HOME}/.cargo"
          test "$RUSTUP_HOME" = "${HOME}/.rustup"
          test "$(command -v cargo)" = "$CARGO_HOME/bin/cargo"
          test "$(command -v rustc)" = "$CARGO_HOME/bin/rustc"
          "$CARGO_HOME/bin/cargo" --version | grep -Eq '^cargo 1\.95\.0([[:space:]]|$)'
          "$CARGO_HOME/bin/rustc" --version | grep -Eq '^rustc 1\.95\.0([[:space:]]|$)'
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo 'reconstruction_rust_prerequisite=true'
          echo 'config_rendered=false'
          echo 'phone_access=false'

