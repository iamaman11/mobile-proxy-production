name: APK transaction integration policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-apk-transaction-integration:
    name: Validate controller-owned APK Release transaction seam
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove Android transaction contract without public source checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/controller/tests/test_controller.py
          python3 .github/controller/tests/test_release_resolver.py
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/release-deployment.yml').read_text(encoding='utf-8')
          runner = Path('.github/scripts/run_phone_release_deployment.py').read_text(encoding='utf-8')
          resolver = Path('.github/controller/release_resolver.py').read_text(encoding='utf-8')

          if 'repository: iamaman11/mobile-proxy' in workflow or 'ref: main' in workflow:
              raise SystemExit('APK deployment must consume Release assets, not public source checkout')
          for required in (
              'mobile-proxy-android-',
              'release-manifest.json',
              'provenance.json',
              'artifact-digests.json',
              'blake3-256',
              'mobile-proxy/product-release-asset/v2',
              'content_digest',
              'android-apk',
          ):
              if required not in resolver:
                  raise SystemExit('Product Release v2 admission contract missing ' + required)
          if 'SHA256SUMS' in resolver:
              raise SystemExit('obsolete SHA256SUMS Product identity contract remains reachable')
          if 'artifact_transport_sha256' not in resolver or 'artifact_transport_sha256' not in runner:
              raise SystemExit('transport SHA-256 is not separated from typed Product content identity')
          if 'verify_artifact(' not in runner or 'dispatch_install_once(' not in runner or 'observe(' not in runner:
              raise SystemExit('Android transaction does not connect verify/dispatch/postcondition seams')
          if 'latest' in resolver.lower():
              raise SystemExit('latest must never be deployment authority')
          print('APK_RELEASE_TRANSACTION_INTEGRATION_OK')
          PY
