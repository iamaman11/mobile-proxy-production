name: APK transaction integration policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-apk-transaction-integration:
    name: Validate Stage C.0g APK transaction execution seam
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution seam
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: private-control

      - name: Check out current canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: main
          path: canonical
          persist-credentials: false

      - name: Validate private ports against canonical APK transaction truth table
        working-directory: private-control
        run: >-
          python3 .github/scripts/test_apk_transaction_integration.py
          --canonical-root ../canonical
