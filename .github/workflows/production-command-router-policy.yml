name: Production deployment controller policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deployment-controller-binding-prerequisites:
    name: Require deployment-controller bindings at workflow-call boundary
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deployment-controller-binding-probe.yml
    secrets: inherit

  controller-hosted-acceptance:
    name: Validate controller boundary and fault-injection invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile controller and run pure hosted acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/controller/*.py \
            .github/controller/tests/*.py \
            .github/scripts/deployment_command_router.py \
            .github/scripts/deployment_execution.py \
            .github/scripts/prepare_release_deployment.py \
            .github/scripts/finalize_deployment_projection.py \
            .github/scripts/run_phone_release_deployment.py
          python3 .github/controller/tests/test_controller.py
          python3 .github/controller/tests/test_evidence_store.py
          python3 .github/controller/tests/test_projection_reconciler.py
          python3 .github/controller/tests/test_release_resolver.py

      - name: Prove accepted public Product Release v0.1.4 resolves off-device
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/controller').resolve()))
          from release_resolver import resolve_release

          admitted = resolve_release(tag='v0.1.4', target='phone-production')
          identity = admitted.identity
          if identity.release_id != 382429107:
              raise SystemExit('v0.1.4 Release id differs from accepted immutable Product Release')
          if identity.source_sha != 'ff882e5ca5116fa90b80f15c6cc019f88e68ccfa':
              raise SystemExit('v0.1.4 source SHA differs from accepted Product Release')
          if identity.artifact_name != 'mobile-proxy-android-v0.1.4.apk':
              raise SystemExit('v0.1.4 Android artifact name differs')
          if re.fullmatch(r'b3:[0-9a-f]{64}', identity.artifact_digest) is None:
              raise SystemExit('v0.1.4 Product content identity is not typed BLAKE3')
          if re.fullmatch(r'[0-9a-f]{64}', admitted.artifact_transport_sha256) is None:
              raise SystemExit('v0.1.4 transport sha256 is invalid')
          if admitted.android_package != 'com.example.mobileproxy' or admitted.android_version_name != '0.1.4':
              raise SystemExit('v0.1.4 Android package/version contract differs')
          if not isinstance(admitted.android_version_code, int) or admitted.android_version_code <= 0:
              raise SystemExit('v0.1.4 Android versionCode is invalid')
          if admitted.immutability_control != 'github-immutable-release':
              raise SystemExit('v0.1.4 immutability control differs')
          print('REAL_PRODUCT_RELEASE_V2_RESOLVER_OK tag=v0.1.4 target=phone-production')
          PY

      - name: Enforce repository ownership boundary and one Issue ingress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import re
          from pathlib import Path

          workflows = Path('.github/workflows')
          router = (workflows / 'production-control-router.yml').read_text(encoding='utf-8')
          deployment = (workflows / 'release-deployment.yml').read_text(encoding='utf-8')
          ack_script = Path('.github/scripts/deployment_execution.py').read_text(encoding='utf-8')
          controller_files = list(Path('.github/controller').glob('*.py'))
          v2_scripts = [
              Path('.github/scripts/deployment_command_router.py'),
              Path('.github/scripts/deployment_execution.py'),
              Path('.github/scripts/prepare_release_deployment.py'),
              Path('.github/scripts/finalize_deployment_projection.py'),
              Path('.github/scripts/run_phone_release_deployment.py'),
          ]

          direct_ingress = sorted(
              path.name
              for path in workflows.glob('*.yml')
              if re.search(r'(?m)^  issue_comment:\s*$', path.read_text(encoding='utf-8'))
          )
          if direct_ingress != ['production-control-router.yml']:
              raise SystemExit('exactly one private Issue command ingress is required: ' + repr(direct_ingress))

          required_router = (
              "github.event.issue.number == 1",
              "github.event.comment.user.login == github.repository_owner",
              "startsWith(github.event.comment.body, '/deploy ')",
              '.github/scripts/deployment_command_router.py',
              '.github/scripts/deployment_execution.py',
              './.github/workflows/release-deployment.yml',
          )
          missing = [item for item in required_router if item not in router]
          if missing:
              raise SystemExit('deployment router contract incomplete: ' + ', '.join(missing))
          if '## DEPLOYMENT EXECUTION ACK' not in ack_script:
              raise SystemExit('deployment ACK contract is missing')

          forbidden_router = (
              'authority_cursor',
              'issue179-comment-',
              'production_command_router.py',
              'physical-transaction-readiness.yml',
              'filesystem-scratch-kernel-rehearsal.yml',
          )
          present = [item for item in forbidden_router if item in router]
          if present:
              raise SystemExit('legacy runtime cursor/kernel route remains reachable: ' + ', '.join(present))

          combined = '\n'.join(path.read_text(encoding='utf-8') for path in controller_files + v2_scripts)
          if 'issue179-comment-' in combined or 'authority_cursor' in combined:
              raise SystemExit('deployment controller v2 depends on development tracker cursor')
          if 'canonical-public' in deployment or 'repository: iamaman11/mobile-proxy' in deployment:
              raise SystemExit('controller workflow checks out mutable/public product source instead of Release assets')
          if 'PUBLIC_DEPLOYMENTS_TOKEN' not in deployment:
              raise SystemExit('public Deployment projection lacks dedicated minimal credential boundary')
          if 'production-target-phone-production' not in deployment or 'cancel-in-progress: false' not in deployment:
              raise SystemExit('phone target global mutation serialization is missing')
          if 'runs-on: [self-hosted, Linux, X64, android-production]' not in deployment:
              raise SystemExit('Android physical adapter is not confined to registered target runner')

          projection_required = (
              'admission_ref:',
              'persist durable admission',
              'finalize-phone-projection:',
              'needs: [admit, execute-phone]',
              'always() && needs.admit.outputs.admitted',
              'runs-on: ubuntu-latest',
              '.github/scripts/finalize_deployment_projection.py',
              'TARGET_JOB_RESULT:',
              'needs.execute-phone.result',
          )
          missing_projection = [item for item in projection_required if item not in deployment]
          if missing_projection:
              raise SystemExit('durable public projection lifecycle contract incomplete: ' + ', '.join(missing_projection))

          finalizer = Path('.github/controller/projection_reconciler.py').read_text(encoding='utf-8')
          if 'state="error"' not in finalizer or 'canonical_terminal=False' not in finalizer:
              raise SystemExit('pre-terminal projection finalizer does not fail closed to public error')
          if 'payload.get("state") != "ACCEPTED"' not in finalizer:
              raise SystemExit('public success is not guarded by canonical ACCEPTED terminal')
          if 'projection.status(' not in finalizer:
              raise SystemExit('public projection reconciler status call is missing')
          forbidden_finalizer = ('persist_terminal(', 'persist_intent(', 'persist_admission(', 'dispatch_install_once(', 'observe(')
          present_finalizer = [item for item in forbidden_finalizer if item in finalizer]
          if present_finalizer:
              raise SystemExit('hosted projection finalizer can mutate canonical/physical state: ' + ', '.join(present_finalizer))

          admission_source = Path('.github/controller/evidence_store.py').read_text(encoding='utf-8')
          for required in ('## DEPLOYMENT ADMISSION V2', 'mutation_authority', 'dispatch_authority', 'persist_admission'):
              if required not in admission_source:
                  raise SystemExit('durable non-mutation admission contract incomplete: ' + required)

          run_path = Path('.github/scripts/run_phone_release_deployment.py')
          tree = ast.parse(run_path.read_text(encoding='utf-8'))
          dispatch_calls = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == 'dispatch_install_once'
          ]
          if len(dispatch_calls) != 1:
              raise SystemExit(f'exactly one destructive dispatch callsite required; got {len(dispatch_calls)}')

          state_machine = Path('.github/controller/deployment_state_machine.py').read_text(encoding='utf-8')
          required_states = ('ACCEPTED', 'REFUSED', 'UNKNOWN', 'RECOVERED', 'QUARANTINED')
          if any(state not in state_machine for state in required_states):
              raise SystemExit('deployment reducer terminal state set is incomplete')
          if 'if state == ACCEPTED' not in state_machine or 'return "success"' not in state_machine:
              raise SystemExit('public Deployment success is not derived from canonical ACCEPTED')
          if 'state in {UNKNOWN, RECOVERED}' not in state_machine or 'return "error"' not in state_machine:
              raise SystemExit('UNKNOWN/RECOVERED projection contract differs')

          resolver = Path('.github/controller/release_resolver.py').read_text(encoding='utf-8')
          if 'SHA256SUMS' in resolver or '"sha256"' in resolver:
              raise SystemExit('obsolete Product Release SHA256SUMS identity contract remains in resolver')
          for required in ('artifact-digests.json', 'blake3-256', 'mobile-proxy/product-release-asset/v2', 'content_digest'):
              if required not in resolver:
                  raise SystemExit('Product Release v2 resolver contract incomplete: ' + required)

          print('DEPLOYMENT_CONTROLLER_BOUNDARY_OK')
          PY
