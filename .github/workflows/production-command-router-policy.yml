name: Production deployment controller policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controller-hosted-acceptance:
    name: Validate controller boundary and fault-injection invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private deployment controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile controller and run pure hosted acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/controller/*.py \
            .github/controller/tests/*.py \
            .github/scripts/deployment_command_router.py \
            .github/scripts/deployment_execution.py \
            .github/scripts/prepare_release_deployment.py \
            .github/scripts/run_phone_release_deployment.py
          python3 .github/controller/tests/test_controller.py
          python3 .github/controller/tests/test_release_resolver.py

      - name: Enforce repository ownership boundary and one Issue ingress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import re
          from pathlib import Path

          workflows = Path('.github/workflows')
          router = (workflows / 'production-control-router.yml').read_text(encoding='utf-8')
          deployment = (workflows / 'release-deployment.yml').read_text(encoding='utf-8')
          ack_script = Path('.github/scripts/deployment_execution.py').read_text(encoding='utf-8')
          controller_files = list(Path('.github/controller').glob('*.py'))
          v2_scripts = [
              Path('.github/scripts/deployment_command_router.py'),
              Path('.github/scripts/deployment_execution.py'),
              Path('.github/scripts/prepare_release_deployment.py'),
              Path('.github/scripts/run_phone_release_deployment.py'),
          ]

          direct_ingress = sorted(
              path.name
              for path in workflows.glob('*.yml')
              if re.search(r'(?m)^  issue_comment:\s*$', path.read_text(encoding='utf-8'))
          )
          if direct_ingress != ['production-control-router.yml']:
              raise SystemExit('exactly one private Issue command ingress is required: ' + repr(direct_ingress))

          required_router = (
              "github.event.issue.number == 1",
              "github.event.comment.user.login == github.repository_owner",
              "startsWith(github.event.comment.body, '/deploy ')",
              '.github/scripts/deployment_command_router.py',
              '.github/scripts/deployment_execution.py',
              './.github/workflows/release-deployment.yml',
          )
          missing = [item for item in required_router if item not in router]
          if missing:
              raise SystemExit('deployment router contract incomplete: ' + ', '.join(missing))
          if '## DEPLOYMENT EXECUTION ACK' not in ack_script:
              raise SystemExit('deployment ACK contract is missing')

          forbidden_router = (
              'authority_cursor',
              'issue179-comment-',
              'production_command_router.py',
              'physical-transaction-readiness.yml',
              'filesystem-scratch-kernel-rehearsal.yml',
          )
          present = [item for item in forbidden_router if item in router]
          if present:
              raise SystemExit('legacy runtime cursor/kernel route remains reachable: ' + ', '.join(present))

          combined = '\n'.join(path.read_text(encoding='utf-8') for path in controller_files + v2_scripts)
          if 'issue179-comment-' in combined or 'authority_cursor' in combined:
              raise SystemExit('deployment controller v2 depends on development tracker cursor')
          if 'canonical-public' in deployment or 'repository: iamaman11/mobile-proxy' in deployment:
              raise SystemExit('controller workflow checks out mutable/public product source instead of Release assets')
          if 'PUBLIC_DEPLOYMENTS_TOKEN' not in deployment:
              raise SystemExit('public Deployment projection lacks dedicated minimal credential boundary')
          if 'production-target-phone-production' not in deployment or 'cancel-in-progress: false' not in deployment:
              raise SystemExit('phone target global mutation serialization is missing')
          if 'runs-on: [self-hosted, Linux, X64, android-production]' not in deployment:
              raise SystemExit('Android physical adapter is not confined to registered target runner')

          run_path = Path('.github/scripts/run_phone_release_deployment.py')
          tree = ast.parse(run_path.read_text(encoding='utf-8'))
          dispatch_calls = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Name)
              and node.func.id == 'dispatch_install_once'
          ]
          if len(dispatch_calls) != 1:
              raise SystemExit(f'exactly one destructive dispatch callsite required; got {len(dispatch_calls)}')

          state_machine = Path('.github/controller/deployment_state_machine.py').read_text(encoding='utf-8')
          required_states = ('ACCEPTED', 'REFUSED', 'UNKNOWN', 'RECOVERED', 'QUARANTINED')
          if any(state not in state_machine for state in required_states):
              raise SystemExit('deployment reducer terminal state set is incomplete')
          if 'if state == ACCEPTED' not in state_machine or 'return "success"' not in state_machine:
              raise SystemExit('public Deployment success is not derived from canonical ACCEPTED')
          if 'state in {UNKNOWN, RECOVERED}' not in state_machine or 'return "error"' not in state_machine:
              raise SystemExit('UNKNOWN/RECOVERED projection contract differs')

          print('DEPLOYMENT_CONTROLLER_BOUNDARY_OK')
          PY
