name: Runtime reconstruction readiness transport

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-readiness:
    name: Dispatch enrolled local-recovery readiness
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/runtime-reconstruction-readiness RUN_ENROLLED_LOCAL_RECOVERY_READINESS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact private execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution
          persist-credentials: false

      - name: Validate enrolled guard-accepted authority and dispatch readiness
        shell: bash
        env:
          PRIVATE_REPOSITORY: ${{ github.repository }}
          PRIVATE_SHA: ${{ github.sha }}
          PRIVATE_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          if (
              os.environ.get("ISSUE_NUMBER") != "1"
              or os.environ.get("COMMENT_USER") != os.environ.get("REPOSITORY_OWNER")
              or os.environ.get("COMMENT_BODY")
              != "/runtime-reconstruction-readiness RUN_ENROLLED_LOCAL_RECOVERY_READINESS"
          ):
              raise SystemExit("exact owner readiness command is required")

          root = Path("private-execution")
          binding = json.loads(
              (root / ".github/production/runtime-reconstruction-binding.json").read_text(encoding="utf-8")
          )
          required_binding = {
              "format_version": 2,
              "binding_role": "private_execution_only",
              "mode": "config_reconstruction_reauthorization",
              "enrollment_status": "enrolled",
              "canonical_repository": "iamaman11/mobile-proxy",
              "canonical_sha": "be619ebab9325e712cc6ef662689f78cc7131d5f",
              "quality_required": True,
              "hardening_tracker_issue": 179,
              "migration_tracker_issue": 162,
              "application_id": "com.example.mobileproxy",
              "required_installed_version_name": "1.1.0",
              "required_installed_version_code": 2,
              "final_release_authority": False,
              "phone_execution_authority": False,
              "provider_credentials_allowed": False,
              "recovery_health_scope": "local_runtime_only",
              "full_serving_authority": False,
              "item20_transport_authority": "deferred_to_sealed_handoff",
              "network_target_class": "loopback_recovery_sentinel",
              "tunnel_owner": "first_party_reverse_tunnel",
              "manifest_authority": "new_synthetic_local_recovery_baseline",
              "raw_device_identifier_in_binding": False,
          }
          for key, value in required_binding.items():
              if binding.get(key) != value:
                  raise SystemExit(f"readiness transport binding mismatch: {key}")

          fingerprint = binding.get("manifest_fingerprint", {})
          fingerprint_value = fingerprint.get("sha256")
          if (
              fingerprint.get("algorithm") != "sha256"
              or fingerprint.get("normalized_json_profile") != "strict-sorted-compact-utf8-v1"
              or not isinstance(fingerprint_value, str)
              or re.fullmatch(r"[0-9a-f]{64}", fingerprint_value) is None
          ):
              raise SystemExit("readiness transport requires one enrolled private manifest fingerprint")

          repository = os.environ["PRIVATE_REPOSITORY"]
          private_sha = os.environ["PRIVATE_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['PRIVATE_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "mobile-proxy-production-runtime-reconstruction-readiness-transport",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url, label):
              last = None
              for attempt, delay in enumerate((0, 1, 2), start=1):
                  if delay:
                      time.sleep(delay)
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=15) as response:
                          return json.load(response)
                  except (urllib.error.URLError, TimeoutError) as error:
                      last = error
                      if attempt == 3:
                          break
              raise SystemExit(f"{label} unavailable after bounded retries") from last

          def current_main():
              return get_json(
                  f"https://api.github.com/repos/{repository}/commits/main",
                  "private main authority",
              ).get("sha")

          if current_main() != private_sha:
              raise SystemExit("readiness transport must execute from exact current private main")

          runs = get_json(
              f"https://api.github.com/repos/{repository}/actions/runs?head_sha={private_sha}&event=push&per_page=100",
              "private guard authority",
          ).get("workflow_runs", [])
          required_guards = {
              "Runtime reconstruction binding policy",
              "Production phone mutation policy",
              "Android migration execution binding policy",
          }
          for guard_name in required_guards:
              if not any(
                  run.get("name") == guard_name
                  and run.get("event") == "push"
                  and run.get("head_branch") == "main"
                  and run.get("head_sha") == private_sha
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  for run in runs
              ):
                  raise SystemExit(f"exact current private main lacks successful required guard: {guard_name}")

          if current_main() != private_sha:
              raise SystemExit("private main drifted before readiness dispatch")

          dispatch_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/runtime-reconstruction-readiness.yml/dispatches",
              data=json.dumps({"ref": "main"}).encode("utf-8"),
              method="POST",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(dispatch_request, timeout=20) as response:
                  if response.status != 204:
                      raise SystemExit("runtime reconstruction readiness dispatch returned unexpected status")
          except (urllib.error.URLError, TimeoutError) as error:
              raise SystemExit("runtime reconstruction readiness dispatch failed") from error

          if current_main() != private_sha:
              raise SystemExit("private main drifted after readiness dispatch")

          print("runtime reconstruction readiness transport: accepted")
          print("enrollment_status=enrolled")
          print("exact_private_guards_verified=true")
          print("readiness_dispatch_requested=true")
          print("runtime_secret_values_read=false")
          print("config_rendered=false")
          print("provider_access=false")
          print("phone_access=false")
          PY