name: Deployment controller binding policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  probe-reusable-workflow-bindings:
    name: Require deployment-controller bindings at workflow-call boundary
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deployment-controller-binding-probe.yml
    secrets: inherit
