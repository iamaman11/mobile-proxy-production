name: C.0o branch-only command-plane migrator

on:
  push:
    branches: [agent/c0o-command-plane-convergence]

permissions:
  contents: write

concurrency:
  group: c0o-command-plane-branch-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out C.0o branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/c0o-command-plane-convergence

      - name: Deterministically migrate every legacy command workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/c0o_migrate_issue_comment_workflows.py
          python3 .github/scripts/test_production_command_router.py

      - name: Commit generated routing convergence when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- . ':!.github/workflows/c0o-branch-migration.yml'; then
            echo 'C0O_NO_GENERATED_DIFF=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows .github/production
          git commit -m 'control: converge Issue #1 command routing'
          git push origin HEAD:agent/c0o-command-plane-convergence
