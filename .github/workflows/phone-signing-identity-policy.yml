name: Phone signing identity current-authority policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-current-signing-observer:
    name: Validate current-authority read-only signing observer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution repository
        uses: actions/checkout@v4

      - name: Prove hosted apksigner transport source
        shell: bash
        run: |
          set -euo pipefail
          hosted_sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          hosted_apksigner_jar="${hosted_sdk_root}/build-tools/36.0.0/lib/apksigner.jar"
          test -f "${hosted_apksigner_jar}"
          java -jar "${hosted_apksigner_jar}" version >/dev/null

      - name: Enforce current-authority signing observation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('.github/workflows/phone-signing-identity.yml')
          text = path.read_text(encoding='utf-8')

          def actions_expr(expression):
              return '$' + '{{ ' + expression + ' }}'

          required = (
              "github.event.comment.user.login == github.repository_owner",
              r"/phone-signing-identity ([0-9a-f]{40})",
              "https://api.github.com/repos/iamaman11/mobile-proxy/commits/main",
              'run.get("name") == "Quality"',
              'run.get("head_branch") == "main"',
              'run.get("head_sha") == requested_sha',
              'run.get("conclusion") == "success"',
              'repository: iamaman11/mobile-proxy',
              'ref: ' + actions_expr('steps.command.outputs.canonical_sha'),
              'run_private_phone_preflight.py',
              'verify_android_installed_signer.py',
              'tools/apksigner.jar',
              'build-tools/36.0.0/lib/apksigner.jar',
              'same_run_hosted_digest_bound_jar',
              'apksigner_build_tools_version',
              '"36.0.0"',
              'java -jar "${hosted_apksigner_jar}" version',
              'source-manifest.json',
              'hashlib.sha256(path.read_bytes()).hexdigest() != files[name]',
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'uses: actions/setup-java@v4',
              "distribution: temurin",
              "java-version: '17'",
              'ANDROID_TARGET_BINDING_KEY: mobile-proxy/android-production/target-binding/v1/public-nonsecret',
              'Activate same-run digest-bound apksigner tooling read-only',
              'android.package-signing-continuity-observer.v1',
              'SIGNING_CONTINUITY_PROVEN',
              'SIGNING_CONTINUITY_MISMATCH',
              'SIGNING_CONTINUITY_UNOBSERVED',
              'recovered signing identity does not match the installed production APK',
              'CONTROL APK SIGNING CONTINUITY FACT',
              '"authority": "CONTROL"',
              '"persisted": True',
              'issues: write',
              'raw_device_identifier_recorded',
              'signer_digest_recorded',
              'phone_mutation_performed',
          )
          missing = [fragment for fragment in required if fragment not in text]
          if missing:
              raise SystemExit(
                  'phone-signing-identity current-authority contract missing: '
                  + ', '.join(missing)
              )

          forbidden = (
              'PINNED_CANONICAL_SHA',
              '20702dda4df3b539cac4402503f7a107a20ef38b',
              actions_expr('secrets.ANDROID_TARGET_BINDING_KEY'),
              'command -v apksigner',
              'adb install',
              'adb uninstall',
              'pm install',
              'pm uninstall',
              'pm clear',
              'cmd package install',
              'cmd package uninstall',
              'am force-stop',
              'production-phone-global-mutation',
          )
          present = [fragment for fragment in forbidden if fragment in text]
          if present:
              raise SystemExit(
                  'phone-signing-identity read-only contract contains forbidden mutation/pinning/secret or ambient-tool dependency: '
                  + ', '.join(present)
              )

          source_verify = text.index('Verify immutable canonical source and apksigner before phone access')
          java_setup = text.index('Ensure Java signing runtime on production runner')
          tooling = text.index('Activate same-run digest-bound apksigner tooling read-only')
          context = text.index('Derive bounded causal signing-observation context')
          observe = text.index('Observe installed signer continuity with exact canonical verifier')
          if not (source_verify < java_setup < tooling < context < observe):
              raise SystemExit('signing observer ordering allows phone observation before source/tool/context admission')

          if text.count('uses: actions/upload-artifact@v4') < 2:
              raise SystemExit('immutable source/tool and bounded observation persistence must both remain explicit')
          if text.count('uses: actions/download-artifact@v4') < 3:
              raise SystemExit('bounded immutable source/tool transport retries were removed')

          phone_job = re.search(
              r'(?ms)^  phone-signing-identity:\n(?P<body>.*?)(?=^  publish-control-evidence:\n)',
              text,
          )
          if phone_job is None:
              raise SystemExit('exact phone signing observation job is missing')
          body = phone_job.group('body')
          mutation_patterns = (
              r'\badb\b[^\n]*(?:\binstall\b|\buninstall\b|\bpush\b)',
              r'\bpm\s+(?:install|uninstall|clear|grant|revoke|enable|disable)\b',
              r'\bcmd\s+package\s+(?:install|uninstall)\b',
              r'\bam\s+(?:start|startservice|force-stop)\b',
          )
          for pattern in mutation_patterns:
              if re.search(pattern, body, flags=re.IGNORECASE):
                  raise SystemExit('read-only signing observer contains a phone mutation command')

          print('Phone signing identity current-authority policy: accepted')
          print('apksigner_transport=same_run_hosted_digest_bound_jar')
          print('apksigner_build_tools_version=36.0.0')
          print('target_binding_secret_required=false')
          PY
