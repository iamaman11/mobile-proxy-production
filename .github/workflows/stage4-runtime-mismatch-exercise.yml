name: Stage 4 fixed runtime mismatch detector exercise

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact registered Stage 4 target
        required: true
        type: string
      release_tag:
        description: Exact immutable Product Release
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  admit:
    name: Admit fixed read-only Stage 4 runtime mismatch exercise
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - name: Check out exact dispatched Controller main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate exact target and immutable Product Release
        id: release
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TARGET" = 'phone-production'
          test "$RELEASE_TAG" = 'v0.1.7'
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/controller').resolve()))
          from release_resolver import resolve_release
          admitted = resolve_release(tag=os.environ['RELEASE_TAG'], target=os.environ['TARGET'])
          if admitted.identity.tag != 'v0.1.7' or admitted.identity.immutable is not True:
              raise SystemExit('Stage 4 mismatch Product Release admission differs')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"source_sha={admitted.identity.source_sha}\n")
          print(
              'STAGE4_RUNTIME_MISMATCH_ADMISSION_ACCEPTED '
              f"release={admitted.identity.tag} source_sha={admitted.identity.source_sha} "
              'phone_access=false phone_mutation=false'
          )
          PY

  exercise:
    name: Exercise managed-current mismatch detection read-only
    needs: admit
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 20
    concurrency:
      group: production-target-phone-production
      cancel-in-progress: false
    environment: phone-production
    env:
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
      MOBILE_PROXY_ADMIN_TOKEN: ${{ secrets.MOBILE_PROXY_ADMIN_TOKEN }}
      MOBILE_PROXY_DEVICE_TOKEN: ${{ secrets.MOBILE_PROXY_DEVICE_TOKEN }}
      MOBILE_PROXY_UI_TOKEN: ${{ secrets.MOBILE_PROXY_UI_TOKEN }}
      MOBILE_PROXY_RELAY_USER: ${{ secrets.MOBILE_PROXY_RELAY_USER }}
      MOBILE_PROXY_RELAY_PASSWORD: ${{ secrets.MOBILE_PROXY_RELAY_PASSWORD }}
      MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64: ${{ secrets.MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64 }}
    steps:
      - name: Check out exact dispatched Controller main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact admitted PRODUCT source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ needs.admit.outputs.source_sha }}
          path: product-source
          persist-credentials: false

      - name: Require exact user-local Rust toolchain before Product digest/render
        shell: bash
        run: |
          set -euo pipefail
          CARGO_HOME="${HOME}/.cargo"
          RUSTUP_HOME="${HOME}/.rustup"
          PATH="${CARGO_HOME}/bin:${PATH}"
          export CARGO_HOME RUSTUP_HOME PATH
          test "$(command -v cargo)" = "$CARGO_HOME/bin/cargo"
          test "$(command -v rustc)" = "$CARGO_HOME/bin/rustc"
          "$CARGO_HOME/bin/cargo" --version | grep -Eq '^cargo 1\.95\.0([[:space:]]|$)'
          "$CARGO_HOME/bin/rustc" --version | grep -Eq '^rustc 1\.95\.0([[:space:]]|$)'
          (
            cd product-source
            "$CARGO_HOME/bin/cargo" metadata --format-version 1 --locked --no-deps >/dev/null
            git diff --check
            test -z "$(git status --porcelain --untracked-files=no)"
          )
          {
            printf 'CARGO_HOME=%s\n' "$CARGO_HOME"
            printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Exercise fixed shadow-expectation mismatch detector exactly once
        id: mismatch
        continue-on-error: true
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TOOL_CACHE:-}"
          export MOBILE_PROXY_RUNTIME_CACHE_DIR="$RUNNER_TOOL_CACHE/mobile-proxy-runtime-cache"
          python3 .github/scripts/exercise_runtime_mismatch.py \
            --target "$TARGET" \
            --release-tag "$RELEASE_TAG" \
            --controller-revision "$GITHUB_SHA" \
            --product-root "$GITHUB_WORKSPACE/product-source" \
            --runtime-manifest "$GITHUB_WORKSPACE/.github/production/runtime-reconstruction-manifest.json" \
            --output "$RUNNER_TEMP/stage4-runtime-mismatch-exercise.json"

      - name: Preserve mandatory bounded runtime mismatch evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage4-runtime-mismatch-exercise-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage4-runtime-mismatch-exercise.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce deterministic mismatch detection and unchanged exact postcondition
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'stage4-runtime-mismatch-exercise.json'
          if not path.is_file():
              raise SystemExit('Stage 4 runtime mismatch evidence is unavailable')
          value = json.loads(path.read_text(encoding='utf-8'))
          if value.get('schema') != 'stage4-runtime-mismatch-exercise.v1':
              raise SystemExit('Stage 4 runtime mismatch schema differs')
          if value.get('classification') != 'MISMATCH_DETECTED':
              raise SystemExit('Stage 4 runtime mismatch was not deterministically detected')
          if value.get('failure_code') is not None:
              raise SystemExit('Stage 4 runtime mismatch retained a failure code')
          baseline = value.get('baseline')
          post = value.get('postcondition')
          mismatch = value.get('mismatch_detection')
          if not isinstance(baseline, dict) or baseline.get('exact') is not True:
              raise SystemExit('Stage 4 runtime mismatch baseline is not exact')
          if not isinstance(post, dict) or post.get('exact') is not True:
              raise SystemExit('Stage 4 runtime mismatch postcondition is not exact')
          if not isinstance(mismatch, dict) or mismatch.get('detected') is not True:
              raise SystemExit('Stage 4 runtime mismatch detector evidence differs')
          if mismatch.get('shadow_target_release_exists') is not False:
              raise SystemExit('Stage 4 shadow mismatch release collided with a real managed release')
          if mismatch.get('current_state_relative_to_shadow') != 'other_managed_release':
              raise SystemExit('Stage 4 managed-current mismatch classification differs')
          safety = value.get('safety')
          if not isinstance(safety, dict) or safety.get('phone_access_performed') is not True:
              raise SystemExit('Stage 4 mismatch lacks direct phone observation')
          for field in (
              'phone_mutation_performed',
              'runtime_mutation_performed',
              'current_link_mutation_performed',
              'deployment_created',
              'deployment_intent_created',
              'recovery_dispatched',
              'reconciliation_dispatched',
              'provider_access_performed',
              'provider_mutation_performed',
              'vm_access_performed',
              'vm_mutation_performed',
              'runner_proxy_mutation_performed',
              'raw_device_identifier_recorded',
              'raw_current_target_path_recorded',
              'raw_runtime_release_paths_recorded',
              'raw_config_recorded',
              'secret_values_recorded',
          ):
              if safety.get(field) is not False:
                  raise SystemExit(f'Stage 4 mismatch safety invariant differs: {field}')
          print('STAGE4_RUNTIME_MISMATCH_ACCEPTED classification=MISMATCH_DETECTED phone_mutation=false')
          PY
