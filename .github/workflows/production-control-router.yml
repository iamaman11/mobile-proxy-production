name: Production control — sole Issue #1 command ingress

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  route:
    name: Classify one exact owner command from declarative contracts
    if: >-
      github.event.repository.full_name == 'iamaman11/mobile-proxy-production' &&
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route_id: ${{ steps.route.outputs.route_id }}
      handler: ${{ steps.route.outputs.handler }}
      workflow: ${{ steps.route.outputs.workflow }}
      ref: ${{ steps.route.outputs.ref }}
      operation: ${{ steps.route.outputs.operation }}
      operation_class: ${{ steps.route.outputs.operation_class }}
      read_only: ${{ steps.route.outputs.read_only }}
      destructive: ${{ steps.route.outputs.destructive }}
      target: ${{ steps.route.outputs.target }}
      release_tag: ${{ steps.route.outputs.release_tag }}
      canonical_sha: ${{ steps.route.outputs.canonical_sha }}
    steps:
      - name: Check out exact comment-event controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate registries and admit exactly one static route
        id: route
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_COMMAND: ${{ github.event.comment.body }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/production/command-control-registry.json
          test -f .github/production/targets.json
          current_main_sha="$(gh api --method GET \
            repos/iamaman11/mobile-proxy-production/commits/main --jq '.sha')"
          python3 .github/scripts/issue_command_router.py \
            --repository "$EVENT_REPOSITORY" \
            --issue-number "$EVENT_ISSUE_NUMBER" \
            --author "$EVENT_AUTHOR" \
            --command "$EVENT_COMMAND" \
            --event-sha "$EVENT_SHA" \
            --current-main-sha "$current_main_sha" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

  deployment-ack:
    name: Preserve existing semantic deployment request and immutable ACK
    needs: route
    if: needs.route.outputs.handler == 'deployment' && needs.route.outputs.route_id == 'deploy-product-release'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      request_json: ${{ steps.command.outputs.request_json }}
      execution_id: ${{ steps.execution.outputs.execution_id }}
      target: ${{ steps.command.outputs.target }}
    steps:
      - name: Check out exact controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build existing cursor-free semantic deployment request
        id: command
        env:
          COMMAND: ${{ github.event.comment.body }}
          REGISTRY_TARGET: ${{ needs.route.outputs.target }}
          REGISTRY_RELEASE: ${{ needs.route.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_command_router.py \
            --command "$COMMAND" \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event.issue.number }}" \
            --comment-id "${{ github.event.comment.id }}" \
            --actor "${{ github.event.comment.user.login }}" \
            --owner "${{ github.repository_owner }}"
          test "${{ steps.command.outputs.target }}" = "$REGISTRY_TARGET"
          test "${{ steps.command.outputs.release_tag }}" = "$REGISTRY_RELEASE"

      - name: Build exact controller execution ACK
        id: execution
        env:
          CONTROL_REQUEST_JSON: ${{ steps.command.outputs.request_json }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_execution.py \
            --request-json "$CONTROL_REQUEST_JSON" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --controller-revision "$GITHUB_SHA" \
            --record-path "$RUNNER_TEMP/deployment-execution-ack.json" \
            --body-path "$RUNNER_TEMP/deployment-execution-ack.md"
          echo "execution_id=gh-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Publish immediate immutable execution ACK
        uses: actions/github-script@v7
        env:
          ACK_BODY_PATH: ${{ runner.temp }}/deployment-execution-ack.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.ACK_BODY_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });

  observe-public-deployment-projection:
    name: Dispatch the one allowlisted hosted public-projection observer
    needs: route
    if: needs.route.outputs.route_id == 'observe-public-deployment-projection' && needs.route.outputs.read_only == 'true'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revalidate exact current controller revision before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_WORKFLOW: ${{ needs.route.outputs.workflow }}
          ROUTE_REF: ${{ needs.route.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ROUTE_WORKFLOW" = '.github/workflows/public-deployment-projection-observer.yml'
          test "$ROUTE_REF" = 'main'
          current_main_sha="$(gh api --method GET \
            repos/iamaman11/mobile-proxy-production/commits/main --jq '.sha')"
          test "$current_main_sha" = "$GITHUB_SHA"

      - name: Dispatch literal observer workflow on literal main ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/iamaman11/mobile-proxy-production/actions/workflows/public-deployment-projection-observer.yml/dispatches \
            -f ref=main

  android-build-tools-bootstrap:
    name: Route exact bounded Android Build Tools bootstrap contract
    needs: route
    if: needs.route.outputs.route_id == 'runner-android-build-tools-bootstrap' && needs.route.outputs.destructive == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/production-runner-android-build-tools-bootstrap.yml
    with:
      command: ${{ github.event.comment.body }}
      source_issue_number: ${{ github.event.issue.number }}
      source_comment_id: ${{ github.event.comment.id }}
      source_actor: ${{ github.event.comment.user.login }}
      source_comment_url: ${{ github.event.comment.html_url }}

  deploy:
    name: Run existing automatic deployment State Machine
    needs: [route, deployment-ack]
    if: >-
      needs.route.outputs.route_id == 'deploy-product-release' &&
      needs.route.outputs.operation == 'deploy-product-release' &&
      needs.route.outputs.destructive == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/release-deployment.yml
    with:
      request_json: ${{ needs.deployment-ack.outputs.request_json }}
      execution_id: ${{ needs.deployment-ack.outputs.execution_id }}
      target: ${{ needs.deployment-ack.outputs.target }}
    secrets: inherit
