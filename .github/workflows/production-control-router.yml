name: Production control — Issue #1 deployment controller

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  route:
    name: Parse one exact deployment command and ACK it
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/deploy ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.route.outputs.operation }}
      target: ${{ steps.route.outputs.target }}
      release_tag: ${{ steps.route.outputs.release_tag }}
      request_id: ${{ steps.route.outputs.request_id }}
      request_json: ${{ steps.route.outputs.request_json }}
      execution_id: ${{ steps.execution.outputs.execution_id }}
    steps:
      - name: Check out exact private controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build cursor-free semantic deployment request
        id: route
        env:
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_command_router.py \
            --command "$COMMAND" \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event.issue.number }}" \
            --comment-id "${{ github.event.comment.id }}" \
            --actor "${{ github.event.comment.user.login }}" \
            --owner "${{ github.repository_owner }}"

      - name: Build exact controller execution ACK
        id: execution
        env:
          CONTROL_REQUEST_JSON: ${{ steps.route.outputs.request_json }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_execution.py \
            --request-json "$CONTROL_REQUEST_JSON" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --controller-revision "$GITHUB_SHA" \
            --record-path "$RUNNER_TEMP/deployment-execution-ack.json" \
            --body-path "$RUNNER_TEMP/deployment-execution-ack.md"
          echo "execution_id=gh-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Publish immediate immutable execution ACK
        uses: actions/github-script@v7
        env:
          ACK_BODY_PATH: ${{ runner.temp }}/deployment-execution-ack.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.ACK_BODY_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body,
            });

  deploy:
    name: Run automatic deployment State Machine
    needs: route
    if: needs.route.outputs.operation == 'deploy-product-release'
    uses: ./.github/workflows/release-deployment.yml
    with:
      request_json: ${{ needs.route.outputs.request_json }}
      execution_id: ${{ needs.route.outputs.execution_id }}
      target: ${{ needs.route.outputs.target }}
    secrets: inherit
