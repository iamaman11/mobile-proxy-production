name: Production control — strict Issue #1 router

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  route:
    name: Classify one owner command exactly once
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      operation: ${{ steps.route.outputs.operation }}
      request_id: ${{ steps.route.outputs.request_id }}
      request_json: ${{ steps.route.outputs.request_json }}
      execution_id: ${{ steps.execution.outputs.execution_id }}
    steps:
      - name: Check out exact private execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Strictly classify command and build semantic request envelope
        id: route
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 .github/scripts/production_command_router.py \
            --registry .github/production/command-routes.json \
            --command "$COMMAND" \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event.issue.number }}" \
            --comment-id "${{ github.event.comment.id }}" \
            --actor "${{ github.event.comment.user.login }}" \
            --owner "${{ github.repository_owner }}"

      - name: Build bounded exact execution ACK
        id: execution
        shell: bash
        env:
          CONTROL_REQUEST_JSON: ${{ steps.route.outputs.request_json }}
        run: |
          set -euo pipefail
          python3 .github/scripts/control_execution.py \
            --request-json "$CONTROL_REQUEST_JSON" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --private-sha "$GITHUB_SHA" \
            --record-path "$RUNNER_TEMP/control-execution-ack.json" \
            --body-path "$RUNNER_TEMP/control-execution-ack.md"
          echo "execution_id=gh-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable exact execution ACK before any routed operation
        uses: actions/github-script@v7
        env:
          ACK_BODY_PATH: ${{ runner.temp }}/control-execution-ack.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.ACK_BODY_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  op_android_release_build:
    name: Route android-release-build
    needs: route
    if: needs.route.outputs.operation == 'android-release-build'
    uses: ./.github/workflows/android-release-build.yml
    with:
      command: ${{ github.event.comment.body }}
      source_event_name: issue_comment
      source_issue_number: ${{ github.event.issue.number }}
      source_comment_id: ${{ github.event.comment.id }}
      source_actor: ${{ github.event.comment.user.login }}
      source_comment_url: ${{ github.event.comment.html_url }}
      control_request_id: ${{ needs.route.outputs.request_id }}
      control_request_json: ${{ needs.route.outputs.request_json }}
    secrets: inherit

