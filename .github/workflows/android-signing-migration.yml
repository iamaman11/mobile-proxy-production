name: Production Android 0.1.4 signing-generation migration

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      source_event_name:
        required: true
        type: string
      source_issue_number:
        required: true
        type: number
      source_comment_id:
        required: true
        type: number
      source_actor:
        required: true
        type: string
      source_comment_url:
        required: true
        type: string
      control_request_id:
        required: true
        type: string
      control_request_json:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  command-gate:
    name: Bind migration to execution binding and proved retained build
    if: >-
      inputs.source_issue_number == 1 &&
      inputs.source_actor == github.repository_owner &&
      startsWith(inputs.command, '/android-release-migrate ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MIGRATION_HARD_BLOCKED: "true"
      COMMAND: ${{ inputs.command }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      build_run_id: ${{ steps.command.outputs.build_run_id }}
      version_name: ${{ steps.binding.outputs.version_name }}
      version_code: ${{ steps.binding.outputs.version_code }}
      old_version_name: ${{ steps.binding.outputs.old_version_name }}
      old_version_code: ${{ steps.binding.outputs.old_version_code }}
    steps:
      - name: Check out exact private execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution

      - name: Load and validate single Android migration execution binding
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path('private-execution/.github/production/android-v0.1.4-migration-binding.json')
          binding = json.loads(path.read_text(encoding='utf-8'))
          expected = {
              'format_version': 1,
              'binding_role': 'private_execution_only',
              'canonical_repository': 'iamaman11/mobile-proxy',
              'quality_required': True,
              'migration_tracker_issue': 162,
              'hardening_tracker_issue': 179,
              'application_id': 'com.example.mobileproxy',
              'version_name': '0.1.4',
              'version_code': 1004,
              'old_version_name': '1.1.0',
              'old_version_code': 2,
              'candidate_retention_days_minimum': 30,
              'final_release_authority': False,
          }
          for key, value in expected.items():
              if binding.get(key) != value:
                  raise SystemExit(f'Android migration binding mismatch: {key}')
          canonical_sha = binding.get('canonical_sha')
          if not isinstance(canonical_sha, str) or re.fullmatch(r'[0-9a-f]{40}', canonical_sha) is None:
              raise SystemExit('Android migration binding canonical_sha is malformed')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={canonical_sha}\n')
              handle.write(f"version_name={binding['version_name']}\n")
              handle.write(f"version_code={binding['version_code']}\n")
              handle.write(f"old_version_name={binding['old_version_name']}\n")
              handle.write(f"old_version_code={binding['old_version_code']}\n")
          PY

      - name: Validate owner command, current canonical main, Quality, retained build, and release order
        id: command
        shell: bash
        env:
          BOUND_CANONICAL_SHA: ${{ steps.binding.outputs.canonical_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          command = os.environ.get('COMMAND', '').strip()
          match = re.fullmatch(r'/android-release-migrate ([0-9a-f]{40}) ([1-9][0-9]*)', command)
          if match is None:
              raise SystemExit('invalid Android release migration command')
          if os.environ.get('MIGRATION_HARD_BLOCKED') == 'true':
              raise SystemExit(
                  'destructive Android migration is hard-blocked by canonical tracker #179 until '
                  'the required hardening, healthy-baseline, fresh-build, and retention gates are completed'
              )

          requested_sha, build_run_id = match.groups()
          bound_sha = os.environ['BOUND_CANONICAL_SHA']
          if requested_sha != bound_sha:
              raise SystemExit('requested SHA is not the single Android migration execution binding')

          def get_json(url: str, token: str | None = None):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'mobile-proxy-production-android-migration',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          current_main = get_json('https://api.github.com/repos/iamaman11/mobile-proxy/commits/main').get('sha')
          if current_main != bound_sha:
              raise SystemExit('private Android migration binding is stale relative to current canonical main')

          public_runs = get_json(
              f'https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?head_sha={bound_sha}&event=push&per_page=100'
          ).get('workflow_runs', [])
          main_quality = [
              run for run in public_runs
              if run.get('name') == 'Quality'
              and run.get('head_branch') == 'main'
              and run.get('head_sha') == bound_sha
              and run.get('status') == 'completed'
              and run.get('conclusion') == 'success'
          ]
          if not main_quality:
              raise SystemExit('exact bound canonical main Quality success is absent')

          migration_issue = get_json('https://api.github.com/repos/iamaman11/mobile-proxy/issues/162')
          if migration_issue.get('state') != 'open':
              raise SystemExit('canonical signing-generation migration tracker #162 is not open')
          signing_gate = get_json('https://api.github.com/repos/iamaman11/mobile-proxy/issues/115')
          if signing_gate.get('state') != 'open':
              raise SystemExit('canonical signing gate #115 must remain open while #162 migration is being satisfied')

          tag_url = 'https://api.github.com/repos/iamaman11/mobile-proxy/git/ref/tags/v0.1.4'
          try:
              get_json(tag_url)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('final public v0.1.4 tag exists before pre-Item20 migration; release ordering violated')

          token = os.environ['GH_TOKEN']
          repository = os.environ['GITHUB_REPOSITORY']
          run = get_json(
              f'https://api.github.com/repos/{repository}/actions/runs/{build_run_id}', token
          )
          if run.get('event') != 'issue_comment' or run.get('conclusion') != 'success':
              raise SystemExit('signed-candidate build run is not a successful issue-comment run')
          if run.get('path') != '.github/workflows/android-release-build.yml':
              raise SystemExit('build run did not execute the signed-candidate workflow')
          if run.get('head_sha') != os.environ['GITHUB_SHA']:
              raise SystemExit('build run and migration caller are from different private execution revisions')

          expected_artifact = f'android-release-candidate-v0.1.4-{bound_sha}'
          artifacts = get_json(
              f'https://api.github.com/repos/{repository}/actions/runs/{build_run_id}/artifacts?per_page=100', token
          ).get('artifacts', [])
          matches = [
              artifact for artifact in artifacts
              if artifact.get('name') == expected_artifact and not artifact.get('expired', False)
          ]
          if len(matches) != 1:
              raise SystemExit('exact signed-candidate artifact is unavailable or ambiguous')

          retention_tag = f'execution-candidate-android-v0.1.4-{bound_sha[:12]}-run-{build_run_id}'
          encoded_tag = urllib.parse.quote(retention_tag, safe='')
          try:
              retention = get_json(
                  f'https://api.github.com/repos/{repository}/releases/tags/{encoded_tag}', token
              )
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  raise SystemExit('required private candidate retention prerelease is absent') from error
              raise
          if retention.get('draft') is not False or retention.get('prerelease') is not True:
              raise SystemExit('candidate retention object is not the expected immutable-by-contract prerelease')
          if retention.get('target_commitish') != os.environ['GITHUB_SHA']:
              raise SystemExit('candidate retention and migration caller are from different private revisions')
          asset_names = sorted(asset.get('name') for asset in retention.get('assets', []))
          required_assets = sorted(['mobile-proxy-android-v0.1.4.apk', 'android-release-evidence.json'])
          if asset_names != required_assets:
              raise SystemExit('candidate retention asset set differs from required APK/evidence pair')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={bound_sha}\n')
              handle.write(f'build_run_id={build_run_id}\n')
          PY

  prepare-tools:
    name: Prepare exact canonical migration tools off-phone
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
    steps:
      - name: Fetch exact canonical source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/canonical"
          rm -rf "${root}"
          git init "${root}"
          git -C "${root}" remote add origin https://github.com/iamaman11/mobile-proxy.git
          git -C "${root}" fetch --no-tags --depth=1 origin "${CANONICAL_SHA}"
          git -C "${root}" checkout --detach "${CANONICAL_SHA}"
          test "$(git -C "${root}" rev-parse HEAD)" = "${CANONICAL_SHA}"
          test -z "$(git -C "${root}" status --porcelain --untracked-files=no)"
          echo "root=${root}" >> "$GITHUB_OUTPUT"

      - name: Build exact typed Android artifact digest helper
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.source.outputs.root }}"
          cd "${root}"
          rustup show active-toolchain
          cargo build \
            --locked \
            --release \
            -p operator-cli \
            --bin android-artifact-digest
          out="${RUNNER_TEMP}/migration-tools"
          rm -rf "${out}"
          mkdir -p "${out}"
          install -m 0755 "${root}/target/release/android-artifact-digest" "${out}/android-artifact-digest"
          install -m 0644 "${root}/scripts/migrate_android_signing_lineage.py" "${out}/migrate_android_signing_lineage.py"
          install -m 0644 "${root}/scripts/run_private_phone_preflight.py" "${out}/run_private_phone_preflight.py"
          install -m 0644 "${root}/scripts/verify_android_installed_signer.py" "${out}/verify_android_installed_signer.py"
          echo "output=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload exact canonical migration tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signing-migration-tools-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ steps.tools.outputs.output }}
          if-no-files-found: error
          retention-days: 1

  migrate-phone:
    name: Execute authorized destructive signing-generation reset
    needs:
      - command-gate
      - prepare-tools
    concurrency:
      group: production-phone-global-mutation
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 20
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      BUILD_RUN_ID: ${{ needs.command-gate.outputs.build_run_id }}
      OLD_VERSION_NAME: ${{ needs.command-gate.outputs.old_version_name }}
      OLD_VERSION_CODE: ${{ needs.command-gate.outputs.old_version_code }}
      VERSION_NAME: ${{ needs.command-gate.outputs.version_name }}
      VERSION_CODE: ${{ needs.command-gate.outputs.version_code }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
    steps:
      - name: Download exact previously proved signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-candidate-v0.1.4-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/signed-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BUILD_RUN_ID }}

      - name: Download exact canonical migration tools from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-signing-migration-tools-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/migration-tools

      - name: Execute canonical migration with automatic rollback
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/signed-candidate"
          tools="${RUNNER_TEMP}/migration-tools"
          evidence="${RUNNER_TEMP}/android-signing-migration-evidence"
          mkdir -p "${evidence}"
          chmod 700 "${tools}/android-artifact-digest"
          python3 "${tools}/migrate_android_signing_lineage.py" \
            --canonical-sha "${CANONICAL_SHA}" \
            --apk "${candidate}/mobile-proxy-android-v0.1.4.apk" \
            --release-evidence "${candidate}/android-release-evidence.json" \
            --digest-tool "${tools}/android-artifact-digest" \
            --retained-old-apk "${evidence}/retained-old-generation.apk" \
            --expected-old-version-name "${OLD_VERSION_NAME}" \
            --expected-old-version-code "${OLD_VERSION_CODE}" \
            --expected-version-name "${VERSION_NAME}" \
            --expected-version-code "${VERSION_CODE}" \
            --authorization "DESTROY_OLD_SIGNING_LINEAGE_AND_APP_DATA" \
            --output "${evidence}/android-signing-migration.json"

      - name: Retain bounded migration evidence and emergency old-generation APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signing-migration-evidence-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/android-signing-migration-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Record safe migration result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Production Android 0.1.4 signing-generation migration
          - Canonical source SHA: ${{ env.CANONICAL_SHA }}
          - Private execution SHA: ${{ github.sha }}
          - Canonical SHA source: single private execution binding
          - Signed-candidate build run: ${{ env.BUILD_RUN_ID }}
          - Migration authority: exact current protected SHA + exact retained signed candidate + same private revision
          - Exact canonical main Quality required: true
          - Final public v0.1.4 tag required: false
          - Expected old version: ${{ env.OLD_VERSION_NAME }} / ${{ env.OLD_VERSION_CODE }}
          - Expected new version: ${{ env.VERSION_NAME }} / ${{ env.VERSION_CODE }}
          - Canonical migration outcome: ${{ steps.migration.outcome }}
          - Same-run registered-device proof before each mutation: required by canonical script
          - Old installed signed APK retained before uninstall: required by canonical script
          - Automatic rollback on post-capture migration failure: required by canonical script
          - Phone reboot requested: false
          - Network mutation requested: false
          - Signing secrets exposed to phone job: false
          - Device identifier recorded: false
          - Signer fingerprint recorded: false
          - Provider credentials requested: false
          EOF

      - name: Fail closed if canonical migration was not accepted
        if: steps.migration.outcome != 'success'
        shell: bash
        run: exit 1

  retain-accepted:
    name: Retain accepted Android generation as private execution evidence
    needs:
      - command-gate
      - migrate-phone
    if: needs.migrate-phone.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      BUILD_RUN_ID: ${{ needs.command-gate.outputs.build_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact accepted signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-candidate-v0.1.4-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/accepted
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BUILD_RUN_ID }}

      - name: Download successful migration evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-signing-migration-evidence-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/migration

      - name: Publish immutable private accepted-generation retention
        shell: bash
        run: |
          set -euo pipefail
          tag="execution-retention-android-v0.1.4-${CANONICAL_SHA:0:12}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "private execution retention release already exists" >&2
            exit 1
          fi
          cat > "${RUNNER_TEMP}/retention-notes.md" <<EOF
          Private execution retention for the accepted Android signing generation.

          Canonical public version metadata: 0.1.4
          Canonical public source SHA: ${CANONICAL_SHA}
          Private execution SHA: ${GITHUB_SHA}
          Final public release authority: not created by this private retention
          Signed-candidate private build run: ${BUILD_RUN_ID}
          Accepted private migration run: ${GITHUB_RUN_ID}

          The new-generation signed APK is the future routine rollback/update artifact. The retained old-generation APK is emergency destructive-migration rollback evidence only and is not update-compatible with the accepted new signing generation.

          This private release is bounded execution evidence only. It is not canonical source, architecture, release policy, or final semantic release authority.
          EOF
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "Private execution retention — Android 0.1.4 accepted signing generation" \
            --notes-file "${RUNNER_TEMP}/retention-notes.md" \
            "${RUNNER_TEMP}/accepted/mobile-proxy-android-v0.1.4.apk" \
            "${RUNNER_TEMP}/accepted/android-release-evidence.json" \
            "${RUNNER_TEMP}/migration/android-signing-migration.json" \
            "${RUNNER_TEMP}/migration/retained-old-generation.apk"
