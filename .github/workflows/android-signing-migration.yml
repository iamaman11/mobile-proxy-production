name: Production Android v0.1.4 signing-lineage migration

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-phone-android-signing-lineage-migration
  cancel-in-progress: false

jobs:
  command-gate:
    name: Bind migration to pinned canonical and proved build run
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/android-release-migrate ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PINNED_CANONICAL_SHA: a6735b3b64958699b50acc619e770d80f4bdfbc1
      CANONICAL_TAG: v0.1.4
      COMMAND: ${{ github.event.comment.body }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      build_run_id: ${{ steps.command.outputs.build_run_id }}
    steps:
      - name: Validate exact owner command, public release tag, and signed-candidate run
        id: command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(r"/android-release-migrate ([0-9a-f]{40}) ([1-9][0-9]*)", command)
          if match is None:
              raise SystemExit("invalid Android release migration command")
          requested_sha, build_run_id = match.groups()
          pinned_sha = os.environ["PINNED_CANONICAL_SHA"]
          if requested_sha != pinned_sha:
              raise SystemExit("requested SHA is not the pinned v0.1.4 canonical baseline")

          def get_json(url: str, token: str | None = None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mobile-proxy-production-android-migration",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          public_commit = get_json(
              f"https://api.github.com/repos/iamaman11/mobile-proxy/commits/{os.environ['CANONICAL_TAG']}"
          )
          if public_commit.get("sha") != pinned_sha:
              raise SystemExit("public v0.1.4 tag does not resolve to the pinned canonical SHA")

          public_runs = get_json(
              f"https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?head_sha={pinned_sha}&event=push&per_page=100"
          ).get("workflow_runs", [])
          tag_quality = [
              run for run in public_runs
              if run.get("name") == "Quality"
              and run.get("head_branch") == os.environ["CANONICAL_TAG"]
              and run.get("head_sha") == pinned_sha
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not tag_quality:
              raise SystemExit("exact v0.1.4 tag Quality success is absent")

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          run = get_json(
              f"https://api.github.com/repos/{repository}/actions/runs/{build_run_id}", token
          )
          if run.get("event") != "issue_comment" or run.get("conclusion") != "success":
              raise SystemExit("signed-candidate build run is not a successful issue-comment run")
          if run.get("path") != ".github/workflows/android-release-build.yml":
              raise SystemExit("build run did not execute the signed-candidate workflow")
          if run.get("head_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("build run and migration caller are from different private revisions")

          expected_artifact = f"android-release-candidate-v0.1.4-{pinned_sha}"
          artifacts = get_json(
              f"https://api.github.com/repos/{repository}/actions/runs/{build_run_id}/artifacts?per_page=100",
              token,
          ).get("artifacts", [])
          matches = [
              artifact for artifact in artifacts
              if artifact.get("name") == expected_artifact and not artifact.get("expired", False)
          ]
          if len(matches) != 1:
              raise SystemExit("exact retained signed-candidate artifact is unavailable or ambiguous")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={pinned_sha}\n")
              handle.write(f"build_run_id={build_run_id}\n")
          PY

  prepare-tools:
    name: Prepare exact canonical migration tools off-phone
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
    steps:
      - name: Fetch exact canonical source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/canonical"
          rm -rf "${root}"
          git init "${root}"
          git -C "${root}" remote add origin https://github.com/iamaman11/mobile-proxy.git
          git -C "${root}" fetch --no-tags --depth=1 origin "${CANONICAL_SHA}"
          git -C "${root}" checkout --detach "${CANONICAL_SHA}"
          test "$(git -C "${root}" rev-parse HEAD)" = "${CANONICAL_SHA}"
          test -z "$(git -C "${root}" status --porcelain --untracked-files=no)"
          echo "root=${root}" >> "$GITHUB_OUTPUT"

      - name: Build exact typed Android artifact digest helper
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.source.outputs.root }}"
          rustup show active-toolchain
          cargo build \
            --manifest-path "${root}/Cargo.toml" \
            --locked \
            --release \
            -p operator-cli \
            --bin android-artifact-digest
          out="${RUNNER_TEMP}/migration-tools"
          rm -rf "${out}"
          mkdir -p "${out}"
          install -m 0755 "${root}/target/release/android-artifact-digest" "${out}/android-artifact-digest"
          install -m 0644 "${root}/scripts/migrate_android_signing_lineage.py" "${out}/migrate_android_signing_lineage.py"
          install -m 0644 "${root}/scripts/run_private_phone_preflight.py" "${out}/run_private_phone_preflight.py"
          install -m 0644 "${root}/scripts/verify_android_installed_signer.py" "${out}/verify_android_installed_signer.py"
          echo "output=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload exact canonical migration tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signing-migration-tools-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ steps.tools.outputs.output }}
          if-no-files-found: error
          retention-days: 1

  migrate-phone:
    name: Execute authorized destructive signing-lineage reset
    needs:
      - command-gate
      - prepare-tools
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 20
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      BUILD_RUN_ID: ${{ needs.command-gate.outputs.build_run_id }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
    steps:
      - name: Download exact previously proved signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-candidate-v0.1.4-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/signed-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BUILD_RUN_ID }}

      - name: Download exact canonical migration tools from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-signing-migration-tools-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/migration-tools

      - name: Execute canonical migration with automatic rollback
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          candidate="${RUNNER_TEMP}/signed-candidate"
          tools="${RUNNER_TEMP}/migration-tools"
          evidence="${RUNNER_TEMP}/android-signing-migration-evidence"
          mkdir -p "${evidence}"
          chmod 700 "${tools}/android-artifact-digest"
          python3 "${tools}/migrate_android_signing_lineage.py" \
            --canonical-sha "${CANONICAL_SHA}" \
            --apk "${candidate}/mobile-proxy-android-v0.1.4.apk" \
            --release-evidence "${candidate}/android-release-evidence.json" \
            --digest-tool "${tools}/android-artifact-digest" \
            --retained-old-apk "${evidence}/retained-old-generation.apk" \
            --expected-old-version-name "1.1.0" \
            --expected-old-version-code 2 \
            --expected-version-name "0.1.4" \
            --expected-version-code 1004 \
            --authorization "DESTROY_OLD_SIGNING_LINEAGE_AND_APP_DATA" \
            --output "${evidence}/android-signing-migration.json"

      - name: Retain bounded migration evidence and emergency old-generation APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signing-migration-evidence-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/android-signing-migration-evidence
          if-no-files-found: warn
          retention-days: 90

      - name: Record safe migration result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Production Android v0.1.4 signing-lineage migration
          - Canonical source SHA: ${{ env.CANONICAL_SHA }}
          - Signed-candidate build run: ${{ env.BUILD_RUN_ID }}
          - Expected package: com.example.mobileproxy
          - Old expected version: 1.1.0 / 2
          - New expected version: 0.1.4 / 1004
          - Canonical migration outcome: ${{ steps.migration.outcome }}
          - Same-run registered-device proof before each mutation: required by canonical script
          - Old installed signed APK retained before uninstall: required by canonical script
          - Automatic rollback on post-capture migration failure: required by canonical script
          - Phone reboot requested: false
          - Network mutation requested: false
          - Signing secrets exposed to phone job: false
          - Device identifier recorded: false
          - Signer fingerprint recorded: false
          - Provider credentials requested: false
          EOF

      - name: Fail closed if canonical migration was not accepted
        if: steps.migration.outcome != 'success'
        shell: bash
        run: exit 1

  retain-accepted:
    name: Retain accepted Android generation as private execution release evidence
    needs:
      - command-gate
      - migrate-phone
    if: needs.migrate-phone.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      BUILD_RUN_ID: ${{ needs.command-gate.outputs.build_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact accepted signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-candidate-v0.1.4-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/accepted
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BUILD_RUN_ID }}

      - name: Download successful migration evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-signing-migration-evidence-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/migration

      - name: Publish immutable private retention release
        shell: bash
        run: |
          set -euo pipefail
          tag="execution-retention-android-v0.1.4-${CANONICAL_SHA:0:12}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "private execution retention release already exists" >&2
            exit 1
          fi
          cat > "${RUNNER_TEMP}/retention-notes.md" <<EOF
          Private execution retention for the accepted Android signing generation.

          Canonical public release identity: v0.1.4
          Canonical public source SHA: ${CANONICAL_SHA}
          Signed-candidate private build run: ${BUILD_RUN_ID}
          Accepted private migration run: ${GITHUB_RUN_ID}

          This private release is bounded execution evidence only. It is not canonical source, architecture, or release policy.
          EOF
          gh release create "${tag}" \
            --title "Private execution retention — Android v0.1.4" \
            --notes-file "${RUNNER_TEMP}/retention-notes.md" \
            "${RUNNER_TEMP}/accepted/mobile-proxy-android-v0.1.4.apk" \
            "${RUNNER_TEMP}/accepted/android-release-evidence.json" \
            "${RUNNER_TEMP}/migration/android-signing-migration.json" \
            "${RUNNER_TEMP}/migration/retained-old-generation.apk"
