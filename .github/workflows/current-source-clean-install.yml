name: Production current-source clean install

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  command-gate:
    name: Validate armed clean-install authority
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/current-source-clean-install ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canonical_sha: ${{ steps.authority.outputs.canonical_sha }}
      quality_run_id: ${{ steps.authority.outputs.quality_run_id }}
    steps:
      - name: Check out exact private execution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-execution
          persist-credentials: false

      - name: Refuse unless exact binding was explicitly armed later
        id: authority
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          b=json.loads(Path('private-execution/.github/production/current-source-clean-install-binding.json').read_text())
          sha=b.get('canonical_sha','')
          run_id=b.get('quality_run_id')
          if re.fullmatch(r'[0-9a-f]{40}',sha) is None or not isinstance(run_id,int): raise SystemExit('binding malformed')
          if os.environ.get('COMMAND','').strip()!=f'/current-source-clean-install {sha}': raise SystemExit('command differs from binding')
          if b.get('status')!='armed' or b.get('phone_execution_authority') is not True or b.get('runtime_secret_access_authority') is not True:
              raise SystemExit('current-source clean install is deliberately DISARMED pending accepted FULL_CYCLE_READINESS')
          if b.get('legacy_package_required') is not False or b.get('legacy_runtime_required') is not False or b.get('legacy_rollback_authority') is not False:
              raise SystemExit('legacy preservation leaked into clean-install authority')
          if b.get('same_job_pre_destructive_preflight_required') is not True: raise SystemExit('same-job phone preflight requirement disabled')
          headers={'Accept':'application/vnd.github+json','User-Agent':'mobile-proxy-clean-install-gate','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=15) as r: return json.load(r)
          if get('https://api.github.com/repos/iamaman11/mobile-proxy/commits/main').get('sha')!=sha: raise SystemExit('bound canonical SHA is not current public main')
          q=get(f'https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs/{run_id}')
          if not(q.get('name')=='Quality' and q.get('event')=='push' and q.get('head_branch')=='main' and q.get('head_sha')==sha and q.get('status')=='completed' and q.get('conclusion')=='success'): raise SystemExit('bound Quality invalid')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as h: h.write(f'canonical_sha={sha}\nquality_run_id={run_id}\n')
          PY

  build-sign:
    name: Build exact signed current-source APK off-phone
    needs: command-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ env.CANONICAL_SHA }}
          path: canonical
          persist-credentials: false
      - name: Build exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/android-release-output"
          python3 canonical/scripts/build_signed_android_release.py --repository-root canonical --canonical-sha "${CANONICAL_SHA}" --output-dir "${output}" --android-baseline-ref v0.1.3
          test -s "${output}/mobile-proxy-android-v0.1.4.apk"
          echo "output=${output}" >> "$GITHUB_ENV"
      - name: Upload exact signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-source-clean-install-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: |
            ${{ env.output }}/mobile-proxy-android-v0.1.4.apk
            ${{ env.output }}/android-release-evidence.json
          if-no-files-found: error
          retention-days: 7

  clean-install-phone:
    name: Globally serialized exact APK clean install
    needs: [command-gate, build-sign]
    if: ${{ needs.command-gate.result == 'success' && needs.build-sign.result == 'success' }}
    concurrency:
      group: production-phone-global-mutation
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 20
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
    steps:
      - name: Check out exact canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ env.CANONICAL_SHA }}
          path: canonical
          persist-credentials: false

      - name: Download exact same-run signed candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: current-source-clean-install-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate

      - name: Build typed Android digest helper from exact canonical source
        shell: bash
        working-directory: canonical
        run: |
          set -euo pipefail
          cargo build --locked -p operator-cli --bin android-artifact-digest
          cp target/debug/android-artifact-digest "${RUNNER_TEMP}/android-artifact-digest"
          chmod 0755 "${RUNNER_TEMP}/android-artifact-digest"

      - name: Exact same-job PHONE_ACCESS proof immediately before destructive clean install
        shell: bash
        run: |
          set -euo pipefail
          python3 canonical/scripts/run_private_phone_preflight.py --canonical-sha "${CANONICAL_SHA}" --output "${RUNNER_TEMP}/phone-access.json"
          python3 canonical/scripts/clean_install_android_production.py \
            --canonical-sha "${CANONICAL_SHA}" \
            --apk "${RUNNER_TEMP}/candidate/mobile-proxy-android-v0.1.4.apk" \
            --release-evidence "${RUNNER_TEMP}/candidate/android-release-evidence.json" \
            --digest-tool "${RUNNER_TEMP}/android-artifact-digest" \
            --expected-version-name 0.1.4 \
            --expected-version-code 1004 \
            --output "${RUNNER_TEMP}/clean-install-evidence.json"

      - name: Record bounded result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Current-source clean install
          - authority: exact protected public main + exact successful main Quality
          - global phone mutation lock: production-phone-global-mutation
          - PHONE_ACCESS: canonical registered-device proof, repeated inside canonical clean-install primitive at mutation boundaries
          - legacy APK/runtime required: false
          - rollback to legacy generation: false
          - target APK: com.example.mobileproxy 0.1.4 / 1004
          - runtime materialization: NOT part of this APK-only gate; requires a later separately authorized full-cycle mutation stage
          EOF
