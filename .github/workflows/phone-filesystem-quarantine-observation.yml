name: Production Android filesystem quarantine observation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  command-gate:
    name: Validate quarantine observation command and prepare canonical source
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/phone-filesystem-quarantine-observe ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      quality_run_id: ${{ steps.command.outputs.quality_run_id }}
      transaction_ids_json: ${{ steps.command.outputs.transaction_ids_json }}
    steps:
      - name: Validate exact command, canonical main SHA, Quality, and transaction IDs
        id: command
        shell: bash
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          tokens = os.environ.get('COMMAND', '').strip().split()
          if len(tokens) < 3 or tokens[0] != '/phone-filesystem-quarantine-observe':
              raise SystemExit('invalid filesystem quarantine observation command')
          requested_sha = tokens[1]
          if re.fullmatch(r'[0-9a-f]{40}', requested_sha) is None:
              raise SystemExit('invalid canonical SHA')
          transaction_ids = tokens[2:]
          transaction_pattern = re.compile(r'[A-Za-z0-9][A-Za-z0-9._-]{0,95}')
          if len(transaction_ids) > 8:
              raise SystemExit('too many quarantine transaction IDs')
          if len(set(transaction_ids)) != len(transaction_ids):
              raise SystemExit('duplicate quarantine transaction ID')
          if any(transaction_pattern.fullmatch(value) is None for value in transaction_ids):
              raise SystemExit('invalid quarantine transaction ID')

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'mobile-proxy-production-quarantine-observation',
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          canonical_main = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/commits/main'
          )['sha']
          if requested_sha != canonical_main:
              raise SystemExit('requested SHA is not current canonical main')

          query = urllib.parse.urlencode(
              {'head_sha': requested_sha, 'status': 'completed', 'per_page': 100}
          )
          runs = get_json(
              'https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?' + query
          ).get('workflow_runs', [])
          quality = [
              run for run in runs
              if run.get('name') == 'Quality'
              and run.get('head_sha') == requested_sha
              and run.get('conclusion') == 'success'
          ]
          if not quality:
              raise SystemExit('exact canonical SHA has no successful Quality run')
          quality.sort(
              key=lambda run: (run.get('run_attempt', 0), run.get('id', 0)),
              reverse=True,
          )
          transaction_ids_json = json.dumps(transaction_ids, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'canonical_sha={requested_sha}\n')
              handle.write(f"quality_run_id={quality[0]['id']}\n")
              handle.write(f'transaction_ids_json={transaction_ids_json}\n')
          PY

      - name: Checkout exact canonical source
        uses: actions/checkout@v4
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ steps.command.outputs.canonical_sha }}
          path: canonical
          persist-credentials: false

      - name: Checkout exact private evidence adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: private-control
          persist-credentials: false

      - name: Build immutable quarantine observation source bundle
        shell: bash
        env:
          CANONICAL_SHA: ${{ steps.command.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ steps.command.outputs.quality_run_id }}
          TRANSACTION_IDS_JSON: ${{ steps.command.outputs.transaction_ids_json }}
          PRIVATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "${CANONICAL_SHA}"
          test "$(git -C private-control rev-parse HEAD)" = "${PRIVATE_SHA}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-observe-source'
          root.mkdir(parents=True, exist_ok=False)
          scripts = (
              'run_private_phone_preflight.py',
              'run_android_capability_inventory.py',
              'android_filesystem_comparator.py',
              'run_android_filesystem_certification.py',
              'run_android_filesystem_quarantine_recovery.py',
              'physical_domain_generation.py',
          )
          digests = {}
          for name in scripts:
              source = Path('canonical/scripts') / name
              if not source.is_file():
                  raise SystemExit(f'canonical source missing: {name}')
              target = root / name
              shutil.copyfile(source, target)
              digests[name] = hashlib.sha256(target.read_bytes()).hexdigest()

          helper_source = Path('private-control/.github/scripts/filesystem_generation_inventory.py')
          if not helper_source.is_file():
              raise SystemExit('private filesystem generation evidence adapter is missing')
          helper = root / 'filesystem_generation_inventory.py'
          shutil.copyfile(helper_source, helper)
          helper_digest = hashlib.sha256(helper.read_bytes()).hexdigest()

          manifest = {
              'format_version': 2,
              'repository': 'iamaman11/mobile-proxy',
              'canonical_sha': os.environ['CANONICAL_SHA'],
              'quality_run_id': int(os.environ['QUALITY_RUN_ID']),
              'transaction_ids': json.loads(os.environ['TRANSACTION_IDS_JSON']),
              'scripts_sha256': digests,
              'private_repository': 'iamaman11/mobile-proxy-production',
              'private_sha': os.environ['PRIVATE_SHA'],
              'private_evidence_adapter': helper.name,
              'private_evidence_adapter_sha256': helper_digest,
          }
          (root / 'source-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload immutable quarantine observation source
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-observe-source-${{ steps.command.outputs.canonical_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-observe-source
          if-no-files-found: error
          retention-days: 1

  observe:
    name: Registered production phone read-only filesystem quarantine observation
    needs: command-gate
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 5
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      TRANSACTION_IDS_JSON: ${{ needs.command-gate.outputs.transaction_ids_json }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
    outputs:
      observation_validated: ${{ steps.result.outputs.observation_validated }}
      observation_complete: ${{ steps.result.outputs.observation_complete }}
      cleanup_admissible: ${{ steps.result.outputs.cleanup_admissible }}
      all_transactions_absent: ${{ steps.result.outputs.all_transactions_absent }}
      scratch_base_state: ${{ steps.result.outputs.scratch_base_state }}
      scratch_base_writable: ${{ steps.result.outputs.scratch_base_writable }}
      scratch_base_executable: ${{ steps.result.outputs.scratch_base_executable }}
      managed_base_state: ${{ steps.result.outputs.managed_base_state }}
      transaction_summary_json: ${{ steps.result.outputs.transaction_summary_json }}
      pre_generation_state: ${{ steps.pre-generation.outputs.state }}
      pre_filesystem_generation: ${{ steps.pre-generation.outputs.generation }}
      post_generation_state: ${{ steps.post-generation.outputs.state }}
      post_filesystem_generation: ${{ steps.post-generation.outputs.generation }}
      generation_stable: ${{ steps.generation-stability.outputs.generation_stable }}
      raw_evidence_persisted: ${{ steps.raw-evidence-state.outputs.raw_evidence_persisted }}
      promoted_facts_persisted: ${{ steps.evidence-state.outputs.promoted_facts_persisted }}
      artifact_persisted: ${{ steps.evidence-state.outputs.artifact_persisted }}
    steps:
      - name: Download immutable canonical quarantine observation logic (attempt 1)
        id: source-download-1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-filesystem-quarantine-observe-source-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-observe-source-attempt-1

      - name: Back off before quarantine observation source retry 2
        if: steps.source-download-1.outcome == 'failure'
        shell: bash
        run: sleep 2

      - name: Download immutable canonical quarantine observation logic (attempt 2)
        id: source-download-2
        if: steps.source-download-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-filesystem-quarantine-observe-source-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-observe-source-attempt-2

      - name: Back off before quarantine observation source retry 3
        if: steps.source-download-1.outcome == 'failure' && steps.source-download-2.outcome == 'failure'
        shell: bash
        run: sleep 5

      - name: Download immutable canonical quarantine observation logic (attempt 3)
        id: source-download-3
        if: steps.source-download-1.outcome == 'failure' && steps.source-download-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-filesystem-quarantine-observe-source-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-observe-source-attempt-3

      - name: Promote one successfully downloaded immutable quarantine observation source bundle
        id: source-transport
        shell: bash
        env:
          SOURCE_DOWNLOAD_1_OUTCOME: ${{ steps.source-download-1.outcome }}
          SOURCE_DOWNLOAD_2_OUTCOME: ${{ steps.source-download-2.outcome }}
          SOURCE_DOWNLOAD_3_OUTCOME: ${{ steps.source-download-3.outcome }}
        run: |
          set -euo pipefail
          selected=""
          selected_attempt=""
          if [ "${SOURCE_DOWNLOAD_1_OUTCOME}" = success ]; then
            selected="${RUNNER_TEMP}/phone-filesystem-quarantine-observe-source-attempt-1"
            selected_attempt=1
          elif [ "${SOURCE_DOWNLOAD_2_OUTCOME}" = success ]; then
            selected="${RUNNER_TEMP}/phone-filesystem-quarantine-observe-source-attempt-2"
            selected_attempt=2
          elif [ "${SOURCE_DOWNLOAD_3_OUTCOME}" = success ]; then
            selected="${RUNNER_TEMP}/phone-filesystem-quarantine-observe-source-attempt-3"
            selected_attempt=3
          else
            echo "no immutable quarantine observation source download attempt succeeded" >&2
            exit 1
          fi
          destination="${RUNNER_TEMP}/phone-filesystem-quarantine-observe-source"
          if [ -e "${destination}" ]; then
            echo "immutable quarantine observation source destination already exists" >&2
            exit 1
          fi
          mv "${selected}" "${destination}"
          echo "download_attempt=${selected_attempt}" >> "$GITHUB_OUTPUT"

      - name: Verify source bundle before generation resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-observe-source'
          manifest = json.loads((root / 'source-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('format_version') != 2:
              raise SystemExit('unsupported source manifest')
          if manifest.get('repository') != 'iamaman11/mobile-proxy':
              raise SystemExit('source repository differs')
          if manifest.get('canonical_sha') != os.environ['CANONICAL_SHA']:
              raise SystemExit('source canonical SHA differs')
          if manifest.get('quality_run_id') != int(os.environ['QUALITY_RUN_ID']):
              raise SystemExit('source Quality authority differs')
          if manifest.get('transaction_ids') != json.loads(os.environ['TRANSACTION_IDS_JSON']):
              raise SystemExit('source quarantine transaction set differs')
          expected = manifest.get('scripts_sha256')
          required = {
              'run_private_phone_preflight.py',
              'run_android_capability_inventory.py',
              'android_filesystem_comparator.py',
              'run_android_filesystem_certification.py',
              'run_android_filesystem_quarantine_recovery.py',
              'physical_domain_generation.py',
          }
          if not isinstance(expected, dict) or set(expected) != required:
              raise SystemExit('source script set differs')
          for name, digest in expected.items():
              path = root / name
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'source digest differs: {name}')
          if manifest.get('private_repository') != 'iamaman11/mobile-proxy-production':
              raise SystemExit('private evidence adapter repository differs')
          helper = root / manifest.get('private_evidence_adapter', '')
          if helper.name != 'filesystem_generation_inventory.py' or helper.parent != root:
              raise SystemExit('private evidence adapter path differs')
          if hashlib.sha256(helper.read_bytes()).hexdigest() != manifest.get('private_evidence_adapter_sha256'):
              raise SystemExit('private evidence adapter digest differs')
          PY

      - name: Fetch trusted filesystem CONTROL history before observation
        id: pre-history
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const headings = [
              '## CONTROL FILESYSTEM MUTATION INTENT',
              '## CONTROL ANDROID FILESYSTEM MUTATION RESULT',
              '## CONTROL ANDROID FILESYSTEM QUARANTINE CLEANUP RESULT',
            ];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              per_page: 100,
            });
            const bounded = comments
              .filter((comment) => headings.some((heading) => String(comment.body || '').startsWith(heading)))
              .map((comment) => ({
                id: comment.id,
                body: String(comment.body || ''),
                user: {login: String(comment.user?.login || '')},
              }));
            if (bounded.length > 512) {
              throw new Error('bounded filesystem CONTROL history exceeds supported inventory size');
            }
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, 'filesystem-control-comments-pre.json'),
              JSON.stringify(bounded),
              'utf8',
            );

      - name: Resolve filesystem generation before any device observation
        id: pre-generation
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/phone-filesystem-quarantine-observe-source"
          python3 "${root}/filesystem_generation_inventory.py" \
            --comments "${RUNNER_TEMP}/filesystem-control-comments-pre.json" \
            --output "${RUNNER_TEMP}/filesystem-generation-inventory-pre.json"
          set +e
          python3 "${root}/physical_domain_generation.py" \
            --inventory "${RUNNER_TEMP}/filesystem-generation-inventory-pre.json" \
            --output "${RUNNER_TEMP}/filesystem-generation-pre.json"
          resolver_status=$?
          set -e
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          resolution = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'filesystem-generation-pre.json').read_text(encoding='utf-8')
          )
          state = str(resolution.get('state', 'INVALID_EVIDENCE'))
          generation = str(resolution.get('generation', ''))
          if resolution.get('domain_scope') != 'domain/filesystem':
              raise SystemExit('pre-observation generation scope differs')
          if resolution.get('git_source_dependency') is not False:
              raise SystemExit('filesystem generation must not depend on Git source identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'state={state}\n')
              handle.write(f'generation={generation}\n')
          PY
          test "${resolver_status}" -eq 0 || true

      - name: Require resolved filesystem generation before device access
        shell: bash
        env:
          GENERATION_STATE: ${{ steps.pre-generation.outputs.state }}
          FILESYSTEM_GENERATION: ${{ steps.pre-generation.outputs.generation }}
        run: |
          set -euo pipefail
          test "${GENERATION_STATE}" = RESOLVED
          test -n "${FILESYSTEM_GENERATION}"

      - name: Derive bounded causal quarantine observation context
        id: causal-context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import os
          import re

          serial = os.environ.get('ANDROID_PRODUCTION_SERIAL', '')
          binding_key = os.environ.get('ANDROID_TARGET_BINDING_KEY', '')
          if not serial:
              raise SystemExit('registered production target binding is unavailable')
          if len(binding_key) < 32:
              raise SystemExit('target binding HMAC key is unavailable or too short')
          if binding_key == serial:
              raise SystemExit('target binding HMAC key must be independent from raw device binding')
          message = b'android-production\0' + serial.encode('utf-8')
          target_binding_id = (
              'tb-hmac-sha256:'
              + hmac.new(binding_key.encode('utf-8'), message, hashlib.sha256).hexdigest()
          )
          if re.fullmatch(r'tb-hmac-sha256:[0-9a-f]{64}', target_binding_id) is None:
              raise SystemExit('opaque target binding identity is invalid')
          observation_ref = (
              f"filesystem-quarantine-observation:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'target_binding_id={target_binding_id}\n')
              handle.write(f'observation_ref={observation_ref}\n')
          PY

      - name: Run bounded read-only quarantine observation
        id: observe-physical
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-observe-source'
          output = Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-observation.json'
          command = [
              'python3',
              str(root / 'run_android_filesystem_quarantine_recovery.py'),
              '--mode', 'observe',
              '--canonical-sha', os.environ['CANONICAL_SHA'],
              '--target-binding-id', os.environ['TARGET_BINDING_ID'],
              '--filesystem-generation', os.environ['FILESYSTEM_GENERATION'],
              '--observation-ref', os.environ['OBSERVATION_REF'],
          ]
          for transaction_id in json.loads(os.environ['TRANSACTION_IDS_JSON']):
              command += ['--transaction-id', transaction_id]
          command += ['--output', str(output)]
          subprocess.run(command, check=True)
          PY
        env:
          TARGET_BINDING_ID: ${{ steps.causal-context.outputs.target_binding_id }}
          FILESYSTEM_GENERATION: ${{ steps.pre-generation.outputs.generation }}
          OBSERVATION_REF: ${{ steps.causal-context.outputs.observation_ref }}

      - name: Validate canonical causal quarantine facts and export bounded observation
        id: result
        shell: bash
        env:
          TARGET_BINDING_ID: ${{ steps.causal-context.outputs.target_binding_id }}
          FILESYSTEM_GENERATION: ${{ steps.pre-generation.outputs.generation }}
          OBSERVATION_REF: ${{ steps.causal-context.outputs.observation_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-observation.json').read_text(
                  encoding='utf-8'
              )
          )
          expected_ids = json.loads(os.environ['TRANSACTION_IDS_JSON'])
          if evidence.get('format_version') != 1:
              raise SystemExit('unsupported quarantine observation evidence')
          if evidence.get('repository') != 'iamaman11/mobile-proxy':
              raise SystemExit('quarantine observation repository differs')
          if evidence.get('canonical_sha') != os.environ['CANONICAL_SHA']:
              raise SystemExit('quarantine observation canonical SHA differs')
          if evidence.get('operation_id') != 'android.filesystem-quarantine-observation.v1':
              raise SystemExit('quarantine observation operation differs')
          if evidence.get('mode') != 'read_only_quarantine_observation':
              raise SystemExit('quarantine observation mode differs')
          for flag in (
              'raw_directory_contents_recorded',
              'raw_command_output_recorded',
              'raw_device_identifier_recorded',
              'phone_mutation_performed',
          ):
              if evidence.get(flag) is not False:
                  raise SystemExit(f'quarantine observation unsafe flag differs: {flag}')

          node_states = {'ABSENT', 'DIRECTORY', 'SYMLINK', 'OTHER', 'UNKNOWN'}
          access_states = {'SUPPORTED', 'UNSUPPORTED', 'UNKNOWN'}
          scratch_base = evidence.get('scratch_base')
          managed_base = evidence.get('managed_base')
          for label, base in (('scratch', scratch_base), ('managed', managed_base)):
              if not isinstance(base, dict):
                  raise SystemExit(f'{label} base observation is invalid')
              if base.get('node_state') not in node_states:
                  raise SystemExit(f'{label} base node state is invalid')
              if base.get('writable') not in access_states or base.get('executable') not in access_states:
                  raise SystemExit(f'{label} base access state is invalid')

          transactions = evidence.get('transactions')
          if not isinstance(transactions, list):
              raise SystemExit('quarantine transaction observations are invalid')
          if [item.get('transaction_id') for item in transactions] != expected_ids:
              raise SystemExit('quarantine observation transaction IDs differ')
          summary = []
          all_absent = True
          for item in transactions:
              scratch = item.get('scratch')
              managed = item.get('managed_root')
              if not isinstance(scratch, dict) or not isinstance(managed, dict):
                  raise SystemExit('quarantine transaction scope is invalid')
              scratch_state = scratch.get('node_state')
              managed_state = managed.get('node_state')
              if scratch_state not in node_states or managed_state not in node_states:
                  raise SystemExit('quarantine transaction node state is invalid')
              all_absent = all_absent and scratch_state == 'ABSENT' and managed_state == 'ABSENT'
              summary.append({
                  'transaction_id': item['transaction_id'],
                  'scratch': scratch_state,
                  'managed_root': managed_state,
              })

          complete = evidence.get('observation_complete') is True
          admissible = evidence.get('cleanup_admissible') is True
          if admissible and not complete:
              raise SystemExit('cleanup admissible cannot be true for incomplete observation')

          dependencies = [
              {'scope': 'target/android-production', 'identity': os.environ['TARGET_BINDING_ID']},
              {
                  'scope': 'observer/filesystem-quarantine',
                  'identity': 'android.filesystem-quarantine-observer.v2',
              },
              {'scope': 'domain/filesystem', 'identity': os.environ['FILESYSTEM_GENERATION']},
          ]
          dependencies.extend(
              {'scope': f'transaction/{transaction_id}', 'identity': transaction_id}
              for transaction_id in expected_ids
          )
          common = {
              'target': 'android-production',
              'observation_ref': os.environ['OBSERVATION_REF'],
              'source_ref': os.environ['CANONICAL_SHA'],
              'dependencies': dependencies,
              'authority': 'CONTROL',
              'persisted': False,
          }
          expected_facts = []
          if complete:
              expected_facts = [
                  {
                      'subject': 'filesystem-quarantine',
                      'predicate': 'transactions_absent',
                      'value': all_absent,
                      **common,
                  },
                  {
                      'subject': 'filesystem-quarantine',
                      'predicate': 'cleanup_admissible',
                      'value': admissible,
                      **common,
                  },
              ]
          if evidence.get('observed_facts') != expected_facts:
              raise SystemExit('canonical quarantine causal fact envelope differs')
          if evidence.get('causal_fact_envelope_emitted') is not bool(expected_facts):
              raise SystemExit('canonical quarantine causal fact emission flag differs')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('observation_validated=true\n')
              handle.write(f'observation_complete={str(complete).lower()}\n')
              handle.write(f'cleanup_admissible={str(admissible).lower()}\n')
              handle.write(f'all_transactions_absent={str(all_absent).lower()}\n')
              handle.write(f"scratch_base_state={scratch_base['node_state']}\n")
              handle.write(f"scratch_base_writable={scratch_base['writable']}\n")
              handle.write(f"scratch_base_executable={scratch_base['executable']}\n")
              handle.write(f"managed_base_state={managed_base['node_state']}\n")
              handle.write('transaction_summary_json=' + json.dumps(summary, separators=(',', ':')) + '\n')
          PY

      - name: Upload raw bounded quarantine observation evidence (attempt 1)
        id: evidence-upload-1
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-observation-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-observation.json
          if-no-files-found: error
          retention-days: 30

      - name: Back off before quarantine observation evidence retry 2
        if: always() && steps.result.outcome == 'success' && steps.evidence-upload-1.outcome == 'failure'
        shell: bash
        run: sleep 3

      - name: Upload raw bounded quarantine observation evidence (attempt 2)
        id: evidence-upload-2
        if: always() && steps.result.outcome == 'success' && steps.evidence-upload-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-observation-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-observation.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Back off before quarantine observation evidence retry 3
        if: always() && steps.result.outcome == 'success' && steps.evidence-upload-1.outcome == 'failure' && steps.evidence-upload-2.outcome == 'failure'
        shell: bash
        run: sleep 6

      - name: Upload raw bounded quarantine observation evidence (attempt 3)
        id: evidence-upload-3
        if: always() && steps.result.outcome == 'success' && steps.evidence-upload-1.outcome == 'failure' && steps.evidence-upload-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-observation-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-observation.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Export raw quarantine observation persistence state
        id: raw-evidence-state
        if: always()
        shell: bash
        env:
          RESULT_OUTCOME: ${{ steps.result.outcome }}
          EVIDENCE_UPLOAD_1_OUTCOME: ${{ steps.evidence-upload-1.outcome }}
          EVIDENCE_UPLOAD_2_OUTCOME: ${{ steps.evidence-upload-2.outcome }}
          EVIDENCE_UPLOAD_3_OUTCOME: ${{ steps.evidence-upload-3.outcome }}
        run: |
          set -euo pipefail
          persisted=false
          if [ "${RESULT_OUTCOME}" = success ]; then
            for outcome in "${EVIDENCE_UPLOAD_1_OUTCOME}" "${EVIDENCE_UPLOAD_2_OUTCOME}" "${EVIDENCE_UPLOAD_3_OUTCOME}"; do
              if [ "${outcome}" = success ]; then
                persisted=true
                break
              fi
            done
          fi
          echo "raw_evidence_persisted=${persisted}" >> "$GITHUB_OUTPUT"

      - name: Fetch trusted filesystem CONTROL history after observation
        id: post-history
        if: steps.raw-evidence-state.outputs.raw_evidence_persisted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const headings = [
              '## CONTROL FILESYSTEM MUTATION INTENT',
              '## CONTROL ANDROID FILESYSTEM MUTATION RESULT',
              '## CONTROL ANDROID FILESYSTEM QUARANTINE CLEANUP RESULT',
            ];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              per_page: 100,
            });
            const bounded = comments
              .filter((comment) => headings.some((heading) => String(comment.body || '').startsWith(heading)))
              .map((comment) => ({
                id: comment.id,
                body: String(comment.body || ''),
                user: {login: String(comment.user?.login || '')},
              }));
            if (bounded.length > 512) {
              throw new Error('bounded filesystem CONTROL history exceeds supported inventory size');
            }
            fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, 'filesystem-control-comments-post.json'),
              JSON.stringify(bounded),
              'utf8',
            );

      - name: Resolve filesystem generation after raw observation persistence
        id: post-generation
        if: steps.raw-evidence-state.outputs.raw_evidence_persisted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/phone-filesystem-quarantine-observe-source"
          python3 "${root}/filesystem_generation_inventory.py" \
            --comments "${RUNNER_TEMP}/filesystem-control-comments-post.json" \
            --output "${RUNNER_TEMP}/filesystem-generation-inventory-post.json"
          set +e
          python3 "${root}/physical_domain_generation.py" \
            --inventory "${RUNNER_TEMP}/filesystem-generation-inventory-post.json" \
            --output "${RUNNER_TEMP}/filesystem-generation-post.json"
          resolver_status=$?
          set -e
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          resolution = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'filesystem-generation-post.json').read_text(encoding='utf-8')
          )
          state = str(resolution.get('state', 'INVALID_EVIDENCE'))
          generation = str(resolution.get('generation', ''))
          if resolution.get('domain_scope') != 'domain/filesystem':
              raise SystemExit('post-observation generation scope differs')
          if resolution.get('git_source_dependency') is not False:
              raise SystemExit('filesystem generation must not depend on Git source identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'state={state}\n')
              handle.write(f'generation={generation}\n')
              handle.write(f'resolver_exit={resolver_status}\n')
          PY

      - name: Classify pre/post filesystem generation stability
        id: generation-stability
        if: always()
        shell: bash
        env:
          RAW_EVIDENCE_PERSISTED: ${{ steps.raw-evidence-state.outputs.raw_evidence_persisted }}
          PRE_STATE: ${{ steps.pre-generation.outputs.state }}
          PRE_GENERATION: ${{ steps.pre-generation.outputs.generation }}
          POST_STATE: ${{ steps.post-generation.outputs.state }}
          POST_GENERATION: ${{ steps.post-generation.outputs.generation }}
        run: |
          set -euo pipefail
          stable=false
          if [ "${RAW_EVIDENCE_PERSISTED}" = true ] && \
             [ "${PRE_STATE}" = RESOLVED ] && \
             [ "${POST_STATE}" = RESOLVED ] && \
             [ -n "${PRE_GENERATION}" ] && \
             [ "${PRE_GENERATION}" = "${POST_GENERATION}" ]; then
            stable=true
          fi
          echo "generation_stable=${stable}" >> "$GITHUB_OUTPUT"

      - name: Promote canonical quarantine facts after stable double-resolution
        id: promote-facts
        if: >-
          steps.raw-evidence-state.outputs.raw_evidence_persisted == 'true' &&
          steps.generation-stability.outputs.generation_stable == 'true' &&
          steps.result.outputs.observation_complete == 'true'
        shell: bash
        env:
          PRE_GENERATION: ${{ steps.pre-generation.outputs.generation }}
          POST_GENERATION: ${{ steps.post-generation.outputs.generation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          raw = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-observation.json').read_text(
                  encoding='utf-8'
              )
          )
          facts = raw.get('observed_facts')
          if not isinstance(facts, list) or len(facts) != 2:
              raise SystemExit('only one complete two-fact quarantine observation may be promoted')
          promoted_facts = []
          for raw_fact in facts:
              if raw_fact.get('authority') != 'CONTROL' or raw_fact.get('persisted') is not False:
                  raise SystemExit('only unpersisted CONTROL quarantine facts may be promoted')
              promoted = copy.deepcopy(raw_fact)
              promoted['persisted'] = True
              comparison = copy.deepcopy(promoted)
              comparison['persisted'] = False
              if comparison != raw_fact:
                  raise SystemExit('quarantine fact promotion changed causal or physical identity')
              promoted_facts.append(promoted)
          envelope = {
              'format_version': 1,
              'evidence_type': 'PROMOTED_OBSERVED_FACT_SET',
              'authority': 'CONTROL',
              'lifecycle': 'CURRENT',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'raw_evidence_ref': f"phone-filesystem-quarantine-observation:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}",
              'raw_evidence_persisted': True,
              'pre_filesystem_generation': os.environ['PRE_GENERATION'],
              'post_filesystem_generation': os.environ['POST_GENERATION'],
              'generation_stable': True,
              'promotion_changes_only_persistence': True,
              'observed_facts': promoted_facts,
              'raw_device_identifier_recorded': False,
              'phone_mutation_performed': False,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'phone-filesystem-quarantine-promoted-facts.json').write_text(
              json.dumps(envelope, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Persist promoted reusable quarantine facts independently
        id: promoted-facts-upload
        if: steps.promote-facts.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-filesystem-quarantine-observed-facts-${{ env.CANONICAL_SHA }}-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-filesystem-quarantine-promoted-facts.json
          if-no-files-found: error
          retention-days: 30

      - name: Export reusable quarantine fact persistence state
        id: evidence-state
        if: always()
        shell: bash
        env:
          RAW_EVIDENCE_PERSISTED: ${{ steps.raw-evidence-state.outputs.raw_evidence_persisted }}
          GENERATION_STABLE: ${{ steps.generation-stability.outputs.generation_stable }}
          PROMOTE_FACTS_OUTCOME: ${{ steps.promote-facts.outcome }}
          PROMOTED_FACTS_UPLOAD_OUTCOME: ${{ steps.promoted-facts-upload.outcome }}
        run: |
          set -euo pipefail
          promoted=false
          if [ "${RAW_EVIDENCE_PERSISTED}" = true ] && \
             [ "${GENERATION_STABLE}" = true ] && \
             [ "${PROMOTE_FACTS_OUTCOME}" = success ] && \
             [ "${PROMOTED_FACTS_UPLOAD_OUTCOME}" = success ]; then
            promoted=true
          fi
          echo "promoted_facts_persisted=${promoted}" >> "$GITHUB_OUTPUT"
          echo "artifact_persisted=${promoted}" >> "$GITHUB_OUTPUT"

  report:
    name: Publish bounded quarantine observation classification
    if: always() && needs.command-gate.result != 'skipped'
    needs: [command-gate, observe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment bounded quarantine observation result on control issue
        uses: actions/github-script@v7
        env:
          CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
          OBSERVATION_JOB_RESULT: ${{ needs.observe.result }}
          OBSERVATION_VALIDATED: ${{ needs.observe.outputs.observation_validated }}
          OBSERVATION_COMPLETE: ${{ needs.observe.outputs.observation_complete }}
          CLEANUP_ADMISSIBLE: ${{ needs.observe.outputs.cleanup_admissible }}
          ALL_ABSENT: ${{ needs.observe.outputs.all_transactions_absent }}
          SCRATCH_BASE_STATE: ${{ needs.observe.outputs.scratch_base_state }}
          SCRATCH_BASE_WRITABLE: ${{ needs.observe.outputs.scratch_base_writable }}
          SCRATCH_BASE_EXECUTABLE: ${{ needs.observe.outputs.scratch_base_executable }}
          MANAGED_BASE_STATE: ${{ needs.observe.outputs.managed_base_state }}
          TRANSACTION_SUMMARY_JSON: ${{ needs.observe.outputs.transaction_summary_json }}
          PRE_GENERATION_STATE: ${{ needs.observe.outputs.pre_generation_state }}
          PRE_FILESYSTEM_GENERATION: ${{ needs.observe.outputs.pre_filesystem_generation }}
          POST_GENERATION_STATE: ${{ needs.observe.outputs.post_generation_state }}
          POST_FILESYSTEM_GENERATION: ${{ needs.observe.outputs.post_filesystem_generation }}
          GENERATION_STABLE: ${{ needs.observe.outputs.generation_stable }}
          RAW_EVIDENCE_PERSISTED: ${{ needs.observe.outputs.raw_evidence_persisted }}
          PROMOTED_FACTS_PERSISTED: ${{ needs.observe.outputs.promoted_facts_persisted }}
          ARTIFACT_PERSISTED: ${{ needs.observe.outputs.artifact_persisted }}
        with:
          script: |
            const validated = process.env.OBSERVATION_VALIDATED === 'true';
            const complete = process.env.OBSERVATION_COMPLETE === 'true';
            const admissible = process.env.CLEANUP_ADMISSIBLE === 'true';
            const allAbsent = process.env.ALL_ABSENT === 'true';
            const rawPersisted = process.env.RAW_EVIDENCE_PERSISTED === 'true';
            const generationStable = process.env.GENERATION_STABLE === 'true';
            const persisted = process.env.ARTIFACT_PERSISTED === 'true';
            let classification;
            if (process.env.PRE_GENERATION_STATE === 'UNKNOWN_EXECUTION_OUTCOME') {
              classification = 'FILESYSTEM_QUARANTINE_GENERATION_UNKNOWN';
            } else if (process.env.PRE_GENERATION_STATE === 'INVALID_EVIDENCE') {
              classification = 'FILESYSTEM_QUARANTINE_GENERATION_INVALID';
            } else if (!validated) {
              classification = 'FILESYSTEM_QUARANTINE_UNOBSERVED';
            } else if (!rawPersisted) {
              classification = 'FILESYSTEM_QUARANTINE_OBSERVED_UNPERSISTED';
            } else if (!complete) {
              classification = 'FILESYSTEM_QUARANTINE_OBSERVATION_UNKNOWN';
            } else if (!generationStable) {
              classification = 'FILESYSTEM_QUARANTINE_STALE_DURING_OBSERVATION';
            } else if (!persisted) {
              classification = 'FILESYSTEM_QUARANTINE_OBSERVED_UNPERSISTED';
            } else if (allAbsent) {
              classification = 'FILESYSTEM_QUARANTINE_ALREADY_ABSENT';
            } else if (admissible) {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_ADMISSIBLE';
            } else {
              classification = 'FILESYSTEM_QUARANTINE_CLEANUP_REFUSED';
            }
            let transactionLines = ['- transaction_summary: `unobserved`'];
            try {
              const transactions = JSON.parse(process.env.TRANSACTION_SUMMARY_JSON || '[]');
              transactionLines = transactions.map((item) =>
                `- transaction \`${item.transaction_id}\`: scratch=\`${item.scratch}\`, managed_root=\`${item.managed_root}\``
              );
            } catch (_) {}
            const body = [
              '## CONTROL ANDROID FILESYSTEM QUARANTINE OBSERVATION RESULT',
              '',
              `- classification: **${classification}**`,
              `- canonical_sha: \`${process.env.CANONICAL_SHA || 'unavailable'}\``,
              `- quality_run_id: \`${process.env.QUALITY_RUN_ID || 'unavailable'}\``,
              `- workflow_run_id: \`${context.runId}\``,
              `- workflow_run_attempt: \`${process.env.GITHUB_RUN_ATTEMPT}\``,
              `- observation_job_result: \`${process.env.OBSERVATION_JOB_RESULT}\``,
              `- observation_validated: \`${validated}\``,
              `- observation_complete: \`${process.env.OBSERVATION_COMPLETE || 'unobserved'}\``,
              `- cleanup_admissible: \`${process.env.CLEANUP_ADMISSIBLE || 'false'}\``,
              `- pre_generation_state: \`${process.env.PRE_GENERATION_STATE || 'unobserved'}\``,
              `- pre_domain/filesystem_generation: \`${process.env.PRE_FILESYSTEM_GENERATION || 'unobserved'}\``,
              `- post_generation_state: \`${process.env.POST_GENERATION_STATE || 'unobserved'}\``,
              `- post_domain/filesystem_generation: \`${process.env.POST_FILESYSTEM_GENERATION || 'unobserved'}\``,
              `- generation_stable: \`${generationStable}\``,
              `- raw_evidence_persisted: \`${rawPersisted}\``,
              `- promoted_facts_persisted: \`${process.env.PROMOTED_FACTS_PERSISTED || 'false'}\``,
              `- artifact_persisted: \`${process.env.ARTIFACT_PERSISTED || 'false'}\``,
              `- scratch_base_state: \`${process.env.SCRATCH_BASE_STATE || 'unobserved'}\``,
              `- scratch_base_writable: \`${process.env.SCRATCH_BASE_WRITABLE || 'unobserved'}\``,
              `- scratch_base_executable: \`${process.env.SCRATCH_BASE_EXECUTABLE || 'unobserved'}\``,
              `- managed_base_state: \`${process.env.MANAGED_BASE_STATE || 'unobserved'}\``,
              ...transactionLines,
              '- raw_directory_contents_recorded: `false`',
              '- raw_command_output_recorded: `false`',
              '- raw_device_identifier_recorded: `false`',
              '- phone_mutation_performed: `false`',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });