name: Production phone read-only preflight

on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      source_event_name:
        required: true
        type: string
      source_issue_number:
        required: true
        type: number
      source_comment_id:
        required: true
        type: number
      source_actor:
        required: true
        type: string
      source_comment_url:
        required: true
        type: string
      control_request_id:
        required: true
        type: string
      control_request_json:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: production-phone-read-only-preflight
  cancel-in-progress: false

jobs:
  command-gate:
    name: Validate command and prepare immutable canonical source
    if: inputs.source_issue_number == 1 && startsWith(inputs.command, '/phone-preflight ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canonical_sha: ${{ steps.command.outputs.canonical_sha }}
      quality_run_id: ${{ steps.command.outputs.quality_run_id }}
    steps:
      - name: Validate exact command, canonical main SHA, and Quality
        id: command
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          command = os.environ.get("COMMAND", "").strip()
          match = re.fullmatch(r"/phone-preflight ([0-9a-f]{40})", command)
          if match is None:
              raise SystemExit("invalid phone preflight command")
          requested_sha = match.group(1)

          def get_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "mobile-proxy-production-preflight",
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          canonical_main = get_json(
              "https://api.github.com/repos/iamaman11/mobile-proxy/commits/main"
          )["sha"]
          if requested_sha != canonical_main:
              raise SystemExit("requested SHA is not current canonical main")

          query = urllib.parse.urlencode(
              {"head_sha": requested_sha, "status": "completed", "per_page": 100}
          )
          runs = get_json(
              "https://api.github.com/repos/iamaman11/mobile-proxy/actions/runs?" + query
          ).get("workflow_runs", [])
          quality = [
              run
              for run in runs
              if run.get("name") == "Quality"
              and run.get("head_sha") == requested_sha
              and run.get("conclusion") == "success"
          ]
          if not quality:
              raise SystemExit("exact canonical SHA has no successful Quality run")
          quality.sort(key=lambda run: (run.get("run_attempt", 0), run.get("id", 0)), reverse=True)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"canonical_sha={requested_sha}\n")
              handle.write(f"quality_run_id={quality[0]['id']}\n")
          PY

      - name: Checkout exact canonical source on hosted runner
        uses: actions/checkout@v4
        with:
          repository: iamaman11/mobile-proxy
          ref: ${{ steps.command.outputs.canonical_sha }}
          path: canonical
          persist-credentials: false

      - name: Build immutable source bundle
        shell: bash
        env:
          CANONICAL_SHA: ${{ steps.command.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ steps.command.outputs.quality_run_id }}
        run: |
          set -euo pipefail
          test "$(git -C canonical rev-parse HEAD)" = "${CANONICAL_SHA}"
          test -f canonical/scripts/run_private_phone_preflight.py
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "phone-preflight-source"
          root.mkdir(parents=True, exist_ok=False)
          source = Path("canonical/scripts/run_private_phone_preflight.py")
          script = root / "run_private_phone_preflight.py"
          shutil.copyfile(source, script)
          manifest = {
              "format_version": 1,
              "repository": "iamaman11/mobile-proxy",
              "canonical_sha": os.environ["CANONICAL_SHA"],
              "quality_run_id": int(os.environ["QUALITY_RUN_ID"]),
              "script_path": script.name,
              "script_sha256": hashlib.sha256(script.read_bytes()).hexdigest(),
          }
          (root / "source-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable preflight source
        uses: actions/upload-artifact@v4
        with:
          name: phone-preflight-source-${{ steps.command.outputs.canonical_sha }}
          path: ${{ runner.temp }}/phone-preflight-source
          if-no-files-found: error
          retention-days: 1

  phone-preflight:
    name: Registered production phone read-only preflight
    needs: command-gate
    runs-on: [self-hosted, Linux, X64, android-production]
    timeout-minutes: 5
    env:
      CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
      QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
      ANDROID_PRODUCTION_SERIAL: ${{ secrets.ANDROID_PRODUCTION_SERIAL }}
      ANDROID_TARGET_BINDING_KEY: ${{ secrets.ANDROID_TARGET_BINDING_KEY }}
    outputs:
      accepted: ${{ steps.bounded-result.outputs.accepted }}
      registered_device_match: ${{ steps.bounded-result.outputs.registered_device_match }}
      adb_state: ${{ steps.bounded-result.outputs.adb_state }}
      shell_probe: ${{ steps.bounded-result.outputs.shell_probe }}
      causal_fact_validated: ${{ steps.causal-fact-validation.outputs.causal_fact_validated }}
      raw_evidence_persisted: ${{ steps.raw-evidence-state.outputs.raw_evidence_persisted }}
      promoted_fact_persisted: ${{ steps.evidence-state.outputs.promoted_fact_persisted }}
      artifact_persisted: ${{ steps.evidence-state.outputs.artifact_persisted }}
      raw_evidence_artifact_id: ${{ steps.evidence-upload.outputs.artifact-id }}
      promoted_fact_artifact_id: ${{ steps.promoted-fact-upload.outputs.artifact-id }}
    steps:
      - name: Download immutable canonical preflight logic (attempt 1)
        id: source-download-1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-preflight-source-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-preflight-source-attempt-1

      - name: Back off before immutable preflight source retry 2
        if: steps.source-download-1.outcome == 'failure'
        shell: bash
        run: sleep 3

      - name: Download immutable canonical preflight logic (attempt 2)
        id: source-download-2
        if: steps.source-download-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-preflight-source-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-preflight-source-attempt-2

      - name: Back off before immutable preflight source retry 3
        if: steps.source-download-1.outcome == 'failure' && steps.source-download-2.outcome == 'failure'
        shell: bash
        run: sleep 6

      - name: Download immutable canonical preflight logic (attempt 3)
        id: source-download-3
        if: steps.source-download-1.outcome == 'failure' && steps.source-download-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: phone-preflight-source-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-preflight-source-attempt-3

      - name: Promote one successfully downloaded immutable source bundle
        id: source-transport
        shell: bash
        env:
          SOURCE_DOWNLOAD_1_OUTCOME: ${{ steps.source-download-1.outcome }}
          SOURCE_DOWNLOAD_2_OUTCOME: ${{ steps.source-download-2.outcome }}
          SOURCE_DOWNLOAD_3_OUTCOME: ${{ steps.source-download-3.outcome }}
        run: |
          set -euo pipefail
          selected=""
          selected_attempt=""
          if [ "${SOURCE_DOWNLOAD_1_OUTCOME}" = success ]; then
            selected="${RUNNER_TEMP}/phone-preflight-source-attempt-1"
            selected_attempt=1
          elif [ "${SOURCE_DOWNLOAD_2_OUTCOME}" = success ]; then
            selected="${RUNNER_TEMP}/phone-preflight-source-attempt-2"
            selected_attempt=2
          elif [ "${SOURCE_DOWNLOAD_3_OUTCOME}" = success ]; then
            selected="${RUNNER_TEMP}/phone-preflight-source-attempt-3"
            selected_attempt=3
          else
            echo "no immutable preflight source download attempt succeeded" >&2
            exit 1
          fi
          destination="${RUNNER_TEMP}/phone-preflight-source"
          if [ -e "${destination}" ] || [ -L "${destination}" ]; then
            echo "immutable preflight source destination already exists" >&2
            exit 1
          fi
          mv "${selected}" "${destination}"
          echo "download_attempt=${selected_attempt}" >> "$GITHUB_OUTPUT"

      - name: Verify canonical source bundle before phone access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "phone-preflight-source"
          manifest = json.loads((root / "source-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("format_version") != 1:
              raise SystemExit("unsupported source manifest")
          if manifest.get("repository") != "iamaman11/mobile-proxy":
              raise SystemExit("source repository differs")
          if manifest.get("canonical_sha") != os.environ["CANONICAL_SHA"]:
              raise SystemExit("source canonical SHA differs")
          if manifest.get("quality_run_id") != int(os.environ["QUALITY_RUN_ID"]):
              raise SystemExit("source Quality authority differs")
          script = root / manifest.get("script_path", "")
          if script.name != "run_private_phone_preflight.py" or script.parent != root:
              raise SystemExit("source script path differs")
          if hashlib.sha256(script.read_bytes()).hexdigest() != manifest.get("script_sha256"):
              raise SystemExit("source script digest differs")
          PY

      - name: Derive bounded causal phone-access context
        id: causal-context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import os
          import re

          serial = os.environ.get('ANDROID_PRODUCTION_SERIAL', '')
          binding_key = os.environ.get('ANDROID_TARGET_BINDING_KEY', '')
          if not serial:
              raise SystemExit('registered production target binding is unavailable')
          if len(binding_key) < 32:
              raise SystemExit('target binding HMAC key is unavailable or too short')
          if binding_key == serial:
              raise SystemExit('target binding HMAC key must be independent from raw device binding')
          message = b'android-production\0' + serial.encode('utf-8')
          target_binding_id = (
              'tb-hmac-sha256:'
              + hmac.new(binding_key.encode('utf-8'), message, hashlib.sha256).hexdigest()
          )
          if re.fullmatch(r'tb-hmac-sha256:[0-9a-f]{64}', target_binding_id) is None:
              raise SystemExit('opaque target binding identity is invalid')
          session_id = f"phone-preflight-session:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
          observation_ref = f"phone-preflight-observation:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'target_binding_id={target_binding_id}\n')
              handle.write(f'session_id={session_id}\n')
              handle.write(f'observation_ref={observation_ref}\n')
          PY

      - name: Run exact registered-device CONTROL preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/phone-preflight-source/run_private_phone_preflight.py" \
            --canonical-sha "${CANONICAL_SHA}" \
            --target-binding-id "${{ steps.causal-context.outputs.target_binding_id }}" \
            --session-id "${{ steps.causal-context.outputs.session_id }}" \
            --observation-ref "${{ steps.causal-context.outputs.observation_ref }}" \
            --output "${RUNNER_TEMP}/phone-preflight.json"

      - name: Validate canonical causal phone-access fact before persistence
        id: causal-fact-validation
        if: success()
        shell: bash
        env:
          TARGET_BINDING_ID: ${{ steps.causal-context.outputs.target_binding_id }}
          SESSION_ID: ${{ steps.causal-context.outputs.session_id }}
          OBSERVATION_REF: ${{ steps.causal-context.outputs.observation_ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'phone-preflight.json').read_text(encoding='utf-8')
          )
          expected_device = {
              'device_count': 1,
              'registered_device_match': True,
              'adb_state': 'device',
              'shell_probe': True,
          }
          expected_dependencies = [
              {'scope': 'target/android-production', 'identity': os.environ['TARGET_BINDING_ID']},
              {'scope': 'observer/phone-access', 'identity': 'android.phone-access-observer.v2'},
              {'scope': 'session/android-production', 'identity': os.environ['SESSION_ID']},
          ]
          expected_fact = {
              'subject': 'phone',
              'predicate': 'registered_phone_access_proven',
              'value': True,
              'target': 'android-production',
              'observation_ref': os.environ['OBSERVATION_REF'],
              'source_ref': os.environ['CANONICAL_SHA'],
              'dependencies': expected_dependencies,
              'authority': 'CONTROL',
              'persisted': False,
          }
          if evidence.get('format_version') != 1:
              raise SystemExit('phone preflight evidence format differs')
          if evidence.get('repository') != 'iamaman11/mobile-proxy':
              raise SystemExit('phone preflight evidence repository differs')
          if evidence.get('canonical_sha') != os.environ['CANONICAL_SHA']:
              raise SystemExit('phone preflight evidence source authority differs')
          if evidence.get('mode') != 'read_only':
              raise SystemExit('phone preflight evidence is not read-only')
          if evidence.get('accepted') is not True or evidence.get('device') != expected_device:
              raise SystemExit('registered-device probe predicates are not proven')
          if evidence.get('causal_fact_envelope_emitted') is not True:
              raise SystemExit('canonical phone-access causal fact was not emitted')
          if evidence.get('observed_facts') != [expected_fact]:
              raise SystemExit('canonical phone-access fact dependency envelope differs')
          if evidence.get('raw_device_identifier_recorded') is not False:
              raise SystemExit('raw device identifier recording is forbidden')
          if evidence.get('mutation_performed') is not False:
              raise SystemExit('phone preflight must remain read-only')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write('causal_fact_validated=true\n')
          PY

      - name: Export bounded CONTROL result
        id: bounded-result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "phone-preflight.json").read_text(encoding="utf-8")
          )
          device = evidence.get("device", {})
          values = {
              "accepted": evidence.get("accepted") is True,
              "registered_device_match": device.get("registered_device_match") is True,
              "adb_state": device.get("adb_state", "unknown"),
              "shell_probe": device.get("shell_probe") is True,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  if isinstance(value, bool):
                      value = str(value).lower()
                  handle.write(f"{key}={value}\n")
          PY

      - name: Upload bounded private evidence
        id: evidence-upload
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-read-only-preflight-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Export raw evidence persistence state
        id: raw-evidence-state
        if: always()
        shell: bash
        env:
          BOUNDED_RESULT_OUTCOME: ${{ steps.bounded-result.outcome }}
          CAUSAL_FACT_VALIDATION_OUTCOME: ${{ steps.causal-fact-validation.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.evidence-upload.outcome }}
        run: |
          set -euo pipefail
          persisted=false
          if [ "${BOUNDED_RESULT_OUTCOME}" = success ] && [ "${CAUSAL_FACT_VALIDATION_OUTCOME}" = success ] && [ "${EVIDENCE_UPLOAD_OUTCOME}" = success ]; then
            persisted=true
          fi
          echo "raw_evidence_persisted=${persisted}" >> "$GITHUB_OUTPUT"

      - name: Promote canonical phone-access fact after raw evidence persistence
        id: promote-fact
        if: steps.raw-evidence-state.outputs.raw_evidence_persisted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path

          raw_path = Path(os.environ['RUNNER_TEMP']) / 'phone-preflight.json'
          report = json.loads(raw_path.read_text(encoding='utf-8'))
          facts = report.get('observed_facts')
          if not isinstance(facts, list) or len(facts) != 1:
              raise SystemExit('raw causal fact cardinality differs during promotion')
          raw_fact = facts[0]
          if raw_fact.get('authority') != 'CONTROL' or raw_fact.get('persisted') is not False:
              raise SystemExit('only unpersisted CONTROL facts may be promoted')
          promoted_fact = copy.deepcopy(raw_fact)
          promoted_fact['persisted'] = True
          comparison = copy.deepcopy(promoted_fact)
          comparison['persisted'] = False
          if comparison != raw_fact:
              raise SystemExit('promotion changed physical value or causal dependency identity')
          promoted = {
              'format_version': 1,
              'evidence_type': 'PROMOTED_OBSERVED_FACT',
              'authority': 'CONTROL',
              'lifecycle': 'CURRENT',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'raw_evidence_ref': f"phone-read-only-preflight:{os.environ['GITHUB_RUN_ID']}:{os.environ['GITHUB_RUN_ATTEMPT']}",
              'raw_evidence_persisted': True,
              'promotion_changes_only_persistence': True,
              'observed_fact': promoted_fact,
              'raw_device_identifier_recorded': False,
              'phone_mutation_performed': False,
          }
          path = Path(os.environ['RUNNER_TEMP']) / 'phone-access-promoted-fact.json'
          path.write_text(json.dumps(promoted, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Persist promoted reusable phone-access fact independently
        id: promoted-fact-upload
        if: steps.promote-fact.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phone-access-observed-fact-${{ env.CANONICAL_SHA }}
          path: ${{ runner.temp }}/phone-access-promoted-fact.json
          if-no-files-found: error
          retention-days: 30

      - name: Export evidence persistence state
        id: evidence-state
        if: always()
        shell: bash
        env:
          RAW_EVIDENCE_PERSISTED: ${{ steps.raw-evidence-state.outputs.raw_evidence_persisted }}
          PROMOTE_FACT_OUTCOME: ${{ steps.promote-fact.outcome }}
          PROMOTED_FACT_UPLOAD_OUTCOME: ${{ steps.promoted-fact-upload.outcome }}
        run: |
          set -euo pipefail
          promoted=false
          if [ "${RAW_EVIDENCE_PERSISTED}" = true ] && [ "${PROMOTE_FACT_OUTCOME}" = success ] && [ "${PROMOTED_FACT_UPLOAD_OUTCOME}" = success ]; then
            promoted=true
          fi
          echo "promoted_fact_persisted=${promoted}" >> "$GITHUB_OUTPUT"
          echo "artifact_persisted=${promoted}" >> "$GITHUB_OUTPUT"

      - name: Record safe result
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Production phone read-only preflight
          - Canonical SHA: ${{ env.CANONICAL_SHA }}
          - Quality run: ${{ env.QUALITY_RUN_ID }}
          - Runner labels: self-hosted, Linux, X64, android-production
          - Source transport attempt: ${{ steps.source-transport.outputs.download_attempt || 'none' }}
          - Preflight outcome: ${{ steps.preflight.outcome }}
          - Causal fact validation: ${{ steps.causal-fact-validation.outputs.causal_fact_validated || 'false' }}
          - Bounded result outcome: ${{ steps.bounded-result.outcome }}
          - Raw evidence persisted: ${{ steps.raw-evidence-state.outputs.raw_evidence_persisted || 'false' }}
          - Promoted reusable fact persisted: ${{ steps.evidence-state.outputs.promoted_fact_persisted || 'false' }}
          - Evidence artifact persisted: ${{ steps.evidence-state.outputs.artifact_persisted }}
          - Device identifier recorded: false
          - Phone mutation performed: false
          EOF

  report:
    name: Publish bounded preflight classification
    if: always() && needs.command-gate.result != 'skipped'
    needs: [command-gate, phone-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish immutable correlated terminal receipt
        uses: actions/github-script@v7
        env:
          CANONICAL_SHA: ${{ needs.command-gate.outputs.canonical_sha }}
          QUALITY_RUN_ID: ${{ needs.command-gate.outputs.quality_run_id }}
          PHONE_JOB_RESULT: ${{ needs.phone-preflight.result }}
          ACCEPTED: ${{ needs.phone-preflight.outputs.accepted }}
          REGISTERED_DEVICE_MATCH: ${{ needs.phone-preflight.outputs.registered_device_match }}
          ADB_STATE: ${{ needs.phone-preflight.outputs.adb_state }}
          SHELL_PROBE: ${{ needs.phone-preflight.outputs.shell_probe }}
          CAUSAL_FACT_VALIDATED: ${{ needs.phone-preflight.outputs.causal_fact_validated }}
          RAW_EVIDENCE_PERSISTED: ${{ needs.phone-preflight.outputs.raw_evidence_persisted }}
          PROMOTED_FACT_PERSISTED: ${{ needs.phone-preflight.outputs.promoted_fact_persisted }}
          ARTIFACT_PERSISTED: ${{ needs.phone-preflight.outputs.artifact_persisted }}
          RAW_EVIDENCE_ARTIFACT_ID: ${{ needs.phone-preflight.outputs.raw_evidence_artifact_id }}
          PROMOTED_FACT_ARTIFACT_ID: ${{ needs.phone-preflight.outputs.promoted_fact_artifact_id }}
          CONTROL_REQUEST_ID: ${{ inputs.control_request_id }}
          CONTROL_REQUEST_JSON: ${{ inputs.control_request_json }}
          SOURCE_COMMENT_ID: ${{ inputs.source_comment_id }}
        with:
          script: |
            const attemptNumber = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isInteger(attemptNumber) || attemptNumber <= 0) {
              throw new Error('invalid GITHUB_RUN_ATTEMPT');
            }
            const executionId = `gh-run:${context.runId}:${attemptNumber}`;
            const request = JSON.parse(process.env.CONTROL_REQUEST_JSON);
            if (request.schema !== 'production-control-request.v1') {
              throw new Error('unexpected control request schema');
            }
            if (request.request_id !== process.env.CONTROL_REQUEST_ID) {
              throw new Error('semantic request id differs from routed input');
            }
            if (request.operation !== 'phone-preflight' || request.mutating !== false) {
              throw new Error('terminal reporter received wrong operation semantics');
            }
            if (Number(request.provenance?.comment_id) !== Number(process.env.SOURCE_COMMENT_ID)) {
              throw new Error('source command provenance differs');
            }

            const jobsResponse = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                attempt_number: attemptNumber,
                per_page: 100,
              },
            );
            const phoneJobs = jobsResponse.data.jobs.filter(
              (job) => job.name.endsWith('Registered production phone read-only preflight'),
            );
            if (phoneJobs.length !== 1) {
              throw new Error(`expected exactly one physical preflight job, found ${phoneJobs.length}`);
            }
            const phoneJob = phoneJobs[0];

            const rawArtifactId = Number(process.env.RAW_EVIDENCE_ARTIFACT_ID || 0);
            const promotedArtifactId = Number(process.env.PROMOTED_FACT_ARTIFACT_ID || 0);
            const validateArtifact = async (artifactId, expectedName) => {
              if (!Number.isInteger(artifactId) || artifactId <= 0) return null;
              const response = await github.request(
                'GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifactId,
                },
              );
              const artifact = response.data;
              if (artifact.name !== expectedName || artifact.expired === true) {
                throw new Error(`artifact ${artifactId} does not match expected durable evidence`);
              }
              if (Number(artifact.workflow_run?.id) !== Number(context.runId)) {
                throw new Error(`artifact ${artifactId} belongs to a different workflow run`);
              }
              return artifact;
            };
            const canonicalSha = process.env.CANONICAL_SHA || null;
            const rawArtifact = await validateArtifact(
              rawArtifactId,
              canonicalSha ? `phone-read-only-preflight-${canonicalSha}` : '',
            );
            const promotedArtifact = await validateArtifact(
              promotedArtifactId,
              canonicalSha ? `phone-access-observed-fact-${canonicalSha}` : '',
            );

            const probeAccepted =
              process.env.ACCEPTED === 'true' &&
              process.env.REGISTERED_DEVICE_MATCH === 'true' &&
              process.env.ADB_STATE === 'device' &&
              process.env.SHELL_PROBE === 'true';
            const causalFactValidated = process.env.CAUSAL_FACT_VALIDATED === 'true';
            const rawPersisted = process.env.RAW_EVIDENCE_PERSISTED === 'true';
            const promotedPersisted = process.env.PROMOTED_FACT_PERSISTED === 'true';
            const artifactPersisted = process.env.ARTIFACT_PERSISTED === 'true';
            const proven = probeAccepted && artifactPersisted;
            const classification = proven
              ? 'PHONE_ACCESS_PROVEN'
              : probeAccepted
                ? 'PHONE_ACCESS_OBSERVED_UNPERSISTED'
                : 'PHONE_ACCESS_UNOBSERVED';
            const routedJobConclusion = process.env.PHONE_JOB_RESULT;
            const executionJobSucceeded = routedJobConclusion === 'success';
            const accepted =
              executionJobSucceeded &&
              phoneJob.conclusion === 'success' &&
              proven &&
              causalFactValidated &&
              rawPersisted &&
              promotedPersisted &&
              rawArtifact !== null &&
              promotedArtifact !== null;
            const terminalState = accepted ? 'ACCEPTED' : probeAccepted ? 'UNKNOWN' : 'REFUSED';
            const requestedCanonicalSha =
              Array.isArray(request.arguments) && /^[0-9a-f]{40}$/.test(request.arguments[0] || '')
                ? request.arguments[0]
                : null;
            const terminal = {
              schema: 'control-execution-terminal.v1',
              source_comment_id: Number(process.env.SOURCE_COMMENT_ID),
              semantic_request_id: request.request_id,
              execution_id: executionId,
              workflow_run_id: Number(context.runId),
              workflow_run_attempt: attemptNumber,
              operation: 'phone-preflight',
              requested_canonical_sha: requestedCanonicalSha,
              canonical_sha: canonicalSha,
              private_sha: context.sha,
              request_authority_cursor: request.authority_cursor,
              physical_job_id: Number(phoneJob.id),
              physical_job_status: phoneJob.status,
              physical_job_conclusion: phoneJob.conclusion,
              runner: phoneJob.runner_name || null,
              terminal_state: terminalState,
              classification,
              registered_device_match: process.env.REGISTERED_DEVICE_MATCH === 'true',
              adb_state: process.env.ADB_STATE || 'unobserved',
              shell_probe: process.env.SHELL_PROBE === 'true',
              causal_fact_validated: causalFactValidated,
              mutation_performed: false,
              raw_device_identifier_recorded: false,
              evidence: {
                raw_artifact_id: rawArtifact ? Number(rawArtifact.id) : null,
                promoted_fact_artifact_id: promotedArtifact ? Number(promotedArtifact.id) : null,
              },
              terminal: true,
            };
            const body = [
              '## CONTROL EXECUTION TERMINAL',
              '',
              `- execution_id: \`${terminal.execution_id}\``,
              `- semantic_request_id: \`${terminal.semantic_request_id}\``,
              `- source_comment_id: \`${terminal.source_comment_id}\``,
              `- operation: \`${terminal.operation}\``,
              `- terminal_state: **${terminal.terminal_state}**`,
              `- classification: **${terminal.classification}**`,
              `- workflow_run_id: \`${terminal.workflow_run_id}\``,
              `- workflow_run_attempt: \`${terminal.workflow_run_attempt}\``,
              `- physical_job_id: \`${terminal.physical_job_id}\``,
              `- runner: \`${terminal.runner || 'unassigned'}\``,
              `- canonical_sha: \`${terminal.canonical_sha || 'unavailable'}\``,
              `- quality_run_id: \`${process.env.QUALITY_RUN_ID || 'unavailable'}\``,
              `- phone_job_result: \`${process.env.PHONE_JOB_RESULT}\``,
              `- probe_accepted: \`${probeAccepted}\``,
              `- artifact_persisted: \`${process.env.ARTIFACT_PERSISTED || 'false'}\``,
              `- registered_device_match: \`${terminal.registered_device_match}\``,
              `- adb_state: \`${terminal.adb_state}\``,
              `- shell_probe: \`${terminal.shell_probe}\``,
              `- mutation_performed: \`false\``,
              `- raw_artifact_id: \`${terminal.evidence.raw_artifact_id || 'none'}\``,
              `- promoted_fact_artifact_id: \`${terminal.evidence.promoted_fact_artifact_id || 'none'}\``,
              '',
              'This receipt is an immutable operator projection. Acceptance authority remains the exact run/job plus validated durable evidence.',
              '',
              '```json',
              JSON.stringify(terminal, null, 2),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
