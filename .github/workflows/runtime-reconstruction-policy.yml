name: Runtime reconstruction binding policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-reconstruction-contract:
    name: Validate pending reconstruction binding and hosted readiness shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce fail-closed runtime reconstruction policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          binding_path = Path('.github/production/runtime-reconstruction-binding.json')
          readiness_path = Path('.github/workflows/runtime-reconstruction-readiness.yml')
          recovery_path = Path('.github/workflows/phone-runtime-recovery.yml')
          if not binding_path.is_file():
              raise SystemExit('runtime reconstruction binding is missing')
          if not readiness_path.is_file():
              raise SystemExit('runtime reconstruction readiness workflow is missing')
          if not recovery_path.is_file():
              raise SystemExit('legacy runtime recovery workflow is missing')

          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          expected_top_level = {
              'format_version',
              'binding_role',
              'mode',
              'enrollment_status',
              'canonical_repository',
              'canonical_sha',
              'quality_required',
              'hardening_tracker_issue',
              'migration_tracker_issue',
              'application_id',
              'required_installed_version_name',
              'required_installed_version_code',
              'final_release_authority',
              'phone_execution_authority',
              'provider_credentials_allowed',
              'tunnel_owner',
              'tunnel_owner_evidence',
              'manifest_authority',
              'manifest_source',
              'manifest_fingerprint',
              'raw_device_identifier_in_binding',
              'required_manifest_fields',
              'expected_token_env_names',
              'required_runtime_secret_names',
              'evidence_policy',
          }
          if set(binding) != expected_top_level:
              extra = sorted(set(binding) - expected_top_level)
              missing = sorted(expected_top_level - set(binding))
              raise SystemExit(f'runtime reconstruction binding key drift: missing={missing} extra={extra}')

          expected_scalars = {
              'format_version': 1,
              'binding_role': 'private_execution_only',
              'mode': 'config_reconstruction_reauthorization',
              'enrollment_status': 'pending',
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': 'be619ebab9325e712cc6ef662689f78cc7131d5f',
              'quality_required': True,
              'hardening_tracker_issue': 179,
              'migration_tracker_issue': 162,
              'application_id': 'com.example.mobileproxy',
              'required_installed_version_name': '1.1.0',
              'required_installed_version_code': 2,
              'final_release_authority': False,
              'phone_execution_authority': False,
              'provider_credentials_allowed': False,
              'tunnel_owner': 'first_party_reverse_tunnel',
              'manifest_authority': 'new_reauthorized_baseline',
              'raw_device_identifier_in_binding': False,
          }
          for key, value in expected_scalars.items():
              if binding.get(key) != value:
                  raise SystemExit(f'runtime reconstruction binding mismatch: {key}')

          if binding.get('tunnel_owner_evidence') != {
              'evidence_type': 'canonical_live_verify',
              'canonical_commit': 'ad9bc7c88fcd0abd7bf422f12b852c24f6dc16ea',
              'historical_owner_evidence_only': True,
          }:
              raise SystemExit('historical tunnel-owner evidence binding drift')

          if binding.get('manifest_source') != {
              'kind': 'github_actions_secret',
              'secret_name': 'ANDROID_RUNTIME_RECONSTRUCTION_MANIFEST_JSON',
          }:
              raise SystemExit('runtime reconstruction manifest source drift')

          if binding.get('manifest_fingerprint') != {
              'algorithm': 'sha256',
              'normalized_json_profile': 'strict-sorted-compact-utf8-v1',
              'sha256': None,
          }:
              raise SystemExit('pending reconstruction fingerprint must remain unset and typed')

          expected_fields = [
              'deviceId',
              'nodeName',
              'operatorProfile',
              'controlPlaneUrl',
              'tokens.adminTokenEnv',
              'tokens.deviceTokenEnv',
              'tokens.uiTokenEnv',
              'tokens.reverseTunnelCertDerB64Env',
              'tokens.relayUserEnv',
              'tokens.relayPasswordEnv',
              'relay.host',
              'relay.httpPort',
          ]
          if binding.get('required_manifest_fields') != expected_fields:
              raise SystemExit('strict runtime reconstruction manifest field contract drift')

          expected_token_names = {
              'adminTokenEnv': 'MOBILE_PROXY_ADMIN_TOKEN',
              'deviceTokenEnv': 'MOBILE_PROXY_DEVICE_TOKEN',
              'uiTokenEnv': 'MOBILE_PROXY_UI_TOKEN',
              'reverseTunnelCertDerB64Env': 'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64',
              'relayUserEnv': 'MOBILE_PROXY_RELAY_USER',
              'relayPasswordEnv': 'MOBILE_PROXY_RELAY_PASSWORD',
          }
          if binding.get('expected_token_env_names') != expected_token_names:
              raise SystemExit('runtime reconstruction token environment contract drift')

          expected_runtime_secrets = [
              'MOBILE_PROXY_ADMIN_TOKEN',
              'MOBILE_PROXY_DEVICE_TOKEN',
              'MOBILE_PROXY_UI_TOKEN',
              'MOBILE_PROXY_RELAY_USER',
              'MOBILE_PROXY_RELAY_PASSWORD',
              'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64',
          ]
          if binding.get('required_runtime_secret_names') != expected_runtime_secrets:
              raise SystemExit('runtime reconstruction required secret-name contract drift')

          expected_evidence_policy = {
              'raw_manifest_recorded': False,
              'raw_device_identifier_recorded': False,
              'secret_values_recorded': False,
              'rendered_config_recorded': False,
              'config_digest_recorded': False,
              'manifest_fingerprint_publication_allowed': False,
              'credential_derived_identifiers_recorded': False,
          }
          if binding.get('evidence_policy') != expected_evidence_policy:
              raise SystemExit('runtime reconstruction evidence policy drift')

          readiness = readiness_path.read_text(encoding='utf-8')
          required_readiness_fragments = [
              'name: Runtime reconstruction readiness',
              '  workflow_dispatch:',
              '  contents: read',
              '    runs-on: ubuntu-latest',
              'runtime-reconstruction-binding.json',
              'readiness must execute from exact current private main',
              'reconstruction binding canonical SHA is not current public main',
              'exact current canonical SHA has no successful main Quality run',
              'production manifest enrollment is pending',
              'no manifest/runtime secret access or config rendering is authorized',
          ]
          for fragment in required_readiness_fragments:
              if fragment not in readiness:
                  raise SystemExit(f'runtime reconstruction readiness missing required fail-closed fragment: {fragment}')

          forbidden_pending_fragments = {
              'self-hosted runner': 'self-hosted',
              'production phone label': 'android-production',
              'GitHub secret expression': 'secrets.',
              'runtime packaging': 'package-device-release',
              'ADB command': 'adb ',
              'ADB executable list': "'adb'",
              'artifact upload': 'upload-artifact',
              'host config path': 'host-daemon.json',
              'sing-box config path': 'sing-box.json',
              'provider credential': 'VULTR_',
          }
          for label, fragment in forbidden_pending_fragments.items():
              if fragment in readiness:
                  raise SystemExit(f'pending reconstruction readiness contains forbidden {label}')

          if readiness.count('runs-on: ubuntu-latest') != 1:
              raise SystemExit('pending readiness must contain exactly one GitHub-hosted job')
          if re.search(r'(?m)^\s*issue_comment\s*:', readiness):
              raise SystemExit('pending readiness must not subscribe to production issue-comment fan-out')

          recovery = recovery_path.read_text(encoding='utf-8')
          recovery_guards = [
              'Refuse legacy-only recovery until empty-layout materialization is proven',
              'phone-runtime-recover is hard-blocked',
          ]
          for fragment in recovery_guards:
              if fragment not in recovery:
                  raise SystemExit('legacy runtime recovery hard block was removed before reconstruction authority exists')

          print('runtime reconstruction policy: accepted')
          print('enrollment_status=pending')
          print('tunnel_owner=first_party_reverse_tunnel')
          print('phone_execution_authority=false')
          print('provider_credentials_allowed=false')
          print('pending_readiness_secret_access=false')
          print('pending_readiness_phone_access=false')
          PY
