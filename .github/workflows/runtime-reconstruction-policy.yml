name: Runtime reconstruction binding policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-reconstruction-contract:
    name: Validate reconstruction binding, enrollment, and hosted-only recovery authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce fail-closed runtime reconstruction policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          binding_path = Path('.github/production/runtime-reconstruction-binding.json')
          readiness_path = Path('.github/workflows/runtime-reconstruction-readiness.yml')
          enrollment_path = Path('.github/workflows/runtime-reconstruction-enrollment.yml')
          recovery_path = Path('.github/workflows/phone-runtime-recovery.yml')
          for path, label in (
              (binding_path, 'runtime reconstruction binding'),
              (readiness_path, 'runtime reconstruction readiness workflow'),
              (enrollment_path, 'runtime reconstruction enrollment workflow'),
              (recovery_path, 'legacy runtime recovery workflow'),
          ):
              if not path.is_file():
                  raise SystemExit(f'{label} is missing')

          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          expected_top_level = {
              'format_version', 'binding_role', 'mode', 'enrollment_status',
              'canonical_repository', 'canonical_sha', 'quality_required',
              'hardening_tracker_issue', 'migration_tracker_issue', 'application_id',
              'required_installed_version_name', 'required_installed_version_code',
              'final_release_authority', 'phone_execution_authority',
              'provider_credentials_allowed', 'tunnel_owner', 'tunnel_owner_evidence',
              'manifest_authority', 'manifest_source', 'manifest_fingerprint',
              'raw_device_identifier_in_binding', 'required_manifest_fields',
              'expected_token_env_names', 'required_runtime_secret_names', 'evidence_policy',
          }
          if set(binding) != expected_top_level:
              raise SystemExit('runtime reconstruction binding key drift')

          expected_scalars = {
              'format_version': 1,
              'binding_role': 'private_execution_only',
              'mode': 'config_reconstruction_reauthorization',
              'canonical_repository': 'iamaman11/mobile-proxy',
              'canonical_sha': 'be619ebab9325e712cc6ef662689f78cc7131d5f',
              'quality_required': True,
              'hardening_tracker_issue': 179,
              'migration_tracker_issue': 162,
              'application_id': 'com.example.mobileproxy',
              'required_installed_version_name': '1.1.0',
              'required_installed_version_code': 2,
              'final_release_authority': False,
              'phone_execution_authority': False,
              'provider_credentials_allowed': False,
              'tunnel_owner': 'first_party_reverse_tunnel',
              'manifest_authority': 'new_reauthorized_baseline',
              'raw_device_identifier_in_binding': False,
          }
          for key, value in expected_scalars.items():
              if binding.get(key) != value:
                  raise SystemExit(f'runtime reconstruction binding mismatch: {key}')

          status = binding.get('enrollment_status')
          if status not in {'pending', 'enrolled'}:
              raise SystemExit('runtime reconstruction enrollment status must be pending or enrolled')

          if binding.get('tunnel_owner_evidence') != {
              'evidence_type': 'canonical_live_verify',
              'canonical_commit': 'ad9bc7c88fcd0abd7bf422f12b852c24f6dc16ea',
              'historical_owner_evidence_only': True,
          }:
              raise SystemExit('historical tunnel-owner evidence binding drift')
          if binding.get('manifest_source') != {
              'kind': 'github_actions_secret',
              'secret_name': 'ANDROID_RUNTIME_RECONSTRUCTION_MANIFEST_JSON',
          }:
              raise SystemExit('runtime reconstruction manifest source drift')

          fingerprint = binding.get('manifest_fingerprint')
          if not isinstance(fingerprint, dict) or fingerprint.get('algorithm') != 'sha256' or fingerprint.get('normalized_json_profile') != 'strict-sorted-compact-utf8-v1':
              raise SystemExit('runtime reconstruction fingerprint type/profile drift')
          fingerprint_value = fingerprint.get('sha256')
          if status == 'pending' and fingerprint_value is not None:
              raise SystemExit('pending reconstruction fingerprint must remain unset')
          if status == 'enrolled' and not (
              isinstance(fingerprint_value, str)
              and re.fullmatch(r'[0-9a-f]{64}', fingerprint_value)
          ):
              raise SystemExit('enrolled reconstruction fingerprint must be one private SHA-256 value')

          expected_fields = [
              'deviceId', 'nodeName', 'operatorProfile', 'controlPlaneUrl',
              'tokens.adminTokenEnv', 'tokens.deviceTokenEnv', 'tokens.uiTokenEnv',
              'tokens.reverseTunnelCertDerB64Env', 'tokens.relayUserEnv',
              'tokens.relayPasswordEnv', 'relay.host', 'relay.httpPort',
          ]
          if binding.get('required_manifest_fields') != expected_fields:
              raise SystemExit('strict runtime reconstruction manifest field contract drift')

          expected_token_names = {
              'adminTokenEnv': 'MOBILE_PROXY_ADMIN_TOKEN',
              'deviceTokenEnv': 'MOBILE_PROXY_DEVICE_TOKEN',
              'uiTokenEnv': 'MOBILE_PROXY_UI_TOKEN',
              'reverseTunnelCertDerB64Env': 'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64',
              'relayUserEnv': 'MOBILE_PROXY_RELAY_USER',
              'relayPasswordEnv': 'MOBILE_PROXY_RELAY_PASSWORD',
          }
          if binding.get('expected_token_env_names') != expected_token_names:
              raise SystemExit('runtime reconstruction token environment contract drift')
          expected_runtime_secrets = {
              'MOBILE_PROXY_ADMIN_TOKEN', 'MOBILE_PROXY_DEVICE_TOKEN', 'MOBILE_PROXY_UI_TOKEN',
              'MOBILE_PROXY_RELAY_USER', 'MOBILE_PROXY_RELAY_PASSWORD',
              'MOBILE_PROXY_REVERSE_TUNNEL_CERT_DER_B64',
          }
          actual_runtime_secrets = binding.get('required_runtime_secret_names')
          if not isinstance(actual_runtime_secrets, list) or len(actual_runtime_secrets) != 6 or set(actual_runtime_secrets) != expected_runtime_secrets:
              raise SystemExit('runtime reconstruction required secret-name contract drift')

          if binding.get('evidence_policy') != {
              'raw_manifest_recorded': False,
              'raw_device_identifier_recorded': False,
              'secret_values_recorded': False,
              'rendered_config_recorded': False,
              'config_digest_recorded': False,
              'manifest_fingerprint_publication_allowed': False,
              'credential_derived_identifiers_recorded': False,
          }:
              raise SystemExit('runtime reconstruction evidence policy drift')

          readiness = readiness_path.read_text(encoding='utf-8')
          for fragment in (
              'name: Runtime reconstruction readiness', '  workflow_dispatch:',
              '  contents: read', '    runs-on: ubuntu-latest',
              'runtime-reconstruction-binding.json', 'production manifest enrollment is pending',
              'no manifest/runtime secret access or config rendering is authorized',
          ):
              if fragment not in readiness:
                  raise SystemExit(f'runtime reconstruction readiness missing safe fragment: {fragment}')
          for fragment in (
              'self-hosted', 'android-production', 'secrets.', 'package-device-release',
              'upload-artifact', 'host-daemon.json', 'sing-box.json', 'VULTR_',
          ):
              if fragment in readiness:
                  raise SystemExit(f'current readiness skeleton contains forbidden protected behavior: {fragment}')
          if re.search(r'(?m)^\s*issue_comment\s*:', readiness):
              raise SystemExit('reconstruction readiness must not subscribe to production issue-comment fan-out')

          enrollment = enrollment_path.read_text(encoding='utf-8')
          required_enrollment = [
              'name: Runtime reconstruction manifest enrollment',
              '  workflow_dispatch:',
              '  issue_comment:',
              'types: [created]',
              "github.event.issue.number == 1",
              "github.event.comment.user.login == github.repository_owner",
              "github.event.comment.body == '/runtime-reconstruction-enroll ENROLL_NEW_RUNTIME_RECONSTRUCTION_BASELINE'",
              '      confirm:',
              'ENROLL_NEW_RUNTIME_RECONSTRUCTION_BASELINE',
              '  contents: write',
              '    runs-on: ubuntu-latest',
              'persist-credentials: false',
              'exact owner production-control enrollment command is required',
              'manifest enrollment must execute from exact current private main',
              'runtime reconstruction manifest top-level schema mismatch',
              'runtime reconstruction manifest token schema mismatch',
              'runtime reconstruction manifest relay schema mismatch',
              'sort_keys=True',
              'separators=(",", ":")',
              'hashlib.sha256(normalized).hexdigest()',
              'binding["enrollment_status"] = "enrolled"',
              'binding["manifest_fingerprint"]["sha256"] = fingerprint',
              'binding["phone_execution_authority"] = False',
              'Enroll private runtime reconstruction manifest baseline',
              'manifest_fingerprint_published=false',
              'runtime_secret_values_read=false',
              'phone_access=false',
          ]
          for fragment in required_enrollment:
              if fragment not in enrollment:
                  raise SystemExit(f'runtime reconstruction enrollment missing required fragment: {fragment}')

          if 'startsWith(' in enrollment:
              raise SystemExit('runtime reconstruction enrollment command gate must use exact equality, not prefix matching')
          if enrollment.count('secrets.') != 1 or 'secrets.ANDROID_RUNTIME_RECONSTRUCTION_MANIFEST_JSON' not in enrollment:
              raise SystemExit('enrollment may reference exactly one approved manifest secret and no other secret')
          for fragment in (
              'self-hosted', 'android-production', 'secrets.MOBILE_PROXY_',
              'ANDROID_PRODUCTION_SERIAL', 'package-device-release', 'upload-artifact',
              'host-daemon.json', 'sing-box.json', 'VULTR_', 'adb ', "'adb'",
              'GITHUB_OUTPUT', 'GITHUB_STEP_SUMMARY',
          ):
              if fragment in enrollment:
                  raise SystemExit(f'enrollment contains forbidden phone/runtime-secret/render/evidence behavior: {fragment}')
          if enrollment.count('runs-on: ubuntu-latest') != 1:
              raise SystemExit('enrollment must contain exactly one GitHub-hosted job')

          recovery = recovery_path.read_text(encoding='utf-8')
          for fragment in (
              'Refuse legacy-only recovery until empty-layout materialization is proven',
              'phone-runtime-recover is hard-blocked',
          ):
              if fragment not in recovery:
                  raise SystemExit('legacy runtime recovery hard block was removed before phone reconstruction authority exists')

          print('runtime reconstruction policy: accepted')
          print(f'enrollment_status={status}')
          print('tunnel_owner=first_party_reverse_tunnel')
          print('phone_execution_authority=false')
          print('provider_credentials_allowed=false')
          print('enrollment_manifest_secret_only=true')
          print('runtime_secret_access=false')
          print('phone_access=false')
          PY
