name: Phone transport preflight v3 policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-phone-transport-preflight-v3:
    name: Validate typed bounded phone transport preflight v3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile preflight transport surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/controller/phone_target.py \
            .github/controller/runner_transport_evidence.py \
            .github/scripts/phone_transport_preflight.py \
            .github/controller/tests/test_phone_target.py \
            .github/controller/tests/test_phone_transport_failure_contract.py \
            .github/controller/tests/test_phone_transport_preflight.py \
            .github/controller/tests/test_runner_transport_evidence.py

      - name: Run typed transport and S4.3 regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/controller/tests/test_phone_transport_failure_contract.py
          python3 .github/controller/tests/test_phone_transport_preflight.py
          python3 .github/controller/tests/test_phone_target.py
          python3 .github/controller/tests/test_runner_transport_evidence.py

      - name: Enforce preflight safety and canonical transport policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('.github/controller/phone_target.py').read_text(encoding='utf-8')
          script = Path('.github/scripts/phone_transport_preflight.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/phone-transport-preflight.yml').read_text(encoding='utf-8')

          required_controller = (
              'class PhoneFailurePhase(str, Enum):',
              'class PhoneTargetDiagnosticFailure(PhoneTargetUnavailable):',
              'PhoneFailurePhase.ADB_TOOLING_UNAVAILABLE',
              'PhoneFailurePhase.ADB_TRANSPORT_TIMEOUT',
              'PhoneFailurePhase.REGISTERED_DEVICE_NOT_DEVICE',
              'PhoneFailurePhase.ROOT_SHELL_SPAWN_FAILED',
              'PhoneFailurePhase.ROOT_SCRIPT_TIMEOUT',
              'PhoneFailurePhase.ROOT_SCRIPT_OUTPUT_TRUNCATED',
              'PhoneFailurePhase.ROOT_SCRIPT_PROTOCOL_MISMATCH',
              'PhoneFailurePhase.ROOT_SCRIPT_NONZERO',
              'PhoneFailurePhase.UNKNOWN',
              'command = [adb, "-s", serial, "shell", "-T", "su", "0"]',
              'def _probe_root_stdout_contract(serial: str) -> None:',
              'def _probe_root_stderr_exit_contract(serial: str) -> None:',
              '_probe_root_stdout_contract(serial)',
              '_probe_root_stderr_exit_contract(serial)',
              'b"printf \'stderr=ok\\\\n\' >&2\\nexit 23\\n"',
          )
          missing = [item for item in required_controller if item not in controller]
          if missing:
              raise SystemExit('typed phone transport contract missing: ' + ', '.join(missing))

          required_script = (
              'phone-transport-preflight.v3',
              '"phone_failure_phase": phone_failure_phase.value',
              '"workflow_execution": "success"',
              '"automatic_recovery_performed": False',
              '_probe_root_stdout_contract',
              '_probe_root_stderr_exit_contract',
          )
          missing = [item for item in required_script if item not in script]
          if missing:
              raise SystemExit('phone transport v3 script contract missing: ' + ', '.join(missing))

          required_workflow = (
              "value.get('schema') != 'phone-transport-preflight.v3'",
              "classification == 'NOT_READY' and phone_failure_phase == 'NONE'",
              "classification != 'NOT_READY' and phone_failure_phase != 'NONE'",
              'uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a',
              'if-no-files-found: error',
              'workflow_execution=success',
              'phone_readiness=',
              'automatic_recovery_performed=false',
          )
          missing = [item for item in required_workflow if item not in workflow]
          if missing:
              raise SystemExit('phone transport v3 workflow contract missing: ' + ', '.join(missing))

          combined = (script + '\n' + workflow).lower()
          forbidden_recovery = (
              'start-server',
              'kill-server',
              'adb reboot',
              'systemctl restart',
              'wsl --shutdown',
              'usbipd attach',
              'usbipd detach',
              '/deploy',
              '/retry-deploy',
          )
          present = [item for item in forbidden_recovery if item in combined]
          if present:
              raise SystemExit('preflight gained forbidden recovery/mutation surface: ' + ', '.join(present))

          forbidden_payload_fields = (
              '"serial":',
              '"adb_argv":',
              '"stdout":',
              '"stderr":',
              '"device_path":',
              '"token":',
              '"url":',
              '"raw_runner_log":',
          )
          present = [item for item in forbidden_payload_fields if item in script]
          if present:
              raise SystemExit('preflight script gained forbidden raw evidence field: ' + ', '.join(present))

          if controller.count('command = [adb, "-s", serial, "shell", "-T", "su", "0"]') != 1:
              raise SystemExit('canonical root argv must have exactly one owner')
          if 'phone_transport_readiness' in controller + script:
              raise SystemExit('duplicate phone transport readiness adapter returned')

          print('PHONE_TRANSPORT_PREFLIGHT_V3_POLICY_OK')
          PY
