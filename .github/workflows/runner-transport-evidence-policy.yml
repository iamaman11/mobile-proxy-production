name: Runner transport evidence policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-runner-transport-evidence:
    name: Validate bounded runner transport degradation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile and test bounded transport evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/controller/runner_transport_evidence.py \
            .github/scripts/phone_transport_preflight.py \
            .github/controller/tests/test_runner_transport_evidence.py
          python3 .github/controller/tests/test_runner_transport_evidence.py

      - name: Compile and test standalone runner transport observer core
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/controller/runner_transport_probe.py \
            .github/scripts/observe_runner_transport.py \
            .github/controller/tests/test_runner_transport_observer.py
          python3 .github/controller/tests/test_runner_transport_observer.py

      - name: Compile and test runner transport artifact finalization
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/finalize_runner_transport_observation.py \
            .github/controller/tests/test_runner_transport_finalizer.py
          python3 .github/controller/tests/test_runner_transport_finalizer.py

      - name: Test service-scoped WSL proxy environment
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/runner-host/wsl/install-runner-proxy.sh
          python3 -B .github/controller/tests/test_runner_proxy_environment.py

      - name: Prove transport evidence and no-remediation boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          owner = Path('.github/controller/runner_transport_evidence.py').read_text(encoding='utf-8')
          adapter = Path('.github/scripts/phone_transport_preflight.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/phone-transport-preflight.yml').read_text(encoding='utf-8')
          observer = Path('.github/scripts/observe_runner_transport.py').read_text(encoding='utf-8')
          probe = Path('.github/controller/runner_transport_probe.py').read_text(encoding='utf-8')
          finalizer = Path('.github/scripts/finalize_runner_transport_observation.py').read_text(encoding='utf-8')
          observer_workflow = Path('.github/workflows/runner-transport-observation.yml').read_text(encoding='utf-8')
          observer_policy = json.loads(Path('.github/production/runner-transport-policy.json').read_text(encoding='utf-8'))

          for required in (
              'ASSIGNMENT_NORMAL_SLO_MS = 20_000',
              'ASSIGNMENT_BOUNDED_SLO_MS = 60_000',
              'REPEATED_ERROR_THRESHOLD = 2',
              'current_listener_session',
              'broker_reconnect',
              'runserver_reconnect',
              'tls_error',
              'eof_error',
              'connection_reset',
              'action_download_error',
              'artifact_transport_error',
              'DIAGNOSTIC_EVIDENCE_UNAVAILABLE',
              'DIAGNOSTIC_WINDOW_TRUNCATED',
              'SESSION_WINDOW_UNRESOLVED',
              'TRANSPORT_DEGRADED',
              'MAX_DIAGNOSTIC_BYTES',
              '_safe_recent_paths',
              'replace(" ", "T")',
              'if not window_unresolved:',
              'expected_local_poll_cancellation',
          ):
              if required not in owner:
                  raise SystemExit('runner transport evidence owner invariant missing: ' + required)

          for required in (
              'phone-transport-preflight.v3',
              'collect_runner_transport_evidence',
              'classify_preflight',
              'phone_failure_phase',
              'raw_runner_log_recorded',
              'raw_transport_url_recorded',
          ):
              if required not in adapter:
                  raise SystemExit('phone transport adapter invariant missing: ' + required)

          for required in (
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'timeout-minutes: 2',
              'group: production-phone-read-only-preflight',
              'cancel-in-progress: false',
              'Validate bounded transport evidence',
              'Preserve mandatory bounded transport evidence',
              'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a',
              'if-no-files-found: error',
              'Record bounded transport artifact outcome',
              'if: always()',
              'PHONE_TRANSPORT_ARTIFACT outcome=',
              "{'READY', 'NOT_READY', 'TRANSPORT_DEGRADED'}",
              "transport.get('assignment_normal_slo_ms') != 20000",
              "transport.get('assignment_bounded_slo_ms') != 60000",
              'artifact_transport_error',
              'SESSION_WINDOW_UNRESOLVED',
              'runner transport session-window resolution evidence differs',
              "classification == 'NOT_READY' and phone_failure_phase == 'NONE'",
              "classification != 'NOT_READY' and phone_failure_phase != 'NONE'",
              'workflow_execution=success',
              'phone_readiness=',
              'automatic_recovery_performed=false',
              'raw_runner_log_recorded',
              'raw_transport_url_recorded',
          ):
              if required not in workflow:
                  raise SystemExit('phone transport workflow invariant missing: ' + required)

          if observer_policy != {
              'active_probe_budget_seconds': 120,
              'attempt_timeout_seconds': 10,
              'classifications': ['HEALTHY', 'TRANSPORT_DEGRADED', 'TRANSPORT_UNAVAILABLE'],
              'destinations': [
                  {'role': 'GITHUB_API', 'url': 'https://api.github.com/'},
                  {'role': 'REPOSITORY_TRANSPORT', 'url': 'https://github.com/'},
                  {'role': 'ACTION_DOWNLOAD', 'url': 'https://codeload.github.com/'},
                  {'role': 'ACTIONS_RESULTS', 'url': 'https://results-receiver.actions.githubusercontent.com/'},
              ],
              'failure_domains': ['UNKNOWN', 'RUNNER_SERVICE', 'DNS_RESOLUTION', 'TLS_VALIDATION'],
              'max_concurrency': 2,
              'max_destinations': 5,
              'max_attempts_per_destination': 3,
              'schema': 'runner-transport-policy.v1',
              'tls_verification_required': True,
          }:
              raise SystemExit('runner transport observer policy differs')

          for required in (
              'runner-transport-observation.v1',
              'BROKER_ASSIGNMENT_TIMESTAMP_UNAVAILABLE',
              'CURRENT_SESSION_EVIDENCE_INCOMPLETE',
              'SERVICE_ENVIRONMENT_UNAVAILABLE',
              'HEALTHY', 'TRANSPORT_DEGRADED', 'TRANSPORT_UNAVAILABLE',
              'raw_runner_log_recorded', 'raw_transport_url_recorded',
              'network_configuration_changed', 'automatic_recovery_performed',
          ):
              if required not in observer:
                  raise SystemExit('runner transport observer invariant missing: ' + required)

          for required in (
              'RUNNER_SERVICE = "mobile-proxy-phone-runner.service"',
              'WATCHDOG_TIMER = "mobile-proxy-runner-transport-health.timer"',
              'systemctl', 'show', '--retry', '0', '--proto', '=https',
              'service_environment_observed',
          ):
              if required not in probe:
                  raise SystemExit('runner transport probe invariant missing: ' + required)

          for required in (
              'ISSUE_COMMENT_CREATED_AT_TO_ACTIONS_JOB_STARTED_AT',
              'ACTIONS_JOB_STARTED_AT_TO_CHECKOUT_STEP_STARTED_AT',
              'ACTIONS_CHECKOUT_STEP_TIMESTAMPS',
              'BROKER_ASSIGNMENT_TIMESTAMP_UNAVAILABLE',
              'ARTIFACT_UPLOAD_RETRY',
              'core_digest_verified',
              'TRANSPORT_UNAVAILABLE',
          ):
              if required not in finalizer:
                  raise SystemExit('runner transport finalizer invariant missing: ' + required)

          for required in (
              "inputs.command == '/observe-runner-transport'",
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'group: production-runner-transport-observation',
              'cancel-in-progress: false',
              'Run bounded runner transport observer',
              '.github/scripts/observe_runner_transport.py',
              'Preserve primary core transport evidence',
              'Retry same core evidence transfer once',
              'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c',
              'hosted download',
              '.github/scripts/finalize_runner_transport_observation.py',
              'Preserve mandatory final runner transport evidence',
          ):
              if required.lower() not in observer_workflow.lower():
                  raise SystemExit('runner transport workflow invariant missing: ' + required)
          if observer_workflow.count('.github/scripts/observe_runner_transport.py') != 1:
              raise SystemExit('runner transport observer may execute more than once')
          if observer_workflow.count('continue-on-error: true') != 2:
              raise SystemExit('runner transport transfer retry boundary differs')

          observer_workflow_lower = observer_workflow.lower()
          workflow_forbidden = (
              'workflow_dispatch:', 'issue_comment:', 'android_production_serial',
              'environment: phone-production', 'secrets:', 'adb ', 'systemctl restart',
              'service restart', 'recover-runner-transport', 'ip route add', 'ip route replace',
              '--insecure', 'curl -k',
          )
          present = [item for item in workflow_forbidden if item in observer_workflow_lower]
          if present:
              raise SystemExit('runner transport workflow gained forbidden surface: ' + ', '.join(present))

          combined = '\n'.join((owner, adapter, workflow, observer, probe, finalizer)).lower()
          forbidden = (
              'systemctl restart',
              'service restart',
              'runner.listener restart',
              './svc.sh restart',
              './config.sh remove',
              'remove-token',
              'registration-token',
              'continue-on-error:',
              'adb install',
              'adb push',
              'curl -k',
              '--insecure',
              'ip route add',
              'ip route replace',
          )
          present = [item for item in forbidden if item in combined]
          if present:
              raise SystemExit('transport evidence gained forbidden remediation/mutation surface: ' + ', '.join(present))

          if 'raw_line' in owner or 'log_lines' in owner or 'transport_url' in owner:
              raise SystemExit('runner transport owner exposes raw diagnostic payload surface')

          print('RUNNER_TRANSPORT_EVIDENCE_POLICY_OK')
          PY
