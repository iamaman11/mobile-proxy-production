name: Filesystem mutation dispatch intent policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-filesystem-dispatch-intent:
    name: Validate durable filesystem pre-dispatch CONTROL contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate durable pre-dispatch generation transition
        run: python3 .github/scripts/control_plane_policy.py --policy filesystem-dispatch-intent
