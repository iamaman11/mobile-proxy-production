name: Filesystem mutation dispatch intent policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-filesystem-dispatch-intent:
    name: Validate durable filesystem pre-dispatch CONTROL contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out private execution wrappers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce serialized durable pre-dispatch generation transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          secret_wiring = 'ANDROID_TARGET_BINDING_KEY: $' + '{{ secrets.ANDROID_TARGET_BINDING_KEY }}'
          contracts = {
              'phone-filesystem-certification.yml': {
                  'operation': 'android.filesystem-certification.v1',
                  'transaction_source': 'f"fs-{os.environ[\'GITHUB_RUN_ID\']}-{os.environ[\'GITHUB_RUN_ATTEMPT\']}"',
                  'adapter': 'run_android_filesystem_certification.py',
                  'adapter_step': 'Run bounded filesystem mutation transaction',
                  'verify_step': 'Verify source bundle before device mutation',
                  'unknown_classifier': "markerPersisted && state === 'UNOBSERVED'",
              },
              'phone-filesystem-quarantine-cleanup.yml': {
                  'operation': 'android.filesystem-quarantine-cleanup.v1',
                  'transaction_source': 'f"fs-quarantine-clean-{os.environ[\'GITHUB_RUN_ID\']}-{os.environ[\'GITHUB_RUN_ATTEMPT\']}"',
                  'adapter': 'run_android_filesystem_quarantine_recovery.py',
                  'adapter_step': 'Run exact bounded quarantine cleanup',
                  'verify_step': 'Verify exact source and prior admission bundle before phone access',
                  'unknown_classifier': 'markerPersisted && !validated',
              },
          }

          workflows = Path('.github/workflows')
          for name, contract in contracts.items():
              path = workflows / name
              if not path.is_file():
                  raise SystemExit(f'{name}: mutator workflow is missing')
              text = path.read_text(encoding='utf-8')

              required = (
                  'group: production-phone-global-mutation',
                  'cancel-in-progress: false',
                  'queue: max',
                  secret_wiring,
                  'Build bounded CONTROL mutation dispatch intent',
                  'Persist CONTROL mutation dispatch intent before adapter invocation',
                  "'evidence_type': 'MUTATION_DISPATCH_INTENT'",
                  "'authority': 'CONTROL'",
                  "'lifecycle': 'CURRENT'",
                  f"'operation_id': '{contract['operation']}'",
                  "'target': 'android-production'",
                  "'affected_domain_generations': {'domain/filesystem': operation_transaction_id}",
                  "'blind_retry_allowed': False",
                  "'raw_device_identifier_recorded': False",
                  "hmac.new(binding_key.encode('utf-8'), message, hashlib.sha256).hexdigest()",
                  "if binding_key == serial:",
                  'if-no-files-found: error',
                  'retention-days: 90',
                  contract['adapter_step'],
                  contract['adapter'],
                  "classification = 'UNKNOWN_EXECUTION_OUTCOME'",
                  contract['unknown_classifier'],
                  contract['transaction_source'],
              )
              missing = [item for item in required if item not in text]
              if missing:
                  raise SystemExit(f"{name}: dispatch-intent contract missing: {', '.join(missing)}")

              if text.count(secret_wiring) != 1:
                  raise SystemExit(f'{name}: target binding key must enter exactly one serialized mutator job')
              if text.count('Build bounded CONTROL mutation dispatch intent') != 1:
                  raise SystemExit(f'{name}: must build exactly one dispatch intent')
              if text.count('Persist CONTROL mutation dispatch intent before adapter invocation') != 1:
                  raise SystemExit(f'{name}: must persist exactly one dispatch intent')
              if text.count("'affected_domain_generations': {'domain/filesystem': operation_transaction_id}") != 1:
                  raise SystemExit(f'{name}: filesystem generation must advance exactly once in intent evidence')
              if text.count(contract['adapter']) < 2:
                  raise SystemExit(f"{name}: canonical adapter must remain source-bundled and invoked")

              verify_index = text.index(contract['verify_step'])
              build_index = text.index('Build bounded CONTROL mutation dispatch intent')
              persist_index = text.index('Persist CONTROL mutation dispatch intent before adapter invocation')
              adapter_index = text.index(contract['adapter_step'])
              if not verify_index < build_index < persist_index < adapter_index:
                  raise SystemExit(
                      f'{name}: source/admission verification -> generation intent -> durable persistence -> adapter order differs'
                  )

              persist_block = text[persist_index:adapter_index]
              if 'continue-on-error: true' in persist_block or 'if: always()' in persist_block:
                  raise SystemExit(f'{name}: dispatch intent persistence must fail closed')
              if 'uses: actions/upload-artifact@v4' not in persist_block:
                  raise SystemExit(f'{name}: dispatch intent must be durable artifact evidence')

              adapter_tail = text[adapter_index:]
              next_step = adapter_tail.find('\n      - name:', 1)
              adapter_block = adapter_tail if next_step < 0 else adapter_tail[:next_step]
              if adapter_block.count(contract['adapter']) != 1:
                  raise SystemExit(f'{name}: device adapter invocation must remain exactly once')
              for retry_token in ('attempt 2', 'attempt 3', 'Back off before', 'sleep 3', 'sleep 6'):
                  if retry_token in adapter_block:
                      raise SystemExit(f'{name}: destructive adapter block must not retry')

              if 'target_binding_id' not in text or 'tb-hmac-sha256:' not in text:
                  raise SystemExit(f'{name}: opaque target binding identity is not emitted')
              if "markerPersisted ? process.env.OPERATION_TRANSACTION_ID : 'unadvanced'" not in text:
                  raise SystemExit(f'{name}: report does not expose persisted filesystem generation')
              if '`- blind_retry_allowed: \\`false\\``' not in text:
                  raise SystemExit(f'{name}: report must explicitly forbid blind retry')

          def classify(marker_persisted, state, validated=True, accepted=False, recovered=False):
              if accepted:
                  return 'ACCEPTED'
              if recovered:
                  return 'RECOVERED'
              if marker_persisted and (state == 'UNOBSERVED' or not validated):
                  return 'UNKNOWN_EXECUTION_OUTCOME'
              if not validated:
                  return 'UNOBSERVED'
              return state

          cases = (
              ((True, 'UNOBSERVED', True, False, False), 'UNKNOWN_EXECUTION_OUTCOME'),
              ((True, 'UNOBSERVED', False, False, False), 'UNKNOWN_EXECUTION_OUTCOME'),
              ((False, 'UNOBSERVED', False, False, False), 'UNOBSERVED'),
              ((True, 'REFUSED', True, False, False), 'REFUSED'),
              ((True, 'ACCEPTED', True, True, False), 'ACCEPTED'),
              ((True, 'RECOVERED', True, False, True), 'RECOVERED'),
          )
          for inputs, expected in cases:
              actual = classify(*inputs)
              if actual != expected:
                  raise SystemExit(
                      f'dispatch ambiguity truth table differs: inputs={inputs} expected={expected} actual={actual}'
                  )

          print('filesystem dispatch intent policy: accepted')
          print('domain_generation_transition=exact-operation-transaction')
          print('target_binding=hmac-sha256-dedicated-secret')
          print('marker_persistence=fail-closed-before-adapter')
          print('unknown_execution_outcome=blind-retry-forbidden')
          PY
