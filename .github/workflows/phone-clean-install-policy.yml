name: Destructive clean-install transaction policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-clean-install-transaction:
    name: Validate cursor-bound destructive clean-install control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private execution repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compile clean-install control code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/clean_install_control.py \
            .github/scripts/run_destructive_clean_install.py \
            .github/scripts/run_destructive_clean_install_v2.py \
            .github/scripts/test_destructive_clean_install_control.py

      - name: Run destructive clean-install hosted truth table
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_destructive_clean_install_control.py

      - name: Enforce fail-closed workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phone-clean-install.yml').read_text(encoding='utf-8')
          control = Path('.github/scripts/clean_install_control.py').read_text(encoding='utf-8')
          wrapper = Path('.github/scripts/run_destructive_clean_install_v2.py').read_text(encoding='utf-8')

          required_workflow = (
              "startsWith(inputs.command, '/phone-clean-install ')",
              'inputs.source_actor == github.repository_owner',
              'clean_install_control.py admit',
              '--command-comment-id "${COMMENT_ID}"',
              '--expected-transaction-id "${TRANSACTION_ID}"',
              'Revalidate semantic admission inside global mutation lock',
              'group: production-phone-global-mutation',
              'cancel-in-progress: false',
              'queue: max',
              'runs-on: [self-hosted, Linux, X64, android-production]',
              'run_destructive_clean_install_v2.py',
              'Fail workflow unless exact replacement package terminal is proven',
          )
          missing = [item for item in required_workflow if item not in workflow]
          if missing:
              raise SystemExit('cursor-bound clean-install workflow invariant missing: ' + ', '.join(missing))

          if workflow.count('group: production-phone-global-mutation') != 1:
              raise SystemExit('clean-install must own exactly one global mutation lock at phone-job scope')
          if workflow.index('Revalidate semantic admission inside global mutation lock') > workflow.index('Execute one durable destructive clean-install transaction'):
              raise SystemExit('semantic admission recheck must run before destructive transaction')

          required_control = (
              'COMMAND_RE = re.compile',
              'cursor=([1-9][0-9]*)',
              'transaction_id = f"clean-install-cursor-{cursor_id}"',
              'latest authoritative tracker checkpoint',
              'duplicate semantic clean-install owner command is not the elected request',
              'cursor transaction already has durable CONTROL evidence; blind retry forbidden',
              'CONTROL_AUTHORIZED_OPERATION=',
              'CONTROL_AUTHORIZED_CANONICAL_SHA=',
          )
          missing = [item for item in required_control if item not in control]
          if missing:
              raise SystemExit('clean-install semantic admission invariant missing: ' + ', '.join(missing))

          required_wrapper = (
              'format_version": 2',
              'semantic_request_key',
              'control_cursor_id',
              'failure_diagnostics',
              'dispatch_failure_stage',
              'observation_failure_stage',
              'raw_error_text_recorded": False',
              'blind_retry_allowed": False',
          )
          missing = [item for item in required_wrapper if item not in wrapper]
          if missing:
              raise SystemExit('clean-install bounded terminal diagnostic invariant missing: ' + ', '.join(missing))

          forbidden = (
              '/android-release-migrate ',
              'android.apk-install.v1',
              'adb install -r',
              'rollback_to_old_generation_available": True',
          )
          present = [item for item in forbidden if item in workflow or item in control or item in wrapper]
          if present:
              raise SystemExit('clean-install path reuses forbidden migration/same-lineage semantics: ' + ', '.join(present))

          print('cursor-bound destructive clean-install policy: accepted')
          PY
